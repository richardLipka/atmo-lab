 * the colour that measurement implies is shown beside the integrator's own, so
 * a student can see that the picture and the theory are one thing.
 *
 * Counting instead of measuring was the flaw this replaces. A fixed number of

 * bar. Weighted by energy, the bars collapse with it.

 * @param {Array}  paths    traced paths

function histogramPhotons(paths, axisRad, halfRad, groupNm = 20) {
  const perBin = Math.max(1, Math.round(groupNm / 10));
  const bins = Math.ceil(SPECTRUM_BINS / perBin);
  const inCone = new Float64Array(bins);
  const elsewhere = new Float64Array(bins);
  const direct = new Float64Array(bins);
  const centres = new Float64Array(bins);
  /** The cone's spectrum on the engine's own grid, for the colour swatch. */
  const coneSpectrum = new Float64Array(SPECTRUM_BINS);

    const first = b * perBin;

      const inView = Math.abs(p.arrivalAngleRad - axisRad) <= halfRad;
      if (spectra && p.spectrumOffset != null) {

        // enough to put a colour swatch next to the integrator's.

          const value = spectra[p.spectrumOffset + i];
          if (inView) coneSpectrum[i] += value;
          const bb = Math.min(bins - 1, Math.floor(i / perBin));
          if (inView) inCone[bb] += value; else elsewhere[bb] += value;
        }

      }

      directSum += p.weight;
      directWeighted += p.weight * p.lambda;

  // An average over the rays in the cone, which makes it a radiance rather than
  // a sum that grows with however many rays happen to be drawn.
  if (coneRays > 0) {
    for (let i = 0; i < SPECTRUM_BINS; i++) coneSpectrum[i] /= coneRays;
    for (let b = 0; b < bins; b++) inCone[b] /= coneRays;

  let peak = 0, directPeak = 0, coneSum = 0, coneWeighted = 0;
  for (let b = 0; b < bins; b++) {
    peak = Math.max(peak, inCone[b] + elsewhere[b]);
    directPeak = Math.max(directPeak, direct[b]);
    coneSum += inCone[b];
    coneWeighted += inCone[b] * centres[b];
  }

  return {
    centres, inCone, elsewhere, direct, peak, directPeak, coneSpectrum,
    coneRays, directRays,
    binWidthNm: perBin * 10,
    coneMeanNm: coneSum > 0 ? coneWeighted / coneSum : null,
    directMeanNm: directSum > 0 ? directWeighted / directSum : null,
  };
}

/**
 * The cross-section drawing.
 *
 * Two very different pictures are needed, because the two mechanisms the
 * simulator contrasts live at wildly different scales: an atmosphere is a
 * hundred kilometres deep, a shaft is a couple of metres wide. Rather than
 * pretend one frame can hold both honestly, the renderer switches:
 *
 *   above datum - the atmosphere view, a slab of air with the star, the
 *                 observer and traced photons;
 *   below datum - the shaft view, drawn at the aspect ratio of the shaft
 *                 itself, with the escape cone and the patch of sky it leaves.
 *
 * Nothing here invents a colour. The glow of the air is evaluated by the
 * scattering integrator on a coarse grid and then smoothed; the ground tint is
 * its albedo times the light actually falling on it.
 */

const FIELD_COLUMNS = 26;
const FIELD_ROWS = 34;
/**
 * The deepest shaft the picture draws to scale, as a depth-to-radius ratio.
 * Beyond this the cone would be thinner than a line, so the shaft is drawn
 * stubbier than it is and both the true ratio and the true angle are printed.
 */
const MAX_DRAWN_SHAFT_RATIO = 9;

/** How much of the sky the shaft view samples, either side of the vertical. */
const SHAFT_RAY_SPAN = 86 * Math.PI / 180;

function createSceneRenderer(canvas, { i18n, colorimetry }) {
  const ctx = canvas.getContext('2d', { alpha: false });
  let data = null;
  let field = null;          // offscreen canvas holding the atmospheric glow
  let fieldKey = null;       // what that glow was computed for
  let layout = null;         // geometry of the last frame, for hit testing
  let hoveredPath = -1;
  let selectedPath = -1;
  /** The brightest arriving bundle seen, so a dimmer one can be drawn dimmer. */
  let rayReference = 0;

  function cssSize() {
    const rect = canvas.getBoundingClientRect();
    return { w: Math.max(320, rect.width), h: Math.max(240, rect.height) };
  }

  function resize() {
    const { w, h } = cssSize();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  /**
   * Evaluate the glow of the atmosphere on a coarse grid and bake it into a
   * small offscreen image. Drawn back scaled up and smoothed, it gives a
   * continuous gradient for the price of a few hundred evaluations - and the
   * shadow of the planet appears on its own at low sun.
   *
   * The grid is laid out in screen space and lifted into the world through the
   * camera, so zooming out re-evaluates the same integrator over a bigger piece
   * of the planet rather than stretching a picture of a small one. Cells below
   * the surface or above the atmosphere are left transparent; the ground and
   * the black of space are painted separately.
   */
  function buildField(result, camera, plot) {
    const scene = result.primary.scene;
    const atm = result.atmosphere;
    const off = document.createElement('canvas');
    off.width = FIELD_COLUMNS;
    off.height = FIELD_ROWS;
    const octx = off.getContext('2d');
    const image = octx.createImageData(FIELD_COLUMNS, FIELD_ROWS);

    for (let row = 0; row < FIELD_ROWS; row++) {
      const sy = plot.y + ((row + 0.5) / FIELD_ROWS) * plot.h;
      for (let col = 0; col < FIELD_COLUMNS; col++) {
        const sx = plot.x + ((col + 0.5) / FIELD_COLUMNS) * plot.w;
        const world = camera.unproject(sx, sy);
        const radius = Math.hypot(world.x, world.y);
        const altitude = radius - camera.R;
        const i = (row * FIELD_COLUMNS + col) * 4;
        if (altitude < 0 || altitude > atm.topAltitude) {
          image.data[i + 3] = 0;
          continue;
        }
        const point = v3(world.x, world.y, 0);
        const spectrum = computeScatteringSource(scene, point, 0, QUALITY_PRESETS.preview);
        const c = colorimetry.spectrumToSrgb(spectrum, result.exposure * FIELD_GAIN);
        image.data[i] = c.rgb[0];
        image.data[i + 1] = c.rgb[1];
        image.data[i + 2] = c.rgb[2];

  }

  /** Ground colour: what the surface reflects of the light reaching it. */
  function groundColor(result) {
    const albedo = result.atmosphere.groundAlbedo;
    const ill = result.primary.illumination;
    const beam = result.primary.beam;
    const spectrum = new Float64Array(beam.spectrum.length);
    const cosSun = Math.max(0, result.primary.scene.sunDir.y);
    for (let i = 0; i < spectrum.length; i++) {

    return `rgb(${Math.round(c.rgb[0] * floor + 12)}, ${Math.round(c.rgb[1] * floor + 10)}, ${Math.round(c.rgb[2] * floor + 9)})`;
  }

  function update(next, options = {}) {
    data = next;
    field = null;
    // Clicking a ray should survive an unrelated slider move; only a fresh set
    // of traced photons invalidates the choice.
    if (!options.keepSelection) selectedPath = -1;
    // The glow field is built lazily on the first draw, because it depends on
    // the plot rectangle and so on the size of the canvas.

  function draw(timeMs) {
    const { w, h } = resize();
    ctx.fillStyle = '#05070d';
    ctx.fillRect(0, 0, w, h);

    if (data.state.compare.enabled && data.result.compare) {
      const gap = 10;
      const half = (w - gap) / 2;
      drawPanel(0, 0, half, h, data.result.compare.left, data.state.compare.leftZ, timeMs, i18n.t('compare.left'));
      drawPanel(half + gap, 0, half, h, data.result.compare.right, data.state.compare.rightZ, timeMs, i18n.t('compare.right'));
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';

      ctx.moveTo(half + gap / 2, 8);
      ctx.lineTo(half + gap / 2, h - 8);
      ctx.stroke();
      layout = null;
    } else {

  }

  function drawPanel(x0, y0, pw, ph, evaluation, z, timeMs, caption) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x0, y0, pw, ph);
    ctx.clip();
    ctx.translate(x0, y0);

    // observer has descended into it. Standing at the mouth is a state worth
    // drawing: the aperture is the whole sky, and it closes as you go down.
    if (data.state.observer.well.enabled && z <= 0) {
      drawShaftView(pw, ph, evaluation, z);
    } else {
      drawAtmosphereView(pw, ph, evaluation, z, timeMs, caption === null);
    }

    if (caption) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = '600 12px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(caption + ' - ' + formatAltitude(z), 10, 18);
    }
    ctx.restore();
  }

  /* ---------------------------------------------------------------- */
  /* Atmosphere view                                                   */
  /* ---------------------------------------------------------------- */

  function drawAtmosphereView(w, h, evaluation, z, timeMs, allowInteraction) {
    const atm = data.result.atmosphere;

    const plot = plotRect(w, h);
    const span = spanFor(data.state, atm, z);
    const camera = makeCamera(atm, plot, span);

    // The glow is expensive, so it is rebuilt only when what it depends on
    // moves - which now includes the zoom and the size of the canvas.
    const key = `${span}|${Math.round(plot.w)}x${Math.round(plot.h)}`;
    if (allowInteraction && fieldKey !== key) {

    ctx.save();
    ctx.beginPath();
    ctx.rect(plot.x, plot.y, plot.w, plot.h);
    ctx.clip();

   * rays inside the wedge are the ones being measured, the grey ones outside
   * are everything else.

    // rectangle. Straight is exact here: the projection is orthographic.

    const right = camera.project(edge(axis + half));

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(o.x, o.y);
    ctx.lineTo(left.x, left.y);
    ctx.lineTo(right.x, right.y);

    ctx.setLineDash([4, 4]);

      ctx.moveTo(o.x, o.y);

  /**

   *

   * where the observer will never see it, then the light arriving from the rest

   */

    const paths = data.photons;

    const phase = animate ? (timeMs / 2600) % 1 : 1;

    const state = data.state;
    const sign = Math.cos(state.observer.viewAzimuthDeg * Math.PI / 180) >= 0 ? 1 : -1;
    const axis = sign * state.observer.viewZenithDeg * Math.PI / 180;
    const half = VIEW_CONE_HALF_DEG * Math.PI / 180;

    /**
     * Is this ray part of what the observer is currently looking at?
     *
     * Colour is reserved for exactly these. Everything else - light arriving
     * from the rest of the sky, light thrown in directions that miss the eye,
     * light that crossed without ever interacting - is drawn grey. The rule is
     * one sentence long and it is the whole legend: coloured means this light
     * enters your eye from the direction you are facing.

    const involved = (p) => p.kind === 'arriving'
      && Math.abs(p.arrivalAngleRad - axis) <= half;

     * How many of the arriving rays get drawn.
     *
     * A fixed number is traced whatever the state, so without this the fan
     * converging on the observer looks the same at 30 km as at the ground - the
     * picture saying nothing changed while the physics says the sky went out.
     * Each ray carries an unbiased estimate of what it delivers; the mean of
     * those, against the most this configuration has ever delivered, is how
     * much light there actually is.
     *
     * Only the arriving families thin out. The events below - light thrown
     * where it misses you, light crossing unscattered - happen in air the
     * observer has climbed above, and they do not stop just because you left.
     */
    let radianceSum = 0, arrivingCount = 0;
    for (const p of paths) {
      if (p.kind !== 'arriving') continue;
      radianceSum += p.radiance ?? 0;
      arrivingCount++;

    const meanArriving = arrivingCount > 0 ? radianceSum / arrivingCount : 0;
    if (meanArriving > rayReference) rayReference = meanArriving;
    // How much light arrives, as a fraction of the most this configuration has
    // ever delivered - and the fraction of the arriving rays that get drawn.
    //
    // Count alone, not opacity. A ray either reaches the observer or it does
    // not; the ones that do are perfectly ordinary rays and there is no reason
    // to draw them faintly. What changes with altitude is how many there are,
    // so that is what changes on screen. Dimming them as well said something
    // different and wrong: that the light which does arrive somehow arrives
    // weakened.
    const share = rayReference > 0 ? Math.min(1, meanArriving / rayReference) : 1;

    /**
     * Which arriving rays survive the thinning.
     *
     * A fixed hash of the index rather than a prefix or a counter, so a ray does
     * not blink in and out as unrelated things change, and the surviving set is
     * an unbiased sample of the whole. Only the DRAWING is thinned: the
     * histogram and the measured colour beside it still use every traced ray,
     * so the measurement stays as precise as it was while the picture stops
     * claiming light that is not there.
     */
    const drawnArriving = (index) => {
      if (share >= 1) return true;
      return (((index * 2654435761) >>> 0) / 4294967296) < share;
    };

    const GREY = '#8a93a6';
    // Grey, but not invisible: zoomed out, the long chord an unscattered beam
    // has to cross IS the demonstration, so it gets the strongest of the greys.
    const contextAlpha = { through: 0.30, missed: 0.16, arriving: 0.13 };
    const contextWidth = { through: 1.2, missed: 1, arriving: 1 };

    /**
     * Every arriving ray outside the cone also ends at the observer, so drawn
     * in full they make a grey starburst on top of the very convergence the
     * cone exists to show. Only every third is drawn. It is a drawing density,
     * chosen by index so it stays put as the view turns, and it changes nothing
     * the panels report.
     */
    const GREY_ARRIVING_STRIDE = 3;
    const asContext = (p, i) => !involved(p)
      && (p.kind !== 'arriving' || (i % GREY_ARRIVING_STRIDE === 0 && drawnArriving(i)));

    /* ---- everything outside the cone, in grey ---- */

    for (const kind of ['through', 'missed', 'arriving']) {
      ctx.save();
      ctx.strokeStyle = GREY;
      ctx.lineWidth = contextWidth[kind];
      ctx.globalAlpha = contextAlpha[kind];
      ctx.beginPath();
      for (let i = 0; i < paths.length; i++) {
        const p = paths[i];
        if (p.kind !== kind || !asContext(p, i)) continue;
        if (i === selectedPath || i === hoveredPath) continue;
        strokePath(p, project, phase);
      }
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    // Scattering vertices outside the cone: every one is still a photon taken
    // out of the beam, so they are drawn - just not celebrated.
    ctx.fillStyle = GREY;
    for (let i = 0; i < paths.length; i++) {
      const p = paths[i];
      if (p.scatterCount === 0 || !asContext(p, i)) continue;
      ctx.globalAlpha = 0.22;
      if (i === selectedPath || i === hoveredPath) continue;
      const e = project(p.events[1]);
      ctx.beginPath();
      ctx.arc(e.x, e.y, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    // Arrowheads on the paths that leave: without them a stub reads as a line
    // rather than as light departing in a direction that misses you.
    ctx.globalAlpha = 0.3;
    for (let i = 0; i < paths.length; i++) {
      const p = paths[i];
      if (p.kind !== 'missed' || !asContext(p, i)) continue;
      if (i === selectedPath || i === hoveredPath) continue;
      const from = project(p.points[p.points.length - 2]);
      const to = project(p.points[p.points.length - 1]);
      drawArrowHead(from.x, from.y, to.x, to.y, 4.5);
    }
    ctx.restore();

    /* ---- the rays inside the cone, in their own colours ---- */

    const buckets = new Map();
    for (let i = 0; i < paths.length; i++) {
      if (!involved(paths[i]) || !drawnArriving(i)) continue;
      if (i === selectedPath || i === hoveredPath) continue;
      const key = Math.round(paths[i].lambda / 20) * 20;
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(i);
    }

    ctx.save();
    ctx.lineWidth = 1.3;
    ctx.globalAlpha = 0.85;
    for (const [lambda, indices] of buckets) {
      const [r, g, b] = wavelengthToDisplayRgb(lambda);
      ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.beginPath();
      for (const index of indices) strokePath(paths[index], project, phase);
      ctx.stroke();
    }
    ctx.restore();

    // The last leg - the one that actually enters the eye - is redrawn heavier,
    // or the incoming stubs swamp the convergence.
    if (phase >= 1) {
      ctx.save();
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      for (const [lambda, indices] of buckets) {
        const [r, g, b] = wavelengthToDisplayRgb(lambda);
        ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.beginPath();
        for (const index of indices) {
          const pts = paths[index].points;
          const from = project(pts[pts.length - 2]), to = project(pts[pts.length - 1]);
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = '#ffffff';
    for (const indices of buckets.values()) {
      for (const index of indices) {
        const e = project(paths[index].events[1]);
        ctx.beginPath();
        ctx.arc(e.x, e.y, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    /* ---- hover and selection ---- */

    for (const index of [hoveredPath, selectedPath]) {
      if (index < 0 || index >= paths.length) continue;
      const p = paths[index];
      const [r, g, b] = wavelengthToDisplayRgb(p.lambda);
      ctx.save();
      ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.lineWidth = index === selectedPath ? 2.6 : 1.8;
      ctx.shadowColor = `rgba(${r}, ${g}, ${b}, 0.9)`;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      strokePath(p, project, 1);
      ctx.stroke();
      ctx.shadowBlur = 0;
      for (const e of p.events) {
        if (e.type !== 'scatter' && e.type !== 'absorb') continue;
        ctx.fillStyle = e.type === 'absorb' ? '#ff5a5a' : '#ffffff';
        const q = project(e);
        ctx.beginPath();
        ctx.arc(q.x, q.y, e.type === 'absorb' ? 3.5 : 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    drawPathLegend(plot);
  }

  function drawArrowHead(x1, y1, x2, y2, size) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - size * Math.cos(angle - 0.42), y2 - size * Math.sin(angle - 0.42));
    ctx.lineTo(x2 - size * Math.cos(angle + 0.42), y2 - size * Math.sin(angle + 0.42));
    ctx.closePath();
    ctx.fill();
  }

  /** One rule in four lines: colour means this light reaches your eye. */
  function drawPathLegend(plot) {
    const rows = [
      { key: 'canvas.legendArriving', colour: true, width: 2.4 },
      { key: 'canvas.legendOffView', colour: false, width: 1 },
      { key: 'canvas.legendMissed', colour: false, width: 1 },
      { key: 'canvas.legendThrough', colour: false, width: 1 },
    ];
    ctx.save();
    ctx.font = '10px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const labels = rows.map((row) => i18n.t(row.key));
    let width = 0;
    for (const label of labels) width = Math.max(width, ctx.measureText(label).width);
    const boxW = width + 32;
    const boxH = rows.length * 15 + 8;
    const x = plot.x + 8;
    const y = plot.y + 8;
    ctx.fillStyle = 'rgba(5, 7, 13, 0.66)';
    ctx.fillRect(x, y, boxW, boxH);
    for (let i = 0; i < rows.length; i++) {
      const cy = y + 12 + i * 15;
      ctx.lineWidth = rows[i].width;
      if (rows[i].colour) {
        // The swatch is a spectrum, because that is what the rule means: these
        // are the rays whose wavelength you are being shown.
        ctx.globalAlpha = 0.95;
        const gradient = ctx.createLinearGradient(x + 6, 0, x + 22, 0);
        for (let k = 0; k <= 4; k++) {
          const [r, g, b] = wavelengthToDisplayRgb(430 + k * 60);
          gradient.addColorStop(k / 4, `rgb(${r}, ${g}, ${b})`);
        }
        ctx.strokeStyle = gradient;
      } else {
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = '#8a93a6';
      }
      ctx.beginPath();
      ctx.moveTo(x + 6, cy);
      ctx.lineTo(x + 22, cy);
      ctx.stroke();
      ctx.globalAlpha = rows[i].colour ? 0.92 : 0.55;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(labels[i], x + 27, cy);
    }
    ctx.restore();
  }

  // Straight in the world, straight on screen: the altitude axis is linear, so
  // a leg needs no subdivision to land on the altitudes it really passes
  // through, and a ray looks like what it is.
  function strokePath(path, project, phase) {
    const pts = path.points;
    if (pts.length < 2) return;
    const limit = phase >= 1 ? pts.length : Math.max(2, Math.ceil(pts.length * phase));
    const first = project(pts[0]);
    ctx.moveTo(first.x, first.y);
    for (let i = 1; i < limit; i++) {
      const q = project(pts[i]);
      ctx.lineTo(q.x, q.y);
    }
  }

  function drawObserver(px, py, evaluation, z) {
    const zenith = data.state.observer.viewZenithDeg * Math.PI / 180;
    const azimuth = data.state.observer.viewAzimuthDeg * Math.PI / 180;
    // In the cross-section, azimuth 0 points towards the star (to the right).
    const sign = Math.cos(azimuth) >= 0 ? 1 : -1;
    const dx = Math.sin(zenith) * sign;
    const dy = Math.cos(zenith);

    ctx.save();
    ctx.strokeStyle = evaluation.view.blocked ? '#ff6b6b' : '#ffffff';
    ctx.lineWidth = 1.8;
    ctx.setLineDash(evaluation.view.blocked ? [4, 3] : []);
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + dx * 54, py - dy * 54);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#05070d';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  /* ---------------------------------------------------------------- */
  /* Shaft view                                                        */
  /* ---------------------------------------------------------------- */

  /**
   * The shaft.
   *
   * The whole content of this picture is one fact: the rock decides which
   * directions can reach you, and it decides on geometry alone. Light arriving
   * from anywhere except a narrow cone about the vertical runs into the rock
   * before it gets to the bottom, and no property of the air or of the light
   * enters into that. So the rays are drawn converging on the observer from
   * right across the sky, each carrying the colour of the patch it came from,
   * and each either arriving or stopping dead at the lip of the shaft.
   */
  function drawShaftView(w, h, evaluation, z) {
    const well = data.state.observer.well;
    const radius = well.radius_m;
    const depth = Math.max(0, -z);                 // how far below the mouth
    const shaftDepth = Math.max(depth, well.depth_m);
    const trueHalf = wellApertureHalfAngle(depth, radius);
    const trueHalfDeg = trueHalf * 180 / Math.PI;

    const padTop = 8, padBottom = 30, padSide = 40;
    const skyHeight = Math.round((h - padTop - padBottom) * 0.26);
    const groundY = padTop + skyHeight;
    const floorY = h - padBottom;
    const centreX = w / 2;

    /**
     * A real shaft is far deeper than it is wide - a hundredth of a degree of
     * sky at the bottom of a deep one - and drawn to scale it would be a
     * vertical line. So the aspect ratio is capped, the cone the picture shows
     * is the cone that fits, and the true numbers are printed beside it. What
     * the drawing keeps exact is the mechanism: everything below is derived
     * from the drawn geometry, so the picture never contradicts itself.
     */
    const trueRatio = radius > 0 ? shaftDepth / radius : 0;
    const drawnRatio = Math.min(trueRatio, MAX_DRAWN_SHAFT_RATIO);

    // The scale is set by the whole shaft, not by how far down the observer
    // happens to be. Deriving it from the observer's depth collapsed the
    // picture to nothing whenever they stood at the mouth, which is exactly the
    // state worth being able to look at: the aperture is the whole sky there,
    // and it closes as they descend.
    let shaftHalfWidth = Math.max(16, Math.min((w - padSide * 2) / 2, w * 0.13));
    const room = floorY - groundY - 16;
    let shaftHeight = drawnRatio * shaftHalfWidth;
    if (shaftHeight > room) {
      shaftHeight = room;
      if (drawnRatio > 0) shaftHalfWidth = room / drawnRatio;
    }
    const perMetre = shaftDepth > 0 ? shaftHeight / shaftDepth : 0;
    const observerY = groundY + depth * perMetre;
    const shaftBottomY = Math.min(floorY, groundY + Math.max(12, shaftHeight));

    // At the mouth this is a right angle: the whole sky is still there.
    const drawnHalf = Math.min(SHAFT_RAY_SPAN,
      Math.atan2(shaftHalfWidth, observerY - groundY));
    // Whether the drawn cone is wider than the real one - which is a question
    // about the cone, not about the shaft. Standing at the mouth the aperture
    // is a right angle and the picture shows a right angle, however stubby the
    // shaft below has had to be drawn, and claiming an exaggeration there would
    // be a lie in the other direction.
    const exaggerated = drawnHalf > trueHalf * 1.05;

    /* ---- the world ---- */

    drawDomeBand(padSide, padTop, w - padSide * 2, skyHeight, evaluation);
    dimBlockedSky(padSide, padTop, w - padSide * 2, skyHeight, drawnHalf);

    ctx.fillStyle = '#241d17';
    ctx.fillRect(0, groundY, w, h - groundY);
    ctx.fillStyle = '#332920';
    ctx.fillRect(0, groundY, w, 5);

    ctx.fillStyle = '#05070c';
    ctx.fillRect(centreX - shaftHalfWidth, groundY, shaftHalfWidth * 2, shaftBottomY - groundY);

    // The cone that survives, filled with the colour of the sky it reveals.
    ctx.save();
    const gradient = ctx.createLinearGradient(0, observerY, 0, groundY);
    gradient.addColorStop(0, 'rgba(255,255,255,0.03)');
    gradient.addColorStop(1, nearestDomeColor(evaluation, 0));
    ctx.fillStyle = gradient;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.moveTo(centreX, observerY);
    ctx.lineTo(centreX - shaftHalfWidth, groundY);
    ctx.lineTo(centreX + shaftHalfWidth, groundY);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    /* ---- the rays, which are the point ---- */

    drawShaftRays(w, centreX, padTop, groundY, observerY, drawnHalf, evaluation);

    // Walls, drawn over the rays so the rock reads as solid.
    ctx.strokeStyle = 'rgba(255,235,205,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(centreX - shaftHalfWidth, groundY);
    ctx.lineTo(centreX - shaftHalfWidth, shaftBottomY);
    ctx.moveTo(centreX + shaftHalfWidth, groundY);
    ctx.lineTo(centreX + shaftHalfWidth, shaftBottomY);
    ctx.stroke();

    drawObserver(centreX, observerY, evaluation, z);

    /* ---- labels ---- */

    ctx.save();
    ctx.font = '10px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(255,255,255,0.68)';
    ctx.fillText(i18n.t('controls.observer.wellDepth') + ': ' + formatAltitude(depth),
      8, floorY - 16);
    ctx.fillText('R = ' + radius.toFixed(1) + ' m', 8, floorY - 3);
    ctx.textAlign = 'right';
    ctx.fillText('θmax = ' + formatAngle(trueHalfDeg), w - 8, groundY + 14);
    if (exaggerated) {
      ctx.fillStyle = 'rgba(255,200,120,0.85)';
      ctx.fillText(i18n.t('canvas.coneExaggerated'), w - 8, groundY + 27);
      ctx.fillText(i18n.t('canvas.trueRatio') + ' ' + Math.round(trueRatio) + ':1',
        w - 8, groundY + 40);
      ctx.fillText(i18n.t('canvas.drawnRatio') + ' ' + drawnRatio.toFixed(0) + ':1',
        w - 8, groundY + 53);
    }
    ctx.restore();
    layout = null;
  }

  /**
   * Rays converging on the observer from right across the sky.
   *
   * Each is drawn along the line that would reach the observer. The ones inside
   * the cone come through the mouth and arrive. The ones outside meet the
   * ground beyond the lip of the shaft and stop there, and the dashed
   * continuation shows where they were going: straight through the rock, which
   * is the whole reason the bottom of a well is dark.
   */
  function drawShaftRays(w, centreX, skyTop, groundY, observerY, drawnHalf, evaluation) {
    const rays = 21;
    const drop = observerY - groundY;
    ctx.save();
    for (let i = 0; i < rays; i++) {
      const angle = (-1 + 2 * (i + 0.5) / rays) * SHAFT_RAY_SPAN;
      const reaches = Math.abs(angle) <= drawnHalf;
      const slope = Math.tan(angle);
      const groundX = centreX + drop * slope;
      const skyX = groundX + (groundY - skyTop) * slope;
      const colour = nearestDomeColor(evaluation, angle * 180 / Math.PI);

      // The part in the open air above the ground, in the colour of that sky.
      ctx.strokeStyle = colour;
      ctx.globalAlpha = reaches ? 0.95 : 0.5;
      ctx.lineWidth = reaches ? 2 : 1.1;
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(skyX, skyTop);
      ctx.lineTo(groundX, groundY);
      ctx.stroke();

      if (reaches) {
        ctx.beginPath();
        ctx.moveTo(groundX, groundY);
        ctx.lineTo(centreX, observerY);
        ctx.stroke();
        continue;
      }

      // Stopped. Where it would have gone, and the rock that is in the way.
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.moveTo(groundX, groundY);
      ctx.lineTo(centreX, observerY);
      ctx.stroke();
      ctx.setLineDash([]);

      // The mark where the rock takes it.
      if (groundX > -20 && groundX < w + 20) {
        ctx.globalAlpha = 0.95;
        ctx.strokeStyle = '#ff8a5a';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(groundX - 3.5, groundY - 3.5);
        ctx.lineTo(groundX + 3.5, groundY + 3.5);
        ctx.moveTo(groundX + 3.5, groundY - 3.5);
        ctx.lineTo(groundX - 3.5, groundY + 3.5);
        ctx.stroke();
      }
    }
    ctx.restore();

    // Say which is which, once, rather than colouring a legend.
    ctx.save();
    ctx.font = '10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText(i18n.t('canvas.shaftReaches'), centreX, observerY + 16);
    ctx.fillStyle = 'rgba(255,138,90,0.9)';
    ctx.textAlign = 'left';
    ctx.fillText(i18n.t('canvas.shaftAbsorbed'), 8, groundY - 6);
    ctx.restore();
  }

  /** Grey out the sky the shaft has taken away, leaving the patch that is left. */
  function dimBlockedSky(x, y, width, height, drawnHalf) {
    const keep = Math.max(2, Math.min(width, width * (drawnHalf / SHAFT_RAY_SPAN)));
    const left = x + (width - keep) / 2;
    ctx.save();
    ctx.fillStyle = 'rgba(4, 5, 9, 0.82)';
    ctx.fillRect(x, y, left - x, height);
    ctx.fillRect(left + keep, y, x + width - (left + keep), height);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(left - 0.5, y - 0.5, keep + 1, height + 1);
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(i18n.t('canvas.shaftPatch'), x + width / 2, y + height + 2);
    ctx.restore();
  }

  /** Paint the sampled sky dome as a horizon-to-horizon band. */
  function drawDomeBand(x, y, w, h, evaluation) {
    const dome = evaluation.dome;
    const n = dome.length;
    for (let i = 0; i < n; i++) {
      const cellX = x + (i / n) * w;
      const cellW = w / n + 1;
      ctx.fillStyle = dome[i].color.css;
      ctx.fillRect(cellX, y, cellW, h);
    }
  }

  function nearestDomeColor(evaluation, signedAngleDeg) {
    let best = evaluation.dome[0], bestDelta = Infinity;
    for (const sample of evaluation.dome) {
      const delta = Math.abs(sample.signedAngleDeg - signedAngleDeg);
      if (delta < bestDelta) { bestDelta = delta; best = sample; }
    }
    return best.color.css;
  }

  /* ---------------------------------------------------------------- */

  /** Find the traced ray nearest to a canvas point. */
  function pick(clientX, clientY) {
    if (!layout || !data || !data.photons) return -1;
    const rect = canvas.getBoundingClientRect();
    const px = clientX - rect.left;
    const py = clientY - rect.top;
    const project = layout.camera.project;
    let best = -1, bestDist = 12;
    for (let i = 0; i < data.photons.length; i++) {
      const pts = data.photons[i].points;
      let previous = project(pts[0]);
      for (let k = 1; k < pts.length; k++) {
        const current = project(pts[k]);
        const d = distanceToSegment(px, py, previous.x, previous.y, current.x, current.y);
        if (d < bestDist) { bestDist = d; best = i; }
        previous = current;
      }
    }
    return best;
  }

  function distanceToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lengthSq = dx * dx + dy * dy;
    const t = lengthSq > 0 ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / lengthSq)) : 0;
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  /** Forget the held brightness, so a new world or star starts from its own. */
  function resetScale() {
    rayReference = 0;
  }

  return {
    update, draw, pick, frameFor, resetScale,
    setHovered(index) { hoveredPath = index; },
    setSelected(index) { selectedPath = index; },
    getSelected() { return selectedPath; },
  };
}

/* Shared constants and helpers -------------------------------------- */

/**
 * The cross-section is drawn in true spherical geometry, orthographically
 * projected: the planet centre sits at the origin of world coordinates and the
 * camera is a plain translate-and-scale. Two consequences, both deliberate.
 *
 * Straight rays stay straight. An early version compressed the altitude axis by
 * a power law to give the dense lower air more room, which bent every ray on
 * screen - the wrong lesson in a picture about light travelling in straight
 * lines. Here it is the GROUND that curves, which is the truth, and at close
 * zoom that curve is a fraction of a pixel, so the picture looks flat by itself.
 *
 * And the frame can be zoomed out until the curve matters. That is the only way
 * to draw the reason a low Sun is red: its light crosses a chord hundreds of
 * kilometres long, which does not fit in a picture of the local sky.
 */

/** Vertical extent of the frame, in metres, at either end of the zoom control. */
const MIN_SPAN_M = 5e3;
const MAX_SPAN_M = 6e6;

function clampSpan(span) {
  return Math.max(MIN_SPAN_M, Math.min(MAX_SPAN_M, span));
}

/**
 * The span used when the observer has not chosen one: three scale heights,
 * which hold 95 % of the column, and always enough to contain the observer.
 */
function autoSpanFor(atmosphere, observerAltitude) {
  return clampSpan(Math.max(
    3 * atmosphere.scaleHeightRayleigh, Math.max(0, observerAltitude) * 1.35));
}

/**
 * How much of the frame is sky.
 *
 * Zoomed in, the ground belongs at the very bottom and the picture is all air.
 * Zoomed out, the planet has to be given room or its curve cannot be seen, so
 * the horizon rises towards the middle. Interpolated on the logarithm, because
 * that is how the zoom control moves.
 */
function skyFractionFor(span) {
  const lo = Math.log(6e4), hi = Math.log(2e6);
  const t = Math.max(0, Math.min(1, (Math.log(span) - lo) / (hi - lo)));
  return 0.95 + t * (0.42 - 0.95);
}

/**
 * The camera: everything the drawing needs to turn world metres into pixels,
 * and to know which piece of the world is on screen.
 */
function makeCamera(atmosphere, plot, span) {
  const R = atmosphere.planetRadius;
  const skyFraction = skyFractionFor(span);
  const scale = plot.h / span;
  const cx = plot.x + plot.w / 2;
  const groundY = plot.y + skyFraction * plot.h;
  return {
    R, span, scale, skyFraction, groundY, cx,
    halfWidth: (plot.w / 2) / scale,
    skyExtent: skyFraction * span,
    project: (q) => ({ x: cx + q.x * scale, y: groundY - (q.y - R) * scale }),
    /** Screen point back to the world, for hit testing. */
    unproject: (sx, sy) => ({ x: (sx - cx) / scale, y: R + (groundY - sy) / scale }),
  };
}

const FIELD_GAIN = 5.4e3;

/** A round number of metres near `metres`, for the scale bar. */
function niceRoundDistance(metres) {
  const power = Math.pow(10, Math.floor(Math.log10(Math.max(1, metres))));
  for (const step of [1, 2, 5, 10]) {
    if (metres <= step * power) return step * power;
  }
  return 10 * power;
}

function niceAltitudeTicks(topAltitude) {
  // The zoom now spans three orders of magnitude, so the ticks are generated
  // rather than chosen from a table: roughly five of them, on a 1-2-5 ladder.
  const step = niceRoundDistance(Math.max(1, topAltitude) / 4);
  const ticks = [];
  for (let v = 0; v <= topAltitude + 1e-6; v += step) ticks.push(Math.round(v));
  return ticks.slice(0, 9);
}

function formatAltitude(metres) {
  const a = Math.abs(metres);
  if (a === 0) return '0 m';
  if (a >= 1000) return `${(metres / 1000).toFixed(a >= 10000 ? 0 : 1)} km`;
  if (a >= 1) return `${metres.toFixed(0)} m`;
  return `${metres.toFixed(2)} m`;
}

function formatAngle(deg) {
  const a = Math.abs(deg);
  if (a >= 1) return `${deg.toFixed(1)}°`;
  if (a >= 0.01) return `${deg.toFixed(3)}°`;
  return `${(deg * 3600).toExponential(1)}″`;
}

/* ===== js/render/sky-strip.js ===== */
/**
 * The observer's own view of the sky, from one horizon to the other.
 *
 * Every column is one viewing direction, filled with the colour that the
 * radiance integrator returned for it. Where the shaft wall stops a direction
 * the column is black, so the geometry of a well shows up immediately as a
 * pair of black wings closing in on a shrinking strip of sky.
 */

function createSkyStrip(canvas, { i18n }) {
  const ctx = canvas.getContext('2d', { alpha: false });
  let data = null;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(280, rect.width);
    const h = Math.max(56, rect.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  function update(next) { data = next; }

  function draw() {
    const { w, h } = resize();
    ctx.fillStyle = '#05070d';
    ctx.fillRect(0, 0, w, h);
    if (!data || !data.result) return;

    const evaluations = data.state.compare.enabled && data.result.compare
      ? [
        { evaluation: data.result.compare.left, label: i18n.t('compare.left') },
        { evaluation: data.result.compare.right, label: i18n.t('compare.right') },
      ]
      : [{ evaluation: data.result.primary, label: null }];

    const bandHeight = (h - 16) / evaluations.length;
    evaluations.forEach((entry, index) => {
      drawBand(entry.evaluation, 0, index * bandHeight, w, bandHeight, entry.label);
    });
    drawScale(w, h);
  }

  /**
   * Where a viewing angle lands on the strip. The angular axis is not always
   * linear: inside a shaft the middle of the strip is magnified so the sliver
   * of visible sky can be seen at all, so positions are found by walking the
   * samples rather than by scaling the angle.
   */
  function angleToX(dome, signedAngle, x, w) {
    const n = dome.length;
    if (signedAngle <= dome[0].signedAngleDeg) return x;
    if (signedAngle >= dome[n - 1].signedAngleDeg) return x + w;
    for (let i = 1; i < n; i++) {
      if (dome[i].signedAngleDeg >= signedAngle) {
        const span = dome[i].signedAngleDeg - dome[i - 1].signedAngleDeg;
        const t = span > 0 ? (signedAngle - dome[i - 1].signedAngleDeg) / span : 0;
        return x + ((i - 1 + t) / (n - 1)) * w;
      }
    }
    return x + w;
  }

  function drawBand(evaluation, x, y, w, h, label) {
    const dome = evaluation.dome;
    const n = dome.length;
    for (let i = 0; i < n; i++) {
      // The band runs left to right from the horizon away from the star,
      // through the zenith, to the horizon beneath it.
      const cellX = x + (i / n) * w;
      ctx.fillStyle = dome[i].color.css;
      ctx.fillRect(cellX, y, w / n + 1, h);
    }

    // Mark the magnified span, so nobody reads it as a wide patch of sky.
    const firstMagnified = dome.findIndex((s) => s.magnified);
    if (firstMagnified >= 0) {
      const lastMagnified = dome.length - 1 - [...dome].reverse().findIndex((s) => s.magnified);
      const x1 = x + (firstMagnified / n) * w;
      const x2 = x + ((lastMagnified + 1) / n) * w;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,200,120,0.85)';
      ctx.setLineDash([3, 3]);
      ctx.lineWidth = 1;
      for (const edge of [x1, x2]) {
        ctx.beginPath();
        ctx.moveTo(edge, y);
        ctx.lineTo(edge, y + h);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,200,120,0.9)';
      ctx.font = '9px system-ui, sans-serif';
      ctx.textAlign = 'center';
      const half = dome[lastMagnified].signedAngleDeg;
      const text = (i18n.getLanguage() === 'cs' ? 'otvor ±' : 'aperture ±') +
        (half >= 1 ? half.toFixed(1) + '°' : half.toExponential(1) + '°');
      ctx.fillText(text, (x1 + x2) / 2, y + h - 4);
      ctx.restore();
    }

    // Where the star sits in this view.
    const elevation = data.state.star.elevationDeg;
    if (elevation >= 0) {
      const sx = angleToX(dome, 90 - elevation, x, w);
      const blocked = evaluation.beam.visible === false;
      ctx.save();
      ctx.globalAlpha = blocked ? 0.25 : 1;
      ctx.fillStyle = evaluation.colors.star.css;
      ctx.beginPath();
      ctx.arc(sx, y + h * 0.42, Math.max(4, h * 0.12), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Where the observer is currently looking.
    const viewSigned = data.state.observer.viewZenithDeg *
      (Math.cos(data.state.observer.viewAzimuthDeg * Math.PI / 180) >= 0 ? 1 : -1);
    const vx = angleToX(dome, viewSigned, x, w);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(vx, y);
    ctx.lineTo(vx, y + h);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.moveTo(vx, y + h);
    ctx.lineTo(vx - 5, y + h - 7);
    ctx.lineTo(vx + 5, y + h - 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    if (label) {
      ctx.save();
      ctx.font = '600 11px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 3;
      ctx.strokeText(label, x + 8, y + 15);
      ctx.fillText(label, x + 8, y + 15);
      ctx.restore();
    }
  }

  function drawScale(w, h) {
    ctx.save();
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.textBaseline = 'bottom';
    ctx.textAlign = 'left';
    ctx.fillText(i18n.t('controls.observer.horizon'), 4, h - 2);
    ctx.textAlign = 'center';
    ctx.fillText(i18n.t('controls.observer.zenith'), w / 2, h - 2);
    ctx.textAlign = 'right';
    ctx.fillText(i18n.t('controls.observer.horizon'), w - 4, h - 2);
    ctx.restore();
  }

  return { update, draw };
}

/* ===== js/render/spectrum-chart.js ===== */
/**
 * The spectrum plot: four curves on one pair of axes.
 *
 *   source     what the star emitted, above the atmosphere
 *   direct     what is left of that beam after the air
 *   scattered  the light arriving from the sky instead
 *   observed   what the eye actually collects in this direction
 *
 * Read together they tell the whole story: the dip the direct beam loses at
 * short wavelengths is the hump the scattered curve gains.
 */


const SERIES = [
  { key: 'source', color: '#e8e8ea', dash: [5, 4], width: 1.6 },
  { key: 'direct', color: '#ffb454', dash: [], width: 2 },
  { key: 'scattered', color: '#5aa9ff', dash: [], width: 2 },
  { key: 'observed', color: '#7ef0c0', dash: [2, 3], width: 1.6 },
];

function createSpectrumChart(canvas, { i18n }) {
  const ctx = canvas.getContext('2d', { alpha: false });
  let payload = null;
  let visible = new Set(SERIES.map((s) => s.key));

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(240, rect.width);
    const h = Math.max(150, rect.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  function update(next) { payload = next; }

  function toggle(key) {
    if (visible.has(key)) visible.delete(key); else visible.add(key);
  }

  function isVisible(key) { return visible.has(key); }

  function draw() {
    const { w, h } = resize();
    ctx.fillStyle = '#0b0e16';
    ctx.fillRect(0, 0, w, h);
    if (!payload) return;

    const padLeft = 34, padRight = 8, padTop = 10, padBottom = 30;
    const plot = { x: padLeft, y: padTop, w: w - padLeft - padRight, h: h - padTop - padBottom };

    const curves = SERIES
      .filter((s) => visible.has(s.key) && payload.curves[s.key])
      .map((s) => ({ ...s, values: payload.curves[s.key] }));

    // One shared vertical scale keeps the curves comparable; without it the
    // sky curve would be rescaled into looking as strong as the direct beam.
    let peak = 0;
    for (const c of curves) {
      for (let i = 0; i < SPECTRUM_BINS; i++) if (c.values[i] > peak) peak = c.values[i];
    }
    if (!(peak > 0)) peak = 1;

    const toX = (i) => plot.x + (i / (SPECTRUM_BINS - 1)) * plot.w;
    const toY = (v) => plot.y + plot.h - (v / peak) * plot.h;

    drawWavelengthAxis(plot, toX);
    drawGrid(plot, peak, toY);

    for (const c of curves) {
      ctx.save();
      ctx.strokeStyle = c.color;
      ctx.lineWidth = c.width;
      ctx.setLineDash(c.dash);
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < SPECTRUM_BINS; i++) {
        const x = toX(i), y = toY(c.values[i]);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    if (peak <= 1e-12 || curves.length === 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(i18n.t('spectrum.empty'), plot.x + plot.w / 2, plot.y + plot.h / 2);
      ctx.restore();
    }

    ctx.save();
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.textAlign = 'center';
    ctx.fillText(i18n.t('spectrum.axisX'), plot.x + plot.w / 2, h - 3);
    ctx.restore();
  }

  /** A true-colour ribbon under the axis, so the axis reads as light. */
  function drawWavelengthAxis(plot, toX) {
    const bandY = plot.y + plot.h + 3;
    const bandH = 7;
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      const [r, g, b] = wavelengthToDisplayRgb(WAVELENGTHS_NM[i]);
      ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.fillRect(toX(i) - plot.w / (SPECTRUM_BINS - 1) / 2, bandY,
        plot.w / (SPECTRUM_BINS - 1) + 1, bandH);
    }
    ctx.save();
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (const nm of [400, 500, 600, 700]) {
      const i = (nm - 380) / 10;
      ctx.fillText(String(nm), toX(i), bandY + bandH + 1);
    }
    ctx.restore();
  }

  function drawGrid(plot, peak, toY) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '9px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let k = 0; k <= 4; k++) {
      const value = (peak * k) / 4;
      const y = toY(value);
      ctx.beginPath();
      ctx.moveTo(plot.x, y + 0.5);
      ctx.lineTo(plot.x + plot.w, y + 0.5);
      ctx.stroke();
      ctx.fillText(formatTick(value), plot.x - 4, y);
    }
    ctx.restore();
  }

  function formatTick(v) {
    if (v === 0) return '0';
    if (v >= 0.01 && v < 1000) return v.toPrecision(2);
    return v.toExponential(0);
  }

  return { update, draw, toggle, isVisible, series: SERIES };
}

/* ===== js/render/chromaticity.js ===== */
/**
 * The CIE 1931 chromaticity diagram, with the current sky and star plotted on
 * it. Advanced students can watch the sky point slide along the blue edge as
 * the wavelength exponent changes, and the star point crawl down the Planckian
 * locus as its temperature falls.
 */

function createChromaticityPlot(canvas, { colorimetry, i18n }) {
  const locus = colorimetry.spectralLocus();
  let payload = null;
  let backdrop = null;
  const ctx = canvas.getContext('2d', { alpha: false });

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const size = Math.max(120, Math.min(rect.width, 260));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(size * dpr) || canvas.height !== Math.round(size * dpr)) {
      canvas.width = Math.round(size * dpr);
      canvas.height = Math.round(size * dpr);
      backdrop = null;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return size;
  }

  const toX = (x, size) => 8 + x * (size - 20) / 0.75;
  const toY = (y, size) => size - 12 - y * (size - 20) / 0.85;

  /** The horseshoe is expensive to fill, so it is painted once and cached. */
  function buildBackdrop(size) {
    const off = document.createElement('canvas');
    off.width = size; off.height = size;
    const octx = off.getContext('2d');
    octx.fillStyle = '#0b0e16';
    octx.fillRect(0, 0, size, size);

    const image = octx.createImageData(size, size);
    for (let py = 0; py < size; py++) {
      for (let px = 0; px < size; px++) {
        const x = (px - 8) * 0.75 / (size - 20);
        const y = (size - 12 - py) * 0.85 / (size - 20);
        const z = 1 - x - y;
        if (x < 0 || y <= 0 || z < 0 || !insideLocus(x, y)) continue;
        // Normalise to constant luminance so the shape shows hue, not brightness.
        const scale = 1 / y;
        const linear = colorimetry.xyzToLinearRgb([x * scale, 1, z * scale]);
        const fitted = colorimetry.fitToGamut(linear);
        const i = (py * size + px) * 4;
        image.data[i] = Math.round(colorimetry.encodeComponent(fitted.rgb[0]) * 255);
        image.data[i + 1] = Math.round(colorimetry.encodeComponent(fitted.rgb[1]) * 255);
        image.data[i + 2] = Math.round(colorimetry.encodeComponent(fitted.rgb[2]) * 255);
        image.data[i + 3] = 235;
      }
    }
    octx.putImageData(image, 0, 0);
    return off;
  }

  /** Even-odd test against the closed spectral locus. */
  function insideLocus(x, y) {
    let inside = false;
    for (let i = 0, j = locus.length - 1; i < locus.length; j = i++) {
      const xi = locus[i].x, yi = locus[i].y;
      const xj = locus[j].x, yj = locus[j].y;
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  function update(next) { payload = next; }

  function draw() {
    const size = resize();
    if (!backdrop) backdrop = buildBackdrop(size);
    ctx.drawImage(backdrop, 0, 0);

    // Outline.
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    locus.forEach((p, i) => {
      const px = toX(p.x, size), py = toY(p.y, size);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    if (!payload) return;
    const points = [
      { xy: payload.sky, label: 'sky', ring: '#ffffff' },
      { xy: payload.star, label: 'star', ring: '#ffd88a' },
    ];
    for (const point of points) {
      if (!point.xy) continue;
      const px = toX(point.xy[0], size), py = toY(point.xy[1], size);
      ctx.save();
      ctx.strokeStyle = point.ring;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('x', size - 12, size - 2);
    ctx.fillText('y', 2, 10);
    ctx.restore();
  }

  return { update, draw };
}

/* ===== js/render/beam-histogram.js ===== */
/**
 * The spectrum of the light the drawn rays deliver, as a chart.
 *
 * The spectrum plot on the right is the analytic answer: smooth curves the
 * integrator produced. This is the measured one - the few hundred rays on
 * screen, each carrying an unbiased estimate of what it contributes, summed per
 * wavelength. The colour it implies is shown beside the integrator's own, and
 * the two agree, which is the point: the picture and the theory are one thing.
 *
 * An earlier version counted rays instead of weighing them. That could never
 * fall when the sky darkened - a fixed number of rays is drawn whatever the
 * state - so climbing to 40 km emptied the sky of light without moving a single
 * bar, while the colour swatch went black. Weighted by energy, and against a
 * scale that is held rather than refitted, the bars collapse with it.
 *
 * Filled bars are the light arriving at the observer: coloured from the viewing
 * cone, grey from the rest of the sky. The dashed outline is the unscattered
 * direct beam, scaled to its own peak because it carries thousands of times
 * more energy than the sky and is here for its shape - which marches red as the
 * star sinks.
 */

const PAD = { left: 34, right: 10, top: 10, bottom: 22 };

function createBeamHistogram(canvas, { i18n }) {
  const ctx = canvas.getContext('2d', { alpha: false });
  let histogram = null;
  /** The brightest the sky has been, held so the bars can visibly fall. */
  let reference = 0;

  function cssSize() {
    const rect = canvas.getBoundingClientRect();
    return { w: Math.max(240, rect.width), h: Math.max(80, rect.height) };
  }

  function resize() {
    const { w, h } = cssSize();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  function update(next) {
    histogram = next;
  }

  function draw() {
    const { w, h } = resize();
    ctx.fillStyle = '#0a0d16';
    ctx.fillRect(0, 0, w, h);
    if (!histogram) return;

    const plot = {
      x: PAD.left, y: PAD.top,
      w: w - PAD.left - PAD.right, h: h - PAD.top - PAD.bottom,
    };
    const bins = histogram.centres.length;
    const slot = plot.w / bins;
    const barW = Math.max(2, slot - 2);

    // The vertical scale is the brightest the sky has been since the page
    // loaded, held rather than re-fitted every frame. Re-fitting would defeat
    // the whole purpose: climbing until the sky is black would keep the bars
    // exactly as tall as before, which is the bug this chart exists to answer.
    if (histogram.peak > reference) reference = histogram.peak;
    const top = Math.max(reference, 1e-30) * 1.08;

    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    for (const frac of [0, 0.5, 1]) {
      const y = plot.y + plot.h - frac * plot.h;
      ctx.beginPath();
      ctx.moveTo(plot.x, y + 0.5);
      ctx.lineTo(plot.x + plot.w, y + 0.5);
      ctx.stroke();
    }
    ctx.restore();

    for (let b = 0; b < bins; b++) {
      const cone = histogram.inCone[b];
      const other = histogram.elsewhere[b];
      if (cone + other <= 0) continue;
      const x = plot.x + b * slot + (slot - barW) / 2;
      const [r, g, bl] = wavelengthToDisplayRgb(histogram.centres[b]);
      const coneH = Math.min(plot.h, (cone / top) * plot.h);
      const otherH = Math.min(plot.h - coneH, (other / top) * plot.h);
      const base = plot.y + plot.h;

      ctx.fillStyle = 'rgba(138, 147, 166, 0.42)';
      ctx.fillRect(x, base - coneH - otherH, barW, otherH);
      ctx.fillStyle = `rgb(${r}, ${g}, ${bl})`;
      ctx.fillRect(x, base - coneH, barW, coneH);
    }

    // The direct beam, drawn as an outline scaled to its own peak. It carries
    // thousands of times more energy than the sky does, so it cannot share the
    // axis; what it is here for is its SHAPE, which marches red as the star
    // sinks while the sky is doing something different.
    if (histogram.directPeak > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      for (let b = 0; b < bins; b++) {
        const y = plot.y + plot.h
          - (histogram.direct[b] / histogram.directPeak) * plot.h * 0.9;
        const x = plot.x + b * slot + slot / 2;
        if (b === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    // Wavelength axis, drawn as the spectrum itself: no legend needed to say
    // which end is which.
    ctx.save();
    const strip = ctx.createLinearGradient(plot.x, 0, plot.x + plot.w, 0);
    for (let i = 0; i <= 10; i++) {
      const [r, g, b] = wavelengthToDisplayRgb(380 + (i / 10) * 370);
      strip.addColorStop(i / 10, `rgb(${r}, ${g}, ${b})`);
    }
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = strip;
    ctx.fillRect(plot.x, plot.y + plot.h + 3, plot.w, 4);
    ctx.restore();

    ctx.save();
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText('380 nm', plot.x, plot.y + plot.h + 9);
    ctx.textAlign = 'right';
    ctx.fillText('750 nm', plot.x + plot.w, plot.y + plot.h + 9);

    const parts = [];
    if (histogram.coneMeanNm != null) {
      parts.push(`${i18n.t('histogram.sky')} ${histogram.coneMeanNm.toFixed(0)} nm`);
    }
    if (histogram.directMeanNm != null) {
      parts.push(`${i18n.t('histogram.direct')} ${histogram.directMeanNm.toFixed(0)} nm`);
    }
    if (parts.length) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      ctx.fillText(parts.join('   ·   '), plot.x + plot.w / 2, plot.y + plot.h + 9);
    }

    // How far the sky has fallen from its brightest, which is the number that
    // moves when the observer climbs and the bars shrink to nothing.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    const share = reference > 0 ? histogram.peak / reference : 0;
    ctx.fillText(share >= 0.995 ? '100 %'
      : share >= 0.01 ? `${(share * 100).toFixed(0)} %`
        : share > 0 ? `${(share * 100).toPrecision(2)} %` : '0 %',
    2, plot.y + 6);
    ctx.restore();
  }

  /** Forget the held scale, so a new world or star starts from its own peak. */
  function resetScale() {
    reference = 0;
  }

  return { update, draw, resetScale };
}

/**
 * The control panel.
 *
 * Controls are declared as data rather than written out as markup, so adding a
 * new physical parameter is one entry in the list below. Each entry names the
 * state path it drives; nothing here knows anything about the physics.
 */

function getPath(object, path) {
  return path.split('.').reduce((node, key) => (node == null ? node : node[key]), object);
}

function setPath(patch, path, value) {
  const keys = path.split('.');
  let node = patch;
  for (let i = 0; i < keys.length - 1; i++) {
    node[keys[i]] = node[keys[i]] ?? {};
    node = node[keys[i]];
  }
  node[keys[keys.length - 1]] = value;
  return patch;
}

/** Surface pressure, in whatever unit keeps the number readable. */
function formatPressure(kPa) {
  if (kPa >= 1000) return `${(kPa / 1000).toFixed(1)} MPa`;
  if (kPa >= 1) return `${kPa.toFixed(kPa >= 10 ? 0 : 2)} kPa`;
  if (kPa > 0) return `${(kPa * 1000).toFixed(0)} Pa`;
  return '0';
}

/** Logarithmic slider mapping, for controls spanning several decades. */
function logToValue(t, min, max) {
  return min * Math.pow(max / min, t);
}
function valueToLog(v, min, max) {
  return Math.log(Math.max(min, v) / min) / Math.log(max / min);
}

function createControls(root, { store, i18n, config }) {
  const elements = new Map();

  /**
   * Just enough of an atmosphere for autoSpanFor: it only reads the scale
   * height, and building a whole atmosphere to fill in a slider would be

  function atmosphereShape(state) {

  const sections = [

          min: 0, max: 5, step: 0.05,
          format: (v) => `${v.toFixed(2)} ×`,
        },
        {
          id: 'ctl-scale-height', type: 'range', labelKey: 'controls.atmosphere.scaleHeight',
          helpKey: 'controls.atmosphere.scaleHeightHelp', path: 'atmosphere.scaleHeight_m',
          min: 1000, max: 60000, step: 100, advanced: true,
          fallback: (state) => config.atmospheres.get(state.atmosphere.presetId)?.rayleigh.scaleHeight_m ?? 8500,
          format: (v) => `${(v / 1000).toFixed(1)} km`,
        },
        {
          id: 'ctl-exponent', type: 'range', labelKey: 'controls.atmosphere.exponent',
          helpKey: 'controls.atmosphere.exponentHelp', path: 'atmosphere.rayleighExponent',
          min: 0, max: 6, step: 0.1, advanced: true,
          format: (v) => `n = ${v.toFixed(1)}`,
        },
        {
          // What this world is actually made of, named from the gas table in
          // config/scattering/rayleigh_gases.json.
          id: 'ctl-composition', type: 'note',
          text: (state) => {
            const world = config.atmospheres.get(state.atmosphere.presetId);
            if (!world) return '';
            const table = config.scattering.get('rayleigh_gases')?.gases ?? {};
            const parts = (world.composition ?? [])
              .filter((entry) => entry.fraction >= 0.001)
              .map((entry) => {
                const name = i18n.localized(table[entry.gas]?.name, entry.gas);
                return `${name} ${(entry.fraction * 100).toFixed(entry.fraction >= 0.1 ? 0 : 1)} %`;
              });
            const composition = parts.length
              ? `${i18n.t('controls.atmosphere.composition')}: ${parts.join(', ')}`
              : '';
            const pressure = world.surfacePressure_kPa != null
              ? `${i18n.t('controls.atmosphere.surfacePressure')}: ${formatPressure(world.surfacePressure_kPa)}`
              : '';
            return [composition, pressure, i18n.localized(world.description)]
              .filter(Boolean).join('\n');
