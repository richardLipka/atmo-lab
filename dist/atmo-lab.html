<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratoř atmosférického světla</title>
<meta name="description" content="Interaktivní fyzikální laboratoř: rozptyl světla v atmosféře, barva oblohy, západ Slunce a geometrie studny.">
<style>
/* ------------------------------------------------------------------ *
 * Atmospheric Light Laboratory
 *
 * A dark instrument panel, so that the colours the physics produces are
 * judged against neutral surroundings rather than against a bright page.
 * ------------------------------------------------------------------ */

:root {
  --bg: #070910;
  --bg-panel: #0f131d;
  --bg-panel-2: #141926;
  --bg-input: #1b2131;
  --line: #242c3d;
  --line-soft: #1c2333;
  --text: #e8ecf5;
  --text-dim: #9aa5bb;
  --text-faint: #6b7488;
  --accent: #5aa9ff;
  --accent-warm: #ffb454;
  --accent-green: #7ef0c0;
  --danger: #ff6b6b;
  --radius: 10px;
  --radius-sm: 6px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; font-weight: 600; }

button, select, input { font-family: inherit; font-size: inherit; color: inherit; }

/* ---- boot screen -------------------------------------------------- */

.boot {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--bg);
  z-index: 50;
}
.boot-inner { text-align: center; color: var(--text-dim); }
.boot-spinner {
  width: 34px; height: 34px;
  margin: 0 auto 14px;
  border: 3px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 900ms linear infinite;
}
.boot.is-error .boot-spinner { border-top-color: var(--danger); animation: none; }
.boot.is-error p { color: var(--danger); max-width: 46ch; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- shell -------------------------------------------------------- */

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  gap: 8px;
  padding: 10px;
}

.app-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 10px 14px;
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.brand h1 { font-size: 17px; letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; font-size: 12px; color: var(--text-dim); }

.header-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.control-group { display: flex; align-items: center; gap: 7px; }
.group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }

.segmented {
  display: inline-flex;
  background: var(--bg-input);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.segmented button {
  border: 0;
  background: transparent;
  color: var(--text-dim);
  padding: 5px 11px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: background 120ms, color 120ms;
}
.segmented button:hover { color: var(--text); }
.segmented button.is-active { background: var(--accent); color: #061021; font-weight: 600; }

select, .ghost-button, .primary-button {
  background: var(--bg-input);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 5px 10px;
  cursor: pointer;
}
select { max-width: 210px; }
select:focus-visible, button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.ghost-button { color: var(--text-dim); transition: color 120ms, border-color 120ms; }
.ghost-button:hover { color: var(--text); border-color: var(--accent); }
.ghost-button.small { padding: 3px 8px; font-size: 12px; }
.primary-button {
  background: var(--accent);
  border-color: var(--accent);
  color: #061021;
  font-weight: 600;
}
.primary-button:hover { filter: brightness(1.08); }
button:disabled { opacity: 0.4; cursor: default; }

/* ---- layout ------------------------------------------------------- */

.layout {
  display: grid;
  grid-template-columns: 290px minmax(0, 1fr) 330px;
  gap: 8px;
  min-height: 0;
}

.panel {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  min-height: 0;
  overflow: hidden;
}

.panel-scroll {
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.panel-scroll::-webkit-scrollbar { width: 9px; }
.panel-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }

.panel-center {
  display: grid;
  /* The cross-section takes whatever is left; the histogram and the sky strip
     are fixed strips beneath it. */
  grid-template-rows: minmax(0, 1fr) auto auto auto auto;
  gap: 6px;
  padding: 8px;
}

/* ---- controls ----------------------------------------------------- */

.control-section { margin-bottom: 18px; }
.control-section h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--accent);
  padding-bottom: 5px;
  margin-bottom: 9px;
  border-bottom: 1px solid var(--line-soft);
}

.field { margin-bottom: 11px; }
.field[hidden] { display: none; }

.field-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 3px;
}
.field-value {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  white-space: nowrap;
}

.field input[type="range"] {
  width: 100%;
  height: 18px;
  background: transparent;
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
}
.field input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  background: var(--bg-input);
  border-radius: 2px;
}
.field input[type="range"]::-moz-range-track {
  height: 4px;
  background: var(--bg-input);
  border-radius: 2px;
}
.field input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  margin-top: -5px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg-panel);
}
.field input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg-panel);
}

.field select { width: 100%; max-width: none; }

.field-check {
  display: flex;
  align-items: center;
  gap: 8px;
}
.field-check input[type="checkbox"] {
  width: 15px; height: 15px;
  accent-color: var(--accent);
  cursor: pointer;
  flex: none;
}
.field-check .field-label { margin: 0; flex: 1; }

.field.is-highlighted {
  animation: pulse 1.6s ease-out 3;
  border-radius: var(--radius-sm);
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(90, 169, 255, 0); }
  35% { box-shadow: 0 0 0 3px rgba(90, 169, 255, 0.45); }
}

/* ---- centre canvas ------------------------------------------------ */

.canvas-wrap {
  position: relative;
  min-height: 0;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: #05070d;
}
#scene-canvas { display: block; width: 100%; height: 100%; }

.canvas-hint {
  position: absolute;
  right: 8px; bottom: 6px;
  margin: 0;
  font-size: 10px;
  color: rgba(255, 255, 255, 0.4);
  pointer-events: none;
}

.sky-wrap { display: grid; gap: 3px; }
.hist-wrap { display: grid; gap: 3px; }
.strip-header {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-faint);
}
.strip-help {
  display: inline-grid;
  place-items: center;
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 1px solid var(--line);
  font-size: 9px;
  cursor: help;
}
#sky-canvas {
  display: block;
  width: 100%;
  height: 78px;
  border-radius: var(--radius-sm);
}
#histogram-canvas {
  display: block;
  width: 100%;
  height: 86px;
  border-radius: var(--radius-sm);
}

.canvas-note { margin: 0; font-size: 10.5px; color: var(--text-faint); }

.ray-log {
  background: var(--bg-panel-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  max-height: 150px;
  overflow-y: auto;
}
.ray-log-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  margin-bottom: 5px;
}
.ray-log-summary {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  margin-bottom: 5px;
}
.ray-events {
  margin: 0;
  padding-left: 20px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
}
.ray-events li { margin-bottom: 2px; }

/* ---- right panel -------------------------------------------------- */

.panel-section { margin-bottom: 16px; }
.panel-section h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--accent);
  padding-bottom: 5px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--line-soft);
}

.chart-wrap { height: 172px; }
#spectrum-canvas { display: block; width: 100%; height: 100%; border-radius: var(--radius-sm); }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  margin-top: 6px;
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: none;
  border: 0;
  padding: 1px 0;
  font-size: 11px;
  color: var(--text-dim);
  cursor: pointer;
}
.legend-item:hover { color: var(--text); }
.legend-item.is-off { opacity: 0.35; text-decoration: line-through; }
.legend-swatch {
  width: 14px; height: 3px;
  border-radius: 2px;
  flex: none;
}

.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.swatch { min-width: 0; }
.swatch-chip {
  height: 46px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: #000;
  transition: background 160ms ease;
}
.swatch-caption { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.swatch-detail {
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--text-faint);
  overflow-wrap: anywhere;
}
.swatch.is-dim .swatch-chip { opacity: 0.45; }

.note { margin: 8px 0 0; font-size: 10.5px; color: var(--text-faint); }
.note-tally { color: var(--accent-green); }

.chroma-wrap { display: grid; place-items: center; }
#chroma-canvas { width: 100%; max-width: 220px; aspect-ratio: 1; border-radius: var(--radius-sm); }

.data-table { width: 100%; border-collapse: collapse; }
.data-table td, .data-table th { padding: 3px 0; vertical-align: baseline; }
.data-head th {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-faint);
  text-align: right;
  padding-bottom: 5px;
}
.data-label { font-size: 11.5px; color: var(--text-dim); padding-right: 8px; }
.data-value {
  font-family: var(--mono);
  font-size: 11px;
  text-align: right;
  white-space: nowrap;
}
.data-table tr.is-key .data-value { color: var(--accent-warm); font-weight: 600; }
.data-table tr.is-key .data-label { color: var(--text); }
.data-separator td { border-top: 1px solid var(--line-soft); padding: 0; height: 7px; }

/* ---- experiment bar ----------------------------------------------- */

.experiment-bar {
  background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  padding: 10px 14px;
}
.experiment-bar[hidden] { display: none; }

.experiment-head {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
  flex-wrap: wrap;
}
.experiment-step { font-size: 11px; color: var(--text-faint); margin-left: 8px; }

.experiment-progress { display: flex; gap: 5px; margin-left: auto; }
.progress-dot {
  width: 9px; height: 9px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--bg-input);
  cursor: pointer;
}
.progress-dot.is-done { background: var(--accent); opacity: 0.55; }
.progress-dot.is-active { background: var(--accent); border-color: var(--accent); transform: scale(1.25); }

.experiment-body { margin: 7px 0; font-size: 13px; }

.experiment-hint {
  display: flex;
  gap: 8px;
  font-size: 12px;
  color: var(--text-dim);
  padding: 5px 9px;
  margin-bottom: 4px;
  background: rgba(90, 169, 255, 0.07);
  border-left: 2px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.experiment-hint[hidden] { display: none; }
.experiment-hint.is-question {
  background: rgba(255, 180, 84, 0.08);
  border-left-color: var(--accent-warm);
}
.hint-label {
  flex: none;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  padding-top: 2px;
}

.experiment-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

/* ---- explanation footer ------------------------------------------- */

.explain {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  padding: 11px 14px;
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.explain h3 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  margin-bottom: 4px;
}
.explain-column.is-why h3 { color: var(--accent-warm); }
.explain p { margin: 0; font-size: 12.5px; color: var(--text-dim); }
.explain-column.is-why p { font-family: var(--mono); font-size: 11.5px; }

.explain-badge {
  position: absolute;
  top: 8px; right: 10px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-faint);
  opacity: 0.6;
}

/* Basic level keeps the equations available but visually secondary. */
body[data-level="basic"] .explain { grid-template-columns: 1.35fr 1fr; }
body[data-level="basic"] .explain-column.is-why { opacity: 0.78; }

/* ---- responsive --------------------------------------------------- */

@media (max-width: 1180px) {
  .layout { grid-template-columns: 250px minmax(0, 1fr) 290px; }
}

@media (max-width: 980px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-rows: none; }
  .layout { grid-template-columns: 1fr; }
  .panel { overflow: visible; }
  .panel-scroll { height: auto; max-height: none; overflow: visible; }
  .canvas-wrap { height: 52vh; min-height: 300px; }
  .panel-center { grid-template-rows: auto auto auto auto auto; }
  .explain { grid-template-columns: 1fr; }
  body[data-level="basic"] .explain { grid-template-columns: 1fr; }
}

@media (max-width: 620px) {
  .app-header { flex-direction: column; align-items: flex-start; }
  .header-controls { gap: 10px; }
  .swatches { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* A short block of prose inside the control column: what a world is made of,
   how thick its air is, and why that matters. */
.field-note {
  font-size: 11px;
  line-height: 1.5;
  color: var(--text-faint);
  white-space: pre-line;
  padding: 7px 9px;
  margin-top: 2px;
  background: var(--bg-panel-2);
  border-left: 2px solid var(--line);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

</style>

ularRadius_deg":0.2,"spectralClass":"B8Ia","colorHint":{"cs":"modrobílá","en":"blue-white"},"description":{"cs":"Velmi horká hvězda. Ve viditelném oboru roste zářivý tok směrem ke krátkým vlnovým délkám.","en":"A very hot star. Across the visible range its flux rises toward short wavelengths."}},"scattering/rayleigh_gases.json":{"id":"rayleigh_gases","description":{"cs":"Relativní Rayleighovy účinné průřezy běžných atmosférických plynů vztažené k suchému vzduchu při 550 nm. Zahrnují index lomu i Kingův depolarizační faktor.","en":"Relative Rayleigh cross-sections of common atmospheric gases, referenced to dry air at 550 nm. They fold in refractive index and the King depolarisation factor."},"referenceGas":"air","referenceCrossSection_m2":4.56e-31,"gases":{"air":{"name":{"cs":"vzduch","en":"air"},"relativeCrossSection":1,"depolarization":0.0279,"molarMass_gpmol":28.96},"n2":{"name":{"cs":"dusík","en":"nitrogen"},"relativeCrossSection":1.02,"depolarization":0.0305,"molarMass_gpmol":28.01},"o2":{"name":{"cs":"kyslík","en":"oxygen"},"relativeCrossSection":0.85,"depolarization":0.054,"molarMass_gpmol":32},"ar":{"name":{"cs":"argon","en":"argon"},"relativeCrossSection":0.87,"depolarization":0,"molarMass_gpmol":39.95},"co2":{"name":{"cs":"oxid uhličitý","en":"carbon dioxide"},"relativeCrossSection":2.45,"depolarization":0.0805,"molarMass_gpmol":44.01},"ch4":{"name":{"cs":"metan","en":"methane"},"relativeCrossSection":2.3,"depolarization":0,"molarMass_gpmol":16.04},"h2":{"name":{"cs":"vodík","en":"hydrogen"},"relativeCrossSection":0.21,"depolarization":0.0221,"molarMass_gpmol":2.02},"he":{"name":{"cs":"helium","en":"helium"},"relativeCrossSection":0.014,"depolarization":0,"molarMass_gpmol":4}}},"scattering/aerosols.json":{"id":"aerosols","description":{"cs":"Vzdělávací aproximace Mieova rozptylu na částicích srovnatelných s vlnovou délkou. Používá Henyeyovu-Greensteinovu fázovou funkci a mocninný (Ångströmův) zákon pro vlnovou délku.","en":"An educational approximation of Mie scattering on particles comparable to the wavelength. It uses a Henyey-Greenstein phase function and an Angstrom power law in wavelength."},"presets":{"clean":{"name":{"cs":"Čistý vzduch","en":"Clean air"},"beta550_perM":0.000004,"scaleHeight_m":1200,"angstromExponent":1.3,"asymmetry_g":0.7,"singleScatteringAlbedo":0.95},"rural":{"name":{"cs":"Venkovský aerosol","en":"Rural aerosol"},"beta550_perM":0.000021,"scaleHeight_m":1200,"angstromExponent":1,"asymmetry_g":0.76,"singleScatteringAlbedo":0.9},"urban-haze":{"name":{"cs":"Městský smog","en":"Urban haze"},"beta550_perM":0.00012,"scaleHeight_m":900,"angstromExponent":0.8,"asymmetry_g":0.8,"singleScatteringAlbedo":0.75},"desert-dust":{"name":{"cs":"Pouštní prach","en":"Desert dust"},"beta550_perM":0.00008,"scaleHeight_m":2500,"angstromExponent":0.2,"asymmetry_g":0.7,"singleScatteringAlbedo":{"wavelengths_nm":[380,450,500,550,600,650,700,750],"values":[0.72,0.8,0.87,0.92,0.95,0.96,0.97,0.97]}},"volcanic":{"name":{"cs":"Sopečný popel","en":"Volcanic ash"},"beta550_perM":0.0003,"scaleHeight_m":6000,"angstromExponent":0.5,"asymmetry_g":0.65,"singleScatteringAlbedo":0.85}},"notes":{"cs":"Skutečný Mieův rozptyl vyžaduje řešení Maxwellových rovnic pro kulovou částici. Zde nahrazujeme výsledek dvěma parametry: mocninou vlnové délky a součinitelem asymetrie g.","en":"Real Mie scattering requires solving Maxwell's equations for a sphere. Here we replace the result with two parameters: a wavelength power law and the asymmetry factor g."}},"experiments/blue-sky.json":{"id":"blue-sky","order":1,"icon":"sky","title":{"cs":"Proč je obloha modrá?","en":"Why is the sky blue?"},"summary":{"cs":"Rozlož denní světlo na přímý svazek a rozptýlenou složku a najdi člen, který dělá oblohu modrou.","en":"Split daylight into the direct beam and the scattered part, and find the term that makes the sky blue."},"steps":[{"title":{"cs":"Výchozí obloha","en":"The starting sky"},"text":{"cs":"Stojíš na Zemi, Slunce je vysoko a díváš se do zenitu. Vpravo jsou dvě křivky: spektrum zdroje nad atmosférou a spektrum světla, které k tobě přichází z oblohy.","en":"You are standing on Earth, the Sun is high, and you are looking straight up. On the right are two curves: the spectrum of the source above the atmosphere, and the spectrum of the light arriving from the sky."},"observe":{"cs":"Spektrum zdroje je téměř ploché. Spektrum oblohy je zřetelně nakloněné ke krátkým vlnovým délkám.","en":"The source spectrum is nearly flat. The sky spectrum is clearly tilted towards short wavelengths."},"state":{"star":{"presetId":"sun-5800k","temperatureK":5800,"elevationDeg":60},"atmosphere":{"presetId":"earth","densityScale":1,"aerosolScale":1,"rayleighExponent":4},"observer":{"z":0,"viewZenithDeg":0,"well":{"enabled":false}}}},{"title":{"cs":"Odstraň prach","en":"Remove the dust"},"text":{"cs":"Vypni aerosoly. Zůstane jen rozptyl na molekulách vzduchu, tedy čistý Rayleighův rozptyl.","en":"Switch the aerosols off. What remains is scattering on air molecules alone, that is, pure Rayleigh scattering."},"observe":{"cs":"Obloha ztmavne a zesytí. Bledý závoj kolem Slunce zmizí, protože ten dělaly velké částice.","en":"The sky darkens and deepens in colour. The pale veil around the Sun disappears, because that was made by the large particles."},"state":{"atmosphere":{"aerosolScale":0}}},{"title":{"cs":"Zabij mocninu","en":"Kill the power law"},"text":{"cs":"Přepni na pokročilou úroveň a přetáhni mocninu vlnové délky n ze 4 na 0. Tím prohlásíš, že rozptyl je pro všechny barvy stejně silný.","en":"Switch to the Advanced level and drag the wavelength exponent n from 4 down to 0. You are declaring that scattering is equally strong for every colour."},"observe":{"cs":"Obloha zešedne. Světla je pořád stejně, jen už nemá barvu.","en":"The sky turns grey. There is just as much light as before, it simply has no colour any more."},"question":{"cs":"Obloha není modrá proto, že by vzduch byl modrý. Co ji tedy dělá modrou?","en":"The sky is not blue because air is blue. So what makes it blue?"},"state":{"level":"advanced","atmosphere":{"rayleighExponent":0}},"highlight":"ctl-exponent"},{"title":{"cs":"Vrať 1/λ⁴","en":"Put 1/lambda^4 back"},"text":{"cs":"Vrať n na 4. Účinný průřez je nyní při 450 nm asi 4,4krát větší než při 650 nm. Krátké vlnové délky jsou ze svazku vyráženy mnohem častěji.","en":"Set n back to 4. The cross-section is now about 4.4 times larger at 450 nm than at 650 nm. Short wavelengths are knocked out of the beam far more often."},"observe":{"cs":"Porovnej křivku přímého svazku a křivku oblohy. Modrá, která ve svazku chybí, je přesně ta, která svítí na obloze. Nic se neztratilo, jen to změnilo směr.","en":"Compare the direct beam curve with the sky curve. The blue missing from the beam is exactly the blue glowing in the sky. Nothing was lost, it only changed direction."},"state":{"atmosphere":{"rayleighExponent":4}}},{"title":{"cs":"Podívej se k obzoru","en":"Look towards the horizon"},"text":{"cs":"Otoč pohled ze zenitu k obzoru. Díváš se přes mnohem delší vrstvu vzduchu.","en":"Turn your view from the zenith down to the horizon. You are now looking through a much longer layer of air."},"observe":{"cs":"U obzoru obloha bledne. Delší dráha znamená více rozptylu, ale také to, že se modré světlo stihne rozptýlit znovu a znovu a barva se rozmyje k bílé.","en":"Near the horizon the sky pales. A longer path means more scattering, but it also means blue light is scattered again and again, and the colour washes out towards white."},"state":{"observer":{"viewZenithDeg":85}}}]},"experiments/sunset.json":{"id":"sunset","order":2,"icon":"sunset","title":{"cs":"Mechanika západu Slunce","en":"Sunset mechanics"},"summary":{"cs":"Sniž Slunce k obzoru a sleduj, jak Beerův-Lambertův zákon ubírá ze svazku modrou složku.","en":"Lower the Sun to the horizon and watch Beer-Lambert extinction strip the blue out of the beam."},"steps":[{"title":{"cs":"Poledne","en":"Noon"},"text":{"cs":"Slunce je vysoko. Jeho světlo prochází zhruba jednou tloušťkou atmosféry. Zapamatuj si barvu přímého svazku vpravo.","en":"The Sun is high. Its light passes through roughly one thickness of atmosphere. Remember the colour of the direct beam on the right."},"observe":{"cs":"Vzdušná hmota je asi 1,15. Svazek je téměř bílý, jen nepatrně teplý.","en":"The air mass is about 1.15. The beam is nearly white, only slightly warm."},"state":{"star":{"presetId":"sun-5800k","temperatureK":5800,"elevationDeg":60},"atmosphere":{"presetId":"earth","densityScale":1,"aerosolScale":1,"rayleighExponent":4},"observer":{"z":0,"viewZenithDeg":30,"well":{"enabled":false}},"level":"advanced"}},{"title":{"cs":"Odpoledne","en":"Afternoon"},"text":{"cs":"Sniž Slunce na 20 stupňů. Dráha se prodloužila zhruba trojnásobně.","en":"Lower the Sun to 20 degrees. The path has lengthened roughly threefold."},"observe":{"cs":"Ve výpisu vpravo sleduj τ při 450 nm a při 650 nm. Rostou obě, ale modrá mnohem rychleji.","en":"In the readout on the right, watch tau at 450 nm and at 650 nm. Both grow, but blue grows much faster."},"state":{"star":{"elevationDeg":20}},"highlight":"ctl-elevation"},{"title":{"cs":"Nízko nad obzorem","en":"Low over the horizon"},"text":{"cs":"Pět stupňů nad obzorem. Vzdušná hmota je kolem deseti: světlo urazí desetkrát delší dráhu než v poledne.","en":"Five degrees above the horizon. The air mass is about ten: the light travels ten times the noon path."},"observe":{"cs":"Svazek je sytě oranžový. Křivka přímého svazku má levou polovinu skoro sraženou k nule.","en":"The beam is deep orange. The left half of the direct beam curve has been crushed almost to zero."},"state":{"star":{"elevationDeg":5}}},{"title":{"cs":"Dotek obzoru","en":"Touching the horizon"},"text":{"cs":"Nula stupňů. Kvůli zakřivení planety je vzdušná hmota přes třicet, ne nekonečno.","en":"Zero degrees. Because the planet is curved the air mass is about thirty, not infinite."},"observe":{"cs":"Zbývá tmavě červený svazek. Propustnost T = exp(−τ) při 450 nm klesla o několik řádů, zatímco při 650 nm je stále znatelná.","en":"A dark red beam is all that remains. The transmission T = exp(-tau) at 450 nm has fallen by orders of magnitude, while at 650 nm it is still appreciable."},"question":{"cs":"Změnila se hvězda? Porovnej křivku zdroje s křivkou přímého svazku. Která z nich se během celého experimentu vůbec nehnula?","en":"Did the star change? Compare the source curve with the direct beam curve. Which of the two has not moved at all during this experiment?"},"state":{"star":{"elevationDeg":0}}},{"title":{"cs":"Zkus to bez mocniny","en":"Try it without the power law"},"text":{"cs":"Nech Slunce na obzoru a nastav mocninu n na 0. Rozptyl je teď pro všechny barvy stejný.","en":"Leave the Sun on the horizon and set the exponent n to 0. Scattering is now the same for every colour."},"observe":{"cs":"Svazek pohasne, ale nezčervená. Zeslabení bez závislosti na vlnové délce dělá jen šedivo, ne západ Slunce.","en":"The beam dims but does not redden. Extinction without a wavelength dependence produces grey, not a sunset."},"state":{"atmosphere":{"rayleighExponent":0}},"highlight":"ctl-exponent"}]},"experiments/flight-to-space.json":{"id":"flight-to-space","order":3,"icon":"rocket","title":{"cs":"Let do vesmíru","en":"Flight into space"},"summary":{"cs":"Stoupej od povrchu až na 100 km a sleduj, jak jas oblohy plynule klesá k nule.","en":"Climb from the surface to 100 km and watch the sky brightness fall continuously to zero."},"steps":[{"title":{"cs":"Na povrchu","en":"At the surface"},"text":{"cs":"Celý sloupec vzduchu je nad tebou. To je 100 % dostupné rozptylující látky.","en":"The entire air column is above you. That is 100 percent of the available scattering material."},"observe":{"cs":"Zapamatuj si zář oblohy ve výpisu vpravo. Budeme ji porovnávat.","en":"Note the sky radiance in the readout on the right. We will keep comparing against it."},"state":{"star":{"presetId":"sun-5800k","temperatureK":5800,"elevationDeg":60},"atmosphere":{"presetId":"earth","densityScale":1,"aerosolScale":1,"rayleighExponent":4},"observer":{"z":0,"viewZenithDeg":0,"well":{"enabled":false}},"level":"advanced"}},{"title":{"cs":"Pět kilometrů","en":"Five kilometres"},"text":{"cs":"Vystoupal jsi zhruba na vrchol Mont Blancu a o něco výš. Nad tebou zbývá už jen 56 % vzduchu.","en":"You are above the summit of Mont Blanc. Only 56 percent of the air is left above you."},"observe":{"cs":"Obloha je znatelně tmavší a sytější. Horolezci to znají.","en":"The sky is noticeably darker and deeper in colour. Mountaineers know this well."},"state":{"observer":{"z":5000}},"highlight":"ctl-position"},{"title":{"cs":"Dvacet kilometrů","en":"Twenty kilometres"},"text":{"cs":"Výška stratosférického balonu. Nad tebou zbývá necelých 10 % atmosféry.","en":"The altitude of a stratospheric balloon. Just under 10 percent of the atmosphere remains above you."},"observe":{"cs":"Obloha je temně modrá až téměř černá, ale Slunce svítí pořád stejně. Dokonce o něco jasněji, protože svazek už není tolik zeslabený.","en":"The sky is a deep, almost black blue, yet the Sun shines just as brightly. Slightly brighter, in fact, because the beam is less attenuated."},"state":{"observer":{"z":20000}}},{"title":{"cs":"Sto kilometrů","en":"One hundred kilometres"},"text":{"cs":"Kármánova hranice. Nad tebou zbývá řádově miliontina původního sloupce.","en":"The Karman line. What remains above you is of order one millionth of the original column."},"observe":{"cs":"Obloha je černá. Hvězda je oslnivá a ostrá, bez jakéhokoli závoje kolem sebe.","en":"The sky is black. The star is dazzling and razor-sharp, with no veil around it at all."},"question":{"cs":"Je obloha černá proto, že tu není světlo? Podívej se na osvětlenost od přímého svazku ve výpisu, než odpovíš.","en":"Is the sky black because there is no light? Look at the direct beam illuminance in the readout before you answer."},"state":{"observer":{"z":100000}}},{"title":{"cs":"Kontrolní pokus: bezvzduchý svět","en":"Control experiment: an airless world"},"text":{"cs":"Vrať se na povrch, ale přepni na Měsíc. Stojíš na zemi za plného dne a nad tebou není nic.","en":"Return to the surface, but switch to the Moon. You are standing on the ground in full daylight with nothing above you."},"observe":{"cs":"Černá obloha v poledne. Není to tím, že by chybělo světlo, ale tím, že chybí prostředí, které by ho rozptýlilo.","en":"A black sky at noon. Not because light is missing, but because the medium that would scatter it is missing."},"state":{"atmosphere":{"presetId":"airless-moon","densityScale":1,"aerosolScale":1},"observer":{"z":0}}}]},"experiments/well-vs-altitude.json":{"id":"well-vs-altitude","order":4,"icon":"well","title":{"cs":"Paradox studny","en":"The well paradox"},"summary":{"cs":"Deset kilometrů nahoru a deset kilometrů dolů. Obojí ztmavne, ale z úplně jiného důvodu.","en":"Ten kilometres up and ten kilometres down. Both go dark, for completely different reasons."},"steps":[{"title":{"cs":"Referenční stav na povrchu","en":"Surface reference"},"text":{"cs":"Začni na povrchu s otevřenou oblohou. Zapiš si dvě čísla z výpisu: zář oblohy ve směru pohledu a osvětlenost u pozorovatele.","en":"Start at the surface under an open sky. Note two numbers from the readout: the sky radiance in the view direction and the illuminance at the observer."},"observe":{"cs":"Zář popisuje, jak jasný je kousek oblohy. Osvětlenost popisuje, kolik světla celkem na tebe dopadá ze všech směrů.","en":"Radiance describes how bright a patch of sky is. Illuminance describes how much light reaches you in total from every direction."},"state":{"star":{"presetId":"sun-5800k","temperatureK":5800,"elevationDeg":70},"atmosphere":{"presetId":"earth","densityScale":1,"aerosolScale":1,"rayleighExponent":4},"observer":{"z":0,"viewZenithDeg":0,"countShaftAir":false,"well":{"enabled":false,"radius_m":2,"depth_m":10000}},"level":"advanced","compare":{"enabled":false}}},{"title":{"cs":"Deset kilometrů vzhůru","en":"Ten kilometres up"},"text":{"cs":"Vystoupej do výšky 10 km. Nad tebou zůstala jen zhruba třetina vzduchu.","en":"Climb to 10 km. Only about a third of the air is left above you."},"observe":{"cs":"Zář oblohy klesla asi na čtvrtinu a barva ztmavla. Osvětlenost se skoro nezměnila, protože přímý svazek zesílil.","en":"The sky radiance has fallen to roughly a quarter and the colour has darkened. The illuminance barely moved, because the direct beam got stronger."},"state":{"observer":{"z":10000,"well":{"enabled":false}}},"highlight":"ctl-position"},{"title":{"cs":"Deset kilometrů dolů","en":"Ten kilometres down"},"text":{"cs":"Teď zapni šachtu o poloměru 2 m a sjeď do hloubky 10 km. Vzduch nad tebou je přesně stejný jako na povrchu.","en":"Now switch on a shaft of radius 2 m and descend to a depth of 10 km. The air above you is exactly the same as it was at the surface."},"observe":{"cs":"Zář toho kousku oblohy nad ústím se nezměnila ani o promile. Osvětlenost se zhroutila o osm řádů. Kolem tebe je tma, a přece je obloha nad tebou stejně modrá.","en":"The radiance of the patch of sky above the mouth has not changed by even a thousandth. The illuminance has collapsed by eight orders of magnitude. It is dark around you, and yet the sky above you is exactly as blue."},"question":{"cs":"Proč ztmavlo při stoupání a proč ztmavlo při sestupu? Jsou to tytéž důvody?","en":"Why did it darken when you climbed, and why did it darken when you descended? Are those the same reason?"},"state":{"observer":{"z":-10000,"well":{"enabled":true,"radius_m":2,"depth_m":10000}}},"highlight":"ctl-well"},{"title":{"cs":"Vedle sebe","en":"Side by side"},"text":{"cs":"Zapni porovnání dvou pozorovatelů. Vlevo je pozorovatel 10 km nad povrchem, vpravo 10 km pod povrchem v šachtě.","en":"Switch on the two-observer comparison. On the left is an observer 10 km above the surface, on the right one 10 km below it in the shaft."},"observe":{"cs":"Vlevo: sloupec vzduchu se zmenšil, obloha zeslábla a ztmavla po celé polokouli. Vpravo: sloupec je nedotčený, obloha si podržela svou zář i barvu, jen z ní zbyl nepatrný kotouček.","en":"Left: the air column shrank, so the sky weakened and darkened across the whole hemisphere. Right: the column is untouched, the sky kept its radiance and its colour, and all that changed is that a tiny disc of it remains."},"state":{"compare":{"enabled":true,"leftZ":10000,"rightZ":-10000}}},{"title":{"cs":"Závěr","en":"The conclusion"},"text":{"cs":"Stoupání mění fyziku: klesá sloupec, klesá optická tloušťka, ubývá rozptylu. Sestup do šachty nemění na atmosféře vůbec nic, mění jen to, kolik oblohy na tebe vidí. Podmínka tg(θ) ≤ R/d je geometrická, nevystupuje v ní ani vlnová délka, ani hustota.","en":"Climbing changes the physics: the column falls, the optical depth falls, there is less scattering. Descending the shaft changes nothing about the atmosphere at all; it only changes how much of the sky can see you. The condition tan(theta) <= R/d is geometry, and neither wavelength nor density appears in it."},"observe":{"cs":"Vyzkoušej ještě přepínač Počítat vzduch uvnitř šachty. Ten teprve přidá do šachty skutečný hustší vzduch, a tehdy se sestup konečně stane i atmosférickým jevem.","en":"Try the Count air inside the shaft switch as well. Only that adds the real, denser air to the shaft, and only then does descending finally become an atmospheric effect too."},"state":{"compare":{"enabled":true}},"highlight":"ctl-shaft-air"}]},"experiments/alien-skies.json":{"id":"alien-skies","order":5,"icon":"planet","title":{"cs":"Cizí oblohy","en":"Alien skies"},"summary":{"cs":"Barva oblohy je součin spektra hvězdy a rozptylového zákona atmosféry. Vyměň obojí a uvidíš.","en":"Sky colour is the product of the star spectrum and the scattering law of the atmosphere. Swap both and see."},"steps":[{"title":{"cs":"Domov","en":"Home"},"text":{"cs":"Slunce o teplotě 5800 K nad zemskou atmosférou. Tohle je referenční obloha, se kterou budeme vše porovnávat.","en":"A 5800 K Sun above the atmosphere of Earth. This is the reference sky we will compare everything against."},"observe":{"cs":"Modrá obloha, teple bílá hvězda.","en":"A blue sky and a warm white star."},"state":{"star":{"presetId":"sun-5800k","temperatureK":5800,"elevationDeg":50,"realisticInsolation":true},"atmosphere":{"presetId":"earth","densityScale":1,"aerosolScale":1,"rayleighExponent":4},"observer":{"z":0,"viewZenithDeg":20,"well":{"enabled":false}},"compare":{"enabled":false},"rays":{"brightness":1}}},{"title":{"cs":"Červený trpaslík","en":"A red dwarf"},"text":{"cs":"Stejná atmosféra, ale hvězda o teplotě 3000 K. Rozptylový zákon 1/λ⁴ se vůbec nezměnil.","en":"The same atmosphere, but a star at 3000 K. The 1/lambda^4 scattering law has not changed at all."},"observe":{"cs":"Obloha je kalně šedomodrá až fialová a mnohem tmavší. Zákon pořád upřednostňuje modrou, jenže hvězda skoro žádnou modrou nevyzařuje.","en":"The sky is a murky grey-blue to violet and far darker. The law still prefers blue, but the star emits almost none."},"question":{"cs":"Je za barvu oblohy zodpovědný rozptyl, nebo zdroj?","en":"Is the colour of a sky the responsibility of the scattering, or of the source?"},"state":{"star":{"presetId":"red-dwarf-3000k","temperatureK":3000},"rays":{"brightness":1}},"highlight":"ctl-temperature"},{"title":{"cs":"Modrý veleobr","en":"A blue supergiant"},"text":{"cs":"Vyšplhej s teplotou na 12 000 K, jako má Rigel.","en":"Take the temperature up to 12,000 K, like Rigel."},"observe":{"cs":"Obloha je sytě, téměř fialově modrá. Stejná atmosféra, jiná surovina.","en":"The sky is an intense, almost violet blue. The same atmosphere, different raw material."},"state":{"star":{"presetId":"rigel-12000k","temperatureK":12000},"rays":{"brightness":1}}},{"title":{"cs":"Mars: když rozptyluje prach","en":"Mars: when dust does the scattering"},"text":{"cs":"Zpátky ke Slunci, ale přesuň se na Mars. Plynu je tu asi stokrát méně než na Zemi, zato je vzduch trvale plný prachu.","en":"Back to the Sun, but move to Mars. There is about a hundred times less gas than on Earth, but the air is permanently full of dust."},"observe":{"cs":"Obloha je máslově okrová. Prachová zrna jsou velká jako vlnová délka, takže rozptylují všechny barvy skoro stejně, a navíc pohlcují modrou silněji než červenou.","en":"The sky is butterscotch. The dust grains are the size of the wavelength, so they scatter every colour almost equally, and on top of that they absorb blue more strongly than red."},"state":{"star":{"presetId":"sun-5800k","temperatureK":5800},"atmosphere":{"presetId":"mars","densityScale":1,"aerosolScale":1},"rays":{"brightness":1}},"highlight":"ctl-atmosphere-preset"},{"title":{"cs":"Mars bez prachu","en":"Mars without the dust"},"text":{"cs":"Ponech marsovský plyn, ale vypni prach. Zůstane čistý řídký CO₂.","en":"Keep the Martian gas but switch the dust off. Pure thin CO2 remains."},"observe":{"cs":"Obloha je téměř černá s náznakem tmavé modři. Rayleighův rozptyl tu funguje úplně stejně jako na Zemi, jen je ho stokrát méně. Marsovská obloha tedy není okrová kvůli CO₂, ale kvůli prachu.","en":"The sky is nearly black with a hint of deep blue. Rayleigh scattering works exactly as it does on Earth, there is simply a hundred times less of it. So the Martian sky is not ochre because of CO2, it is ochre because of dust."},"state":{"atmosphere":{"presetId":"thin-co2"},"rays":{"brightness":1}}},{"title":{"cs":"Titan a Venuše","en":"Titan and Venus"},"text":{"cs":"Projdi si ještě Titan s organickým oparem a velmi hustou venušskou atmosféru. Na Titanu je navíc zapnuta skutečná vzdálenost od Slunce, takže tam dopadá necelé procento zemského osvětlení.","en":"Finally look at Titan with its organic haze and the very dense atmosphere of Venus. On Titan the realistic distance from the Sun is also applied, so it receives under one percent of the illumination Earth gets."},"observe":{"cs":"Na obou světech je pod hustou vrstvou šero a světlo je silně zbarvené do oranžova. Krátké vlnové délky prostě k povrchu nedojdou.","en":"On both worlds it is gloomy beneath the dense layer and the light is strongly tinted orange. Short wavelengths simply never reach the surface."},"state":{"atmosphere":{"presetId":"titan-haze"},"rays":{"brightness":400}},"highlight":"ctl-brightness"}]},"localization/cs.json":{"meta":{"code":"cs","name":"Czech","nativeName":"Čeština"},"app":{"title":"Laboratoř atmosférického světla","subtitle":"Proč je obloha modrá, proč je západ Slunce červený a proč je ve studni tma","loading":"Spouštím fyzikální jádro...","error":"Simulaci se nepodařilo spustit"},"header":{"language":"Jazyk","level":"Úroveň","levelBasic":"Základní","levelAdvanced":"Pokročilá","experiment":"Experiment","experimentNone":"Volné zkoumání","reset":"Výchozí stav","resetTitle":"Vrátit všechny ovládací prvky na počáteční hodnoty"},"controls":{"star":{"title":"Zdroj světla (hvězda)","preset":"Předvolba","temperature":"Povrchová teplota","temperatureHelp":"Určuje vyzařované spektrum podle Planckova zákona. Teplejší hvězdy vyzařují poměrně více krátkovlnného světla.","elevation":"Výška nad obzorem","elevationHelp":"Jak vysoko hvězda stojí. Čím níž, tím delší dráhu musí světlo urazit atmosférou.","belowHorizon":"pod obzorem","realisticInsolation":"Skutečná vzdálenost od hvězdy","realisticInsolationHelp":"Přepočítá dopadající světlo podle toho, jak daleko planeta obíhá, aby bylo srovnání planet poctivé.","peakWavelength":"Maximum vyzařování"},"atmosphere":{"title":"Atmosféra","preset":"Předvolba","density":"Hustota","densityHelp":"Násobí všechny rozptylové součinitele. Nula znamená vakuum.","scaleHeight":"Škálová výška H","scaleHeightHelp":"Výška, na které hustota klesne e-krát. Větší H znamená hlubší a pozvolnější atmosféru.","aerosol":"Množství aerosolů","aerosolHelp":"Prach a kapičky. Rozptylují téměř všechny barvy stejně a hlavně dopředu.","aerosolType":"Druh aerosolu","aerosolNative":"Vlastní pro tento svět","aerosolTypeHelp":"Vymění vznášející se částice za jinou směs. Stejný plyn, jiná zrna: smog, pouštní prach nebo sopečný popel.","exponent":"Mocnina vlnové délky n","exponentHelp":"Účinný průřez je úměrný 1/λⁿ. Skutečný Rayleighův rozptyl má n = 4. Nastav n = 0 a obloha ztratí barvu.","surfacePressure":"Tlak u povrchu","composition":"Složení"},"observer":{"title":"Pozorovatel","position":"Svislá poloha z","positionHelp":"Nad nulou stoupáš atmosférou. Pod nulou sestupuješ šachtou, přičemž vzduch nad tebou zůstává úplně stejný.","underground":"pod povrchem","altitude":"výška","groundLevel":"úroveň povrchu","viewDirection":"Směr pohledu","viewDirectionHelp":"Měří se od svislice. 0 stupňů je zenit, 90 stupňů je obzor.","zenith":"zenit","horizon":"obzor","well":"Šachta (studna)","wellEnabled":"Šachta je přítomna","wellRadius":"Poloměr šachty","wellDepth":"Hloubka šachty","wellDepthHelp":"Zároveň určuje, jak hluboko může sjet posuvník polohy.","countShaftAir":"Počítat vzduch uvnitř šachty","countShaftAirHelp":"Standardně vypnuto, aby sestup měnil pouze geometrii. Zapnutím přidáš hustší vzduch, který by hlubokou šachtu ve skutečnosti vyplňoval.","zoom":"Přiblížení (výška výřezu)","zoomHelp":"Kolik světa řez ukazuje. Při nízkém Slunci oddal pohled a uvidíš tětivu, kterou musí jeho světlo proletět – právě ta délka je důvod, proč je červené. Funguje i kolečko myši."},"rays":{"title":"Simulace paprsků","count":"Počet paprsků","showScattering":"Zobrazit rozptylové události","showScatteringHelp":"Sleduj jednotlivé fotony, jak jsou vychylovány ze svazku.","animate":"Animovat","brightness":"Zesílení jasu","brightnessHelp":"Násobí pouze zobrazený jas. Nemění vypočtenou fyziku ani barevný odstín.","quality":"Kvalita výpočtu","qualityPreview":"Rychlá","qualityNormal":"Běžná","qualityHigh":"Přesná"}},"canvas":{"title":"Řez atmosférou","observer":"Pozorovatel","ground":"Povrch","space":"Vesmír","star":"ke hvězdě","wellWall":"Stěna šachty","skyStrip":"Co pozorovatel vidí","skyStripHelp":"Obloha od obzoru k obzoru očima pozorovatele. Černé klíny jsou směry zastavené stěnou šachty.","altitudeAxis":"Výška","blocked":"Zastaveno stěnou šachty","clickRay":"Klikni na paprsek a projdi jeho cestu krok za krokem","rayLog":"Historie fotonu","rayLogEmpty":"Není vybrán žádný paprsek. Klikni na libovolný paprsek v řezu.","rayLogClose":"Zavřít","verticalExaggerated":"Svislé měřítko je stlačené, aby se do jednoho obrázku vešla šachta i celá atmosféra.","scattered":"rozptýlen","escaped":"unikl do vesmíru","absorbed":"pohlcen","reachedGround":"dopadl na povrch","event":"Událost","altitude":"Výška","wavelength":"Vlnová délka","energy":"Zbývající energie","angle":"Vychýlení","legendArriving":"dopadá k tobě z místa, kam se díváš","legendMissed":"rozptýleno jinam, k tobě nedorazí","legendThrough":"prochází bez rozptylu až k zemi","observed":"dorazil k pozorovateli","missedObserver":"odchází jiným směrem","viewCone":"tvůj zorný kužel","legendOffView":"dopadá k tobě z jiné části oblohy","shaftReaches":"dopadá k pozorovateli","shaftAbsorbed":"zastaveno horninou","shaftPatch":"jediný zbytek oblohy","coneExaggerated":"kužel rozšířen, aby šel nakreslit","trueRatio":"skutečná hloubka : poloměr","drawnRatio":"nakresleno jako"},"spectrum":{"title":"Spektrum","axisX":"Vlnová délka (nm)","axisY":"Relativní spektrální intenzita","source":"Zdroj (nad atmosférou)","direct":"Přímý svazek (po průchodu vzduchem)","scatteredSky":"Rozptýlené světlo (obloha)","observed":"Pozorovaný součet","normalize":"Normalizovat křivky","empty":"Z tohoto směru k pozorovateli nedorazí žádné světlo."},"color":{"title":"Vnímaná barva","sky":"Obloha ve směru pohledu","star":"Hvězda, jak ji vidíme","computed":"Spočítáno ze spektra přes CIE 1931 XYZ, nikdy nevybráno ručně.","chromaticity":"Diagram chromatičnosti","blockedByWall":"Stěna šachty tento směr zakrývá, nedorazí odsud žádné světlo.","darkness":"Příliš málo světla na zobrazení barvy.","measured":"Změřeno z nakreslených paprsků","fromRays":"z"},"data":{"title":"Fyzikální veličiny","airColumn":"Sloupec vzduchu nad pozorovatelem","airColumnMass":"Hmotnost sloupce","columnFraction":"Podíl přízemního sloupce","opticalDepth":"Optická tloušťka τ","opticalDepthAt":"τ při {lambda} nm","transmission":"Propustnost T","airMass":"Vzdušná hmota podél svazku","pathLength":"Délka dráhy ve směru pohledu","apertureAngle":"Poloviční úhel otvoru šachty","apertureSolidAngle":"Viditelný prostorový úhel","skyFraction":"Viditelný podíl oblohy","illuminance":"Osvětlenost u pozorovatele","illuminanceOpen":"Osvětlenost bez šachty","illuminanceRatio":"Zbývající světlo","skyLuminance":"Zář oblohy ve směru pohledu","scaleHeight":"Škálová výška","peakWavelength":"Maximum vyzařování","scatteringAngle":"Rozptylový úhel","hemisphere":"polokoule","advancedOnly":"Přepni na pokročilou úroveň a uvidíš úplný výpis."},"explain":{"titleSee":"Co vidím?","titleWhy":"Jaká fyzika za tím stojí?","states":{"daySky":{"see":"Obloha svítí modře ve všech směrech mimo hvězdu, zatímco hvězda sama vypadá stále skoro bílá. Nic tu není namalované modře: díváš se na sluneční světlo, které molekuly vzduchu vyrazily bokem ze svazku.","why":"Rayleighův rozptyl má účinný průřez úměrný 1/λ⁴. Při 450 nm je {ratio}krát silnější než při 650 nm, takže modré světlo je do tvého oka odkláněno mnohem častěji než červené. Zbylý svazek si téměř všechnu červenou ponechá, a proto hvězda zůstává teple bílá."},"sunset":{"see":"Hvězda klesla nízko, zezlátla až zčervenala a výrazně pohasla. Změna barvy není ve hvězdě, ale v {airmass}krát delší dráze, kterou teď její světlo urazí vzduchem.","why":"Beerův-Lambertův zákon dává T(λ) = exp(−τ(λ)). Podél této dráhy je τ rovno {tau450} při 450 nm, ale jen {tau650} při 650 nm, takže modrá se odfiltruje téměř úplně, kdežto červená projde. Vidíš zbytek svazku, ne nově vzniklé červené světlo."},"twilight":{"see":"Hvězda je pod obzorem. Přímé světlo už k tobě nedorazí, a přesto obloha není černá: osvětluje ji jen vzduch vysoko nad tebou, který ještě na slunci je.","why":"Stín planety pohltil spodní atmosféru, takže rozptylový integrál sbírá světlo pouze z osvětlených vrstev výše. Jednonásobný rozptyl efekt ukáže, ale skutečný soumrak je temnější a fialovější, protože fotony se před příchodem několikrát odrazí."},"highAltitude":{"see":"Obloha nad tebou výrazně ztmavla a prohloubila barvu. Hvězda se nezměnila a atmosféru jsi neopustil, jenom je nad tebou mnohem méně vzduchu.","why":"Sloupec nad tebou klesá exponenciálně, C(z) = C(0)·exp(−z/H). Ve výšce {z} při H = {scaleHeight} zbývá nad tebou jen {columnPercent} vzduchu, takže je úměrně méně látky, která by k tvému oku rozptýlila světlo."},"space":{"see":"Obloha je úplně černá, přestože hvězda svítí stejně jasně jako dřív a proti tmě je až ostře zřetelná. Světlo kolem tebe proudí v obrovském množství, jen se cestou k tvému oku nemá od čeho odrazit.","why":"Rozptylový integrál se zhroutil na nulu, protože ρ → 0. Jas oblohy potřebuje prostředí, ne zdroj. Proto kosmonauti vidí i za plného dne černou oblohu a totéž platí na bezvzduchém Měsíci."},"airless":{"see":"Je jasný den, povrch je ostře osvětlený, a přesto je obloha přímo nad hlavou černá. Nic světlo neblokuje, jen tu není vzduch, který by ho rozptýlil.","why":"Při ρ = 0 zmizí každý člen rozptylového integrálu, zatímco přímá propustnost zůstává T = 1. Černá obloha dokazuje nepřítomnost rozptylujícího prostředí, nikdy ne nepřítomnost světla."},"thinAir":{"see":"Obloha je skoro černá, jen s náznakem tmavé modři, a přesto je den a povrch je jasně osvětlený. Vzduch tu je, jen je ho zoufale málo.","why":"Rayleighův rozptyl funguje úplně stejně jako na Zemi a modrou pořád upřednostňuje poměrem 1/λ⁴. Jenže optická tloušťka je jen {tau550}, takže se rozptýlí sotva promile procházejícího světla. Barva zůstává modrá, mizí jen jas."},"wellShallow":{"see":"Sestoupil jsi do šachty. Kus oblohy v ústí je přesně tak jasný a přesně tak modrý jako venku, jenže je z něj malý kotouč místo celé oblohy a všude kolem ztmavlo.","why":"Vzduch nad tebou se vůbec nezměnil: C_atm je stále C_atm(0). Změnila se geometrie. Paprsek vycházející pod zenitovým úhlem θ unikne jen tehdy, když tg(θ) ≤ R/d. Tady je ta mez {aperture}, takže z celé polokoule zbývá {solidAngle} oblohy."},"wellDeep":{"see":"Hluboko v šachtě je téměř tma, a přece je ten útržek oblohy vysoko nahoře pořád stejně modrý jako na povrchu. To je ten klíčový bod: tma není atmosférická, díváš se dírou.","why":"Zář v nezakrytém směru se nezměnila, ale osvětlenost sleduje viditelný prostorový úhel: E/E_volné = sin²(θ_max) = {ratio}. Porovnej to se stoupáním: ve výšce {z} by byla tmavší sama obloha, protože sloupec vzduchu se opravdu zmenšil."},"dusty":{"see":"Obloha je bledě okrová místo modré a světlo je měkké a rozptýlené. Rozptyl tu obstarávají větší částice a ty zacházejí se všemi barvami skoro stejně.","why":"Aerosoly rozptylují jen se slabou závislostí na vlnové délce (přibližně 1/λ⁰ až 1/λ¹) a s výrazně dopředu vytaženou Henyeyovou-Greensteinovou fázovou funkcí s g = {g}. Tam, kde prach navíc pohlcuje modrou víc než červenou, jako na Marsu, obloha zteplá."},"denseAtmosphere":{"see":"Světlo je tady dole slabé a silně zbarvené. K povrchu se z původního spektra dostane jen málo.","why":"Optická tloušťka je hluboko nad jedničkou, takže exp(−τ) zcela pohltilo krátké vlnové délky. Pozor: model s jednonásobným rozptylem tady jas podhodnocuje, ve skutečnosti se fotony před dopadem mnohokrát rozptýlí."},"coldStar":{"see":"Hvězda je oranžově červená a obloha nad ní je tlumeně kalně modrá, ne sytá.","why":"Rayleighův rozptyl stále upřednostňuje krátké vlnové délky poměrem 1/λ⁴, jenže hvězda krátkovlnného světla vyzařuje málo, takže není z čeho brát. Barva oblohy je součinem rozptylového zákona a spektra zdroje, ne rozptylového zákona samotného."},"hotStar":{"see":"Hvězda je modrobílá a obloha sytě tmavě modrá, znatelně výrazněji než pod hvězdou slunečního typu.","why":"Horké černé těleso vyzařuje mnohem více krátkovlnného světla a zákon 1/λ⁴ tento přebytek ještě zesílí. Spektrum zdroje a rozptylový zákon se násobí."}}},"experiment":{"step":"Krok {n} z {total}","next":"Další krok","previous":"Zpět","finish":"Dokončit","exit":"Opustit experiment","restart":"Začít znovu","apply":"Ukaž mi to","question":"Zamysli se","observe":"Čeho si všímat"},"units":{"km":"km","m":"m","nm":"nm","kelvin":"K","degree":"°","steradian":"sr","kgPerM2":"kg/m²","percent":"%","times":"×","relative":"rel."},"compare":{"title":"Vedle sebe","left":"Vlevo","right":"Vpravo","altitude":"10 km nad povrchem","shaft":"10 km hluboko v šachtě","verdict":"Stejný vzduch nad hlavou, naprosto odlišná obloha.","enable":"Porovnat dva pozorovatele"},"footer":{"model":"Model s jednonásobným rozptylem","modelNote":"Světlo se sleduje od hvězdy k jedné rozptylové události a odtud do oka. Vícenásobný rozptyl, lom světla ani pohlcování ozonem nejsou zahrnuty.","sourceData":"Všechna fyzikální data jsou v editovatelných souborech JSON ve složce /config."},"histogram":{"title":"Světlo, které nakreslené paprsky přinášejí","help":"Spektrum změřené z paprsků nahoře, ne spočítané z teorie. Plné sloupce: světlo dopadající k pozorovateli – barevně ze zorného kužele, šedě ze zbytku oblohy. Čárkovaná obrysová čára: přímý nerozptýlený svazek, škálovaný na vlastní vrchol, protože je tisíckrát jasnější. Měřítko drží nejjasnější dosud viděnou oblohu, takže při stoupání sloupce klesají.","sky":"obloha","direct":"přímý svazek"}},"localization/en.json":{"meta":{"code":"en","name":"English","nativeName":"English"},"app":{"title":"Atmospheric Light Laboratory","subtitle":"Why the sky is blue, why sunsets are red, and why a well is dark","loading":"Loading physics engine...","error":"Could not start the simulation"},"header":{"language":"Language","level":"Level","levelBasic":"Basic","levelAdvanced":"Advanced","experiment":"Experiment","experimentNone":"Free exploration","reset":"Reset","resetTitle":"Return every control to its starting value"},"controls":{"star":{"title":"Light source (star)","preset":"Preset","temperature":"Surface temperature","temperatureHelp":"Sets the emitted spectrum through Planck's law. Hotter stars emit relatively more short-wavelength light.","elevation":"Elevation above horizon","elevationHelp":"How high the star stands. Lowering it lengthens the path light takes through the air.","belowHorizon":"below horizon","realisticInsolation":"Realistic distance from star","realisticInsolationHelp":"Scales the incoming light by how far this world orbits from its star, so planets can be compared honestly.","peakWavelength":"Peak wavelength"},"atmosphere":{"title":"Atmosphere","preset":"Preset","density":"Density","densityHelp":"Multiplies every scattering coefficient. Zero means vacuum.","scaleHeight":"Scale height H","scaleHeightHelp":"The height over which density falls by a factor of e. A larger H means a deeper, more gradual atmosphere.","aerosol":"Aerosol amount","aerosolHelp":"Dust and droplets. These scatter almost all colours equally and mostly forwards.","aerosolType":"Aerosol type","aerosolNative":"Native to this world","aerosolTypeHelp":"Swaps the suspended particles for a different mixture. Same gas, different grains: smog, desert dust or volcanic ash.","exponent":"Wavelength exponent n","exponentHelp":"The cross-section goes as 1/lambda^n. True Rayleigh scattering is n = 4. Drag it to 0 and the sky loses its colour.","surfacePressure":"Surface pressure","composition":"Composition"},"observer":{"title":"Observer","position":"Vertical position z","positionHelp":"Above zero you climb through the atmosphere. Below zero you descend a shaft while the air above you stays exactly the same.","underground":"underground","altitude":"altitude","groundLevel":"ground level","viewDirection":"Viewing direction","viewDirectionHelp":"Measured from straight up. 0 degrees is the zenith, 90 degrees is the horizon.","zenith":"zenith","horizon":"horizon","well":"Well shaft","wellEnabled":"Shaft present","wellRadius":"Shaft radius","wellDepth":"Shaft depth","wellDepthHelp":"Also sets how far down the position slider can travel.","countShaftAir":"Count air inside the shaft","countShaftAirHelp":"Off by default, so that descending changes geometry only. Switch it on to add the denser air that would really fill a deep shaft.","zoom":"Zoom (frame height)","zoomHelp":"How much of the world the cross-section shows. Zoom out at a low Sun to see the chord its light has to cross - that length is why it is red. The mouse wheel works too."},"rays":{"title":"Ray simulation","count":"Number of rays","showScattering":"Show scattering events","showScatteringHelp":"Follow individual photons as they are deflected out of the beam.","animate":"Animate","brightness":"Brightness boost","brightnessHelp":"Multiplies the displayed brightness only. It never changes the computed physics or the hue.","quality":"Simulation quality","qualityPreview":"Fast","qualityNormal":"Normal","qualityHigh":"Precise"}},"canvas":{"title":"Cross-section","observer":"Observer","ground":"Surface","space":"Space","star":"to the star","wellWall":"Shaft wall","skyStrip":"What the observer sees","skyStripHelp":"The sky from horizon to horizon through the observer's own eyes. Black wedges are directions stopped by the shaft wall.","altitudeAxis":"Altitude","blocked":"Blocked by shaft wall","clickRay":"Click any path to trace it step by step","rayLog":"Photon history","rayLogEmpty":"No ray selected. Click any ray in the cross-section.","rayLogClose":"Close","verticalExaggerated":"Vertical scale is compressed so that both the shaft and the whole atmosphere fit on one picture.","scattered":"scattered","escaped":"escaped to space","absorbed":"absorbed","reachedGround":"reached the ground","event":"Event","altitude":"Altitude","wavelength":"Wavelength","energy":"Remaining energy","angle":"Deflection","legendArriving":"reaches you from where you are looking","legendMissed":"scattered away, never reaches you","legendThrough":"crosses unscattered, reaches the ground","observed":"arrived at the observer","missedObserver":"leaves in another direction","viewCone":"your field of view","legendOffView":"reaches you from elsewhere in the sky","shaftReaches":"reaches the observer","shaftAbsorbed":"stopped by the rock","shaftPatch":"the only sky left","coneExaggerated":"cone widened to be drawable","trueRatio":"true depth : radius","drawnRatio":"drawn as"},"spectrum":{"title":"Spectrum","axisX":"Wavelength (nm)","axisY":"Relative spectral intensity","source":"Source (above the atmosphere)","direct":"Direct beam (after the air)","scatteredSky":"Scattered light (the sky)","observed":"Observed total","normalize":"Normalise curves","empty":"No light reaches the observer from this direction."},"color":{"title":"Perceived colour","sky":"Sky in view direction","star":"Star as seen","computed":"Computed from the spectrum through CIE 1931 XYZ, never chosen by hand.","chromaticity":"Chromaticity diagram","blockedByWall":"The shaft wall blocks this direction, so no light arrives at all.","darkness":"Too little light to show a colour.","measured":"Measured from the drawn rays","fromRays":"from"},"data":{"title":"Physical quantities","airColumn":"Air column above observer","airColumnMass":"Mass column","columnFraction":"Fraction of surface column","opticalDepth":"Optical depth tau","opticalDepthAt":"tau at {lambda} nm","transmission":"Transmission T","airMass":"Air mass along beam","pathLength":"Path length in view direction","apertureAngle":"Shaft aperture half-angle","apertureSolidAngle":"Visible solid angle","skyFraction":"Fraction of sky visible","illuminance":"Illuminance at observer","illuminanceOpen":"Illuminance with no shaft","illuminanceRatio":"Light remaining","skyLuminance":"Sky radiance in view direction","scaleHeight":"Scale height","peakWavelength":"Emission peak","scatteringAngle":"Scattering angle","hemisphere":"hemisphere","advancedOnly":"Switch to Advanced level to see the full readout."},"explain":{"titleSee":"What do I see?","titleWhy":"Which physics governs this?","states":{"daySky":{"see":"The sky glows blue in every direction away from the star, while the star itself still looks close to white. Nothing here is painted blue: you are looking at sunlight that has been knocked sideways out of the beam by air molecules.","why":"Rayleigh scattering has a cross-section proportional to 1/lambda^4. At 450 nm it is {ratio} times stronger than at 650 nm, so blue light is redirected into your eye far more often than red. The remaining beam keeps almost all of its red, which is why the star stays warm-white."},"sunset":{"see":"The star has dropped low and turned deep orange or red, and it has dimmed sharply. The colour change is not in the star, it is in the {airmass} times longer path its light now takes through the air.","why":"Beer-Lambert extinction gives T(lambda) = exp(-tau(lambda)). Along this path tau is {tau450} at 450 nm but only {tau650} at 650 nm, so blue is stripped out almost completely while red survives. What you see is the leftover of the beam, not new red light."},"twilight":{"see":"The star is below the horizon. Direct light no longer reaches you, yet the sky is not black: it is lit only by air high above you that is still in sunlight.","why":"The shadow of the planet has swallowed the lower atmosphere, so the scattering integral collects light only from the illuminated layers higher up. Single scattering already shows the effect; real twilight is deeper and more purple because photons bounce several times before arriving."},"highAltitude":{"see":"The sky above you has gone much darker and deeper in colour. The star has not changed and you have not left the atmosphere, but far less air remains overhead.","why":"The column above you falls exponentially, C(z) = C(0) exp(-z/H). At {z} with H = {scaleHeight} only {columnPercent} of the air is left above you, so there is proportionally less material to scatter light towards your eye."},"space":{"see":"The sky is completely black although the star shines as brightly as ever, and it is now painfully sharp against the darkness. Light is streaming past you in enormous quantity; it simply has nothing to bounce off on its way to your eye.","why":"The scattering integral has collapsed to zero because rho -> 0. Brightness of the sky needs a medium, not a source. This is why astronauts in daylight see a black sky, and why the same is true on the airless Moon."},"airless":{"see":"It is full daylight, the ground is brightly lit, and yet the sky directly overhead is black. Nothing is blocking the light - there is simply no air to scatter it.","why":"With rho = 0 every term in the scattering integral vanishes, while the direct transmission stays T = 1. A black sky proves the absence of a scattering medium, never the absence of light."},"thinAir":{"see":"The sky is almost black with the faintest hint of deep blue, and yet it is daytime and the ground is brightly lit. There is air here, there is simply far too little of it.","why":"Rayleigh scattering behaves exactly as it does on Earth and still favours blue by 1/lambda^4. But the optical depth is only {tau550}, so barely a thousandth of the passing light is scattered. The colour stays blue; only the brightness goes."},"wellShallow":{"see":"You have dropped into the shaft. The patch of sky through the mouth is exactly as bright and exactly as blue as it was outside - but it is now a small disc instead of the whole sky, and everything around you has darkened.","why":"The air above you has not changed at all: C_atm is still C_atm(0). What changed is geometry. A ray leaving at zenith angle theta escapes only while tan(theta) <= R/d. Here that limit is {aperture}, leaving {solidAngle} of sky out of a full hemisphere."},"wellDeep":{"see":"Deep in the shaft it is nearly dark, yet the scrap of sky far above is still the same blue as at the surface. This is the key point: the darkness is not atmospheric, it is a hole you are looking through.","why":"Radiance in the open direction is unchanged, but the illuminance follows the visible solid angle: E/E_open = sin^2(theta_max) = {ratio}. Compare this with climbing: at {z} up, the sky itself would be dimmer because the air column really did shrink."},"dusty":{"see":"The sky is pale ochre rather than blue, and the light is soft and diffuse. Larger particles are doing the scattering here, and they treat every colour almost alike.","why":"Aerosols scatter with only a weak wavelength dependence (roughly 1/lambda^0 to 1/lambda^1) and a strongly forward-peaked Henyey-Greenstein lobe with g = {g}. Where the dust also absorbs blue more than red, as on Mars, the sky turns warm."},"denseAtmosphere":{"see":"The light down here is dim and heavily tinted. Very little of the original spectrum survives the journey to the surface.","why":"The optical depth is far above one, so exp(-tau) has extinguished the short wavelengths entirely. Note that a single-scattering model under-predicts the true brightness here: in reality photons scatter many times before arriving."},"coldStar":{"see":"The star is orange-red and the sky above it is a muted, dusky blue rather than a vivid one.","why":"Rayleigh scattering still prefers short wavelengths by 1/lambda^4, but the star emits little short-wavelength light for it to work on. The sky colour is the product of the scattering law and the source spectrum, not the scattering law alone."},"hotStar":{"see":"The star is blue-white and the sky is an intense deep blue, noticeably stronger than under a Sun-like star.","why":"A hot black body emits far more short-wavelength light, and the 1/lambda^4 law then amplifies that excess. Source spectrum and scattering law multiply together."}}},"experiment":{"step":"Step {n} of {total}","next":"Next step","previous":"Back","finish":"Finish","exit":"Leave experiment","restart":"Start again","apply":"Show me this","question":"Think about it","observe":"What to watch"},"units":{"km":"km","m":"m","nm":"nm","kelvin":"K","degree":"deg","steradian":"sr","kgPerM2":"kg/m2","percent":"%","times":"x","relative":"rel."},"compare":{"title":"Side by side","left":"Left","right":"Right","altitude":"10 km above the ground","shaft":"10 km down a shaft","verdict":"Same air overhead, utterly different sky.","enable":"Compare two observers"},"footer":{"model":"Single-scattering model","modelNote":"Light is followed from the star to one scattering event and then to the eye. Multiple scattering, refraction and ozone absorption are not modelled.","sourceData":"All physical data live in editable JSON files under /config."},"histogram":{"title":"Light the drawn rays deliver","help":"The spectrum measured from the rays above, not computed from theory. Filled bars: light arriving at the observer, coloured from the viewing cone and grey from the rest of the sky. Dashed outline: the unscattered direct beam, scaled to its own peak because it is thousands of times brighter. The scale is held at the brightest sky seen so far, so climbing makes the bars fall.","sky":"sky","direct":"direct beam"}},"color/cie-1931-2deg.json":{"id":"cie-1931-2deg","description":"CIE 1931 2-degree standard observer colour matching functions, 380-750 nm at 10 nm resolution.","reference":"CIE 1931 XYZ colour matching functions (2 deg observer), tabulated at 10 nm.","wavelengthStart_nm":380,"wavelengthStep_nm":10,"count":38,"xBar":[0.001368,0.004243,0.01431,0.04351,0.13438,0.2839,0.34828,0.3362,0.2908,0.19536,0.09564,0.03201,0.0049,0.0093,0.06327,0.1655,0.2904,0.43345,0.5945,0.7621,0.9163,1.0263,1.0622,1.0026,0.85445,0.6424,0.4479,0.2835,0.1649,0.0874,0.04677,0.0227,0.011359,0.00579,0.002899,0.00144,0.00069,0.000332],"yBar":[0.000039,0.00012,0.000396,0.00121,0.004,0.0116,0.023,0.038,0.06,0.09098,0.13902,0.20802,0.323,0.503,0.71,0.862,0.954,0.99495,0.995,0.952,0.87,0.757,0.631,0.503,0.381,0.265,0.175,0.107,0.061,0.032,0.017,0.00821,0.004102,0.002091,0.001047,0.00052,0.000249,0.00012],"zBar":[0.00645,0.02005,0.06785,0.2074,0.6456,1.3 <script>
(function () {
'use strict';
/* ===== js/config-loader.js ===== */
/**
 * Configuration loading.
 *
 * Every number that describes a world, a star, a scatterer or a phrase of text
 * lives in a JSON file under /config. The loader reads the manifest and then
 * pulls in whatever it lists, so adding a new planet means dropping in a file
 * and naming it in config/index.json - no code changes.
 *
 * Over http the files are fetched individually, which keeps them editable and
 * live. Opened straight from disk, fetch is blocked by the browser, so the
 * loader falls back to config/bundle.js, a generated copy of the same data
 * that index.html loads with a plain script tag. The JSON files stay the one
 * source of truth; the bundle is rebuilt from them by tools/build-bundle.js.
 */

const BASE = 'config/';
const STANDALONE = true;

async function fetchJson(path) {
  const response = await fetch(BASE + path, { cache: 'no-cache' });
  if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
  return response.json();
}

/** The generated fallback, if index.html managed to load it. */
function bundled() {
  return typeof window !== 'undefined' ? window.__ATMO_CONFIG__ : undefined;
}

function fromBundle(path) {
  const b = bundled();
  if (!b || !b[path]) throw new Error(`${path} missing from the offline bundle`);
  return b[path];
}

/**
 * Load everything the application needs.
 * Returns maps keyed by id, ready for the UI to enumerate.
 */
async function loadConfiguration() {
  const isStandalone = typeof STANDALONE !== 'undefined' && STANDALONE;
  const isFile = typeof window !== 'undefined' && window.location && window.location.protocol === 'file:';
  let useBundle = false;
  let index;

  if (isStandalone || (isFile && bundled())) {
    useBundle = true;
    index = fromBundle('index.json');
  } else {
    try {
      index = await fetchJson('index.json');
    } catch (err) {
      if (!bundled()) {
        throw new Error(
          'Configuration could not be loaded. Serve the folder over http, ' +
          'or run "npm run build" once so that config/bundle.js exists.');
      }
      useBundle = true;
      index = fromBundle('index.json');
    }
  }

  const get = async (path) => (useBundle ? fromBundle(path) : fetchJson(path));

  const collect = async (dir, ids) => {
    const entries = await Promise.all(ids.map((id) => get(`${dir}/${id}.json`)));
    const map = new Map();
    ids.forEach((id, i) => map.set(id, entries[i]));
    return map;
  };

  const [atmospheres, stars, scattering, experiments, localization, color] = await Promise.all([
    collect('atmospheres', index.atmospheres),
    collect('stars', index.stars),
    collect('scattering', index.scattering),
    collect('experiments', index.experiments),
    collect('localization', index.localization),
    collect('color', index.color),
  ]);

  return {
    index,
    atmospheres,
    stars,
    scattering,
    experiments,
    localization,
    colorimetryData: color.get(index.color[0]),
    loadedFrom: useBundle ? 'bundle' : 'files',
  };
}

/* ===== js/i18n.js ===== */
/**
 * Bilingual text. Czech is the default; English is one click away and the
 * switch never reloads the page.
 *
 * Any element carrying data-i18n gets its text replaced; data-i18n-title,
 * data-i18n-aria and data-i18n-placeholder fill the matching attributes. The
 * same helper resolves {cs: ..., en: ...} blocks that sit inside the physics
 * config files, so planet names and experiment prose translate too.
 */

function createI18n(localizationMap, initialLanguage = 'cs') {
  let language = localizationMap.has(initialLanguage) ? initialLanguage : 'cs';
  const listeners = new Set();

  function dictionary() {
    return localizationMap.get(language) ?? {};
  }

  /** Walk a dotted key path through the dictionary. */
  function lookup(key, dict) {
    let node = dict;
    for (const part of key.split('.')) {
      if (node == null || typeof node !== 'object') return undefined;
      node = node[part];
    }
    return typeof node === 'string' ? node : undefined;
  }

  /**
   * Translate a key, substituting {placeholders}. Falls back to the other
   * language, then to the key itself, so a missing string is visible rather
   * than silently blank.
   */
  function t(key, params) {
    let text = lookup(key, dictionary());
    if (text === undefined) {
      for (const [, dict] of localizationMap) {
        text = lookup(key, dict);
        if (text !== undefined) break;
      }
    }
    if (text === undefined) return key;
    if (!params) return text;
    return text.replace(/\{(\w+)\}/g, (match, name) =>
      Object.prototype.hasOwnProperty.call(params, name) ? String(params[name]) : match);
  }

  /** Resolve a {cs, en} block from a config file. */
  function localized(value, fallback = '') {
    if (value == null) return fallback;
    if (typeof value === 'string') return value;
    return value[language] ?? value.cs ?? value.en ?? fallback;
  }

  function setLanguage(next) {
    if (!localizationMap.has(next) || next === language) return;
    language = next;
    if (typeof document !== 'undefined') {
      document.documentElement.lang = language;
      applyTo(document);
    }
    listeners.forEach((fn) => fn(language));
  }

  function getLanguage() { return language; }

  function onChange(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  }

  /** Refresh every translatable node under `root`. */
  function applyTo(root = document) {
    root.querySelectorAll('[data-i18n]').forEach((el) => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    root.querySelectorAll('[data-i18n-title]').forEach((el) => {
      el.title = t(el.getAttribute('data-i18n-title'));
    });
    root.querySelectorAll('[data-i18n-aria]').forEach((el) => {
      el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
    });
  }

  /** Number formatting that follows the active language. */
  function formatNumber(value, options = {}) {
    const locale = language === 'cs' ? 'cs-CZ' : 'en-GB';
    return new Intl.NumberFormat(locale, options).format(value);
  }

  return { t, localized, setLanguage, getLanguage, onChange, applyTo, formatNumber,
    availableLanguages: Array.from(localizationMap.keys()) };
}

/* ===== js/state.js ===== */
/**
 * Application state and the rules that keep it physically coherent.
 *
 * One object holds everything the user can change. Panels subscribe to it and
 * are told which paths moved, so a slider drag repaints the spectrum without
 * rebuilding the whole interface.
 */

const DEFAULT_STATE = {
  language: 'cs',
  level: 'basic',
  experimentId: null,
  experimentStep: 0,

  star: {
    presetId: 'sun-5800k',
    temperatureK: 5800,
    elevationDeg: 55,
    realisticInsolation: true,
  },

  atmosphere: {
    presetId: 'earth',
    densityScale: 1,
    scaleHeight_m: null,   // null means "use the value from the preset"
    aerosolScale: 1,
    aerosolPresetId: null,   // null means 'the haze this world came with'
    rayleighExponent: 4,
  },

  observer: {
    z: 0,
    viewZenithDeg: 35,
    viewAzimuthDeg: 180,
    countShaftAir: false,
    well: { enabled: false, radius_m: 1.5, depth_m: 50 },
  },

  // Null means "fit the frame to the air"; a number is a vertical extent in
  // metres, chosen with the zoom control or the mouse wheel.
  camera: { span_m: null },

  rays: {
    count: 600,
    showScattering: true,
    animate: true,
    brightness: 1,
    quality: 'normal',
  },

  compare: { enabled: false, leftZ: 10000, rightZ: -10000 },
};

/** Highest altitude the position control can reach, in metres. */
function maxAltitudeFor(atmosphereConfig) {
  return Math.max(100000, atmosphereConfig?.topAltitude_m ?? 100000);
}

/**
 * The vertical control is one continuous coordinate that has to span a two
 * metre well and a hundred kilometre climb. A signed power law gives metre
 * resolution near the ground while still reaching space at the end of travel.
 */
const SLIDER_RANGE = 1000;
const SLIDER_POWER = 2.5;

function sliderToZ(slider, maxAltitude, maxDepth) {
  const t = Math.abs(slider) / SLIDER_RANGE;
  const magnitude = Math.pow(t, SLIDER_POWER);
  return slider >= 0 ? magnitude * maxAltitude : -magnitude * maxDepth;
}

function zToSlider(z, maxAltitude, maxDepth) {
  const span = z >= 0 ? maxAltitude : maxDepth;
  if (span <= 0) return 0;
  const t = Math.pow(Math.min(1, Math.abs(z) / span), 1 / SLIDER_POWER);
  return Math.round((z >= 0 ? t : -t) * SLIDER_RANGE);
}

function isPlainObject(v) {
  return v !== null && typeof v === 'object' && !Array.isArray(v);
}

/** Deep merge a patch into a target, recording the dotted paths that changed. */
function mergeInto(target, patch, changed, prefix = '') {
  for (const [key, value] of Object.entries(patch)) {
    const path = prefix ? `${prefix}.${key}` : key;
    if (isPlainObject(value) && isPlainObject(target[key])) {
      mergeInto(target[key], value, changed, path);
    } else if (target[key] !== value) {
      target[key] = value;
      changed.add(path);
      // Mark ancestors so coarse subscribers can watch a whole section.
      let p = prefix;
      while (p) { changed.add(p); p = p.includes('.') ? p.slice(0, p.lastIndexOf('.')) : ''; }
    }
  }
}

function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

function createStore(initial = DEFAULT_STATE) {
  const state = clone(initial);
  const listeners = new Set();
  let context = { maxAltitude: 100000 };

  /**
   * Enforce the invariants that make the model meaningful:
   * being below datum means being in a shaft, and the shaft is what limits
   * how far down the observer can go.
   */
  function reconcile(changed) {
    const obs = state.observer;
    // Inside a shaft you are somewhere between its bottom and its mouth, and
    // nowhere else: the cross-section shows the shaft the whole time the shaft
    // is switched on, so the position control must not be able to leave it.
    const maxDepth = obs.well.enabled ? obs.well.depth_m : 0;
    const ceiling = obs.well.enabled ? 0 : context.maxAltitude;
    const clamped = Math.max(-maxDepth, Math.min(ceiling, obs.z));
    if (clamped !== obs.z) {
      obs.z = clamped;
      changed.add('observer.z');
      changed.add('observer');
    }
    // The zoom is a physical extent, so it has physical limits: below a few
    // kilometres nothing is left to see, and past a few thousand the planet has
    // shrunk to a dot.
    const span = state.camera.span_m;
    if (span != null) {
      const fixed = Math.max(5e3, Math.min(6e6, span));
      if (fixed !== span) {
        state.camera.span_m = fixed;
        changed.add('camera.span_m');
        changed.add('camera');
      }
    }
    if (state.compare.enabled) {
      const depth = Math.max(obs.well.depth_m, 1);
      const right = Math.max(-depth, Math.min(0, state.compare.rightZ));
      if (right !== state.compare.rightZ) {
        state.compare.rightZ = right;
        changed.add('compare.rightZ');
        changed.add('compare');
      }
    }
  }

  function notify(changed) {
    if (changed.size === 0) return;
    listeners.forEach((fn) => fn(state, changed));
  }

  return {
    get state() { return state; },

    /** Tell the store about limits that depend on the loaded configuration. */
    setContext(next) { context = { ...context, ...next }; },

    /** Apply a partial update; nested objects are merged, not replaced. */
    patch(update) {
      const changed = new Set();
      mergeInto(state, update, changed);
      reconcile(changed);
      notify(changed);
      return changed;
    },

    /** Replace the whole state, used by Reset. */
