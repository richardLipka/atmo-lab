    const sourceColor = colorimetry.spectrumToSrgb(source, 1 / Math.max(1e-6, colorimetry.luminance(source)));

    const domeColors = dome.map((sample) => ({
      ...sample,
      color: sample.result.blocked
        ? { css: '#000000', rgb: [0, 0, 0], luminance: 0 }
        : colorimetry.spectrumToSrgb(sample.result.observed, exposure),
    }));

    const atmosphericZ = Math.max(0, scene.observerZ);
    const columnR = atmosphere.verticalColumnRayleigh(atmosphericZ);
    const columnA = atmosphere.verticalColumnAerosol(atmosphericZ);
    const columnO = atmosphere.verticalColumnOzone(atmosphericZ);
    const surfaceColumn = atmosphere.verticalColumnRayleigh(0);
    const verticalTau = atmosphere.opticalDepth(columnR, columnA, columnO);

    const depth = scene.observerZ < 0 ? -scene.observerZ : 0;
    const half = scene.wellActive ? wellApertureHalfAngle(depth, scene.wellRadius) : Math.PI / 2;

    // A star straight overhead, against the sky right behind it. The zenith is
    // the one direction a vertical shaft always leaves open, and the ray up it
    // carries both: the star's light through the air (and any air in the
    // shaft), and the sky's own glow in that direction.
    const zenith = computeViewRadiance(scene, { x: 0, y: 1, z: 0 }, quality);
    const zenithSkyLuminance = colorimetry.luminance(zenith.scattered);
    const starIlluminance = overheadStarIlluminance(zenith.transmittance, colorimetry);
    const starContrast = starContrastAgainstSky({ starIlluminance, skyLuminance: zenithSkyLuminance });
    const venusFactor = starIlluminanceRelativeToSun(VENUS_BRIGHTEST_MAGNITUDE)
      / starIlluminanceRelativeToSun(OVERHEAD_STAR.magnitude);

    return {
      scene, view, beam, dome: domeColors, illumination,
      perceived: perceived.spectrum,
      colors: {
        sky: skyColor, perceived: perceivedColor, scatter: scatterColor,
        star: starColor, source: sourceColor,
      },
      metrics: {
        z: scene.observerZ,
        atmosphericAltitude: atmosphericZ,
        columnFraction: surfaceColumn > 0 ? columnR / surfaceColumn : 0,
        massColumn: atmosphere.massColumn(atmosphericZ),
        verticalTau: sampleAt(verticalTau, REFERENCE_LAMBDAS),
        viewTau: sampleAt(view.opticalDepth, REFERENCE_LAMBDAS),
        beamTau: sampleAt(beam.opticalDepth, REFERENCE_LAMBDAS),
        beamTransmission: sampleAt(beam.transmittance, REFERENCE_LAMBDAS),
        airMass: beam.airMass,
        pathLength: view.pathLength,
        scaleHeight: atmosphere.scaleHeightRayleigh,
        apertureHalfAngleDeg: half / DEG,
        apertureSolidAngle: scene.wellActive ? wellSolidAngle(half) : 2 * Math.PI,
        skyFraction: scene.wellActive ? wellSolidAngle(half) / (2 * Math.PI) : 1,
        // How much of the observer's own field of view still has sky in it,
        // which is what sets how bright the place looks.
        fieldOfViewShare: perceived.share,
        analyticIlluminanceFraction: scene.wellActive
          ? wellIlluminanceFraction(depth, scene.wellRadius) : 1,
        skyLuminance: colorimetry.luminance(view.scattered),
        overheadStar: {
          illuminance: starIlluminance,
          zenithSkyLuminance,
          contrast: starContrast,
          venusContrast: starContrast * venusFactor,
        },
        peakWavelength: wienPeakNm(sim.star.temperatureK),
        scatteringAngleDeg: Math.acos(Math.max(-1, Math.min(1,
          viewDir.x * scene.sunDir.x + viewDir.y * scene.sunDir.y + viewDir.z * scene.sunDir.z))) / DEG,
        blocked: view.blocked,
      },
    };
  }

  /**
   * How bright the sky looks from here, rather than how bright one direction is.
   *
   * The radiance of a patch of sky is the same whether or not there is a shaft
   * in the way - that is the whole point of the well - so quoting it alone left
   * the bottom of a fifty-metre well reading as a bright blue sky. An eye does
   * not measure one direction. It collects a field of view, and what a shaft
   * changes is how much of that field has any sky in it at all.
   *
   * So this is the mean radiance over the observer's field of view, with the
   * directions the rock has taken counted as the nothing they deliver. In the
   * open it is simply the sky in that direction; down a shaft the aperture is a
   * small disc inside a much larger cone and the mean falls with the ratio of
   * their solid angles - which is to say with how many rays get through, while
   * the hue stays that of the ones that do.
   */
  function perceivedSky(dome, scene, viewObserved, viewZenithRad) {
    if (!scene.wellActive) return { spectrum: viewObserved, share: 1 };

    const share = fieldOfViewSkyShare(
      scene.apertureHalfAngle, VIEW_CONE_HALF_DEG * DEG, viewZenithRad);

    // The sky that shows through an aperture is the sky about the zenith, since
    // that is where a vertical shaft points.
    const zenith = nearestSample(dome, 0);
    const out = specNew();
    if (!zenith || share <= 0) return { spectrum: out, share: 0 };
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      out[i] = zenith.result.observed[i] * share;
    }
    return { spectrum: out, share };
  }

  function nearestSample(dome, signedAngleDeg) {
    let best = null, bestDelta = Infinity;
    for (const sample of dome) {
      const delta = Math.abs(sample.signedAngleDeg - signedAngleDeg);
      if (delta < bestDelta) { bestDelta = delta; best = sample; }
    }
    return best;
  }

  function sampleAt(spectrum, lambdas) {
    const out = {};
    for (const nm of lambdas) {
      const i = Math.round((nm - 380) / 10);
      out[nm] = spectrum[i] ?? 0;
    }
    return out;
  }

  /**
   * Full evaluation of the current state: one entry per observer being
   * simulated, and a pointer to the one the interface answers for.
   *
   * `primary` is not "the first observer", it is "the SELECTED observer". Every
   * readout that quotes one number - the spectrum plot, the swatches, the
   * table, the explanation at the foot of the page - reads it, and so every one
   * of them describes the panel the user has selected without having to know
   * that a comparison is running at all.
   */
  function run(state) {
    const simulations = simulationsOf(state).map(({ id, sim }) => {
      const atmosphereConfig = configFor(sim);
      const atmosphere = atmosphereFor(sim);
      const source = sourceFor(sim, atmosphereConfig);
      return {
        id, sim, observer: sim.observer, atmosphere, atmosphereConfig, source,
        evaluation: evaluate(state, sim, atmosphere, source),
      };
    });
    const activeId = activeSimulationId(state);
    const active = simulations.find((entry) => entry.id === activeId) ?? simulations[0];

    return {
      exposure: exposureFor(state),
      simulations,
      activeId: active.id,
      primary: active.evaluation,
      // The world of the SELECTED simulation, for everything that still speaks
      // of one: the readouts, the explanation, the spectrum plot. They describe
      // the panel the reader has chosen, and so they read these.
      atmosphere: active.atmosphere,
      atmosphereConfig: active.atmosphereConfig,
      source: active.source,
    };
  }

  return { run, atmosphereFor, sourceFor, sceneFor, exposureFor };
}

/* ===== js/render/scene-renderer.js ===== */
/**
 * The cross-section drawing.
 *
 * Two very different pictures are needed, because the two mechanisms the
 * simulator contrasts live at wildly different scales: an atmosphere is a
 * hundred kilometres deep, a shaft is a couple of metres wide. Rather than
 * pretend one frame can hold both honestly, the renderer switches:
 *
 *   above datum - the atmosphere view, a slab of air with the star, the
 *                 observer and traced photons;
 *   below datum - the shaft view, drawn at the aspect ratio of the shaft
 *                 itself, with the escape cone and the patch of sky it leaves.
 *
 * Nothing here invents a colour. The glow of the air is evaluated by the
 * scattering integrator on a coarse grid and then smoothed; the ground tint is
 * its albedo times the light actually falling on it.
 *
 * One panel per simulation. When the comparison is running there are two, and
 * each is drawn from ITS OWN everything - its own star, its own air, its own
 * traced rays, its own shaft, its own frame - rather than from one trace shown
 * twice at two heights, which is what it used to be and which made the second
 * panel a picture of the first observer's rays relabelled. One panel is
 * selected: it takes the controls, it answers the readouts, and it is the only
 * one that responds to the pointer. Clicking the other selects it.
 */

const FIELD_COLUMNS = 26;
const FIELD_ROWS = 34;
/**
 * The deepest shaft the picture draws to scale, as a depth-to-radius ratio.
 * Beyond this the cone would be thinner than a line, so the shaft is drawn
 * stubbier than it is and both the true ratio and the true angle are printed.
 */
/** How many of the blocked directions to draw, once nearly all of them are. */
const MAX_DRAWN_BLOCKED = 26;

function createSceneRenderer(canvas, { i18n, colorimetry }) {
  const ctx = canvas.getContext('2d', { alpha: false });
  let data = null;
  /** Baked glow images, one per panel, keyed by what each was computed for. */
  const fields = new Map();
  let layout = null;         // geometry of the selected panel, for hit testing
  /** Where each panel was drawn last frame, so a click can find its panel. */
  let panelBoxes = [];
  /**
   * The panel being drawn: one observer and everything measured for them.
   * Every helper below reads this rather than reaching for `data.state.observer`
   * - which is how the comparison used to end up drawing the shaft, the viewing
   * cone and the rays of observer A inside observer B's panel.
   */
  let current = null;
  let hoveredPath = -1;
  let selectedPath = -1;

  function cssSize() {
    const rect = canvas.getBoundingClientRect();
    return { w: Math.max(320, rect.width), h: Math.max(240, rect.height) };
  }

  function resize() {
    const { w, h } = cssSize();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  /**
   * Evaluate the glow of the atmosphere on a coarse grid and bake it into a
   * small offscreen image. Drawn back scaled up and smoothed, it gives a
   * continuous gradient for the price of a few hundred evaluations - and the
   * shadow of the planet appears on its own at low sun.
   *
   * The grid is laid out in screen space and lifted into the world through the
   * camera, so zooming out re-evaluates the same integrator over a bigger piece
   * of the planet rather than stretching a picture of a small one. Cells below
   * the surface or above the atmosphere are left transparent; the ground and
   * the black of space are painted separately.
   */
  function buildField(scene, camera, plot) {
    const atm = current.atmosphere;
    const off = document.createElement('canvas');
    off.width = FIELD_COLUMNS;
    off.height = FIELD_ROWS;
    const octx = off.getContext('2d');
    const image = octx.createImageData(FIELD_COLUMNS, FIELD_ROWS);

    for (let row = 0; row < FIELD_ROWS; row++) {
      const sy = plot.y + ((row + 0.5) / FIELD_ROWS) * plot.h;
      for (let col = 0; col < FIELD_COLUMNS; col++) {
        const sx = plot.x + ((col + 0.5) / FIELD_COLUMNS) * plot.w;
        const world = camera.unproject(sx, sy);
        const radius = Math.hypot(world.x, world.y);
        const altitude = radius - camera.R;
        const i = (row * FIELD_COLUMNS + col) * 4;
        if (altitude < 0 || altitude > atm.topAltitude) {
          image.data[i + 3] = 0;
          continue;
        }
        const point = v3(world.x, world.y, 0);
        const spectrum = computeScatteringSource(scene, point, 0, QUALITY_PRESETS.preview);
        const c = colorimetry.spectrumToSrgb(spectrum, data.result.exposure * FIELD_GAIN);
        image.data[i] = c.rgb[0];
        image.data[i + 1] = c.rgb[1];
        image.data[i + 2] = c.rgb[2];
        image.data[i + 3] = 255;
      }
    }
    octx.putImageData(image, 0, 0);
    return off;
  }

  /** Ground colour: what the surface reflects of the light reaching it. */
  function groundColor(evaluation) {
    const albedo = current.atmosphere.groundAlbedo;
    const ill = evaluation.illumination;
    const beam = evaluation.beam;
    const spectrum = new Float64Array(beam.spectrum.length);
    const cosSun = Math.max(0, evaluation.scene.sunDir.y);
    // The terrain is lit by the beam that reaches the SURFACE, which is not the
    // beam that reaches the observer: down a shaft the latter is blocked, and
    // colouring the whole landscape from it turned the ground black while the
    // Sun was still up. What the shaft blocks is the observer's view, not the
    // countryside. Night still darkens it, because then there is no beam.
    const lit = !beam.belowHorizon;
    for (let i = 0; i < spectrum.length; i++) {
      spectrum[i] = lit
        ? albedo * current.source[i] * beam.transmittance[i] * cosSun : 0;
    }
    const c = colorimetry.spectrumToSrgb(spectrum, 1.6);
    const floor = Math.max(0.03, Math.min(1, ill.totalOpen * 4));
    return `rgb(${Math.round(c.rgb[0] * floor + 12)}, ${Math.round(c.rgb[1] * floor + 10)}, ${Math.round(c.rgb[2] * floor + 9)})`;
  }

  function update(next, options = {}) {
    data = next;
    // Clicking a ray should survive an unrelated slider move; only a fresh set
    // of traced photons invalidates the choice.
    if (!options.keepSelection) selectedPath = -1;
    // The glow fields are built lazily on the first draw, because they depend
    // on the plot rectangle and so on the size of the canvas.
    fields.clear();
  }

  function draw(timeMs) {
    const { w, h } = resize();
    ctx.fillStyle = '#05070d';
    ctx.fillRect(0, 0, w, h);
    panelBoxes = [];
    layout = null;
    if (!data || !data.result || !data.stations || data.stations.length === 0) return;

    const stations = data.stations;
    if (stations.length === 1) {
      drawPanel(0, 0, w, h, stations[0], timeMs, false);
      return;
    }

    const gap = 10;
    const half = (w - gap) / 2;
    drawPanel(0, 0, half, h, stations[0], timeMs, true);
    drawPanel(half + gap, 0, half, h, stations[1], timeMs, true);
  }

  function drawPanel(x0, y0, pw, ph, station, timeMs, labelled) {
    const active = station.id === data.activeId;
    // `labelled` is also how much room the badge takes at the top left, which
    // the legend and the aperture label have to keep clear of.
    current = { ...station, active, labelled, topInset: labelled ? 38 : 0 };
    panelBoxes.push({ id: station.id, x: x0, y: y0, w: pw, h: ph });

    ctx.save();
    ctx.beginPath();
    ctx.rect(x0, y0, pw, ph);
    ctx.clip();
    ctx.translate(x0, y0);

    // One picture, always. An earlier version switched to a purpose-drawn
    // schematic of the shaft, which meant the shaft was the one situation the
    // simulation did not actually simulate - it was a diagram of what the
    // answer would be. The shaft is now part of the same cross-section, cut out
    // of the ground, with the same traced rays running into its walls.
    drawAtmosphereView(pw, ph, timeMs, x0, y0);
    if (labelled) drawPanelBadge(pw, station, active);
    ctx.restore();

    // The frame of the selected panel, drawn last so nothing paints over it.
    // Two panels are worth nothing if the reader cannot tell which one the
    // controls and the numbers belong to.
    if (labelled && active) {
      ctx.save();
      ctx.strokeStyle = stationColour(station.id);
      ctx.lineWidth = 2;
      ctx.strokeRect(x0 + 1, y0 + 1, pw - 2, ph - 2);
      ctx.restore();
    }
    current = null;
  }

  /**
   * Which observer this panel is, and whether it is the selected one.
   *
   * The badge carries the whole answer to "what am I controlling": the letter,
   * the height, and either the word for selected or an invitation to click. It
   * is drawn in the observer's own colour, the same colour the controls, the
   * strip and the histogram use for that observer.
   */
  function drawPanelBadge(pw, station, active) {
    const colour = stationColour(station.id);
    const name = i18n.t(station.id === 'a' ? 'compare.observerA' : 'compare.observerB');
    const title = `${name} - ${formatPlace(station.observer.z, i18n)}`;
    const hint = i18n.t(active ? 'compare.selected' : 'compare.selectHint');

    ctx.save();
    ctx.font = '600 12px system-ui, sans-serif';
    const titleWidth = ctx.measureText(title).width;
    ctx.font = '10px system-ui, sans-serif';
    const hintWidth = ctx.measureText(hint).width;
    const boxW = Math.min(pw - 16, Math.max(titleWidth, hintWidth) + 18);

    ctx.fillStyle = active ? 'rgba(8, 11, 18, 0.85)' : 'rgba(8, 11, 18, 0.6)';
    ctx.fillRect(8, 8, boxW, 34);
    ctx.fillStyle = colour;
    ctx.fillRect(8, 8, 3, 34);
    ctx.globalAlpha = active ? 1 : 0.75;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '600 12px system-ui, sans-serif';
    ctx.fillStyle = active ? colour : 'rgba(255,255,255,0.8)';
    ctx.fillText(title, 17, 22);
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(hint, 17, 36);
    ctx.restore();
  }

  /* ---------------------------------------------------------------- */
  /* Atmosphere view                                                   */
  /* ---------------------------------------------------------------- */

  function drawAtmosphereView(w, h, timeMs, originX, originY) {
    const atm = current.atmosphere;
    const observer = current.observer;
    const evaluation = current.evaluation;
    const z = observer.z;

    const plot = plotRect(w, h);
    const span = spanFor(observer, atm);
    const camera = makeCamera(atm, plot, span,
      belowGroundFor(observer), Math.max(0, -z));

    // The glow is expensive, so it is rebuilt only when what it depends on
    // moves - which now includes the zoom and the size of the canvas. Each
    // panel keeps its own, because each has its own frame.
    const key = `${span}|${Math.round(plot.w)}x${Math.round(plot.h)}`;
    const cached = fields.get(current.id);
    const panelField = cached && cached.key === key
      ? cached.image
      : buildField(evaluation.scene, camera, plot);
    fields.set(current.id, { key, image: panelField });

    ctx.save();
    ctx.beginPath();
    ctx.rect(plot.x, plot.y, plot.w, plot.h);
    ctx.clip();

    if (panelField) {
      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(panelField, plot.x, plot.y, plot.w, plot.h);
      ctx.restore();
    }

    // The planet, drawn as the arc it is. At close zoom the sagitta is a
    // fraction of a pixel and it looks like a flat horizon on its own.
    fillPlanet(plot, camera, groundColor(evaluation));

    drawAltitudeArcs(plot, camera, atm);
    drawStarMarker(plot);
    drawApertureCone(plot, camera, z);
    drawViewCone(plot, camera, z);
    // Starlight goes in BEFORE the scattered light, on purpose: in the open the
    // scattered rays should be able to bury it, and down a shaft the walls have
    // already stopped most of them, so it shows.
    const stars = overheadStars(plot, camera);
    drawStarRays(stars);
    if (current.photons && data.state.rays.showScattering) {
      drawPhotons(plot, camera, z, timeMs);
    }
    drawObserverAt(camera, z, evaluation);
    drawStarIcons(stars, timeMs);
    drawStarAgainstSky(plot);
    ctx.restore();

    // Outside the clip: the labels live in the left margin, which is not part
    // of the plot rectangle the rays are clipped to.
    drawAltitudeLabels(plot, camera, atm);
    drawScaleBar(plot, camera);
    // Only the selected panel is hit-tested, and the origin travels with the
    // geometry so a click in the right-hand panel lands where it was drawn.
    if (current.active) layout = { plot, camera, originX, originY };
  }

  /** The drawing area inside the canvas, shared by the view and the tracer. */
  function plotRect(w, h) {
    const padLeft = 52, padRight = 12, padTop = 10, padBottom = 26;
    return { x: padLeft, y: padTop, w: w - padLeft - padRight, h: h - padTop - padBottom };
  }

  /**
   * The piece of the world that is on screen, for whoever needs to sample it.
   *
   * The ray tracer has to lay its paths out over exactly the region that will be
   * drawn, and it runs before the first frame, so it asks here rather than
   * guessing at the canvas geometry.
   */
  function frameFor(observer, atmosphere, panels = 1) {
    const { w, h } = cssSize();
    // In the comparison each observer gets half the canvas, and the rays have
    // to be laid out over the frame they will actually be drawn in.
    const plot = plotRect(panels > 1 ? (w - 10) / 2 : w, h);
    const camera = makeCamera(atmosphere, plot,
      spanFor(observer, atmosphere), belowGroundFor(observer),
      Math.max(0, -observer.z));
    return {
      span_m: camera.span,
      halfWidth_m: camera.halfWidth,
      skyExtent_m: camera.skyExtent,
    };
  }

  /** How far below the surface this observer's frame has to reach, in metres. */
  function belowGroundFor(observer) {
    const well = observer.well;
    return well.enabled ? Math.max(well.depth_m, -observer.z) : 0;
  }

  /** Which vertical extent is on screen: the observer's choice, or the default. */
  function spanFor(observer, atmosphere) {
    return observer.span_m != null
      ? clampSpan(observer.span_m)
      : autoSpanFor(atmosphere, observer.z, observer.well);
  }

  /**
   * Fill everything below the surface. The surface is a circle of radius R about
   * the origin, so the boundary is sampled across the plot and closed downwards.
   */
  function fillPlanet(plot, camera, colour) {
    const steps = 96;
    ctx.save();
    ctx.beginPath();
    let started = false;
    for (let i = 0; i <= steps; i++) {
      const sx = plot.x + (i / steps) * plot.w;
      const worldX = (sx - camera.cx) / camera.scale;
      // The surface point directly "below" this column: y = sqrt(R^2 - x^2).
      const inside = camera.R * camera.R - worldX * worldX;
      const worldY = inside > 0 ? Math.sqrt(inside) : 0;
      const p = camera.project({ x: worldX, y: worldY });
      if (!started) { ctx.moveTo(p.x, p.y); started = true; } else ctx.lineTo(p.x, p.y);
    }
    ctx.lineTo(plot.x + plot.w, plot.y + plot.h);
    ctx.lineTo(plot.x, plot.y + plot.h);
    ctx.closePath();
    ctx.fillStyle = colour;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    cutShaft(camera);
  }

  /**
   * The shaft, as what it is: a hole in the ground, drawn to scale in the same
   * frame as everything else. At a wide zoom it is narrower than a pixel and
   * simply does not show, which is the truth about a two-metre shaft under a
   * hundred kilometres of air - zoom in to see it.
   */
  function cutShaft(camera) {
    const well = current.observer.well;
    if (!well.enabled) return;
    const top = camera.project({ x: -well.radius_m, y: camera.R });
    const bottom = camera.project({ x: well.radius_m, y: camera.R - well.depth_m });
    const width = bottom.x - top.x;
    if (width < 0.4) return;

    ctx.save();
    // The inside of a shaft is rock, not a void. It was painted near-black,
    // which read as a hole cut out of the picture rather than as the thing that
    // takes the sky away. It is now the ground's own reflectance lit by the sky
    // that still gets down there - the same spectrum the strip fills its wings
    // with, so the two agree - with a floor, because two hundred metres down the
    // truth is black and black tells the reader nothing.
    ctx.fillStyle = shaftWallCss();
    ctx.fillRect(top.x, top.y, width, bottom.y - top.y);
    ctx.strokeStyle = 'rgba(255,235,205,0.55)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(top.x, top.y);
    ctx.lineTo(top.x, bottom.y);
    ctx.moveTo(top.x + width, top.y);
    ctx.lineTo(top.x + width, bottom.y);
    ctx.stroke();
    ctx.restore();
  }

  /**
   * Altitude gridlines. They are circles about the planet centre, so at wide
   * zoom the top of the atmosphere is visibly a shell wrapped round a ball -
   * which is the whole reason the zoom exists.
   */
  function drawAltitudeArcs(plot, camera, atm) {
    ctx.save();
    for (const value of altitudeTicksFor(camera, atm)) {
      const top = value === atm.topAltitude;
      ctx.strokeStyle = top ? 'rgba(160,200,255,0.35)' : 'rgba(255,255,255,0.10)';
      ctx.setLineDash(top ? [5, 4] : []);
      ctx.beginPath();
      const steps = 64;
      for (let i = 0; i <= steps; i++) {
        const sx = plot.x + (i / steps) * plot.w;
        const worldX = (sx - camera.cx) / camera.scale;
        const radius = camera.R + value;
        const inside = radius * radius - worldX * worldX;
        if (inside <= 0) continue;
        const q = camera.project({ x: worldX, y: Math.sqrt(inside) });
        if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  /** The altitudes those arcs stand for, written in the left margin. */
  function drawAltitudeLabels(plot, camera, atm) {
    ctx.save();
    ctx.font = '10px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    // Zoomed out, the whole atmosphere is a few pixels tall and every tick
    // lands on the same row. Keep the ones that are legibly apart, and always
    // keep the top of the atmosphere, which is the one worth naming.
    const ticks = altitudeTicksFor(camera, atm);
    let lastY = -Infinity;
    for (let i = ticks.length - 1; i >= 0; i--) {
      const value = ticks[i];
      const label = camera.project({ x: 0, y: camera.R + value });
      if (label.y < plot.y + 6 || label.y > plot.y + plot.h - 4) continue;
      if (label.y - lastY < 13 && value !== 0) continue;
      lastY = label.y;
      ctx.fillStyle = value === atm.topAltitude
        ? 'rgba(160,200,255,0.8)' : 'rgba(255,255,255,0.5)';
      ctx.fillText(formatAltitude(value), plot.x - 6, label.y);
    }
    ctx.restore();
  }

  /** Which altitudes get an arc and a label at this zoom. */
  function altitudeTicksFor(camera, atm) {
    const ticks = niceAltitudeTicks(Math.min(atm.topAltitude, camera.skyExtent));
    if (!ticks.includes(atm.topAltitude) && atm.topAltitude <= camera.skyExtent) {
      ticks.push(atm.topAltitude);
    }
    return ticks;
  }

  /** A bar giving the horizontal scale, which now changes with the zoom. */
  function drawScaleBar(plot, camera) {
    const target = plot.w * 0.22;
    const metres = niceRoundDistance(target / camera.scale);
    const px = metres * camera.scale;
    const y = plot.y + plot.h + 14;
    const x = plot.x + 4;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y - 4); ctx.lineTo(x, y);
    ctx.lineTo(x + px, y); ctx.lineTo(x + px, y - 4);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.62)';
    ctx.font = '10px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(formatAltitude(metres), x + px + 6, y - 8);
    ctx.restore();
  }

  /** The observer, with its sight line, placed through the camera. */
  function drawObserverAt(camera, z, evaluation) {
    // Not clamped to the surface: down a shaft, that is the whole point.
    const p = camera.project({ x: 0, y: camera.R + z });
    drawObserver(p.x, p.y, evaluation, z);
  }

  /**
   * A marker showing where the star sits. The beams themselves are not drawn
   * here: the traced `through` paths carry the real, spectrally weighted
   * version of the same light, and a second set of decorative rays only
   * competed with it.
   */
  function drawStarMarker(plot) {
    const color = current.evaluation.colors.source.css;
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = color;
    const mx = plot.x + plot.w - 8;
    const my = plot.y + 10
      + (1 - Math.max(0, Math.min(1, current.sim.star.elevationDeg / 90))) * (plot.h * 0.35);
    ctx.beginPath();
    ctx.arc(mx - 26, my, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.textAlign = 'right';
    ctx.fillText(i18n.t('canvas.star'), mx, my + 3);
    ctx.restore();
  }

  /**
   * Faint stars along the top of the frame, each sending one ray straight down.
   *
   * By day the stars are all still there; what hides them is the scattered
   * sunlight arriving from every other direction at once. Each one is drawn
   * with exactly one ray - a thin white line to the ground - and the one in the
   * middle stands directly over the observer, so its ray is the one that ends
   * in their eye, or runs down the shaft to the bottom.
   *
   * They are evenly spread across the middle of the frame and kept clear of the
   * star marker at the right. The middle one is placed first and exactly on the
   * observer's line, because it is the only one whose light is anybody's.
   */
  const OVERHEAD_STAR_SPREAD = [0, -1, 1, -2, 2, -3, 3];

  function overheadStars(plot, camera) {
    const step = plot.w * 0.11;
    const top = plot.y + current.topInset + 7;
    const well = current.observer.well;
    const shaft = well.enabled && well.depth_m > 0;
    // Nothing may sit under the legend box, which is drawn over the top left
    // whenever the rays are. The star over the observer is never dropped.
    const legendShown = current.photons && data.state.rays.showScattering;
    const clearOf = legendShown ? plot.x + 8 + legendBoxWidth() + 8 : plot.x;
    return OVERHEAD_STAR_SPREAD.filter((k) => k === 0 || camera.cx + k * step - 6 > clearOf)
      .map((k, index) => {
      const sx = camera.cx + k * step;
      const x = (sx - camera.cx) / camera.scale;
      const fromY = camera.unproject(sx, top).y;
      // Straight down until it meets rock: the floor of the shaft if the star
      // stands over the opening, the curved ground anywhere else.
      const inShaft = shaft && Math.abs(x) < well.radius_m;
      const ground = Math.sqrt(Math.max(0, camera.R * camera.R - x * x));
      const toY = inShaft ? camera.R - well.depth_m : ground;
      return {
        index, sx, top, overObserver: k === 0,
        from: camera.project({ x, y: Math.max(fromY, toY) }),
        to: camera.project({ x, y: toY }),
      };
      });
  }

  function drawStarRays(stars) {
    ctx.save();
    ctx.lineCap = 'round';
    for (const star of stars) {
      ctx.strokeStyle = 'rgba(244, 247, 255, 1)';
      ctx.globalAlpha = star.overObserver ? 0.85 : 0.5;
      ctx.lineWidth = star.overObserver ? 1.3 : 1;
      ctx.beginPath();
      ctx.moveTo(star.sx, star.top + 4);
      ctx.lineTo(star.to.x, star.to.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  /** The stars themselves: small four-pointed sparks, on top of everything. */
  function drawStarIcons(stars, timeMs) {
    const animate = data.state.rays.animate;
    ctx.save();
    for (const star of stars) {
      const twinkle = animate ? 0.8 + 0.2 * Math.sin(timeMs / 520 + star.index * 1.9) : 1;
      const r = star.overObserver ? 4.2 : 3.4;
      ctx.globalAlpha = 0.95 * twinkle;
      ctx.fillStyle = '#f4f7ff';
      ctx.beginPath();
      ctx.moveTo(star.sx, star.top - r);
      ctx.quadraticCurveTo(star.sx, star.top, star.sx + r, star.top);
      ctx.quadraticCurveTo(star.sx, star.top, star.sx, star.top + r);
      ctx.quadraticCurveTo(star.sx, star.top, star.sx - r, star.top);
      ctx.quadraticCurveTo(star.sx, star.top, star.sx, star.top - r);
      ctx.fill();
      ctx.globalAlpha = 0.35 * twinkle;
      ctx.beginPath();
      ctx.arc(star.sx, star.top, r * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /**
   * What decides whether the star overhead is seen, drawn to scale.
   *
   * The rays above are the wrong thing to judge by. Down a shaft the star's
   * single line stands almost alone, because the walls have stopped the light
   * from the rest of the sky - and that picture is exactly what makes the
   * well myth so persuasive. The eye cannot tell a star from the sky within
   * about one arcminute of it, and that patch of sky glows just as brightly at
   * the bottom of a well as on open ground. So the inset shows the two things
   * that arrive from that patch, side by side on one linear scale: the glow of
   * the sky behind the star, and the star. By day the star is a sliver beside
   * the sky; down any shaft it is the same sliver; at dusk it overtakes; on the
   * Moon the sky's bar is gone.
   */
  function drawStarAgainstSky(plot) {
    if (Math.abs(current.observer.viewZenithDeg) > VIEW_CONE_HALF_DEG) return;
    const star = current.evaluation?.metrics?.overheadStar;
    if (!star) return;
    const skyLight = Math.max(0, star.zenithSkyLuminance) * eyeResolutionSolidAngle();
    const starLight = Math.max(0, star.illuminance);
    const scale = Math.max(skyLight, starLight);
    if (!(scale > 0)) return;

    const w = Math.min(190, plot.w * 0.44);
    const h = 70;
    const x = plot.x + plot.w - w - 8;
    const y = plot.y + plot.h - h - 22;
    const barX = x + 8;
    const barW = w - 16;
    const percent = (v) => {
      const p = 100 * v / scale;
      const text = p >= 10 ? p.toFixed(0) : p >= 0.1 ? p.toFixed(1) : p > 0 ? p.toExponential(0) : '0';
      return `${i18n.getLanguage() === 'cs' ? text.replace('.', ',') : text} %`;
    };

    ctx.save();
    ctx.fillStyle = 'rgba(5, 7, 13, 0.78)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.font = '10px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.fillText(i18n.t('canvas.starPatchTitle'), barX, y + 10);

    // Each row: its label and value on one line, the bar beneath them.
    const row = (labelY, label, value, colour) => {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.textAlign = 'left';
      ctx.fillText(label, barX, labelY);
      ctx.textAlign = 'right';
      ctx.fillText(percent(value), barX + barW, labelY);
      const barY = labelY + 7;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(barX, barY, barW, 7);
      const len = value > 0 ? Math.max(1, barW * value / scale) : 0;
      ctx.fillStyle = colour;
      ctx.fillRect(barX, barY, len, 7);
    };
    ctx.font = '9.5px system-ui, sans-serif';
    row(y + 26, i18n.t('canvas.starPatchSky'), skyLight, '#8fb8ff');
    row(y + 50, i18n.t('canvas.starPatchStar'), starLight, '#f4f7ff');
    ctx.restore();
  }

  /**
   * The only sky a shaft leaves.
   *
   * Without this the picture is honestly puzzling: the air above is bright blue
   * and nothing arrives, and the reason - that the rock has taken all of the
   * sky except a sliver - is implied by the stopped rays rather than shown.
   * This is that sliver, at arctan(R/depth), drawn to scale from the observer
   * out through the mouth. The blue you can actually have is the blue inside it.
   */
  function drawApertureCone(plot, camera, z) {
    const well = current.observer.well;
    if (!well.enabled || z >= 0) return;
    const half = wellApertureHalfAngle(-z, well.radius_m);
    if (!(half > 0) || half >= Math.PI / 2 - 1e-6) return;

    const origin = { x: 0, y: camera.R + z };
    const reach = camera.span * 3;
    const edge = (angle) => camera.project({
      x: origin.x + Math.sin(angle) * reach,
      y: origin.y + Math.cos(angle) * reach,
    });
    const o = camera.project(origin);
    const left = edge(-half);
    const right = edge(half);

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(o.x, o.y);
    ctx.lineTo(left.x, left.y);
    ctx.lineTo(right.x, right.y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(150, 210, 255, 0.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150, 210, 255, 0.45)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 3]);
    for (const side of [left, right]) {
      ctx.beginPath();
      ctx.moveTo(o.x, o.y);
      ctx.lineTo(side.x, side.y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(180, 220, 255, 0.85)';
    ctx.textAlign = 'left';
    ctx.fillText('θmax = ' + formatAngle(half * 180 / Math.PI),
      plot.x + 8, plot.y + 14 + current.topInset);
    ctx.restore();
  }

  /**
   * The cone of sky the observer is looking down.
   *
   * The panels report one radiance, one spectrum and one colour, and all three
   * are properties of this cone. Drawing it makes that concrete: the coloured
   * rays inside the wedge are the ones being measured, the grey ones outside
   * are everything else.
   */
  function drawViewCone(plot, camera, z) {
    const observer = current.observer;
    const sign = Math.cos(observer.viewAzimuthDeg * Math.PI / 180) >= 0 ? 1 : -1;
    const axis = sign * observer.viewZenithDeg * Math.PI / 180;
    const half = VIEW_CONE_HALF_DEG * Math.PI / 180;
    const origin = { x: 0, y: camera.R + z };
    const reach = camera.span * 3;

    // One straight segment per edge, generously long and clipped by the plot
    // rectangle. Straight is exact here: the projection is orthographic.
    const edge = (angle) => ({
      x: origin.x + Math.sin(angle) * reach,
      y: origin.y + Math.cos(angle) * reach,
    });
    const o = camera.project(origin);
    const left = camera.project(edge(axis - half));
    const right = camera.project(edge(axis + half));

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(o.x, o.y);
    ctx.lineTo(left.x, left.y);
    ctx.lineTo(right.x, right.y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.075)';
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    for (const side of [left, right]) {
      ctx.beginPath();
      ctx.moveTo(o.x, o.y);
      ctx.lineTo(side.x, side.y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.72)';
    ctx.textAlign = 'center';
    const label = camera.project({
      x: origin.x + Math.sin(axis) * camera.span * 0.55,
      y: origin.y + Math.cos(axis) * camera.span * 0.55,
    });
    ctx.fillText(i18n.t('canvas.viewCone'),
      Math.max(plot.x + 60, Math.min(plot.x + plot.w - 60, label.x)),
      Math.max(plot.y + 12, label.y));
    ctx.restore();
  }

  /**
   * Draw the families of light paths.
   *
   * They are painted back to front so the subject ends up on top: first the
   * light that crossed without interacting, then the events that threw light
   * where the observer will never see it, then the light arriving from the rest
   * of the sky, and last, brightest, the rays inside the viewing cone.
   */
  function drawPhotons(plot, camera, observerZ, timeMs) {
    const project = camera.project;
    const paths = current.photons;
    const animate = data.state.rays.animate;
    const phase = animate ? (timeMs / 2600) % 1 : 1;

    const observer = current.observer;
    const sign = Math.cos(observer.viewAzimuthDeg * Math.PI / 180) >= 0 ? 1 : -1;
    const axis = sign * observer.viewZenithDeg * Math.PI / 180;
    const half = VIEW_CONE_HALF_DEG * Math.PI / 180;
    // Hover and selection are indices into the SELECTED panel's rays; the same
    // index in the other panel is a different ray, so it must not light up.
    const hovered = current.active ? hoveredPath : -1;
    const selected = current.active ? selectedPath : -1;

    const observerWorld = { x: 0, y: camera.R + observerZ };

    /**
     * Where in the sky a scattering event sits, as the observer sees it.
     *
     * The cone is a volume, not a list of ray labels, and what decides whether
     * a ray belongs to it is where its event happened. This matters because the
     * light feeding those events arrives from somewhere else entirely - down
     * the line to the star, which at a low Sun is nearly at right angles to
     * where you are looking. A ray can therefore come into the cone from any
     * direction at all; what makes it yours is that it turned inside the cone
     * and left along the line to your eye.
     */
    const eventAngle = (p) => {
      const e = p.events[1];
      return Math.atan2(e.x - observerWorld.x, e.y - observerWorld.y);
    };

    /** Did this ray's turn happen inside the cone the observer is looking down? */
    const turnsInCone = (p) => p.scatterCount > 0
      && Math.abs(eventAngle(p) - axis) <= half;

    /**
     * Is this ray part of what the observer is currently looking at?
     *
     * Colour is reserved for exactly these: light that turned inside the cone
     * AND turned towards the eye. Everything else - the same turn made a few
     * degrees the wrong way, light arriving from the rest of the sky, light
     * that crossed without ever interacting - is drawn grey. The rule is one
     * sentence long and it is the whole legend.
     */
    const involved = (p) => p.kind === 'arriving' && turnsInCone(p);

    /**
     * An event inside the cone whose light goes somewhere else.
     *
     * These are the control group, and they are the reason the cone is drawn as
     * a volume rather than a bundle of lines: the same air, the same star, the
     * same deflection, one of them lands in your eye and the other does not.
     * They are ringed rather than coloured, so they read as events you are
     * looking straight at and still cannot see.
     */
    const missedInCone = (p) => p.kind === 'missed' && turnsInCone(p);

    // How many of the arriving rays get drawn, and why that number and not
    // another. See paths.columnFraction: it is the share of the air still above
    // the observer, which is the share of the sky's brightness that is left, so
    // the rays on screen and the colour beside them fall by the same factor.
    // Count alone, never opacity - a ray that reaches you is an ordinary ray,
    // and drawing it faintly would say the light arrives weakened, which is a
    // different claim and a false one.
    const share = drawnRayShare(paths);
    const drawnArriving = (index) => isRayDrawn(index, share);

    const GREY = CONTEXT_GREY;
    // Grey, but not invisible: zoomed out, the long chord an unscattered beam
    // has to cross IS the demonstration, so it gets the strongest of the greys.
    const contextAlpha = { through: 0.30, missed: 0.16, arriving: 0.13 };
    const contextWidth = { through: 1.2, missed: 1, arriving: 1 };

    /**
     * Every arriving ray outside the cone also ends at the observer, so drawn
     * in full they make a grey starburst on top of the very convergence the
     * cone exists to show. Only every third is drawn. It is a drawing density,
     * chosen by index so it stays put as the view turns, and it changes nothing
     * the panels report.
     */
    const GREY_ARRIVING_STRIDE = 3;
    const asContext = (p, i) => !involved(p) && !missedInCone(p)
      && (p.kind !== 'arriving' || (i % GREY_ARRIVING_STRIDE === 0 && drawnArriving(i)));

    /* ---- everything outside the cone, in grey ---- */

    for (const kind of ['through', 'missed', 'arriving']) {
      ctx.save();
      ctx.strokeStyle = GREY;
      ctx.lineWidth = contextWidth[kind];
      ctx.globalAlpha = contextAlpha[kind];
      ctx.beginPath();
      for (let i = 0; i < paths.length; i++) {
        const p = paths[i];
        if (p.kind !== kind || !asContext(p, i)) continue;
        if (i === selected || i === hovered) continue;
        strokePath(p, project, phase);
      }
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    // Scattering vertices outside the cone: every one is still a photon taken
    // out of the beam, so they are drawn - just not celebrated.
    ctx.fillStyle = GREY;
    for (let i = 0; i < paths.length; i++) {
      const p = paths[i];
      if (p.scatterCount === 0 || !asContext(p, i)) continue;
      ctx.globalAlpha = 0.22;
      if (i === selected || i === hovered) continue;
      const e = project(p.events[1]);
      ctx.beginPath();
      ctx.arc(e.x, e.y, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    // Arrowheads on the paths that leave: without them a stub reads as a line
    // rather than as light departing in a direction that misses you.
    ctx.globalAlpha = 0.3;
    for (let i = 0; i < paths.length; i++) {
      const p = paths[i];
      if (p.kind !== 'missed' || !asContext(p, i)) continue;
      if (i === selected || i === hovered) continue;
      const from = project(p.points[p.points.length - 2]);
      const to = project(p.points[p.points.length - 1]);
      drawArrowHead(from.x, from.y, to.x, to.y, 4.5);
    }
    ctx.restore();

    /* ---- events inside the cone whose light goes elsewhere ---- */

    // Drawn brighter than the rest of the grey, and ringed. You are looking
    // straight at these; the air turned the light exactly where the coloured
    // rays turned it, and a few degrees of deflection sent it past your eye
    // instead of into it. Without them the cone looks like a place where light
    // simply arrives, rather than a place where most of what happens misses.
    ctx.save();
    ctx.strokeStyle = GREY;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    for (let i = 0; i < paths.length; i++) {
      if (!missedInCone(paths[i]) || i === selected || i === hovered) continue;
      strokePath(paths[i], project, phase);
    }
    ctx.stroke();

    ctx.globalAlpha = 0.55;
    ctx.fillStyle = GREY;
    for (let i = 0; i < paths.length; i++) {
      const p = paths[i];
      if (!missedInCone(p) || i === selected || i === hovered) continue;
      const from = project(p.points[p.points.length - 2]);
      const to = project(p.points[p.points.length - 1]);
      drawArrowHead(from.x, from.y, to.x, to.y, 4.5);
    }

    ctx.globalAlpha = 0.75;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.lineWidth = 1.1;
    for (let i = 0; i < paths.length; i++) {
      const p = paths[i];
      if (!missedInCone(p) || i === selected || i === hovered) continue;
      const e = project(p.events[1]);
      ctx.beginPath();
      ctx.arc(e.x, e.y, 3, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    /* ---- the rays the wall stops ---- */

    drawBlockedRays(paths, project);

    /* ---- the rays inside the cone, in their own colours ---- */

    const buckets = new Map();
    for (let i = 0; i < paths.length; i++) {
      if (!involved(paths[i]) || !drawnArriving(i)) continue;
      if (i === selected || i === hovered) continue;
      // One bucket per band, so the picture holds eight colours and no more.
      const key = paths[i].band ?? 0;
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(i);
    }

    ctx.save();
    ctx.lineWidth = 1.3;
    ctx.globalAlpha = 0.85;
    for (const [band, indices] of buckets) {
      ctx.strokeStyle = RAY_BANDS[band].css;
      ctx.beginPath();
      for (const index of indices) strokePath(paths[index], project, phase);
      ctx.stroke();
    }
    ctx.restore();

    // The last leg - the one that actually enters the eye - is redrawn heavier,
    // or the incoming stubs swamp the convergence.
    if (phase >= 1) {
      ctx.save();
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      for (const [band, indices] of buckets) {
        ctx.strokeStyle = RAY_BANDS[band].css;
        ctx.beginPath();
        for (const index of indices) {
          const pts = paths[index].points;
          const from = project(pts[pts.length - 2]), to = project(pts[pts.length - 1]);
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = '#ffffff';
    for (const indices of buckets.values()) {
      for (const index of indices) {
        const e = project(paths[index].events[1]);
        ctx.beginPath();
        ctx.arc(e.x, e.y, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    /* ---- light that never turned at all, and landed on the observer ---- */

    drawDirectBeam(paths, project, axis, half);

    /* ---- hover and selection ---- */

    for (const index of [hovered, selected]) {
      if (index < 0 || index >= paths.length) continue;
      const p = paths[index];
      const [r, g, b] = RAY_BANDS[p.band ?? 0].rgb;
      ctx.save();
      ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.lineWidth = index === selected ? 2.6 : 1.8;
      ctx.shadowColor = `rgba(${r}, ${g}, ${b}, 0.9)`;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      strokePath(p, project, 1);
      ctx.stroke();
      ctx.shadowBlur = 0;
      for (const e of p.events) {
        if (e.type !== 'scatter' && e.type !== 'absorb') continue;
        ctx.fillStyle = e.type === 'absorb' ? '#ff5a5a' : '#ffffff';
        const q = project(e);
        ctx.beginPath();
        ctx.arc(q.x, q.y, e.type === 'absorb' ? 3.5 : 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    drawPathLegend(plot);
  }

  /**
   * The star's own beam, arriving unturned.
   *
   * Point the view at the star and, before this existed, every ray in the cone
   * had scattered somewhere - as though light never arrives in a straight line.
   * The truth is the other way round: almost everything reaching an observer
   * looking at the Sun has never been scattered at all.
   *
   * The bundle is drawn in band colours when the star is inside the viewing
   * cone, obeying the rule that governs everything else on screen, and in grey
   * when it is not. It is deliberately NOT to scale, and it is the one place in
   * the picture where the number of lines is not the amount of light: the
   * beam's irradiance runs to thousands of times the whole sky's, and drawing
   * that many lines is not possible. The ratio is printed in the panel instead,
   * which is the only place it fits.
   */
  function drawDirectBeam(paths, project, axis, half) {
    const direct = [];
    for (const p of paths) if (p.kind === 'direct') direct.push(p);
    if (direct.length === 0) return;
    const inView = Math.abs(direct[0].arrivalAngleRad - axis) <= half;

    ctx.save();
    ctx.lineCap = 'round';
    for (const p of direct) {
      const from = project(p.points[0]);
      const to = project(p.points[1]);
      if (inView) {
        ctx.strokeStyle = RAY_BANDS[p.band ?? 0].css;
        ctx.globalAlpha = 0.9;
        ctx.lineWidth = 1.8;
      } else {
        ctx.strokeStyle = CONTEXT_GREY;
        ctx.globalAlpha = 0.34;
        ctx.lineWidth = 1.2;
      }
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  /**
   * Directions the shaft wall refuses.
   *
   * These are ordinary traced rays that never became scattering paths, because
   * the rock was in the way before the air was. Each is drawn from the point on
   * the wall where it stops down to the observer, so the picture shows which
   * part of the sky has been taken away and by what. Only a sample is drawn:
   * once the aperture is a couple of degrees nearly every direction is blocked,
   * and all of them at once is a solid fan that hides the few that get through.
   */
  function drawBlockedRays(paths, project) {
    const blocked = [];
    for (const p of paths) if (p.kind === 'blocked') blocked.push(p);
    if (blocked.length === 0) return;
    const stride = Math.max(1, Math.round(blocked.length / MAX_DRAWN_BLOCKED));

    ctx.save();
    for (let i = 0; i < blocked.length; i += stride) {
      const p = blocked[i];
      const hit = project(p.points[0]);
      const eye = project(p.points[1]);
      if (Math.hypot(hit.x - eye.x, hit.y - eye.y) < 3) continue;

      ctx.strokeStyle = 'rgba(255, 138, 90, 0.34)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.moveTo(eye.x, eye.y);
      ctx.lineTo(hit.x, hit.y);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = 'rgba(255, 138, 90, 0.9)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(hit.x - 3, hit.y - 3);
      ctx.lineTo(hit.x + 3, hit.y + 3);
      ctx.moveTo(hit.x + 3, hit.y - 3);
      ctx.lineTo(hit.x - 3, hit.y + 3);
      ctx.stroke();
    }
    ctx.restore();
  }

  /** The rock inside the shaft, shared with the strip so they cannot diverge. */
  function shaftWallCss() {
    if (!current.wall || !colorimetry) return '#241c16';
    const c = colorimetry.spectrumToSrgb(current.wall, data.result.exposure);
    return `rgb(${Math.max(22, c.rgb[0])}, ${Math.max(16, c.rgb[1])}, ${Math.max(12, c.rgb[2])})`;
  }

  function drawArrowHead(x1, y1, x2, y2, size) {
    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - size * Math.cos(angle - 0.42), y2 - size * Math.sin(angle - 0.42));
    ctx.lineTo(x2 - size * Math.cos(angle + 0.42), y2 - size * Math.sin(angle + 0.42));
    ctx.closePath();
    ctx.fill();
  }

  /**
   * The rule, and the palette it is written in.
   *
   * Every coloured ray is one of eight bands, picked in proportion to the
   * light's own spectrum, so the colours are countable and counting them reads
   * the spectrum off the picture. The swatch shows them as eight blocks rather
   * than a smooth ramp for exactly that reason: a ramp cannot be counted.
   */
  const LEGEND_ROWS = [
    { key: 'canvas.legendArriving', style: 'bands', width: 2.4 },
    { key: 'canvas.legendDirect', style: 'bands', width: 1.4 },
    { key: 'canvas.legendInCone', style: 'ring', width: 1 },
    { key: 'canvas.legendOffView', style: 'grey', width: 1 },
    { key: 'canvas.legendMissed', style: 'grey', width: 1 },
    { key: 'canvas.legendThrough', style: 'grey', width: 1 },
    { key: 'canvas.legendStarlight', style: 'starlight', width: 1.3 },
  ];
  const LEGEND_SWATCH_W = 34;

  /** How wide the legend box is, so other things can keep out of it. */
  function legendBoxWidth() {
    ctx.save();
    ctx.font = '10px system-ui, sans-serif';
    let width = 0;
    for (const row of LEGEND_ROWS) width = Math.max(width, ctx.measureText(i18n.t(row.key)).width);
    ctx.restore();
    return width + LEGEND_SWATCH_W + 20;
  }

  function drawPathLegend(plot) {
    const rows = LEGEND_ROWS;
    const swatchW = LEGEND_SWATCH_W;
    ctx.save();
    ctx.font = '10px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const labels = rows.map((row) => i18n.t(row.key));
    const boxW = legendBoxWidth();
    const boxH = rows.length * 15 + 8;
    const x = plot.x + 8;
    const y = plot.y + 8 + current.topInset + (current.observer.well.enabled ? 14 : 0);
    ctx.fillStyle = 'rgba(5, 7, 13, 0.66)';
    ctx.fillRect(x, y, boxW, boxH);

    const left = x + 6;
    const right = left + swatchW - 12;
    for (let i = 0; i < rows.length; i++) {
      const cy = y + 12 + i * 15;
      ctx.lineWidth = rows[i].width;
      if (rows[i].style === 'bands') {
        ctx.globalAlpha = 0.95;
        const step = (right - left) / RAY_BANDS.length;
        for (let b = 0; b < RAY_BANDS.length; b++) {
          ctx.strokeStyle = RAY_BANDS[b].css;
          ctx.beginPath();
          ctx.moveTo(left + b * step, cy);
          // A hair of overlap, so the blocks abut instead of leaving seams.
          ctx.lineTo(left + (b + 1) * step + 0.5, cy);
          ctx.stroke();
        }
      } else if (rows[i].style === 'starlight') {
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = '#f4f7ff';
        ctx.beginPath();
        ctx.moveTo(left, cy);
        ctx.lineTo(right, cy);
        ctx.stroke();
      } else if (rows[i].style === 'ring') {
        ctx.globalAlpha = 0.55;
        ctx.strokeStyle = '#8a93a6';
        ctx.beginPath();
        ctx.moveTo(left, cy);
        ctx.lineTo(right, cy);
        ctx.stroke();
        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.arc((left + right) / 2, cy, 3, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = '#8a93a6';
        ctx.beginPath();
        ctx.moveTo(left, cy);
        ctx.lineTo(right, cy);
        ctx.stroke();
      }
      ctx.globalAlpha = rows[i].style === 'bands' || rows[i].style === 'starlight' ? 0.92 : 0.55;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(labels[i], x + swatchW, cy);
    }
    ctx.restore();
  }

  // Straight in the world, straight on screen: the altitude axis is linear, so
  // a leg needs no subdivision to land on the altitudes it really passes
  // through, and a ray looks like what it is.
  function strokePath(path, project, phase) {
    const pts = path.points;
    if (pts.length < 2) return;
    const limit = phase >= 1 ? pts.length : Math.max(2, Math.ceil(pts.length * phase));
    const first = project(pts[0]);
    ctx.moveTo(first.x, first.y);
    for (let i = 1; i < limit; i++) {
      const q = project(pts[i]);
      ctx.lineTo(q.x, q.y);
    }
  }

  function drawObserver(px, py, evaluation, z) {
    const zenith = current.observer.viewZenithDeg * Math.PI / 180;
    const azimuth = current.observer.viewAzimuthDeg * Math.PI / 180;
    // In the cross-section, azimuth 0 points towards the star (to the right).
    const sign = Math.cos(azimuth) >= 0 ? 1 : -1;
    const dx = Math.sin(zenith) * sign;
    const dy = Math.cos(zenith);

    ctx.save();
    ctx.strokeStyle = evaluation.view.blocked ? '#ff6b6b' : '#ffffff';
    ctx.lineWidth = 1.8;
    ctx.setLineDash(evaluation.view.blocked ? [4, 3] : []);
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + dx * 54, py - dy * 54);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#05070d';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  /* ---------------------------------------------------------------- */
  /* Shaft view                                                        */
  /* ---------------------------------------------------------------- */

  /* ---------------------------------------------------------------- */

  /** Which panel a canvas point falls in, as an observer id, or null. */
  function panelAt(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const px = clientX - rect.left;
    const py = clientY - rect.top;
    for (const box of panelBoxes) {
      if (px >= box.x && px <= box.x + box.w && py >= box.y && py <= box.y + box.h) {
        return box.id;
      }
    }
    return null;
  }

  /**
   * Find the traced ray nearest to a canvas point.
   *
   * Only the selected panel is searched. Picking a ray out of the panel that is
   * not being controlled would open a log about rays that the readouts beside
   * it do not describe.
   */
  function pick(clientX, clientY) {
    const rays = selectedStation()?.photons;
    if (!layout || !rays) return -1;
    const rect = canvas.getBoundingClientRect();
    const px = clientX - rect.left - layout.originX;
    const py = clientY - rect.top - layout.originY;
    const project = layout.camera.project;
    let best = -1, bestDist = 12;
    for (let i = 0; i < rays.length; i++) {
      const pts = rays[i].points;
      let previous = project(pts[0]);
      for (let k = 1; k < pts.length; k++) {
        const current = project(pts[k]);
        const d = distanceToSegment(px, py, previous.x, previous.y, current.x, current.y);
        if (d < bestDist) { bestDist = d; best = i; }
        previous = current;
      }
    }
    return best;
  }

  function distanceToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lengthSq = dx * dx + dy * dy;
    const t = lengthSq > 0 ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / lengthSq)) : 0;
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  /** The panel the controls and the readouts belong to. */
  function selectedStation() {
    if (!data || !data.stations) return null;
    return data.stations.find((entry) => entry.id === data.activeId) ?? data.stations[0];
  }

  return {
    update, draw, pick, panelAt, frameFor,
    setHovered(index) { hoveredPath = index; },
    setSelected(index) { selectedPath = index; },
    getSelected() { return selectedPath; },
  };
}

/** The one grey everything outside the viewing cone is drawn in. */
const CONTEXT_GREY = '#8a93a6';

/**
 * The two observers' identity colours.
 *
 * Deliberately unlike anything the physics produces: the sky is blue, the rock
 * is brown, the star is warm white, so an identity colour must be none of
 * those or it reads as a measurement. Every place that has to say WHICH
 * observer - the panel frame, the badge, the strip, the histogram, the control
 * panel - uses these, so the answer is always the same colour.
 */
const STATION_COLOURS = { a: '#ff8fa3', b: '#b197fc' };

function stationColour(id) {
  return STATION_COLOURS[id] ?? STATION_COLOURS.a;
}

/**
 * Where an observer is, said the way a person would say it.
 *
 * "-50 m" is a coordinate, not a place. Fifty metres underground is a place,
 * and the labels that name an observer have to name somewhere the reader can
 * picture, because that is the whole of what distinguishes the two of them.
 */
function formatPlace(z, i18n) {
  if (Math.abs(z) < 0.5) return i18n.t('controls.observer.groundLevel');
  return z > 0
    ? formatAltitude(z)
    : `${formatAltitude(-z)} ${i18n.t('controls.observer.underground')}`;
}

/* Shared constants and helpers -------------------------------------- */

/**
 * The cross-section is drawn in true spherical geometry, orthographically
 * projected: the planet centre sits at the origin of world coordinates and the
 * camera is a plain translate-and-scale. Two consequences, both deliberate.
 *
 * Straight rays stay straight. An early version compressed the altitude axis by
 * a power law to give the dense lower air more room, which bent every ray on
 * screen - the wrong lesson in a picture about light travelling in straight
 * lines. Here it is the GROUND that curves, which is the truth, and at close
 * zoom that curve is a fraction of a pixel, so the picture looks flat by itself.
 *
 * And the frame can be zoomed out until the curve matters. That is the only way
 * to draw the reason a low Sun is red: its light crosses a chord hundreds of
 * kilometres long, which does not fit in a picture of the local sky.
 */

/**
 * The span used when the observer has not chosen one: three scale heights,
 * which hold 95 % of the column, and always enough to contain the observer.
 */
function autoSpanFor(atmosphere, observerAltitude, well = null) {
  // A shaft is a thing of metres under an atmosphere of kilometres, and no
  // single frame holds both. When there is a shaft to be in, the frame fits the
  // shaft; the zoom control reaches all the way back out to the atmosphere.
  if (well && well.enabled) {
    return clampSpan(Math.max(4 * well.radius_m, well.depth_m * 2.4, 20));
  }
  return clampSpan(Math.max(
    3 * atmosphere.scaleHeightRayleigh, Math.max(0, observerAltitude) * 1.35));
}

/**
 * How much of the frame is sky.
 *
 * Zoomed in, the ground belongs at the very bottom and the picture is all air.
 * Zoomed out, the planet has to be given room or its curve cannot be seen, so
 * the horizon rises towards the middle. Interpolated on the logarithm, because
 * that is how the zoom control moves.
 */
function skyFractionFor(span) {
  const lo = Math.log(6e4), hi = Math.log(2e6);
  const t = Math.max(0, Math.min(1, (Math.log(span) - lo) / (hi - lo)));
  return 0.95 + t * (0.42 - 0.95);
}

/**
 * The camera: everything the drawing needs to turn world metres into pixels,
 * and to know which piece of the world is on screen.
 */
function makeCamera(atmosphere, plot, span, belowGround = 0, observerDepth = 0) {
  const R = atmosphere.planetRadius;
  // Normally the ground belongs near the bottom of the frame. When there is a
  // shaft the horizon rises to make room for it - and if the observer is deep
  // enough, or the zoom close enough, that the horizon has to leave the top of
  // the picture altogether, then it leaves. What must never leave is the
  // observer: a zoom that puts them off the bottom edge shows the walls of a
  // shaft with nobody in it, which is what happened before this second step.
  let skyFraction = belowGround > 0
    ? Math.min(skyFractionFor(span), 1 - (belowGround * 1.25) / span)
    : skyFractionFor(span);
  if (observerDepth > 0) {
    const observerFraction = skyFraction + observerDepth / span;
    if (observerFraction > 0.88) skyFraction -= observerFraction - 0.88;
    skyFraction = Math.min(skyFraction, 0.95);
  }
  const scale = plot.h / span;
  const cx = plot.x + plot.w / 2;
  const groundY = plot.y + skyFraction * plot.h;
  return {
    R, span, scale, skyFraction, groundY, cx,
    halfWidth: (plot.w / 2) / scale,
    skyExtent: skyFraction * span,
    project: (q) => ({ x: cx + q.x * scale, y: groundY - (q.y - R) * scale }),
    /** Screen point back to the world, for hit testing. */
    unproject: (sx, sy) => ({ x: (sx - cx) / scale, y: R + (groundY - sy) / scale }),
  };
}

const FIELD_GAIN = 5.4e3;

/** A round number of metres near `metres`, for the scale bar. */
function niceRoundDistance(metres) {
  const power = Math.pow(10, Math.floor(Math.log10(Math.max(1, metres))));
  for (const step of [1, 2, 5, 10]) {
    if (metres <= step * power) return step * power;
  }
  return 10 * power;
}

function niceAltitudeTicks(topAltitude) {
  // The zoom now spans three orders of magnitude, so the ticks are generated
  // rather than chosen from a table: roughly five of them, on a 1-2-5 ladder.
  const step = niceRoundDistance(Math.max(1, topAltitude) / 4);
  const ticks = [];
  for (let v = 0; v <= topAltitude + 1e-6; v += step) ticks.push(Math.round(v));
  return ticks.slice(0, 9);
}

function formatAltitude(metres) {
  const a = Math.abs(metres);
  if (a === 0) return '0 m';
  if (a >= 1000) return `${(metres / 1000).toFixed(a >= 10000 ? 0 : 1)} km`;
  if (a >= 1) return `${metres.toFixed(0)} m`;
  return `${metres.toFixed(2)} m`;
}

function formatAngle(deg) {
  const a = Math.abs(deg);
  if (a >= 1) return `${deg.toFixed(1)}°`;
  if (a >= 0.01) return `${deg.toFixed(3)}°`;
  return `${(deg * 3600).toExponential(1)}″`;
}

/* ===== js/render/sky-strip.js ===== */
/**
 * The observer's own view of the sky, from one horizon to the other.
 *
 * Every column is one viewing direction, filled with what the TRACED RAYS
 * deliver from it - the same measurement the colour swatch on the right is
 * built from, run once per direction instead of once for the viewing cone.
 * Filling it from the integrator instead, as it used to be, let the picture and
 * the strip beneath it disagree about the same sky.
 *
 * Where the shaft wall stops a direction the column is not black. Black says
 * "nothing here"; what is there is rock, and rock has a colour - the ground's
 * own reflectance lit by the patch of sky that still reaches down the shaft. So
 * a well shows as two warm dark wings closing in on a shrinking strip of sky,
 * and the wings darken as the shaft deepens because less light gets to them.
 *
 * The side-by-side comparison used to be the exception. Two observers were
 * drawn from one set of traced rays, so neither band could be measured and both
 * fell back to the integrator - the theory, sitting under a picture that had no
 * say in it, in the one place where the whole argument is that two observers
 * under the same sky see different things. Each observer now has their own
 * trace, so each band is measured from the rays drawn directly above it and the
 * exception is gone.
 */

function createSkyStrip(canvas, { i18n, colorimetry }) {
  const ctx = canvas.getContext('2d', { alpha: false });
  let data = null;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(280, rect.width);
    const h = Math.max(56, rect.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  function update(next) { data = next; }

  function draw() {
    const { w, h } = resize();
    ctx.fillStyle = '#05070d';
    ctx.fillRect(0, 0, w, h);
    if (!data || !data.result) return;

    const stations = data.stations ?? [];
    if (stations.length === 0) return;

    // One band per observer, laid out exactly as the panels above are: one
    // full-width band for a single observer, two half-width bands side by side
    // for two, so each band sits under the picture it was measured from.
    if (stations.length === 1) {
      drawBand(stations[0], 0, 0, w, h - 16, false);
      drawScale(0, w, h);
    } else {
      const gap = 10;
      const half = (w - gap) / 2;
      drawBand(stations[0], 0, 0, half, h - 16, true);
      drawBand(stations[1], half + gap, 0, half, h - 16, true);
      drawScale(0, half, h);
      drawScale(half + gap, half, h);
    }
  }

  /**
   * Where a viewing angle lands on the strip: a plain linear axis, horizon to
   * horizon.
   *
   * It used to be non-linear. The sky dome is sampled with extra samples packed
   * inside a shaft's aperture, so that a sliver of sky a degree wide is
   * computed at all rather than falling between samples, and the strip drew one
   * equal-width column per sample. That handed a third of the strip to an
   * aperture worth two per cent of the sky, and the bottom of a fifty-metre
   * well came out looking like a bright blue window. Sampling density is a
   * numerical concern; it must not decide how wide anything looks.
   */
  function angleToX(signedAngle, x, w) {
    return x + ((Math.max(-90, Math.min(90, signedAngle)) + 90) / 180) * w;
  }

  /**
   * The colour of one direction, as the rays measured it.
   *
   * This is the colour swatch pointed that way: `measureCone` with the same
   * field of view and the same arithmetic, so turning the observer to this
   * direction makes the panel on the right read what this column already shows.
   * A direction that ends in rock is the rock; a direction that ends in sky is
   * the sky, however little of it there is.
   */
  function columnCss(measured, signedAngle, exposure) {
    const bin = measured.binOfAngle(signedAngle);
    const c = colorimetry.spectrumToSrgb(measured.spectrumAt(bin), exposure);
    // The floor belongs to the ROCK and to nothing else. It exists so a wall
    // with almost no light on it still reads as a wall rather than as a hole
    // cut out of the picture. Applying it to sky as well was wrong in exactly
    // the way this whole section is about: it warmed a nearly black sky at the
    // bottom of a deep shaft into something faintly brown, and brown has one
    // meaning here - you are facing rock. Thin sky goes to black.
    if (!measured.blocked[bin]) return c.css;
    return `rgb(${Math.max(22, c.rgb[0])}, ${Math.max(16, c.rgb[1])}, ${Math.max(12, c.rgb[2])})`;
  }

  /** The dome sample nearest a viewing angle. */
  function sampleAt(dome, signedAngle) {
    let best = dome[0], bestDelta = Infinity;
    for (const sample of dome) {
      const delta = Math.abs(sample.signedAngleDeg - signedAngle);
      if (delta < bestDelta) { bestDelta = delta; best = sample; }
    }
    return best;
  }

  function drawBand(station, x, y, w, h, labelled) {
    const evaluation = station.evaluation;
    const observer = station.observer;
    const measured = station.sky;
    const dome = evaluation.dome;
    const exposure = data.result.exposure;
    const active = station.id === data.activeId;

    // One column of pixels per viewing direction, on the true angular axis, so
    // the visible sky occupies exactly the share of the strip it occupies of
    // the sky. From the horizon away from the star, through the zenith, to the
    // horizon beneath it.
    const columns = Math.max(1, Math.round(w));
    for (let i = 0; i < columns; i++) {
      const angle = -90 + (180 * (i + 0.5)) / columns;
      ctx.fillStyle = measured
        ? columnCss(measured, angle, exposure)
        : sampleAt(dome, angle).color.css;
      ctx.fillRect(x + (i * w) / columns, y, w / columns + 1, h);
    }

    // A shaft's aperture can be far narrower than one column, so mark it
    // rather than let it disappear - but mark it, do not widen it.
    const half = evaluation.metrics.apertureHalfAngleDeg;
    if (half < 89.9) {
      // Bracket the aperture from outside rather than draw on top of it. A
      // hundred-and-fifty-metre shaft leaves half a degree of sky, which is one
      // pixel of strip, and two marker lines drawn at its edges cover the very
      // thing they point at - so the sky it does have reads as the marker's own
      // colour instead of its own.
      const gap = 2;
      const x1 = angleToX(-half, x, w) - gap;
      const x2 = angleToX(half, x, w) + gap;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,200,120,0.9)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Math.max(x1, x + 0.5), y);
      ctx.lineTo(Math.max(x1, x + 0.5), y + h);
      ctx.moveTo(Math.min(x2, x + w - 0.5), y);
      ctx.lineTo(Math.min(x2, x + w - 0.5), y + h);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,200,120,0.95)';
      ctx.font = '9px system-ui, sans-serif';
      ctx.textAlign = 'center';
      const text = (i18n.getLanguage() === 'cs' ? 'otvor ±' : 'aperture ±')
        + (half >= 1 ? half.toFixed(1) + '°' : half.toExponential(1) + '°');
      ctx.fillText(text, Math.min(x + w - 34, Math.max(x + 34, (x1 + x2) / 2)), y + h - 4);
      ctx.restore();
    }

    // Where the star sits in this view - this simulation's star, which need
    // not be the other one's, nor at the other one's elevation.
    const elevation = station.sim.star.elevationDeg;
    if (elevation >= 0) {
      const sx = angleToX(90 - elevation, x, w);
      const blocked = evaluation.beam.visible === false;
      ctx.save();
      ctx.globalAlpha = blocked ? 0.25 : 1;
      ctx.fillStyle = evaluation.colors.star.css;
      ctx.beginPath();
      ctx.arc(sx, y + h * 0.42, Math.max(4, h * 0.12), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Where the observer is currently looking.
    const viewSigned = observer.viewZenithDeg *
      (Math.cos(observer.viewAzimuthDeg * Math.PI / 180) >= 0 ? 1 : -1);
    const vx = angleToX(viewSigned, x, w);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(vx, y);
    ctx.lineTo(vx, y + h);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.moveTo(vx, y + h);
    ctx.lineTo(vx - 5, y + h - 7);
    ctx.lineTo(vx + 5, y + h - 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Which observer this band belongs to, in that observer's own colour, and
    // a frame round the selected one - the same marking the panel above it
    // carries, so the eye can join the two without being told.
    if (labelled) {
      const colour = stationColour(station.id);
      const label = i18n.t(station.id === 'a' ? 'compare.observerA' : 'compare.observerB');
      ctx.save();
      ctx.font = '600 11px system-ui, sans-serif';
      ctx.strokeStyle = 'rgba(0,0,0,0.65)';
      ctx.lineWidth = 3;
      ctx.strokeText(label, x + 8, y + 15);
      ctx.fillStyle = colour;
      ctx.fillText(label, x + 8, y + 15);
      if (active) {
        ctx.strokeStyle = colour;
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
      }
      ctx.restore();
    }
  }

  function drawScale(x, w, h) {
    ctx.save();
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.textBaseline = 'bottom';
    ctx.textAlign = 'left';
    ctx.fillText(i18n.t('controls.observer.horizon'), x + 4, h - 2);
    ctx.textAlign = 'center';
    ctx.fillText(i18n.t('controls.observer.zenith'), x + w / 2, h - 2);
    ctx.textAlign = 'right';
    ctx.fillText(i18n.t('controls.observer.horizon'), x + w - 4, h - 2);
    ctx.restore();
  }

  return { update, draw };
}

/* ===== js/render/spectrum-chart.js ===== */
/**
 * The spectrum plot: four curves on one pair of axes.
 *
 *   source     what the star emitted, above the atmosphere
 *   direct     what is left of that beam after the air
 *   scattered  the light arriving from the sky instead
 *   observed   what the eye actually collects in this direction
 *
 * Read together they tell the whole story: the dip the direct beam loses at
 * short wavelengths is the hump the scattered curve gains.
 */

const SERIES = [
  { key: 'source', color: '#e8e8ea', dash: [5, 4], width: 1.6 },
  { key: 'direct', color: '#ffb454', dash: [], width: 2 },
  { key: 'scattered', color: '#5aa9ff', dash: [], width: 2 },
  { key: 'observed', color: '#7ef0c0', dash: [2, 3], width: 1.6 },
];
