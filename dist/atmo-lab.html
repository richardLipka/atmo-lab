 atmosféru, takže rozptylový integrál sbírá světlo pouze z osvětlených vrstev výše. To světlo prošlo ozonovou vrstvou napříč a ozon pohlcuje oranžovou a žlutou (Chappuisův pás): právě to, víc než samotný Rayleighův rozptyl, drží soumrakový zenit modrý (Hulburt 1953). Skutečný soumrak je navíc jasnější, než dokáže jediný rozptyl, protože se světlo cestou několikrát rozptýlí, a fialový nádech některých večerů dává červené sluneční světlo rozptýlené dopředu na oparu ve stratosféře."},"highAltitude":{"see":"Obloha nad tebou výrazně ztmavla a prohloubila barvu. Hvězda se nezměnila a atmosféru jsi neopustil, jenom je nad tebou mnohem méně vzduchu.","why":"Sloupec nad tebou klesá exponenciálně, C(z) = C(0)·exp(−z/H). Ve výšce {z} při H = {scaleHeight} zbývá nad tebou jen {columnPercent} vzduchu, takže je úměrně méně látky, která by k tvému oku rozptýlila světlo."},"space":{"see":"Obloha je úplně černá, přestože hvězda svítí stejně jasně jako dřív a proti tmě má ostrý okraj. Světla kolem tebe prochází spousta, jen tu není nic, na čem by se rozptýlilo směrem k tvému oku.","why":"Rozptylový integrál se zhroutil na nulu, protože ρ → 0. Jas oblohy potřebuje prostředí, ne zdroj. Proto kosmonauti vidí i za plného dne černou oblohu a totéž platí na bezvzduchém Měsíci."},"airless":{"see":"Je jasný den, povrch je ostře osvětlený, a přesto je obloha přímo nad hlavou černá. Nic světlo neblokuje, jen tu není vzduch, který by ho rozptýlil.","why":"Při ρ = 0 zmizí každý člen rozptylového integrálu, zatímco přímá propustnost zůstává T = 1. Černá obloha dokazuje nepřítomnost rozptylujícího prostředí, nikdy ne nepřítomnost světla."},"thinAir":{"see":"Obloha je skoro černá, jen s náznakem tmavé modři, a přesto je den a povrch je jasně osvětlený. Vzduch tu je, ale velmi řídký.","why":"Rayleighův rozptyl funguje stejně jako na Zemi a modrou pořád upřednostňuje podle 1/λ⁴. Optická tloušťka je ale jen {tau550}, takže se rozptýlí jen několik promile procházejícího světla. Barva zůstává modrá, ubývá jen jas."},"wellShallow":{"see":"Sestoupil jsi do šachty. Kus oblohy v ústí je přesně tak jasný a přesně tak modrý jako venku, jenže je z něj malý kotouč místo celé oblohy a všude kolem ztmavlo.","why":"Vzduch nad tebou se vůbec nezměnil: C_atm je stále C_atm(0). Změnila se geometrie. Paprsek vycházející pod zenitovým úhlem θ unikne jen tehdy, když tg(θ) ≤ R/d. Tady je ta mez {aperture}, takže z celé polokoule zbývá {solidAngle} oblohy."},"wellDeep":{"see":"Hluboko v šachtě je téměř tma, a přece je útržek oblohy vysoko nahoře stejně modrý jako na povrchu. Tmu tu nezpůsobuje vzduch, ale to, že oblohu vidíš jen malým otvorem.","why":"Zář v nezakrytém směru se nezměnila, ale osvětlenost sleduje viditelný prostorový úhel: E/E_volné = sin²(θ_max) = {ratio}. Porovnej to se stoupáním: ve výšce {z} by byla tmavší sama obloha, protože sloupec vzduchu se opravdu zmenšil."},"dusty":{"see":"Obloha je bledě okrová místo modré a světlo je měkké a rozptýlené. Rozptyl tu obstarávají větší částice a ty zacházejí se všemi barvami skoro stejně.","why":"Aerosoly rozptylují jen se slabou závislostí na vlnové délce (přibližně 1/λ⁰ až 1/λ¹) a s výrazně dopředu vytaženou Henyeyovou-Greensteinovou fázovou funkcí s g = {g}. Tam, kde prach navíc pohlcuje modrou víc než červenou, jako na Marsu, obloha zteplá."},"denseAtmosphere":{"see":"Světlo je tady dole slabé a silně zbarvené. K povrchu se z původního spektra dostane jen málo.","why":"Optická tloušťka je hluboko nad jedničkou, takže exp(−τ) zcela pohltilo krátké vlnové délky. Pozor: model s jednonásobným rozptylem tady jas podhodnocuje, ve skutečnosti se fotony před dopadem mnohokrát rozptýlí."},"coldStar":{"see":"Hvězda je oranžová a obloha nad ní béžová až kalně šedomodrá. Je modřejší než hvězda, ale ne tak modrá jako pod Sluncem.","why":"Rayleighův rozptyl stále upřednostňuje krátké vlnové délky poměrem 1/λ⁴, jenže hvězda krátkovlnného světla vyzařuje málo, takže není z čeho brát. Barva oblohy je součinem rozptylového zákona a spektra zdroje, ne rozptylového zákona samotného."},"hotStar":{"see":"Hvězda je modrobílá a obloha sytě tmavě modrá, znatelně výrazněji než pod hvězdou slunečního typu.","why":"Horké černé těleso vyzařuje mnohem více krátkovlnného světla a zákon 1/λ⁴ tento přebytek ještě zesílí. Spektrum zdroje a rozptylový zákon se násobí."}}},"experiment":{"step":"Krok {n} z {total}","next":"Další krok","previous":"Zpět","finish":"Dokončit","exit":"Opustit experiment","restart":"Začít znovu","apply":"Ukaž mi to","question":"Zamysli se","observe":"Čeho si všímat","goal":"Cíl","changed":"Změněno","on":"zapnuto","off":"vypnuto","auto":"automaticky","sources":"Zdroje"},"units":{"km":"km","m":"m","nm":"nm","kelvin":"K","degree":"°","steradian":"sr","kgPerM2":"kg/m²","percent":"%","times":"×","relative":"rel."},"compare":{"controls":"Ovládání patří","controlsHelp":"Kterou simulaci řídí levý panel. Ta druhá zůstává přesně taková, jaká je. Přepnout lze i kliknutím do jejího obrázku.","enable":"Porovnat dvě simulace","enableHelp":"Přidá druhou simulaci se vším všudy: vlastní hvězdou, vlastní atmosférou, vlastním pozorovatelem, vlastními paprsky a vlastním pásem oblohy pod obrázkem.","note":"{observer} — hvězda, atmosféra i pozorovatel níže patří jí, stejně jako čísla v pravém panelu.","observerA":"Simulace A","observerB":"Simulace B","readoutFor":"Měřeno pro {observer} · {where}","selectHint":"klikni pro výběr","selected":"vybraná — ovládá ji levý panel","sharedRays":"Tato část platí pro obě simulace. Určuje, jak se kreslí, ne co se počítá; dvě různé expozice by se nedaly porovnat okem.","syncAtoB":"A → B","syncAtoBHelp":"Zkopíruje celé nastavení A do B: hvězdu, atmosféru i pozorovatele. Obě simulace pak stojí na stejném základě a stačí změnit jedinou věc.","syncBtoA":"A ← B","syncBtoAHelp":"Zkopíruje celé nastavení B do A: hvězdu, atmosféru i pozorovatele.","title":"Porovnání dvou simulací"},"footer":{"model":"Model s jednonásobným rozptylem","modelNote":"Světlo se sleduje od hvězdy k jedné rozptylové události a odtud do oka. Vícenásobný rozptyl ani lom světla nejsou zahrnuty.","sourceData":"Všechna fyzikální data jsou v editovatelných souborech JSON ve složce /config."},"histogram":{"title":"Světlo, které nakreslené paprsky přinášejí","help":"Spektrum změřené z paprsků nahoře, ne spočítané z teorie. Plné sloupce: světlo dopadající k pozorovateli – barevně ze zorného kužele, šedě ze zbytku oblohy. Čárkovaná obrysová čára: přímý nerozptýlený svazek, škálovaný na vlastní vrchol, protože je tisíckrát jasnější. Měřítko drží nejjasnější dosud viděnou oblohu, takže při stoupání sloupce klesají.","sky":"obloha","direct":"přímý svazek"}},"localization/en.json":{"meta":{"code":"en","name":"English","nativeName":"English"},"app":{"title":"Atmospheric Light Laboratory","subtitle":"Why the sky is blue, why sunsets are red, and why a well is dark","loading":"Loading physics engine...","error":"Could not start the simulation"},"header":{"language":"Language","level":"Level","levelBasic":"Basic","levelAdvanced":"Advanced","experiment":"Experiment","experimentNone":"Free exploration","viewBeam":"Single Beam","viewScattering":"Light Scattering","reset":"Reset","resetTitle":"Return every control to its starting value"},"controls":{"star":{"title":"Light source (star)","preset":"Star","temperature":"Surface temperature","temperatureHelp":"Sets the emitted spectrum through Planck's law. Hotter stars emit relatively more short-wavelength light.","elevation":"Elevation above horizon","elevationHelp":"How high the star stands. Lowering it lengthens the path light takes through the air.","belowHorizon":"below horizon","realisticInsolation":"Realistic distance from star","realisticInsolationHelp":"Scales the incoming light by how far this world orbits from its star, so planets can be compared honestly.","peakWavelength":"Peak wavelength","presetHelp":"Chooses a star and sets its surface temperature. You can then fine-tune the temperature with the slider below."},"atmosphere":{"title":"Atmosphere","preset":"World","density":"Air density","densityHelp":"Multiplies the amount of all the air: gas, aerosol and ozone. 1 × is the world’s real value, 0 × is vacuum.","scaleHeight":"Scale height H","scaleHeightHelp":"The height over which density falls by a factor of e. A larger H means a deeper, more gradual atmosphere.","aerosol":"Aerosol amount","aerosolHelp":"Multiplies the amount of dust and droplets of the chosen kind. These particles scatter every colour almost equally and mostly forwards. 0 × means only the gas molecules scatter.","aerosolType":"Aerosol type","aerosolNative":"As the chosen world has it","aerosolTypeHelp":"Replaces the particles in the air with another kind (smog, desert dust, volcanic ash), keeping the same gas. The values follow aerosol types from the OPAC database.","exponent":"Wavelength exponent n","exponentHelp":"Scattering on molecules goes as 1/λⁿ. n = 4 is real air. At n = 0 the molecules scatter every colour equally and the sky loses its colour.","surfacePressure":"Surface pressure","composition":"Composition","presetHelp":"Chooses a planet or moon with its atmosphere. Resets density, aerosol and the exponent to that world’s values."},"observer":{"title":"Observer","position":"Vertical position z","positionHelp":"Above zero you climb through the atmosphere. Below zero you descend a shaft while the air above you stays exactly the same.","underground":"underground","altitude":"altitude","groundLevel":"ground level","viewDirection":"Viewing direction","viewDirectionHelp":"Measured from straight up. 0 degrees is the zenith, 90 degrees is the horizon.","zenith":"zenith","horizon":"horizon","well":"Well shaft","wellEnabled":"Shaft under the observer","wellRadius":"Shaft radius","wellDepth":"Shaft depth","wellDepthHelp":"How deep the shaft is. The vertical position slider then goes down to the bottom at most.","countShaftAir":"Count air inside the shaft","countShaftAirHelp":"Off: the shaft is empty, and descending changes only how much sky you can see. On: the shaft fills with air whose gas grows denser with depth while its dust keeps the surface density; the light of the sky has to cross it.","zoom":"Zoom (frame height)","zoomHelp":"How much of the world the cross-section shows. Zoom out at a low Sun to see the chord its light has to cross - that length is why it is red. The mouse wheel works too.","aboveGround":"above ground","wellEnabledHelp":"Digs a vertical shaft the observer can descend. From the bottom you see only the part of the sky the walls do not hide.","wellRadiusHelp":"The radius of the shaft opening. Together with the observer’s depth it sets how wide a cone of sky is visible from the bottom: its half-angle is arctan(radius / depth)."},"rays":{"title":"Rays and display","count":"Number of rays","showScattering":"Draw the rays","showScatteringHelp":"Off: the cross-section shows only the glow of the air and nothing is measured from rays; the values from theory remain.","animate":"Animate the rays","brightness":"Brightness boost (display only)","brightnessHelp":"Multiplies how brightly the colours are shown, for example for dark Titan. It changes neither the calculation nor the hue.","quality":"Precision of the theory","qualityPreview":"Fast","qualityNormal":"Normal","qualityHigh":"Precise","physicalMix":"Draw in true proportions","physicalMixHelp":"Draw the families in the proportions the physics gives instead of the legible ones. Only about a sixth of the light crossing Earth’s air is scattered at all, so the picture fills with the unscattered beams that really do dominate it and the sky fan thins to almost nothing. Nothing measured changes — only what is drawn.","countHelp":"How many light paths are traced in the cross-section. The colour in the “What you see” box is measured from them: more rays give a more precise measurement but take longer.","animateHelp":"The rays are drawn progressively from the star to the observer. This changes nothing in the calculation.","qualityHelp":"How finely the theoretical values are computed (the table, the Theory tab, the glow of the air in the cross-section). The rays do not depend on it."}},"canvas":{"absorbed":"absorbed","altitude":"Altitude","altitudeAxis":"Altitude","angle":"Deflection","blocked":"Blocked by shaft wall","clickRay":"Click any path to trace it step by step","coneExaggerated":"cone widened to be drawable","downloadPng":"Save this image as a PNG, exactly as it is drawn now.","drawnRatio":"drawn as","energy":"Remaining energy","escaped":"escaped to space","event":"Event","ground":"Surface","legendArriving":"reaches you from where you are looking","legendDirect":"straight from the star, not to scale","legendInCone":"turns in view, but goes elsewhere","legendMissed":"scattered away, never reaches you","legendOffView":"reaches you from elsewhere in the sky","legendThrough":"crosses unscattered, reaches the ground","missedObserver":"leaves in another direction","observed":"arrived at the observer","observer":"Observer","rayLog":"Photon history","rayLogClose":"Close","rayLogEmpty":"No ray selected. Click any ray in the cross-section.","reachedGround":"reached the ground","scattered":"scattered","shaftAbsorbed":"stopped by the rock","shaftPatch":"the only sky left","shaftReaches":"reaches the observer","skyStrip":"What the observer sees","skyStripHelp":"The sky from horizon to horizon through the observer's own eyes. Black wedges are directions stopped by the shaft wall.","space":"Space","star":"to the star","title":"Cross-section","trueRatio":"true depth : radius","verticalExaggerated":"Vertical scale is compressed so that both the shaft and the whole atmosphere fit on one picture.","viewCone":"your field of view","wavelength":"Wavelength","wellWall":"Shaft wall","legendStarlight":"starlight from overhead, one ray each","starPatchTitle":"Light from the 1′ of sky around the star overhead","starPatchSky":"glow of the sky behind the star","starPatchStar":"the star (like Vega)"},"spectrum":{"title":"Spectrum","axisX":"Wavelength (nm)","axisY":"Relative spectral intensity","source":"Source (above the atmosphere)","direct":"Direct beam (after the air)","scatteredSky":"Scattered light (the sky)","observed":"Observed total","normalize":"Normalise curves","empty":"No light reaches the observer from this direction."},"color":{"title":"Perceived colour","sky":"Sky in view direction","star":"Star as seen","computed":"Computed from the spectrum through CIE 1931 XYZ, never chosen by hand.","chromaticity":"Chromaticity diagram","blockedByWall":"The shaft wall blocks this direction, so no light arrives at all.","darkness":"Too little light to show a colour.","measured":"What you see, measured from the rays","perceived":"How bright it looks here","skyShare":"of your view:","tabMeasured":"From the simulation","tabTheory":"Theory, for comparison","raysArriving":"{drawn} rays across {cast} directions in view","noneArrive":"Not one ray comes down any of the {cast} directions in view.","noRays":"No rays were traced in this direction.","measuredNote":"Built only from the rays on screen, and it is the same calculation the strip under the picture uses - point the observer anywhere and the strip already shows this colour at that direction. The mix of the eight colours is the hue; how many of them there are, against how much sky the field of view still holds, is the brightness. Climbing leaves fewer rays because there is less air overhead to scatter; a shaft leaves less sky because the rock takes the directions. Too little light reads as dark. Brown means something else entirely: that you are facing the rock.","agreement":"The integrator differs by dxy = {dxy}; brightness ratio {ratio} from {rays} rays.","belowOneRay":"Less light than one ray stands for, across {cast} directions in view.","starInCone":"The star is in your field of view: its disc is about {ratio} times brighter than the sky around it, so the bundle on the picture is not to scale and cannot be.","skyFills":"sky fills {share} of your view","overheadStarShaft":"The shaft has hidden {lost} of your view of the sky, but the patch of sky behind the star is as bright as up top, so it has changed nothing in this ratio.","overheadStarOut":"A star straight overhead, as bright as Vega, is outside your field of view. Look straight up.","overheadStarPercent":"A star straight overhead, as bright as Vega, has only {pct} of the brightness of the patch of sky around it (1′ across, the smallest detail the eye resolves).","overheadStarTimes":"A star straight overhead, as bright as Vega, is {n} times brighter than the patch of sky around it (1′ across, the smallest detail the eye resolves).","overheadStarBlack":"A star straight overhead, as bright as Vega: the patch of sky around it is black.","starVisible":"The star is brighter than the sky behind it, so the sky will not hide it.","starBorderline":"It is at the edge of visibility: only an experienced observer who knows where to look will find it.","starLost":"The sky behind it is far brighter, so the star is lost in it."},"data":{"title":"Physical quantities","airColumn":"Air column above observer","airColumnMass":"Mass column","columnFraction":"Fraction of surface column","opticalDepth":"Optical depth tau","opticalDepthAt":"τ at {lambda} nm","transmission":"Transmission T","airMass":"Air mass along beam","pathLength":"Path length in view direction","apertureAngle":"Shaft aperture half-angle","apertureSolidAngle":"Visible solid angle","skyFraction":"Fraction of sky visible","illuminance":"Illuminance at observer","illuminanceOpen":"Illuminance with no shaft","illuminanceRatio":"Light remaining","skyLuminance":"Sky radiance in view direction","scaleHeight":"Scale height","peakWavelength":"Emission peak","scatteringAngle":"Scattering angle","hemisphere":"hemisphere","advancedOnly":"Switch to Advanced level to see the full readout.","beamTransmissionAt":"Direct-beam transmission at {lambda} nm"},"explain":{"titleSee":"What do I see?","titleWhy":"Which physics governs this?","states":{"daySky":{"see":"The sky glows blue in every direction away from the star, while the star itself still looks close to white. Nothing here is painted blue: you are looking at sunlight that has been knocked sideways out of the beam by air molecules.","why":"Air molecules scatter light more strongly the shorter its wavelength, roughly as 1/λ⁴: about {ratio} times more strongly at 450 nm than at 650 nm. So the light reaching your eye from the sky is mostly blue. The direct beam keeps almost all of its red, which is why the Sun looks warm white."},"greySky":{"see":"The sky is greyish white, not blue, although roughly as much light comes from it.","why":"The exponent n is {exponent}, so the molecules scatter every wavelength almost equally: the ratio of scattering at 450 nm to that at 650 nm is only {ratio}. The scattered light then has the same mix of colours as sunlight, so it is white. What makes the sky blue is only that short wavelengths are scattered more strongly."},"sunset":{"see":"The star has dropped low, turned orange to red, and dimmed sharply. The colour change is not in the star but in the path its light takes through the air: {airmass} times longer than straight up.","why":"The share of light that gets through the air is T = e^(−τ), where the optical depth τ grows with the amount of air on the way. Along this path τ = {tau450} at 450 nm but only {tau650} at 650 nm, so blue is filtered out almost completely while red gets through. What you see is the leftover of the beam, not new red light."},"greySunset":{"see":"The star has dropped low and dimmed sharply, but it has not turned red. Its light crosses {airmass} times more air than straight up, but the air now takes away every colour almost equally.","why":"Along the path τ at 450 nm ({tau450}) is almost the same as at 650 nm ({tau650}), so by T = exp(−τ) roughly the same share of each colour gets through. A long path alone does not colour a sunset; that needs air that weakens blue more than red."},"twilight":{"see":"The star is below the horizon. Direct light no longer reaches you, yet the sky is not black: it is lit only by air high above you that is still in sunlight.","why":"The shadow of the planet has swallowed the lower atmosphere, so the scattering integral collects light only from the illuminated layers higher up. That light has crossed the ozone layer edgeways, and ozone absorbs orange and yellow (the Chappuis band): this, more than Rayleigh scattering alone, is what keeps the twilight zenith blue (Hulburt 1953). Real twilight is also brighter than a single scattering can make it, because light is scattered several times on the way, and the purple glow of some evenings is red sunlight scattered forward by haze in the stratosphere."},"highAltitude":{"see":"The sky above you has gone much darker and deeper in colour. The star has not changed and you have not left the atmosphere, but far less air remains overhead.","why":"The column above you falls exponentially, C(z) = C(0) exp(−z/H). At {z} with H = {scaleHeight} only {columnPercent} of the air is left above you, so there is proportionally less material to scatter light towards your eye."},"space":{"see":"The sky is completely black although the star shines as brightly as before and has a sharp edge against the dark. Plenty of light is passing you; there is simply nothing here to scatter it towards your eye.","why":"The scattering integral has collapsed to zero because ρ → 0. Brightness of the sky needs a medium, not a source. This is why astronauts in daylight see a black sky, and why the same is true on the airless Moon."},"airless":{"see":"It is full daylight, the ground is brightly lit, and yet the sky directly overhead is black. Nothing is blocking the light - there is simply no air to scatter it.","why":"With ρ = 0 every term in the scattering integral vanishes, while the direct transmission stays T = 1. A black sky proves the absence of a scattering medium, never the absence of light."},"thinAir":{"see":"The sky is almost black with a hint of deep blue, and yet it is daytime and the ground is brightly lit. There is air here, but it is very thin.","why":"Rayleigh scattering works just as it does on Earth and still favours blue by 1/λ⁴. But the optical depth is only {tau550}, so only a few thousandths of the passing light are scattered. The colour stays blue; only the brightness goes."},"wellShallow":{"see":"You have dropped into the shaft. The patch of sky through the mouth is exactly as bright and exactly as blue as it was outside - but it is now a small disc instead of the whole sky, and everything around you has darkened.","why":"The air above you has not changed at all: C_atm is still C_atm(0). What changed is geometry. A ray leaving at zenith angle θ escapes only while tan(θ) ≤ R/d. Here that limit is {aperture}, leaving {solidAngle} of sky out of a full hemisphere."},"wellDeep":{"see":"Deep in the shaft it is nearly dark, yet the scrap of sky far above is as blue as it is at the surface. The darkness is not caused by the air but by seeing the sky only through a small opening.","why":"Radiance in the open direction is unchanged, but the illuminance follows the visible solid angle: E/E_open = sin²(θ_max) = {ratio}. Compare this with climbing: at {z} up, the sky itself would be dimmer because the air column really did shrink."},"dusty":{"see":"The sky is pale ochre rather than blue, and the light is soft and diffuse. Larger particles are doing the scattering here, and they treat every colour almost alike.","why":"Aerosols scatter with only a weak wavelength dependence (roughly 1/λ⁰ to 1/λ¹) and a strongly forward-peaked Henyey-Greenstein lobe with g = {g}. Where the dust also absorbs blue more than red, as on Mars, the sky turns warm."},"denseAtmosphere":{"see":"The light down here is dim and heavily tinted. Very little of the original spectrum survives the journey to the surface.","why":"The optical depth is far above one, so exp(−τ) has extinguished the short wavelengths entirely. Note that a single-scattering model under-predicts the true brightness here: in reality photons scatter many times before arriving."},"coldStar":{"see":"The star is orange and the sky above it is beige to a dull grey-blue. It is bluer than the star, but not as blue as under the Sun.","why":"Rayleigh scattering still prefers short wavelengths by 1/λ⁴, but the star emits little short-wavelength light for it to work on. The sky colour is the product of the scattering law and the source spectrum, not the scattering law alone."},"hotStar":{"see":"The star is blue-white and the sky is an intense deep blue, noticeably stronger than under a Sun-like star.","why":"A hot black body emits far more short-wavelength light, and the 1/λ⁴ law then amplifies that excess. Source spectrum and scattering law multiply together."}}},"experiment":{"step":"Step {n} of {total}","next":"Next step","previous":"Back","finish":"Finish","exit":"Leave experiment","restart":"Start again","apply":"Show me this","question":"Think about it","observe":"What to watch","goal":"Goal","changed":"Changed","on":"on","off":"off","auto":"automatic","sources":"Sources"},"units":{"km":"km","m":"m","nm":"nm","kelvin":"K","degree":"deg","steradian":"sr","kgPerM2":"kg/m2","percent":"%","times":"x","relative":"rel."},"compare":{"controls":"Controls belong to","controlsHelp":"Which simulation the left-hand panel drives. The other stays exactly as it is. Clicking a panel selects it too.","enable":"Compare two simulations","enableHelp":"Adds a second simulation, entire: its own star, its own atmosphere, its own observer, its own rays and its own strip of sky beneath the picture.","note":"{observer} — the star, the air and the observer below are its own, and so are the numbers on the right.","observerA":"Simulation A","observerB":"Simulation B","readoutFor":"Measured for {observer} · {where}","selectHint":"click to select","selected":"selected - the controls drive this one","sharedRays":"This section drives both simulations. It sets how they are drawn rather than what is computed; two panels at two exposures could not be compared by eye.","syncAtoB":"A → B","syncAtoBHelp":"Copies the whole of A onto B: star, atmosphere and observer. Both panels then stand on the same footing, so you can change exactly one thing.","syncBtoA":"A ← B","syncBtoAHelp":"Copies the whole of B onto A: star, atmosphere and observer.","title":"Two simulations"},"footer":{"model":"Single-scattering model","modelNote":"Light is followed from the star to one scattering event and then to the eye. Multiple scattering and refraction are not modelled.","sourceData":"All physical data live in editable JSON files under /config."},"histogram":{"title":"Light the drawn rays deliver","help":"The spectrum measured from the rays above, not computed from theory. Filled bars: light arriving at the observer, coloured from the viewing cone and grey from the rest of the sky. Dashed outline: the unscattered direct beam, scaled to its own peak because it is thousands of times brighter. The scale is held at the brightest sky seen so far, so climbing makes the bars fall.","sky":"sky","direct":"direct beam"}},"color/cie-1931-2deg.json":{"id":"cie-1931-2deg","description":"CIE 1931 2-degree standard observer colour matching functions, 380-750 nm at 10 nm resolution.","reference":"CIE 1931 XYZ colour matching functions (2 deg observer), tabulated at 10 nm.","wavelengthStart_nm":380,"wavelengthStep_nm":10,"count":38,"xBar":[0.001368,0.004243,0.01431,0.04351,0.13438,0.2839,0.34828,0.3362,0.2908,0.19536,0.09564,0.03201,0.0049,0.0093,0.06327,0.1655,0.2904,0.43345,0.5945,0.7621,0.9163,1.0263,1.0622,1.0026,0.85445,0.6424,0.4479,0.2835,0.1649,0.0874,0.04677,0.0227,0.011359,0.00579,0.002899,0.00144,0.00069,0.000332],"yBar":[0.000039,0.00012,0.000396,0.00121,0.004,0.0116,0.023,0.038,0.06,0.09098,0.13902,0.20802,0.323,0.503,0.71,0.862,0.954,0.99495,0.995,0.952,0.87,0.757,0.631 <body>

<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-spinner"></div>
    <p id="boot-message">Spouštím fyzikální jádro…</p>
  </div>
</div>

<div class="app" id="app" hidden>

  <header class="app-header">
    <div class="brand">
      <h1 data-i18n="app.title">Laboratoř atmosférického světla</h1>
      <p data-i18n="app.subtitle"></p>
    </div>

    <div class="header-controls">
      <div class="control-group">
        <div class="segmented segmented-views" id="view-toggle" role="tablist">
          <button type="button" class="is-active" data-view="beam" id="tab-btn-beam" data-i18n="header.viewBeam"></button>
          <button type="button" data-view="scattering" id="tab-btn-scattering" data-i18n="header.viewScattering"></button>
        </div>
      </div>

      <div class="control-group">
        <span class="group-label" data-i18n="header.language"></span>
        <div class="segmented" id="lang-toggle" role="group">
          <button type="button" data-lang="cs">CZ</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>

      <div class="control-group">
        <span class="group-label" data-i18n="header.level"></span>
        <div class="segmented" id="level-toggle" role="group">
          <button type="button" data-level="basic" data-i18n="header.levelBasic"></button>
          <button type="button" data-level="advanced" data-i18n="header.levelAdvanced"></button>
        </div>
      </div>

      <div class="control-group">
        <label class="group-label" for="experiment-select" data-i18n="header.experiment"></label>
        <select id="experiment-select"></select>
      </div>

      <button type="button" id="reset-button" class="ghost-button"
              data-i18n="header.reset" data-i18n-title="header.resetTitle"></button>
    </div>
  </header>

  <main class="layout">

    <aside class="panel panel-left">
      <div class="panel-scroll" id="beam-controls-root"></div>
      <div class="panel-scroll" id="controls-root" hidden></div>
    </aside>

    <section class="panel panel-center">
      <div id="beam-center-wrap" class="beam-center-wrap">
        <div class="canvas-wrap beam-canvas-wrap">
          <canvas id="beam-canvas"></canvas>
        </div>
      </div>

      <div id="scattering-center-wrap" class="scattering-center-wrap" hidden>
        <!-- Each button sits over the panel it copies FROM, and its arrow points at
             where that copy is going - which is the panel next to it. Both were
             centred together in the middle before, where "B to A" had to be read
             rather than seen. -->
        <div class="compare-bar" id="compare-bar" hidden>
          <button type="button" id="sync-a-to-b" class="sync-button"
                  data-i18n="compare.syncAtoB" data-i18n-title="compare.syncAtoBHelp"></button>
          <button type="button" id="sync-b-to-a" class="sync-button"
                  data-i18n="compare.syncBtoA" data-i18n-title="compare.syncBtoAHelp"></button>
        </div>

        <div class="canvas-wrap">
          <canvas id="scene-canvas"></canvas>
          <button type="button" class="png-button" data-download="scene-canvas"
                  data-file="cross-section" data-i18n-title="canvas.downloadPng">PNG</button>
          <p class="canvas-hint" data-i18n="canvas.clickRay"></p>
        </div>

        <div class="hist-wrap">
          <div class="strip-header">
            <span data-i18n="histogram.title"></span>
            <span class="strip-help" data-i18n-title="histogram.help">?</span>
          </div>
          <div class="canvas-frame">
            <canvas id="histogram-canvas"></canvas>
            <button type="button" class="png-button" data-download="histogram-canvas"
                    data-file="histogram" data-i18n-title="canvas.downloadPng">PNG</button>
          </div>
        </div>

        <div class="sky-wrap">
          <div class="strip-header">
            <span data-i18n="canvas.skyStrip"></span>
            <span class="strip-help" data-i18n-title="canvas.skyStripHelp">?</span>
          </div>
          <div class="canvas-frame">
            <canvas id="sky-canvas"></canvas>
            <button type="button" class="png-button" data-download="sky-canvas"
                    data-file="sky" data-i18n-title="canvas.downloadPng">PNG</button>
          </div>
        </div>

        <div class="ray-log" id="ray-log" hidden>
          <div class="ray-log-head">
            <strong data-i18n="canvas.rayLog"></strong>
            <button type="button" id="ray-log-close" class="ghost-button small"
                    data-i18n="canvas.rayLogClose"></button>
          </div>
          <div class="ray-log-body" id="ray-log-body"></div>
        </div>

        <p class="canvas-note" data-i18n="canvas.verticalExaggerated"></p>
      </div>
    </section>

    <aside class="panel panel-right">
      <div class="panel-scroll" id="beam-telemetry-root"></div>
      <div class="panel-scroll" id="right-panel" hidden>

        <p class="panel-target" id="panel-target" hidden></p>

        <section class="panel-section">
          <h2 data-i18n="spectrum.title"></h2>
          <div class="chart-wrap">
            <canvas id="spectrum-canvas"></canvas>
            <button type="button" class="png-button" data-download="spectrum-canvas"
                    data-file="spectrum" data-per-simulation
                    data-i18n-title="canvas.downloadPng">PNG</button>
          </div>
          <div class="legend" id="spectrum-legend"></div>
        </section>

        <section class="panel-section">
          <h2 data-i18n="color.title"></h2>
          <div class="tabs" id="color-tabs" role="tablist">
            <button type="button" class="tab is-active" data-tab="measured"
                    role="tab" data-i18n="color.tabMeasured"></button>
            <button type="button" class="tab" data-tab="theory"
                    role="tab" data-i18n="color.tabTheory"></button>
          </div>

          <div class="tab-panel" data-panel="measured">
            <div class="swatches">
              <div class="swatch" id="swatch-measured">
                <div class="swatch-chip"></div>
                <div class="swatch-caption"></div>
                <div class="swatch-detail"></div>
              </div>
              <div class="swatch" id="swatch-star">
                <div class="swatch-chip"></div>
                <div class="swatch-caption"></div>
                <div class="swatch-detail"></div>
              </div>
            </div>
            <p class="note" id="measured-note"></p>
            <p class="note note-star" id="overhead-star-note"></p>
            <div class="band-tally" id="band-tally"></div>
          </div>

          <div class="tab-panel" data-panel="theory" hidden>
            <div class="swatches">
              <div class="swatch" id="swatch-sky">
                <div class="swatch-chip"></div>
                <div class="swatch-caption"></div>
                <div class="swatch-detail"></div>
              </div>
              <div class="swatch" id="swatch-perceived">
                <div class="swatch-chip"></div>
                <div class="swatch-caption"></div>
                <div class="swatch-detail"></div>
              </div>
              <div class="swatch" id="swatch-theory-star">
                <div class="swatch-chip"></div>
                <div class="swatch-caption"></div>
                <div class="swatch-detail"></div>
              </div>
            </div>
            <p class="note" id="swatch-note"></p>
            <p class="note" id="theory-agreement"></p>
          </div>
          <p class="note note-tally" id="photon-tally" hidden></p>
        </section>

        <section class="panel-section" id="chroma-section" hidden>
          <h2 data-i18n="color.chromaticity"></h2>
          <div class="chroma-wrap">
            <!-- The diagram is narrower than the panel and centred in it, so the
                 button hangs off its own frame rather than the panel's - the
                 corner it sits in has to be the corner of the picture. -->
            <div class="canvas-frame chroma-frame">
              <canvas id="chroma-canvas"></canvas>
              <button type="button" class="png-button" data-download="chroma-canvas"
                      data-file="chromaticity" data-per-simulation
                      data-i18n-title="canvas.downloadPng">PNG</button>
            </div>
          </div>
        </section>

        <section class="panel-section" id="data-section">
          <h2 data-i18n="data.title"></h2>
          <table class="data-table">
            <tbody id="data-rows"></tbody>
          </table>
        </section>

      </div>
    </aside>
  </main>

  <section class="experiment-bar" id="experiment-panel" hidden>
    <div class="experiment-head">
      <div>
        <strong id="experiment-title"></strong>
        <span class="experiment-step" id="experiment-step"></span>
      </div>
      <div class="experiment-progress" id="experiment-progress"></div>
      <button type="button" id="experiment-exit" class="ghost-button small"></button>
    </div>
    <div class="experiment-hint is-goal" id="experiment-goal" hidden>
      <span class="hint-label"></span>
      <span class="hint-text"></span>
    </div>
    <p class="experiment-body" id="experiment-body"></p>
    <div class="experiment-hint is-changes" id="experiment-changes" hidden>
      <span class="hint-label"></span>
      <span class="hint-text"></span>
    </div>
    <div class="experiment-hint" id="experiment-observe">
      <span class="hint-label"></span>
      <span class="hint-text"></span>
    </div>
    <div class="experiment-hint is-question" id="experiment-question">
      <span class="hint-label"></span>
      <span class="hint-text"></span>
    </div>
    <div class="experiment-hint is-sources" id="experiment-sources" hidden>
      <span class="hint-label"></span>
      <span class="hint-text"></span>
    </div>
    <div class="experiment-actions">
      <button type="button" id="experiment-prev" class="ghost-button"></button>
      <button type="button" id="experiment-next" class="primary-button"></button>
    </div>
  </section>

  <footer class="explain" id="explain-panel">
    <div class="explain-column">
      <h3 id="explain-see-title"></h3>
      <p id="explain-see-body"></p>
    </div>
    <div class="explain-column is-why">
      <h3 id="explain-why-title"></h3>
      <p id="explain-why-body"></p>
    </div>
    <span class="explain-badge" id="explain-badge"></span>
  </footer>

</div>

<script>
(function () {
'use strict';
/* ===== js/config-loader.js ===== */
/**
 * Configuration loading.
 *
 * Every number that describes a world, a star, a scatterer or a phrase of text
 * lives in a JSON file under /config. The loader reads the manifest and then
 * pulls in whatever it lists, so adding a new planet means dropping in a file
 * and naming it in config/index.json - no code changes.
 *
 * Over http the files are fetched individually, which keeps them editable and
 * live. Opened straight from disk, fetch is blocked by the browser, so the
 * loader falls back to config/bundle.js, a generated copy of the same data
 * that index.html loads with a plain script tag. The JSON files stay the one
 * source of truth; the bundle is rebuilt from them by tools/build-bundle.js.
 */

const BASE = 'config/';
const STANDALONE = true;

async function fetchJson(path) {
  const response = await fetch(BASE + path, { cache: 'no-cache' });
  if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
  return response.json();
}

/** The generated fallback, if index.html managed to load it. */
function bundled() {
  return typeof window !== 'undefined' ? window.__ATMO_CONFIG__ : undefined;
}

function fromBundle(path) {
  const b = bundled();
  if (!b || !b[path]) throw new Error(`${path} missing from the offline bundle`);
  return b[path];
}

/**
 * Load everything the application needs.
 * Returns maps keyed by id, ready for the UI to enumerate.
 */
async function loadConfiguration() {
  const isStandalone = typeof STANDALONE !== 'undefined' && STANDALONE;
  const isFile = typeof window !== 'undefined' && window.location && window.location.protocol === 'file:';
  let useBundle = false;
  let index;

  if (isStandalone || (isFile && bundled())) {
    useBundle = true;
    index = fromBundle('index.json');
  } else {
    try {
      index = await fetchJson('index.json');
    } catch (err) {
      if (!bundled()) {
        throw new Error(
          'Configuration could not be loaded. Serve the folder over http, ' +
          'or run "npm run build" once so that config/bundle.js exists.');
      }
      useBundle = true;
      index = fromBundle('index.json');
    }
  }

  const get = async (path) => (useBundle ? fromBundle(path) : fetchJson(path));

  const collect = async (dir, ids) => {
    const entries = await Promise.all(ids.map((id) => get(`${dir}/${id}.json`)));
    const map = new Map();
    ids.forEach((id, i) => map.set(id, entries[i]));
    return map;
  };

  const [atmospheres, stars, scattering, experiments, localization, color] = await Promise.all([
    collect('atmospheres', index.atmospheres),
    collect('stars', index.stars),
    collect('scattering', index.scattering),
    collect('experiments', index.experiments),
    collect('localization', index.localization),
    collect('color', index.color),
  ]);

  return {
    index,
    atmospheres,
    stars,
    scattering,
    experiments,
    localization,
    colorimetryData: color.get(index.color[0]),
    loadedFrom: useBundle ? 'bundle' : 'files',
  };
}

/* ===== js/i18n.js ===== */
/**
 * Bilingual text. Czech is the default; English is one click away and the
 * switch never reloads the page.
 *
 * Any element carrying data-i18n gets its text replaced; data-i18n-title,
 * data-i18n-aria and data-i18n-placeholder fill the matching attributes. The
 * same helper resolves {cs: ..., en: ...} blocks that sit inside the physics
 * config files, so planet names and experiment prose translate too.
 */

function createI18n(localizationMap, initialLanguage = 'cs') {
  let language = localizationMap.has(initialLanguage) ? initialLanguage : 'cs';
  const listeners = new Set();

  function dictionary() {
    return localizationMap.get(language) ?? {};
  }

  /** Walk a dotted key path through the dictionary. */
  function lookup(key, dict) {
    let node = dict;
    for (const part of key.split('.')) {
      if (node == null || typeof node !== 'object') return undefined;
      node = node[part];
    }
    return typeof node === 'string' ? node : undefined;
  }

  /**

/**
 * Spectral representation.
 *
 * Every radiometric quantity in this simulator is carried as a discrete
 * spectral power density vector I(lambda) sampled on a fixed grid:
 *
 *     lambda in [380 nm, 750 nm], step 10 nm  ->  38 bins.
 *

const SPECTRUM_MIN_NM = 380;
const SPECTRUM_MAX_NM = 750;
const SPECTRUM_STEP_NM = 10;

/* Physical constants (SI, CODATA 2018). */
const PLANCK_H = 6.62607015e-34;      // J s
const LIGHT_C = 2.99792458e8;         // m / s
const BOLTZMANN_K = 1.380649e-23;     // J / K
const WIEN_B = 2.897771955e-3;        // m K

  for (let i = 0; i < SPECTRUM_BINS; i++) out[i] *= scale;

}

 * @param {number} temperatureK absolute temperature in kelvin

 * violet to red read as one continuous wash, and a student cannot count them.

 * the eye can hold them all at once.
 *

  const bands = [];

    const to = edges[b + 1];

    // band really contains rather than an average of its ends.
    const centre = Math.min(SPECTRUM_MAX_NM, (from + to) / 2);

  return BAND_OF_BIN[i];
}

/**
 * Scattering physics: cross-sections and phase functions.
 *
 * Two regimes are modelled.
 *
 * Rayleigh scattering applies when the scatterer is far smaller than the
 * wavelength (air molecules, ~0.3 nm, against ~500 nm light). The cross
 * section goes as 1/lambda^4, which is the single fact behind the blue sky and
 * the red sunset.
 *
 * Aerosol (Mie) scattering applies when the particle size is comparable to the
 * wavelength (dust, droplets, smoke). The exact theory needs Maxwell's
 * equations solved on a sphere; here it is replaced by the standard
 * educational pair of an Angstrom power law and a Henyey-Greenstein phase
 * function, which reproduce the two features that matter: near-neutral colour
 * and strong forward peaking.
 */

const REFERENCE_WAVELENGTH_NM = 550;

/**
 * The scattering cross-section of real air, relative to its value at 550 nm.
 *
 * An ideal dipole scatters as 1/lambda^4 exactly. Air does not, for two reasons
 * that both come from the molecule rather than from the light: the refractive
 * index of air itself rises towards the blue (so the polarisability that
 * squares into the cross-section is not constant), and the molecules are not
 * spheres, so a little light is scattered depolarised - the King factor, which
 * also rises towards the blue. Together they steepen the law to roughly
 * lambda^-4.08 across the visible.
 *
 * This is the fit of Bodhaine, Wood, Dutton & Slusser (1999), "On Rayleigh
 * optical depth calculations", J. Atmos. Oceanic Technol. 16, 1854-1861,
 * Eq. (29): the cross-section of dry air with 360 ppm CO2, accurate to better
 * than 0.01 % over 250-850 nm. Only its SHAPE is used here - the strength comes
 * from the atmosphere's own column - so the leading constant cancels.
 */
function bodhaineAirShape(lambdaNm) {
  const l = lambdaNm / 1000;          // the fit is written in micrometres
  const l2 = l * l;
  return (1.0455996 - 341.29061 / l2 - 0.90230850 * l2)
    / (1 + 0.0027059889 / l2 - 85.968563 * l2);

/**
 * How far real air departs from an ideal 1/lambda^4 law at each wavelength,
 * normalised to 1 at 550 nm. Multiplying an ideal (550/lambda)^4 spectrum by
 * this gives Bodhaine's measured shape exactly.
 */
const AIR_DISPERSION_FACTOR = (() => {
  const out = specNew();
  const ref = bodhaineAirShape(REFERENCE_WAVELENGTH_NM);
  for (let i = 0; i < SPECTRUM_BINS; i++) {
    const nm = WAVELENGTHS_NM[i];
    const ideal = Math.pow(REFERENCE_WAVELENGTH_NM / nm, 4);
    out[i] = (bodhaineAirShape(nm) / ref) / ideal;

 * `beta550` was measured.

 *     beta(lambda) = beta(550) * (550 / lambda)^exponent * D(lambda)
 *
 * The exponent is exposed so a student can dial it away from 4 and watch the
 * sky lose its colour - the fastest way to see that 1/lambda^4 is doing all
 * the work. D is the departure of the real gas from an ideal dipole (see
 * AIR_DISPERSION_FACTOR); it is 1 everywhere for a world that does not declare
 * one, and it stays applied when the exponent is moved, so the slider always
 * means "the ideal part of the law" and n = 4 is real air, exactly.

  const out = specNew();
  for (let i = 0; i < SPECTRUM_BINS; i++) {

 * halves are joined continuously at the split.

  const long = pair ? angstromExponent.long : angstromExponent;
  const short = pair ? angstromExponent.short : angstromExponent;
  const atSplit = beta550 * Math.pow(REFERENCE_WAVELENGTH_NM / ANGSTROM_SPLIT_NM, long);
  for (let i = 0; i < SPECTRUM_BINS; i++) {
    const nm = WAVELENGTHS_NM[i];

 * linearly interpolated and clamped at the ends.

 * than absorption. Martian dust absorbs blue far more than red, and that

 * angles is fully polarised and half as strong as forward light. A real
 * molecule is slightly anisotropic, so some of the right-angle light is
 * depolarised and the sideways dip is shallower:
 *
 *     P(theta) = 3 / (16 pi (1 + 2 gamma)) * [(1 + 3 gamma) + (1 - gamma) cos^2 theta]
 *     gamma    = rho / (2 - rho)

 * of Hansen & Travis (1974), Space Sci. Rev. 16, 527. For air rho = 0.0279

 * the Sun comes out 1.4 % brighter than the ideal law says, and the sky beside
 * the Sun 1.4 % fainter.

  const rho = Math.max(0, Math.min(0.5, depolarization || 0));
  const gamma = rho / (2 - rho);

/**

 * textbook 3 / (16 pi) (1 + cos^2 theta).
 *
 * It integrates to 1 over the full solid angle. Forward and backward
 * scattering are equally likely and sideways scattering is only about half as
 * likely, so the sky is brightest near the Sun and dimmest 90 degrees away.

function rayleighPhase(cosTheta, depolarization = 0) {
  const { a, b, norm } = rayleighPhaseCoefficients(depolarization);
  return (a + b * cosTheta * cosTheta) / norm;

/**
 * Henyey-Greenstein phase function, the standard one-parameter stand-in for a
 * Mie lobe.
 *
 *     P(theta) = (1 - g^2) / (4 pi (1 + g^2 - 2 g cos theta)^{3/2})
 *
 * g = 0 is isotropic, g -> 1 is entirely forward. Atmospheric aerosols sit
 * around g = 0.7, which is why haze produces a bright glare around the Sun.

function henyeyGreensteinPhase(cosTheta, g) {
  const gg = Math.max(-0.99, Math.min(0.99, g));
  const denom = 1 + gg * gg - 2 * gg * cosTheta;
  return (1 - gg * gg) / (4 * Math.PI * Math.pow(Math.max(denom, 1e-6), 1.5));

/**
 * Draw a scattering direction cosine from the Rayleigh phase function.
 *
 * The cumulative distribution of a + b mu^2 on [-1, 1] is a cubic in mu, and a
 * cubic with a positive linear term has exactly one real root, which Cardano's
 * formula gives in closed form:
 *
 *     mu^3 + p mu + q = 0,   p = 3a / b,   q = (3 / b) (a + b / 3) (1 - 2 xi)
 *
 * With no depolarisation this is the familiar u = 4 xi - 2,

 *
