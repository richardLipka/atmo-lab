 * Controls are declared as data rather than written out as markup, so adding a
 * new physical parameter is one entry in the list below. Each entry names the
 * state path it drives; nothing here knows anything about the physics.
 *
 * Every path that names part of a SIMULATION - the star, the air, the observer
 * - is aimed at whichever simulation is selected. The entries below say
 * `star.elevationDeg`, and if B is the selected simulation they read and write
 * `compare.b.star.elevationDeg` instead. There is one function that does the
 * aiming and one that does the writing, so no control can be retargeted while
 * another is quietly forgotten.
 *
 * The ray section is the exception and says so: it sets how BOTH simulations
 * are drawn. The display exposure especially - two panels rendered at two gains
 * cannot be compared by eye, which is the one thing a comparison is for.
 */

function getPath(object, path) {
  return path.split('.').reduce((node, key) => (node == null ? node : node[key]), object);
}

function setPath(patch, path, value) {
  const keys = path.split('.');
  let node = patch;
  for (let i = 0; i < keys.length - 1; i++) {
    node[keys[i]] = node[keys[i]] ?? {};
    node = node[keys[i]];
  }
  node[keys[keys.length - 1]] = value;
  return patch;
}

/** Does this state path name part of a simulation rather than of the page? */
function isSimulationPath(path) {
  return SIMULATION_KEYS.some((key) => path === key || path.startsWith(`${key}.`));
}

/** Rewrite a simulation path so it names the selected simulation. */
function aim(path, state) {
  if (!isSimulationPath(path)) return path;
  const prefix = activeSimulationPath(state);
  return prefix ? `${prefix}.${path}` : path;
}

/** Read a state path, aimed at the selected simulation. */
function readAimed(state, path) {
  return getPath(state, aim(path, state));
}

/**
 * Send a patch to the selected simulation.
 *
 * The declarations and the `onChange` handlers below all speak of `star`,
 * `atmosphere` and `observer`, because that is what they are about; this is the
 * single place where "which simulation" is answered.
 */
function retarget(patch, state) {
  if (activeSimulationId(state) !== 'b') return patch;
  const moved = {};
  const rest = {};
  for (const [key, value] of Object.entries(patch)) {
    if (SIMULATION_KEYS.includes(key)) moved[key] = value; else rest[key] = value;
  }
  if (Object.keys(moved).length === 0) return patch;
  return { ...rest, compare: { ...(rest.compare ?? {}), b: moved } };
}

/** Surface pressure, in whatever unit keeps the number readable. */
function formatPressure(kPa) {
  if (kPa >= 1000) return `${(kPa / 1000).toFixed(1)} MPa`;
  if (kPa >= 1) return `${kPa.toFixed(kPa >= 10 ? 0 : 2)} kPa`;
  if (kPa > 0) return `${(kPa * 1000).toFixed(0)} Pa`;
  return '0';
}

/** Logarithmic slider mapping, for controls spanning several decades. */
function logToValue(t, min, max) {
  return min * Math.pow(max / min, t);
}
function valueToLog(v, min, max) {
  return Math.log(Math.max(min, v) / min) / Math.log(max / min);
}

function createControls(root, { store, i18n, config }) {
  const elements = new Map();

  /**
   * Just enough of an atmosphere for autoSpanFor: it only reads the scale
   * height, and building a whole atmosphere to fill in a slider would be
   * wasteful on every repaint of the controls.
   */
  function atmosphereShape(state) {
    const air = activeSimulation(state).atmosphere;
    const preset = config.atmospheres.get(air.presetId);
    return {
      scaleHeightRayleigh: air.scaleHeight_m
        ?? preset?.rayleigh.scaleHeight_m ?? 8500,
    };
  }

  /** The configured world the selected simulation is running in. */
  function worldOf(state) {
    return config.atmospheres.get(activeSimulation(state).atmosphere.presetId);
  }

  const sections = [
    {
      id: 'sec-compare', titleKey: 'compare.title',
      controls: [
        {
          id: 'ctl-compare', type: 'checkbox', labelKey: 'compare.enable',
          helpKey: 'compare.enableHelp', path: 'compare.enabled',
          // Switching the comparison on hands the controls back to A, so that
          // it always begins from the observer that was there a moment ago.
          onChange: (enabled) => ({ compare: { enabled, active: 'a' } }),
        },
        {
          id: 'ctl-compare-active', type: 'segment', labelKey: 'compare.controls',
          helpKey: 'compare.controlsHelp', path: 'compare.active',
          dependsOn: 'compare.enabled',
          options: () => [
            { value: 'a', label: i18n.t('compare.observerA'), colour: stationColour('a') },
            { value: 'b', label: i18n.t('compare.observerB'), colour: stationColour('b') },
          ],
        },
        {
          // A note draws itself from its own text, so it hides itself by
          // returning nothing rather than by declaring a dependency.
          id: 'ctl-compare-note', type: 'note',
          text: (state) => (state.compare.enabled
            ? i18n.t('compare.note').replace('{observer}',
              i18n.t(activeSimulationId(state) === 'b' ? 'compare.observerB' : 'compare.observerA'))
            : ''),
        },
      ],
    },
    {
      id: 'sec-star', titleKey: 'controls.star.title',
      controls: [
        {
          id: 'ctl-star-preset', type: 'select', labelKey: 'controls.star.preset',
          helpKey: 'controls.star.presetHelp', path: 'star.presetId',
          options: () => Array.from(config.stars.values()).map((s) => ({
            value: s.id, label: i18n.localized(s.name),
          })),
          onChange: (value) => {
            const preset = config.stars.get(value);
            return { star: { presetId: value, temperatureK: preset?.temperature_K ?? 5800 } };
          },
        },
        {
          id: 'ctl-temperature', type: 'range', labelKey: 'controls.star.temperature',
          helpKey: 'controls.star.temperatureHelp', path: 'star.temperatureK',
          min: 2000, max: 20000, step: 100,
          format: (v) => `${Math.round(v)} K`,
        },
        {
          id: 'ctl-elevation', type: 'range', labelKey: 'controls.star.elevation',
          helpKey: 'controls.star.elevationHelp', path: 'star.elevationDeg',
          min: -8, max: 90, step: 0.5,
          format: (v) => v < 0
            ? `${v.toFixed(1)}° (${i18n.t('controls.star.belowHorizon')})`
            : `${v.toFixed(1)}°`,
        },
        {
          id: 'ctl-insolation', type: 'checkbox', labelKey: 'controls.star.realisticInsolation',
          helpKey: 'controls.star.realisticInsolationHelp',
          path: 'star.realisticInsolation', advanced: true,
        },
      ],
    },
    {
      id: 'sec-atmosphere', titleKey: 'controls.atmosphere.title',
      controls: [
        {
          id: 'ctl-atmosphere-preset', type: 'select', labelKey: 'controls.atmosphere.preset',
          helpKey: 'controls.atmosphere.presetHelp', path: 'atmosphere.presetId',
          options: () => Array.from(config.atmospheres.values()).map((a) => ({
            value: a.id, label: i18n.localized(a.name),
          })),
          // Switching world resets the derived sliders to that world's own values.
          onChange: (value) => ({
            atmosphere: {
              presetId: value, densityScale: 1, aerosolScale: 1,
              aerosolPresetId: null, scaleHeight_m: null, rayleighExponent: 4,
            },
          }),
        },
        {
          id: 'ctl-density', type: 'range', labelKey: 'controls.atmosphere.density',
          helpKey: 'controls.atmosphere.densityHelp', path: 'atmosphere.densityScale',
          min: 0, max: 3, step: 0.02,
          format: (v) => `${v.toFixed(2)} ×`,
        },
        {
          id: 'ctl-aerosol-preset', type: 'select', labelKey: 'controls.atmosphere.aerosolType',
          helpKey: 'controls.atmosphere.aerosolTypeHelp', path: 'atmosphere.aerosolPresetId',
          nullable: true,
          options: () => {
            const presets = config.scattering.get('aerosols')?.presets ?? {};
            return [{ value: '', label: i18n.t('controls.atmosphere.aerosolNative') }].concat(
              Object.entries(presets).map(([id, preset]) => ({
                value: id, label: i18n.localized(preset.name),
              })));
          },
        },
        {
          id: 'ctl-aerosol', type: 'range', labelKey: 'controls.atmosphere.aerosol',
          helpKey: 'controls.atmosphere.aerosolHelp', path: 'atmosphere.aerosolScale',
          min: 0, max: 5, step: 0.05,
          format: (v) => `${v.toFixed(2)} ×`,
        },
        {
          id: 'ctl-scale-height', type: 'range', labelKey: 'controls.atmosphere.scaleHeight',
          helpKey: 'controls.atmosphere.scaleHeightHelp', path: 'atmosphere.scaleHeight_m',
          min: 1000, max: 60000, step: 100, advanced: true,
          fallback: (state) => worldOf(state)?.rayleigh.scaleHeight_m ?? 8500,
          format: (v) => `${(v / 1000).toFixed(1)} km`,
        },
        {
          id: 'ctl-exponent', type: 'range', labelKey: 'controls.atmosphere.exponent',
          helpKey: 'controls.atmosphere.exponentHelp', path: 'atmosphere.rayleighExponent',
          min: 0, max: 6, step: 0.1, advanced: true,
          format: (v) => `n = ${v.toFixed(1)}`,
        },
        {
          // What this world is actually made of, named from the gas table in
          // config/scattering/rayleigh_gases.json.
          id: 'ctl-composition', type: 'note',
          text: (state) => {
            const world = worldOf(state);
            if (!world) return '';
            const table = config.scattering.get('rayleigh_gases')?.gases ?? {};
            const parts = (world.composition ?? [])
              .filter((entry) => entry.fraction >= 0.001)
              .map((entry) => {
                const name = i18n.localized(table[entry.gas]?.name, entry.gas);
                return `${name} ${(entry.fraction * 100).toFixed(entry.fraction >= 0.1 ? 0 : 1)} %`;
              });
            const composition = parts.length
              ? `${i18n.t('controls.atmosphere.composition')}: ${parts.join(', ')}`
              : '';
            const pressure = world.surfacePressure_kPa != null
              ? `${i18n.t('controls.atmosphere.surfacePressure')}: ${formatPressure(world.surfacePressure_kPa)}`
              : '';
            return [composition, pressure, i18n.localized(world.description)]
              .filter(Boolean).join('\n');
          },
        },
      ],
    },
    {
      id: 'sec-observer', titleKey: 'controls.observer.title',
      controls: [
        {
          id: 'ctl-position', type: 'range', labelKey: 'controls.observer.position',
          helpKey: 'controls.observer.positionHelp', path: 'observer.z',
          min: -1000, max: 1000, step: 1, mapping: 'position',
          format: (v) => {
            if (Math.abs(v) < 0.5) return i18n.t('controls.observer.groundLevel');
            return v > 0
              ? `${formatAltitude(v)} (${i18n.t('controls.observer.altitude')})`
              : `${formatAltitude(-v)} (${i18n.t('controls.observer.underground')})`;
          },
        },
        {
          id: 'ctl-view', type: 'range', labelKey: 'controls.observer.viewDirection',
          helpKey: 'controls.observer.viewDirectionHelp', path: 'observer.viewZenithDeg',
          min: -90, max: 90, step: 1, mapping: 'view',
          format: (v) => {
            const a = Math.abs(v);
            if (a < 1) return `0° (${i18n.t('controls.observer.zenith')})`;
            if (a > 89) return `90° (${i18n.t('controls.observer.horizon')})`;
            return `${a.toFixed(0)}°`;
          },
        },
        {
          id: 'ctl-well', type: 'checkbox', labelKey: 'controls.observer.wellEnabled',
          helpKey: 'controls.observer.wellEnabledHelp', path: 'observer.well.enabled',
          onChange: (enabled) => {
            const observer = activeObserver(store.state);
            if (enabled) {
              const depth = observer.well?.depth_m ?? 50;
              const z = observer.z <= 0 ? -depth : observer.z;
              return { observer: { well: { enabled: true }, z } };
            }
            return { observer: { well: { enabled: false }, z: Math.max(0, observer.z) } };
          },
        },
        {
          id: 'ctl-well-radius', type: 'range', labelKey: 'controls.observer.wellRadius',
          helpKey: 'controls.observer.wellRadiusHelp',
          path: 'observer.well.radius_m', min: 0.2, max: 20, step: 0.1,
          scale: 'log', dependsOn: 'observer.well.enabled',
          format: (v) => `${v.toFixed(1)} m`,
        },
        {
          id: 'ctl-well-depth', type: 'range', labelKey: 'controls.observer.wellDepth',
          helpKey: 'controls.observer.wellDepthHelp',
          path: 'observer.well.depth_m', min: 1, max: 10000, step: 1,
          scale: 'log', dependsOn: 'observer.well.enabled',
          format: (v) => formatAltitude(v),
        },
        {
          id: 'ctl-shaft-air', type: 'checkbox', labelKey: 'controls.observer.countShaftAir',
          helpKey: 'controls.observer.countShaftAirHelp',
          path: 'observer.countShaftAir', advanced: true, dependsOn: 'observer.well.enabled',
        },
        {
          id: 'ctl-zoom', type: 'range', labelKey: 'controls.observer.zoom',
          helpKey: 'controls.observer.zoomHelp', path: 'observer.span_m',
          min: MIN_SPAN_M, max: MAX_SPAN_M, step: 1, scale: 'log',
          fallback: (state) => {
            const observer = activeObserver(state);
            return autoSpanFor(atmosphereShape(state), observer.z, observer.well);
          },
          format: (v) => formatAltitude(v),
        },
      ],
    },
    {
      id: 'sec-rays', titleKey: 'controls.rays.title',
      controls: [
        {
          // The one section that is not about a situation but about how both
          // situations are drawn. Saying so is the difference between a shared
          // control and a control that looks broken.
          id: 'ctl-rays-shared', type: 'note',
          text: (state) => (state.compare.enabled ? i18n.t('compare.sharedRays') : ''),
        },
        {
          id: 'ctl-ray-count', type: 'range', labelKey: 'controls.rays.count',
          helpKey: 'controls.rays.countHelp', path: 'rays.count', min: 100, max: 5000, step: 100,
          format: (v) => String(Math.round(v)),
        },
        {
          id: 'ctl-show-scattering', type: 'checkbox', labelKey: 'controls.rays.showScattering',
          helpKey: 'controls.rays.showScatteringHelp', path: 'rays.showScattering',
        },
        {
          id: 'ctl-animate', type: 'checkbox', labelKey: 'controls.rays.animate',
          helpKey: 'controls.rays.animateHelp', path: 'rays.animate',
        },
        {
          id: 'ctl-brightness', type: 'range', labelKey: 'controls.rays.brightness',
          helpKey: 'controls.rays.brightnessHelp', path: 'rays.brightness',
          min: 0.05, max: 10000, step: 0.001, scale: 'log',
          format: (v) => `${v < 10 ? v.toFixed(2) : Math.round(v)} ×`,
        },
        {
          id: 'ctl-mix-physical', type: 'checkbox', advanced: true,
          labelKey: 'controls.rays.physicalMix',
          helpKey: 'controls.rays.physicalMixHelp', path: 'rays.mix.physical',
        },
        {
          id: 'ctl-quality', type: 'select', labelKey: 'controls.rays.quality',
          helpKey: 'controls.rays.qualityHelp', path: 'rays.quality', advanced: true,
          options: () => [
            { value: 'preview', label: i18n.t('controls.rays.qualityPreview') },
            { value: 'normal', label: i18n.t('controls.rays.qualityNormal') },
            { value: 'high', label: i18n.t('controls.rays.qualityHigh') },
          ],
        },
      ],
    },
  ];

  /* ---- construction ---- */

  function build() {
    root.textContent = '';
    for (const section of sections) {
      const wrap = document.createElement('section');
      wrap.className = 'control-section';
      wrap.id = section.id;

      const heading = document.createElement('h2');
      heading.setAttribute('data-i18n', section.titleKey);
      heading.textContent = i18n.t(section.titleKey);
      wrap.appendChild(heading);

      for (const control of section.controls) wrap.appendChild(buildControl(control));
      root.appendChild(wrap);
    }
  }

  function buildControl(control) {
    const field = document.createElement('div');
    field.className = 'field';
    field.id = control.id;
    if (control.advanced) field.dataset.advanced = 'true';

    if (control.type === 'note') {
      field.classList.add('field-note');
      elements.set(control.id, { control, field, input: null, value: null, labelText: null });
      return field;
    }

    const label = document.createElement('label');
    label.className = 'field-label';
    label.htmlFor = control.id + '-input';

    const labelText = document.createElement('span');
    labelText.setAttribute('data-i18n', control.labelKey);
    labelText.textContent = i18n.t(control.labelKey);
    label.appendChild(labelText);

    const value = document.createElement('span');
    value.className = 'field-value';
    label.appendChild(value);

    let input;
    if (control.type === 'segment') {
      // A row of buttons rather than a select, because this one answers a
      // question the reader has to be able to answer at a glance - which
      // simulation am I steering - and a collapsed dropdown does not.
      input = document.createElement('div');
      input.className = 'segmented segmented-observer';
      input.setAttribute('role', 'group');
      input.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-value]');
        if (button) commit(control, button.dataset.value);
      });
    } else if (control.type === 'range') {
      input = document.createElement('input');
      input.type = 'range';
      if (control.mapping === 'position') { input.min = -1000; input.max = 1000; input.step = 1; }
      else if (control.scale === 'log') { input.min = 0; input.max = 1000; input.step = 1; }
      else { input.min = control.min; input.max = control.max; input.step = control.step; }
      input.addEventListener('input', () => commit(control, readInput(control, input)));
    } else if (control.type === 'checkbox') {
      input = document.createElement('input');
      input.type = 'checkbox';
      field.classList.add('field-check');
      input.addEventListener('change', () => commit(control, input.checked));
    } else {
      input = document.createElement('select');
      input.addEventListener('change', () => commit(control, input.value));
    }
    input.id = control.id + '-input';

    if (control.helpKey) {
      input.title = i18n.t(control.helpKey);
      label.title = i18n.t(control.helpKey);
      field.dataset.help = control.helpKey;
    }

    if (control.type === 'checkbox') {
      field.appendChild(input);
      field.appendChild(label);
    } else if (control.type === 'segment') {
      label.htmlFor = '';
      field.appendChild(label);
      field.appendChild(input);
    } else {
      field.appendChild(label);
      field.appendChild(input);
    }

    elements.set(control.id, { control, field, input, value, labelText });
    return field;
  }

  /* ---- reading and writing ---- */

  function readInput(control, input) {
    const raw = Number(input.value);
    if (control.mapping === 'position') {
      const state = store.state;
      const well = activeObserver(state).well;
      const maxDepth = well.enabled ? well.depth_m : 0;
      return sliderToZ(raw, maxAltitudeFor(worldOf(state)), maxDepth);
    }
    if (control.scale === 'log') return logToValue(raw / 1000, control.min, control.max);
    return raw;
  }

  function commit(control, value) {
    const state = store.state;
    if (control.onChange) {
      store.patch(retarget(control.onChange(value), state));
      return;
    }
    if (control.mapping === 'view') {
      // A signed control: negative means looking away from the star.
      store.patch(retarget({
        observer: {
          viewZenithDeg: Math.abs(value),
          viewAzimuthDeg: value >= 0 ? 0 : 180,
        },
      }, state));
      return;
    }
    store.patch(setPath({}, aim(control.path, state),
      control.nullable && value === '' ? null : value));
  }

  function currentValue(control, state) {
    if (control.mapping === 'view') {
      const observer = activeObserver(state);
      const signed = observer.viewAzimuthDeg > 90 ? -1 : 1;
      return observer.viewZenithDeg * signed;
    }
    const raw = readAimed(state, control.path);
    if (raw == null && control.fallback) return control.fallback(state);
    return raw;
  }

  /** Push the current state into every widget. */
  function update() {
    const state = store.state;
    const advanced = state.level === 'advanced';
    const maxAltitude = maxAltitudeFor(worldOf(state));
    const aimed = activeObserver(state);
    const maxDepth = aimed.well.enabled ? aimed.well.depth_m : 0;

    // The star, the air and the observer all belong to one of the two
    // simulations, and the panel says which in that simulation's own colour
    // rather than leaving it to be inferred from a picture somewhere else.
    root.dataset.observer = state.compare.enabled ? activeSimulationId(state) : '';
    root.style.setProperty('--observer-colour', stationColour(activeSimulationId(state)));

    for (const { control, field, input, value, labelText } of elements.values()) {
      if (control.type === 'note') {
        field.textContent = control.text(state);
        field.hidden = !field.textContent;
        continue;
      }
      labelText.textContent = i18n.t(control.labelKey);
      if (control.helpKey) {
        input.title = i18n.t(control.helpKey);
        field.title = i18n.t(control.helpKey);
      }

      field.hidden = (control.advanced && !advanced) ||
        (control.dependsOn && !readAimed(state, control.dependsOn));

      const raw = currentValue(control, state);

      if (control.type === 'segment') {
        const options = control.options();
        if (input.dataset.signature !== i18n.getLanguage()) {
          input.textContent = '';
          for (const option of options) {
            const button = document.createElement('button');
            button.type = 'button';
            button.dataset.value = option.value;
            button.textContent = option.label;
            input.appendChild(button);
          }
          input.dataset.signature = i18n.getLanguage();
        }
        input.querySelectorAll('button').forEach((button) => {
          const on = button.dataset.value === String(raw);
          button.classList.toggle('is-active', on);
          button.style.setProperty('--segment-colour',
            options.find((o) => o.value === button.dataset.value)?.colour ?? '');
        });
        value.textContent = '';
      } else if (control.type === 'select') {
        const options = control.options();
        const wanted = options.map((o) => o.value).join('|');
        if (input.dataset.signature !== wanted + '|' + i18n.getLanguage()) {
          input.textContent = '';
          for (const option of options) {
            const el = document.createElement('option');
            el.value = option.value;
            el.textContent = option.label;
            input.appendChild(el);
          }
          input.dataset.signature = wanted + '|' + i18n.getLanguage();
        }
        input.value = raw == null ? '' : String(raw);
        value.textContent = '';
      } else if (control.type === 'checkbox') {
        input.checked = Boolean(raw);
        value.textContent = '';
      } else {
        if (control.mapping === 'position') {
          input.value = String(zToSlider(raw, maxAltitude, maxDepth));
        } else if (control.scale === 'log') {
          input.value = String(Math.round(valueToLog(raw, control.min, control.max) * 1000));
        } else {
          input.value = String(raw);
        }
        value.textContent = control.format ? control.format(Number(raw)) : String(raw);
      }
    }
  }

  /** Briefly draw attention to a control named by a guided experiment. */
  function highlight(controlId) {
    for (const { field } of elements.values()) field.classList.remove('is-highlighted');
    const entry = elements.get(controlId);
    if (!entry) return;
    entry.field.classList.add('is-highlighted');
    entry.field.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  build();
  update();
  return { update, highlight, rebuild: () => { build(); update(); } };
}

/* ===== js/ui/panels.js ===== */
/**
 * The measurement panel: spectrum legend, perceived colour, and the numeric
 * readout that turns the picture into physics a student can quote.
 *
 * Every number here describes ONE observer - the selected one - and says so.
 * The comparison used to put both observers in one table, side by side, which
 * reads well until you notice that the swatch, the spectrum plot, the band
 * tally and the chromaticity diagram above the table could not be doubled and
 * so went on describing whichever observer the rest of the interface happened
 * to be pointed at. Half a panel about one observer and half about another is
 * worse than either. The two are compared where they are drawn, side by side
 * under the cross-section; the panel answers for the one you have selected.
 */

function createPanels(root, { i18n, store, spectrumChart, chromaticity, colorimetry }) {
  const legend = root.querySelector('#spectrum-legend');
  const swatchSky = root.querySelector('#swatch-sky');
  const swatchPerceived = root.querySelector('#swatch-perceived');
  const swatchMeasured = root.querySelector('#swatch-measured');
  const swatchStar = root.querySelector('#swatch-star');
  const swatchTheoryStar = root.querySelector('#swatch-theory-star');
  const swatchNote = root.querySelector('#swatch-note');
  const measuredNote = root.querySelector('#measured-note');
  const overheadStarNote = root.querySelector('#overhead-star-note');
  const bandTally = root.querySelector('#band-tally');
  const theoryAgreement = root.querySelector('#theory-agreement');
  const colorTabs = root.querySelector('#color-tabs');
  const dataBody = root.querySelector('#data-rows');
  const dataSection = root.querySelector('#data-section');
  const chromaSection = root.querySelector('#chroma-section');
  const photonTally = root.querySelector('#photon-tally');
  const panelTarget = root.querySelector('#panel-target');

  buildLegend();
  wireTabs();

  /**
   * Two tabs, and which one is first is the argument.
   *
   * What the interface calls the sky colour is now measured from the rays on
   * screen and from nothing else. The integrator's answer has not gone away -
   * it is one click behind, with the difference between the two spelled out -
   * but it is no longer what is shown by default, because a picture that has no
   * say in the number beside it is decoration.
   */
  function wireTabs() {
    if (!colorTabs) return;
    colorTabs.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-tab]');
      if (!button) return;
      const wanted = button.dataset.tab;
      colorTabs.querySelectorAll('button[data-tab]').forEach((b) => {
        b.classList.toggle('is-active', b.dataset.tab === wanted);
      });
      root.querySelectorAll('.tab-panel').forEach((panel) => {
        panel.hidden = panel.dataset.panel !== wanted;
      });
    });
  }

  function buildLegend() {
    legend.textContent = '';
    for (const series of spectrumChart.series) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'legend-item';
      button.dataset.key = series.key;

      const swatch = document.createElement('span');
      swatch.className = 'legend-swatch';
      swatch.style.background = series.color;
      if (series.dash.length) swatch.style.opacity = '0.75';

      const text = document.createElement('span');
      text.textContent = i18n.t(`spectrum.${legendKey(series.key)}`);

      button.append(swatch, text);
      button.addEventListener('click', () => {
        spectrumChart.toggle(series.key);
        button.classList.toggle('is-off', !spectrumChart.isVisible(series.key));
        spectrumChart.draw();
      });
      legend.appendChild(button);
    }
  }

  function legendKey(key) {
    return key === 'scattered' ? 'scatteredSky' : key;
  }

  function refreshLegendText() {
    legend.querySelectorAll('.legend-item').forEach((button) => {
      const key = button.dataset.key;
      button.lastChild.textContent = i18n.t(`spectrum.${legendKey(key)}`);
    });
  }

  /* ---- number formatting ---- */

  const fmt = {
    fixed: (v, digits = 2) => Number.isFinite(v) ? v.toFixed(digits) : '-',
    sci: (v, digits = 2) => {
      if (!Number.isFinite(v)) return '-';
      if (v === 0) return '0';
      if (Math.abs(v) >= 0.01 && Math.abs(v) < 10000) return v.toFixed(digits);
      return v.toExponential(digits);
    },
    percent: (v) => {
      if (!Number.isFinite(v)) return '-';
      if (v >= 0.01) return `${(v * 100).toFixed(1)} %`;
      if (v === 0) return '0 %';
      return `${(v * 100).toExponential(1)} %`;
    },
    length: (v) => Number.isFinite(v) ? formatAltitude(v) : '-',
    mass: (v) => v == null ? '-' : `${Math.round(v).toLocaleString(i18n.getLanguage() === 'cs' ? 'cs-CZ' : 'en-GB')} kg/m²`,
  };

  /** The share of one colour the direct beam keeps; nothing to say once the star has set. */
  const beamShare = (beam, bin) => (beam.belowHorizon ? '-' : fmt.percent(beam.transmittance[bin]));

  /**
   * Build the readout rows for one observer. Rows that are meaningless in the
   * current situation - a shaft aperture when there is no shaft - are dropped
   * rather than shown as dashes.
   */
  function rowsFor(evaluation, state) {
    const m = evaluation.metrics;
    const inWell = evaluation.scene.wellActive;
    const rows = [
      { key: 'data.columnFraction', value: fmt.percent(m.columnFraction) },
      { key: 'data.airColumnMass', value: fmt.mass(m.massColumn), advanced: true },
      { key: 'data.scaleHeight', value: fmt.length(m.scaleHeight), advanced: true },
      { separator: true },
      // Straight up through the air above the observer: what climbing changes.
      { key: 'data.opticalDepthAt', params: { lambda: 450 }, value: fmt.sci(m.verticalTau[450], 3), advanced: true },
      { key: 'data.opticalDepthAt', params: { lambda: 550 }, value: fmt.sci(m.verticalTau[550], 3), advanced: true },
      { key: 'data.opticalDepthAt', params: { lambda: 650 }, value: fmt.sci(m.verticalTau[650], 3), advanced: true },
      // Along the path to the star: what lowering it changes. The share of each
      // colour that survives is the sunset, so it is shown as it is.
      { key: 'data.airMass', value: fmt.fixed(m.airMass, 2) },
      { key: 'data.beamTransmissionAt', params: { lambda: 450 }, value: beamShare(evaluation.beam, 7) },
      { key: 'data.beamTransmissionAt', params: { lambda: 650 }, value: beamShare(evaluation.beam, 27) },
      { key: 'data.pathLength', value: fmt.length(m.pathLength), advanced: true },
      { separator: true },
      { key: 'data.skyLuminance', value: fmt.sci(m.skyLuminance, 3) },
      { key: 'data.illuminance', value: fmt.sci(evaluation.illumination.total, 3) },
      { key: 'data.scatteringAngle', value: `${fmt.fixed(m.scatteringAngleDeg, 0)}°`, advanced: true },
      { key: 'data.peakWavelength', value: `${Math.round(m.peakWavelength)} nm`, advanced: true },
    ];

    if (inWell) {
      rows.push(
        { separator: true },
        { key: 'data.apertureAngle', value: formatAngle(m.apertureHalfAngleDeg), emphasis: true },
        { key: 'data.apertureSolidAngle', value: `${fmt.sci(m.apertureSolidAngle, 2)} sr`, emphasis: true },
        { key: 'data.skyFraction', value: fmt.percent(m.skyFraction) },
        {
          key: 'data.illuminanceRatio', emphasis: true,
          value: fmt.percent(evaluation.illumination.totalOpen > 0
            ? evaluation.illumination.total / evaluation.illumination.totalOpen : 0),
        },
      );
    }
    return rows;
  }

  function renderRows(columns, advanced) {
    dataBody.textContent = '';
    const reference = columns[0].rows;

    if (columns.length > 1) {
      const head = document.createElement('tr');
      head.className = 'data-head';
      head.appendChild(document.createElement('th'));
      for (const column of columns) {
        const th = document.createElement('th');
        th.textContent = column.label;
        head.appendChild(th);
      }
      dataBody.appendChild(head);
    }

    reference.forEach((row, index) => {
      if (row.separator) {
        const tr = document.createElement('tr');
        tr.className = 'data-separator';
        const td = document.createElement('td');
        td.colSpan = columns.length + 1;
        tr.appendChild(td);
        dataBody.appendChild(tr);
        return;
      }
      if (row.advanced && !advanced) return;

      const tr = document.createElement('tr');
      if (row.emphasis) tr.className = 'is-key';
      const label = document.createElement('td');
      label.className = 'data-label';
      label.textContent = i18n.t(row.key, row.params);
      tr.appendChild(label);

      for (const column of columns) {
        const td = document.createElement('td');
        td.className = 'data-value';
        td.textContent = column.rows[index]?.value ?? '-';
        tr.appendChild(td);
      }
      dataBody.appendChild(tr);
    });
  }

  /**
   * The sky, measured from the rays and from nothing else.
   *
   * Two numbers make this colour, and both are visible on screen:
   *
   *   WHICH COLOURS. Every ray was drawn in one of eight bands, in proportion
   *     to its own spectrum, so the mix of bands arriving from the cone is the
   *     hue. The tally underneath counts them.
   *
   *   HOW MANY. The light is divided by the number of DIRECTIONS looked in, not
   *     by the number that delivered. Five rays out of fifty is a tenth of a
   *     sky, and reads as one. That is why a well goes dark: not because the
   *     light coming down it changes colour, but because there is so much less
   *     of it per direction you can look in.
   */
  function renderMeasured(result, histogram) {
    const chip = swatchMeasured.querySelector('.swatch-chip');
    const caption = swatchMeasured.querySelector('.swatch-caption');
    const detail = swatchMeasured.querySelector('.swatch-detail');
    caption.textContent = i18n.t('color.measured');

    if (!histogram || !colorimetry) {
      chip.style.background = '#000';
      detail.textContent = '-';
      return;
    }

    const measured = colorimetry.spectrumToSrgb(histogram.coneSpectrum, result.exposure);
    chip.style.background = measured.css;

    // The two things the brightness is made of, and both are on the screen.
    //
    // How many rays are drawn coming into the cone - which falls as you climb,
    // because there is less air left overhead to turn light towards you. And
    // how much of the field of view still has sky in it - which falls down a
    // shaft, because the rock takes the directions.
    //
    // The second is a share of SKY, not of drawn angles, and the difference is
    // large. A drawn ray is not one direction: it is the ring you get by
    // spinning it about the axis of view, and a ring near the middle of your
    // view stands for almost no sky at all. A fifty-metre shaft leaves one
    // drawn angle in seven but only one part in fifty of the sky.
    const cast = histogram.coneCast ?? 0;
    const drawn = histogram.drawnInCone ?? histogram.coneRays ?? 0;
    const share = histogram.skyShare;
    if (drawn === 0) {
      // Two different nothings. Either no light arrives at all - the rock has
      // taken every direction, or the star is down - or light does arrive but
      // there is less of it than one drawn ray stands for, which is what the
      // top of the atmosphere looks like.
      detail.textContent = cast === 0 ? i18n.t('color.noRays')
        : histogram.coneRays > 0 ? i18n.t('color.belowOneRay', { cast })
          : i18n.t('color.noneArrive', { cast });
    } else {
      detail.textContent = `${measured.css}  ·  `
        + i18n.t('color.raysArriving', { drawn, cast })
        + `  ·  ${i18n.t('color.skyFills', { share: formatShare(share ?? 1) })}`;
    }

    renderMeasuredStar(result, histogram);
    renderBandTally(histogram);
    renderOverheadStar(result, histogram);

    // The one sentence that says where the number came from. It matters that it
    // is not the same sentence as the one on the theory tab.
    //
    // When the star is in the field of view there is a second sentence, and it
    // is an admission. The swatch above is the SKY, and the star's disc beside
    // it runs to some hundreds of thousands of times that radiance - too much
    // to fold into one colour without the answer being "white", and far too
    // much to draw as rays at the scale everything else uses. So the picture
    // shows the beam as a bundle that is frankly not to scale, and the size of
    // the lie is printed here rather than hidden.
    measuredNote.textContent = i18n.t('color.measuredNote');
    if (histogram.starInCone && histogram.beam) {
      const sky = colorimetry.luminance(histogram.coneSpectrum);
      const star = colorimetry.luminance(histogram.beam.radiance ?? histogram.beam.spectrum);
      if (sky > 0 && star > 0) {
        measuredNote.textContent += ` ${i18n.t('color.starInCone', {
          ratio: formatRatio(star / sky),
        })}`;
      }
    }
  }

  /**
   * The faint star drawn over the observer, as a number - and the right number.
   *
   * What decides whether a star can be seen is how it compares with the patch
   * of sky the eye cannot tell apart from it, about one arcminute across. That
   * patch has the radiance of the sky behind the star, which a shaft does not
   * change; so the comparison comes out the same at the bottom of a well as on
   * open ground, and it changes only when the sky itself goes dark. An earlier
   * version reported the star's share of the whole field of view instead, which
   * a shaft does raise - and which therefore hinted that a well helps, when the
   * chimney tests of Hynek and Winsor showed it does not.
   */
  function renderOverheadStar(result, histogram) {
    const state = store.state;
    const observer = activeObserver(state);
    if (!histogram) {
      overheadStarNote.textContent = '';
      return;
    }
    if (Math.abs(observer.viewZenithDeg) > VIEW_CONE_HALF_DEG) {
      overheadStarNote.textContent = i18n.t('color.overheadStarOut');
      return;
    }
    const star = result.primary.metrics.overheadStar;
    const c = star.contrast;
    // Numbers inside a sentence follow the language's decimal mark.
    const local = (v) => (i18n.getLanguage() === 'cs' ? v.replace(/(\d)\.(\d)/g, '$1,$2') : v);
    let text = !Number.isFinite(c) ? i18n.t('color.overheadStarBlack')
      : c >= 1 ? i18n.t('color.overheadStarTimes', { n: local(formatRatio(c)) })
        : i18n.t('color.overheadStarPercent', { pct: local(`${(c * 100).toPrecision(2)} %`) });
    text += ` ${i18n.t(c >= 1 ? 'color.starVisible'
      : c >= 0.1 ? 'color.starBorderline' : 'color.starLost')}`;
    const scene = result.primary.scene;
    const skyShare = histogram.skyShare ?? 1;
    if (scene.wellActive && !scene.countShaftAir && skyShare < 0.999) {
      text += ` ${i18n.t('color.overheadStarShaft', { lost: formatShare(1 - skyShare) })}`;
    }
    overheadStarNote.textContent = text;
  }

  /** A large ratio, rounded to something a person would actually say. */
  function formatRatio(value) {
    if (!(value > 0)) return '-';
    if (value < 10) return value.toFixed(1);
    if (value < 1000) return String(Math.round(value / 10) * 10);
    const exponent = Math.floor(Math.log10(value));
    const lead = Math.round(value / 10 ** (exponent - 1)) / 10;
    return `${lead}×10^${exponent}`;
  }

  /**
   * The star, marched from the observer out through the air.
   *
   * Not sampled: there is one star, one direction and one chord, so the beam is
   * integrated along it with the same marcher the scattered paths use. It is
   * still the trace's own answer rather than the panel's - the same air, the
   * same rock, the same horizon test.
   */
  function renderMeasuredStar(result, histogram) {
    const beam = histogram.beam;
    const chip = swatchStar.querySelector('.swatch-chip');
    const caption = swatchStar.querySelector('.swatch-caption');
    const detail = swatchStar.querySelector('.swatch-detail');
    caption.textContent = i18n.t('color.star');

    if (!beam) {
      chip.style.background = '#000';
      detail.textContent = '-';
      swatchStar.classList.add('is-dim');
      return;
    }
    const scale = 1 / Math.max(1e-6, colorimetry.luminance(result.source));
    const colour = colorimetry.spectrumToSrgb(beam.spectrum, scale);
    chip.style.background = beam.visible ? colour.css : '#000';
    swatchStar.classList.toggle('is-dim', !beam.visible);
    detail.textContent = beam.visible
      ? `${colour.css}  ·  ${formatAltitude(beam.pathLength)}`
      // The horizon first: at night the wall is also in the way, but "the star
      // has set" is the fact that explains the other one.
      : (beam.belowHorizon
        ? i18n.t('controls.star.belowHorizon')
        : i18n.t('color.blockedByWall'));
  }

  /**
   * How many rays of each colour arrived, laid out as the spectrum.
   *
   * This is the bridge between the picture and the swatch above it: the numbers
   * here are countable on the cross-section. When a shaft closes down, watch
   * which columns empty first - they do not. The mix stays; the total goes, and
   * the total is the brightness.
   */
  function renderBandTally(histogram) {
    if (!bandTally) return;
    bandTally.textContent = '';
    const counts = histogram.coneBandRays;
    if (!counts) return;
    for (const band of RAY_BANDS) {
      const item = document.createElement('div');
      item.className = 'band-tally-item';
      const n = counts[band.index] ?? 0;
      if (n === 0) item.classList.add('is-empty');
      item.title = `${band.fromNm}-${band.toNm} nm`;

      const bar = document.createElement('div');
      bar.className = 'band-tally-bar';
      bar.style.background = band.css;

      const count = document.createElement('div');
      count.className = 'band-tally-count';
      count.textContent = String(n);

      item.append(bar, count);
      bandTally.appendChild(item);
    }
  }

  /**
   * The integrator's answer, kept for comparison.
   *
   * Everything here is computed rather than traced. It is worth keeping, and
   * worth keeping visibly separate: when the measured colour and this one agree
   * to a thousandth of a chromaticity, that agreement is evidence about the
   * model, which it could not be if either were quietly derived from the other.
   */
  function renderTheory(result, histogram) {
    const primary = result.primary;
    const blocked = primary.view.blocked;
    const sky = primary.colors.sky;
    const star = primary.colors.star;

    swatchSky.querySelector('.swatch-chip').style.background = blocked ? '#000' : sky.css;
    swatchSky.querySelector('.swatch-caption').textContent = i18n.t('color.sky');
    swatchSky.querySelector('.swatch-detail').textContent = blocked
      ? i18n.t('color.blockedByWall')
      : `${sky.css}  ·  x=${sky.chromaticity[0].toFixed(3)} y=${sky.chromaticity[1].toFixed(3)}`;

    // What the whole field of view amounts to, worked out from the geometry of
    // the aperture rather than from the rays. The measured colour gets the same
    // fact for free, by dividing over the directions it looked in.
    const perceived = primary.colors.perceived;
    swatchPerceived.querySelector('.swatch-chip').style.background = perceived.css;
    swatchPerceived.querySelector('.swatch-caption').textContent = i18n.t('color.perceived');
    swatchPerceived.querySelector('.swatch-detail').textContent =
      `${perceived.css}  ·  ${i18n.t('color.skyShare')} `
      + formatShare(primary.metrics.fieldOfViewShare);

    swatchTheoryStar.querySelector('.swatch-chip').style.background = star.css;
    swatchTheoryStar.querySelector('.swatch-caption').textContent = i18n.t('color.star');
    swatchTheoryStar.querySelector('.swatch-detail').textContent = primary.beam.visible
      ? `${star.css}  ·  x=${star.chromaticity[0].toFixed(3)} y=${star.chromaticity[1].toFixed(3)}`
      : (primary.beam.blockedByWell
        ? i18n.t('color.blockedByWall') : i18n.t('controls.star.belowHorizon'));
    swatchTheoryStar.classList.toggle('is-dim', !primary.beam.visible);

    swatchNote.textContent = i18n.t('color.computed');
    renderAgreement(result, histogram);
  }

  /**
   * How far apart the two answers are.
   *
   * A few dozen rays is a noisy instrument, so this wanders by a percent or so
   * as a slider moves, and that is worth seeing: it is the size of the error bar
   * on the picture. What it must not do is drift.
   */
  function renderAgreement(result, histogram) {
    if (!theoryAgreement) return;
    if (!histogram || !(histogram.coneRays > 0) || !colorimetry) {
      theoryAgreement.textContent = '';
      return;
    }
    // Sky against sky. The swatch shows what fills the field of view, rock and
    // all; the integrator answers only for the sky, so comparing the two would
    // report a large difference down a shaft and mean nothing by it.
    const sky = histogram.coneSkySpectrum ?? histogram.coneSpectrum;
    const measured = colorimetry.spectrumToSrgb(sky, result.exposure);
    const target = result.primary.colors.sky.chromaticity;
    const distance = Math.hypot(
      measured.chromaticity[0] - target[0], measured.chromaticity[1] - target[1]);
    const measuredY = colorimetry.luminance(sky);
    const theoryY = colorimetry.luminance(result.primary.perceived);
    const ratio = theoryY > 0 ? measuredY / theoryY : null;
    theoryAgreement.textContent = i18n.t('color.agreement', {
      dxy: distance.toFixed(3),
      ratio: ratio == null ? '-' : ratio.toFixed(2),
      rays: histogram.coneRays,
    });
  }

  /** A fraction as a percentage, down to the very small ones a shaft produces. */
  function formatShare(fraction) {
    if (!(fraction > 0)) return '0 %';
    const pct = fraction * 100;
    if (pct >= 1) return `${pct.toFixed(0)} %`;
    if (pct >= 0.01) return `${pct.toFixed(2)} %`;
    return `${pct.toExponential(1)} %`;
  }

  /** Share of a spectrum's energy below the blue/red split. */
  function blueShare(spectrum, splitNm = 520) {
    let all = 0, blue = 0;
    for (let i = 0; i < spectrum.length; i++) {
      all += spectrum[i];
      if (380 + i * 10 < splitNm) blue += spectrum[i];
    }
    return all > 0 ? blue / all : null;
  }

  /**
   * The sentence that makes the picture quantitative.
   *
   * Taken off the rays, like everything else on this side of the tabs: the
   * spectrum they deliver from the cone, and the spectrum the star's own beam
   * still has when it arrives. Both wobble by a percent or two as a slider
   * moves, which is what a measurement of a few hundred samples does, and is
   * the honest price of the sentence being about the picture.
   */
  function renderPhotonTally(result, tally, state, histogram) {
    if (!tally || !state.rays.showScattering) {
      photonTally.hidden = true;
      return;
    }
    photonTally.hidden = false;
    const cs = i18n.getLanguage() === 'cs';
    const pct = (v) => (v == null ? null : Math.round(v * 100));
    const arriving = histogram && histogram.coneRays > 0
      ? pct(blueShare(histogram.coneSkySpectrum ?? histogram.coneSpectrum)) : null;
    const through = histogram && histogram.beam
      ? pct(blueShare(histogram.beam.spectrum)) : null;
    const emitted = pct(blueShare(result.source));

    if (arriving == null) {
      photonTally.textContent = cs
        ? 'Z tohoto směru k pozorovateli nedopadá žádné rozptýlené světlo.'
        : 'No scattered light reaches the observer from this direction.';
      return;
    }

    // Each clause stands on its own, because they can fail separately. Down a
    // shaft the sky is still there and the star is not, and an earlier version
    // dropped the whole sentence on that - reporting no scattered light at the
    // bottom of a well while twenty-one rays were coming down it.
    const parts = [];
    parts.push(cs
      ? `Ze světla, které dopadá k pozorovateli ze zorného kužele, je ${arriving} % modré `
        + '(< 520 nm)'
      : `Of the light arriving at the observer from the viewing cone, ${arriving}% is blue `
        + '(< 520 nm)');
    if (through != null) {
      parts.push(cs
        ? `ze světla, které projde bez rozptylu až k pozorovateli, jen ${through} %`
        : `of the light that crosses unscattered to the observer, only ${through}%`);
    }
    let text = `${parts.join('; ')}. `;
    text += cs ? `Hvězda přitom vyzářila ${emitted} % modré.`
      : `The star itself emitted ${emitted}% blue.`;

    const scattered = tally.scatteredFraction != null
      ? Math.round(tally.scatteredFraction * 100) : null;
    if (scattered != null) {
      text += cs ? ` Rozptýlí se přitom jen ${scattered} % světla, které vzduchem prochází.`
        : ` Only ${scattered}% of the light crossing the air is scattered at all.`;
    }
    photonTally.textContent = text;
  }

  /**
   * Whose numbers these are.
   *
   * Shown only while there are two observers to confuse, because a label that
   * is always there is read as decoration and stops answering the question it
   * exists for.
   */
  function renderTarget(result, state) {
    if (!panelTarget) return;
    panelTarget.hidden = !state.compare.enabled;
    if (!state.compare.enabled) return;
    const id = result.activeId;
    const observer = result.simulations.find((entry) => entry.id === id)?.observer;
    panelTarget.style.setProperty('--observer-colour', stationColour(id));
    panelTarget.textContent = i18n.t('compare.readoutFor')
      .replace('{observer}', i18n.t(id === 'b' ? 'compare.observerB' : 'compare.observerA'))
      .replace('{where}', observer ? formatPlace(observer.z, i18n) : '');
  }

  function update(result, tally, histogram) {
    const state = store.state;
    const advanced = state.level === 'advanced';

    const primary = result.primary;
    renderTarget(result, state);
    spectrumChart.update({
      curves: {
        source: result.source,
        direct: primary.beam.spectrum,
        scattered: primary.view.scattered,
        observed: primary.view.observed,
      },
    });
    spectrumChart.draw();

    renderMeasured(result, histogram);
    renderTheory(result, histogram);
    renderPhotonTally(result, tally, state, histogram);

    dataSection.hidden = false;
    renderRows([{ label: '', rows: rowsFor(primary, state) }], advanced);

    chromaSection.hidden = !advanced;
    if (advanced) {
      chromaticity.update({
        sky: primary.view.blocked ? null : primary.colors.sky.chromaticity,
        star: primary.beam.visible ? primary.colors.star.chromaticity : null,
      });
      chromaticity.draw();
    }
  }

  return { update, refreshLegendText };
}

/* ===== js/ui/explanation.js ===== */
/**
 * The explanation panel.
 *
 * It looks at the state the student has actually produced and picks the one
 * story that fits, then fills that story with the numbers currently on screen.
 * Order matters: the tests run from the most specific situation to the most
 * general, so standing at the bottom of a deep shaft is explained as a shaft
 * and not as "a slightly dark daytime sky".
 */

const SPACE_COLUMN_FRACTION = 2e-3;
const AIRLESS_TAU = 1e-6;
const THIN_TAU = 0.03;
const DENSE_TAU = 3;
const DEEP_APERTURE_DEG = 1;

function createExplanation(root, { i18n, store }) {
  const seeTitle = root.querySelector('#explain-see-title');
  const seeBody = root.querySelector('#explain-see-body');
  const whyTitle = root.querySelector('#explain-why-title');
  const whyBody = root.querySelector('#explain-why-body');
  const badge = root.querySelector('#explain-badge');

  /** Choose which explanation applies. */
  function classify(result, state) {
    const m = result.primary.metrics;
    const scene = result.primary.scene;
    // The star of the SELECTED simulation, which in a comparison need not be
    // the other panel's star at all.
    const star = activeSimulation(state).star;
    const tau550 = m.verticalTau[550];

    if (scene.wellActive) {
      return m.apertureHalfAngleDeg < DEEP_APERTURE_DEG ? 'wellDeep' : 'wellShallow';
    }
    // "Airless" is a property of the world, so it is judged at the surface;
    // "space" is a property of where the observer has climbed to. Testing the
    // observer's own optical depth would call the top of a thick atmosphere
    // airless, which is exactly the confusion the two texts exist to prevent.
    const surfaceTau = result.atmosphere.opticalDepth(
      result.atmosphere.verticalColumnRayleigh(0),
      result.atmosphere.verticalColumnAerosol(0))[Math.round((550 - 380) / 10)];
    if (surfaceTau < AIRLESS_TAU) return 'airless';
    if (m.columnFraction < SPACE_COLUMN_FRACTION) return 'space';
    // A world with real air but almost none of it: the scattering law is
    // untouched, only the amount of material is missing.
    if (surfaceTau < THIN_TAU && m.atmosphericAltitude < 3000) return 'thinAir';
    if (star.elevationDeg < 0) return 'twilight';
    // A low star is only a red sunset if the air takes more blue than red. With
    // the wavelength dependence switched off it merely dims, and the sunset
    // text - "blue is stripped out while red survives" - would contradict the
    // very numbers it quotes.
    if (star.elevationDeg < 10) {
      return m.beamTau[450] > 1.25 * m.beamTau[650] ? 'sunset' : 'greySunset';
    }
    if (tau550 > DENSE_TAU) return 'denseAtmosphere';

    // Molecules that scatter every colour alike make a grey sky, and the
    // day-sky text - "the shorter the wavelength, the stronger" - would then
    // quote a ratio of one against itself.
    const beta = result.atmosphere.rayleighBeta0;
    const i450 = Math.round((450 - 380) / 10), i650 = Math.round((650 - 380) / 10);
    if (beta[i650] > 0 && beta[i450] / beta[i650] < 1.5) return 'greySky';

    // Is the aerosol doing more of the scattering than the gas?
    const atmosphere = result.atmosphere;
    const index550 = Math.round((550 - 380) / 10);
    const gas = atmosphere.rayleighBeta0[index550] * atmosphere.scaleHeightRayleigh;
    const dust = atmosphere.aerosolSca0[index550] * atmosphere.scaleHeightAerosol;
    if (dust > gas) return 'dusty';

    if (m.atmosphericAltitude > 3000) return 'highAltitude';
    if (star.temperatureK < 4000) return 'coldStar';
    if (star.temperatureK > 9000) return 'hotStar';
    return 'daySky';
  }

  /** Numbers the explanation texts can quote. */
  function parameters(result, state) {
    const m = result.primary.metrics;
    const atmosphere = result.atmosphere;
    const i450 = Math.round((450 - 380) / 10);
    const i650 = Math.round((650 - 380) / 10);
    const scatterRatio = atmosphere.rayleighBeta0[i650] > 0
      ? atmosphere.rayleighBeta0[i450] / atmosphere.rayleighBeta0[i650]
      : 0;
    const illumination = result.primary.illumination;

    return {
      ratio: scatterRatio.toFixed(1),
      exponent: Number(activeSimulation(state).atmosphere.rayleighExponent ?? 4).toFixed(1),
      airmass: m.airMass >= 10 ? Math.round(m.airMass) : m.airMass.toFixed(1),
      tau450: formatTau(m.beamTau[450]),
      tau650: formatTau(m.beamTau[650]),
      z: formatAltitude(Math.abs(m.z)),
      scaleHeight: formatAltitude(m.scaleHeight),
      columnPercent: m.columnFraction >= 0.01
        ? `${(m.columnFraction * 100).toFixed(1)} %`
        : `${(m.columnFraction * 100).toExponential(1)} %`,
      aperture: formatAngle(m.apertureHalfAngleDeg),
      solidAngle: `${m.apertureSolidAngle.toExponential(2)} sr`,
      g: atmosphere.asymmetryG.toFixed(2),
      tau550: formatTau(m.verticalTau[550]),
      illuminanceRatio: illumination.totalOpen > 0
        ? (illumination.total / illumination.totalOpen).toExponential(1) : '0',
    };
  }

  function formatTau(value) {
    if (!Number.isFinite(value)) return '-';
    if (value >= 0.01 && value < 1000) return value.toFixed(2);
    return value.toExponential(1);
  }

  function update(result) {
    const state = store.state;
    const key = classify(result, state);
    const params = parameters(result, state);
    // Czech writes a decimal comma. These numbers sit inside Czech sentences,
    // where "4.5krát" reads as a typo; the data table keeps its own format.
    if (i18n.getLanguage() === 'cs') {
      for (const [k, v] of Object.entries(params)) {
        if (typeof v === 'string') params[k] = v.replace(/(\d)\.(\d)/g, '$1,$2');
      }
    }
    // The well texts quote the illuminance ratio under the name `ratio`.
    if (key === 'wellDeep') params.ratio = params.illuminanceRatio;

    seeTitle.textContent = i18n.t('explain.titleSee');
    whyTitle.textContent = i18n.t('explain.titleWhy');
    seeBody.textContent = i18n.t(`explain.states.${key}.see`, params);
    whyBody.textContent = i18n.t(`explain.states.${key}.why`, params);
    badge.textContent = key;
    root.dataset.state = key;
  }

  return { update };
}

/* ===== js/ui/experiments.js ===== */
/**
 * Guided experiments.
 *
 * Each step is a short piece of prose plus a patch to apply to the state, so a
 * student can be walked through a discovery without ever losing the ability to
 * grab a slider and wander off. Leaving an experiment changes nothing: the
 * controls simply stop being driven for you.
 *
 * A step is NOT applied on top of whatever happens to be on screen. It is
 * rebuilt from a clean starting situation plus every step up to it, so going
 * back, jumping ahead with the dots, or returning after wandering off all give
 * exactly the situation the text describes. Applying only the step's own patch
 * left the settings of other steps behind: going back from "put n = 4 back" to
 * "set n = 0" kept n = 4 while the text said 0.
 *
 * And a step says what it changed. The list under the text is computed from the
 * state before and after the step, named with the controls' own labels, so a
 * reader always knows which slider moved and to what - and the list cannot
 * drift from what the step really does, because it is not written by hand.
 */

const copyOf = (value) => JSON.parse(JSON.stringify(value));
const isPlainRecord = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

/** Deep merge of plain objects, patch winning; returns a new object. */
function mergedOver(base, patch) {
  const out = copyOf(base);
  (function into(target, source) {
    for (const [key, value] of Object.entries(source)) {
      if (isPlainRecord(value) && isPlainRecord(target[key])) into(target[key], value);
      else target[key] = copyOf(value);
    }
  })(out, patch);
  return out;
}

/**
 * The situation every guide starts from: the default star, world and observer,
 * no comparison, and the display at its normal brightness. The page's own
 * choices - language, how many rays, animation - are left alone.
 */
function guideBaseline() {
  const d = copyOf(DEFAULT_STATE);
  return {
    star: d.star, atmosphere: d.atmosphere, observer: d.observer,
    compare: d.compare, rays: { brightness: d.rays.brightness },
  };
}

function readGuidePath(object, path) {
  return path.split('.').reduce((node, key) => (node == null ? node : node[key]), object);
}

/**
 * The full situation step `index` of a guide stands for: the baseline plus
 * every step up to and including it. Pure, so the test suite can replay every
 * guide exactly as the page does.
 */
function guideSituation(experiment, index, level = 'basic') {
  let state = mergedOver(guideBaseline(), { level });
  for (let i = 0; i <= index; i++) {
    const step = experiment.steps[i];
    if (step?.state) state = mergedOver(state, step.state);
  }
  return state;
}

/**
 * Every state path a guide may change. Each is named in the "Changed" line
 * with the label of the control that shows it; a guide changing anything else
 * would be changing something the reader cannot find.
 */
const DESCRIBED_PATHS = [
  'level', 'star.presetId', 'star.temperatureK', 'star.elevationDeg', 'star.realisticInsolation',
  'atmosphere.presetId', 'atmosphere.densityScale', 'atmosphere.aerosolPresetId',
  'atmosphere.aerosolScale', 'atmosphere.rayleighExponent',
  'observer.z', 'observer.viewZenithDeg', 'observer.well.enabled', 'observer.well.radius_m',
  'observer.well.depth_m', 'observer.countShaftAir', 'observer.span_m',
  'compare.enabled', 'compare.active', 'rays.brightness',
];

function createExperiments(root, { i18n, store, config, onHighlight }) {
  const titleEl = root.querySelector('#experiment-title');
  const stepEl = root.querySelector('#experiment-step');
  const bodyEl = root.querySelector('#experiment-body');
  const changesEl = root.querySelector('#experiment-changes');
  const goalEl = root.querySelector('#experiment-goal');
  const observeEl = root.querySelector('#experiment-observe');
  const questionEl = root.querySelector('#experiment-question');
  const sourcesEl = root.querySelector('#experiment-sources');
  const prevBtn = root.querySelector('#experiment-prev');
  const nextBtn = root.querySelector('#experiment-next');
  const exitBtn = root.querySelector('#experiment-exit');
  const progressEl = root.querySelector('#experiment-progress');

  prevBtn.addEventListener('click', () => move(-1));
  nextBtn.addEventListener('click', () => move(1));
  exitBtn.addEventListener('click', () => exit());

  const onOff = (v) => i18n.t(v ? 'experiment.on' : 'experiment.off');
  const times = (v) => `${Number(v) < 10 ? Number(v).toFixed(2) : Math.round(v)} ×`;

  /**
   * What a guide may change, under the name the control panel gives it, and
   * how to print the new value. A path a guide changes that is missing here is
   * a guide changing something the reader cannot find - the test suite checks
   * there is none.
   */
  const DESCRIBED = [
    ['level', 'header.level', (v) => i18n.t(v === 'advanced' ? 'header.levelAdvanced' : 'header.levelBasic')],
    ['star.presetId', 'controls.star.preset', (v) => i18n.localized(config.stars.get(v)?.name, v)],
    ['star.temperatureK', 'controls.star.temperature', (v) => `${Math.round(v)} K`],
    ['star.elevationDeg', 'controls.star.elevation', (v) => `${v}°`],
    ['star.realisticInsolation', 'controls.star.realisticInsolation', onOff],
    ['atmosphere.presetId', 'controls.atmosphere.preset', (v) => i18n.localized(config.atmospheres.get(v)?.name, v)],
    ['atmosphere.densityScale', 'controls.atmosphere.density', times],
    ['atmosphere.aerosolPresetId', 'controls.atmosphere.aerosolType', (v) => (v
      ? i18n.localized(config.scattering.get('aerosols')?.presets?.[v]?.name, v)
      : i18n.t('controls.atmosphere.aerosolNative'))],
    ['atmosphere.aerosolScale', 'controls.atmosphere.aerosol', times],
    ['atmosphere.rayleighExponent', 'controls.atmosphere.exponent', (v) => `n = ${v}`],
    ['observer.z', 'controls.observer.position', (v) => (Math.abs(v) < 0.5
      ? i18n.t('controls.observer.groundLevel')
      : `${formatAltitude(Math.abs(v))} ${i18n.t(v > 0 ? 'controls.observer.aboveGround' : 'controls.observer.underground')}`)],
    ['observer.viewZenithDeg', 'controls.observer.viewDirection', (v) => (Math.abs(v) < 1
      ? `0° (${i18n.t('controls.observer.zenith')})` : `${Math.abs(v)}°`)],
    ['observer.well.enabled', 'controls.observer.wellEnabled', onOff],
    ['observer.well.radius_m', 'controls.observer.wellRadius', (v) => `${v} m`],
    ['observer.well.depth_m', 'controls.observer.wellDepth', (v) => formatAltitude(v)],
    ['observer.countShaftAir', 'controls.observer.countShaftAir', onOff],
    ['observer.span_m', 'controls.observer.zoom', (v) => (v ? formatAltitude(v) : i18n.t('experiment.auto'))],
    ['compare.enabled', 'compare.enable', onOff],
    ['compare.active', 'compare.controls', (v) => i18n.t(v === 'b' ? 'compare.observerB' : 'compare.observerA')],
    ['rays.brightness', 'controls.rays.brightness', times],
  ];
  const SIMULATION_PATHS = DESCRIBED.filter(([p]) => /^(star|atmosphere|observer)\./.test(p));
  if (DESCRIBED.length !== DESCRIBED_PATHS.length
    || DESCRIBED.some(([p], i) => p !== DESCRIBED_PATHS[i])) {
    throw new Error('experiments: DESCRIBED and DESCRIBED_PATHS disagree');
  }

  function current() {
    const state = store.state;
    if (!state.experimentId) return null;
    return config.experiments.get(state.experimentId) ?? null;
  }

  /** The full situation a step stands for: the baseline plus every step up to it. */
  const situationAt = (experiment, index) => guideSituation(experiment, index, store.state.level);

  /** The settings this step changed, as "label → value" lines. */
  function changesAt(experiment, index) {
    if (index === 0) return [];
    const before = situationAt(experiment, index - 1);
    const after = situationAt(experiment, index);
    const lines = [];
    const two = after.compare?.enabled || before.compare?.enabled;
    const describe = (path, labelKey, format, prefix = '') => {
      const a = readGuidePath(before, path), b = readGuidePath(after, path);
      if (JSON.stringify(a) === JSON.stringify(b)) return;
      lines.push(`${prefix}${i18n.t(labelKey)} → ${format(b)}`);
    };
    for (const [path, labelKey, format] of DESCRIBED) {
      const own = two && SIMULATION_PATHS.some(([p]) => p === path)
        ? `${i18n.t('compare.observerA')}: ` : '';
      describe(path, labelKey, format, own);
    }
    for (const [path, labelKey, format] of SIMULATION_PATHS) {
      describe(`compare.b.${path}`, labelKey, format, `${i18n.t('compare.observerB')}: `);
    }
    return lines;
  }

  function start(experimentId) {
    if (!experimentId) { exit(); return; }
    store.patch({ experimentId, experimentStep: 0 });
    applyStep(0);
  }

  function exit() {
    store.patch({ experimentId: null, experimentStep: 0 });
    onHighlight(null);
    render();
  }

  function move(delta) {
    const experiment = current();
    if (!experiment) return;
    const next = store.state.experimentStep + delta;
    if (next < 0) return;
    if (next >= experiment.steps.length) { exit(); return; }
    store.patch({ experimentStep: next });
    applyStep(next);
  }

  function applyStep(index) {
    const experiment = current();
    if (!experiment) return;
    const step = experiment.steps[index];
    if (!step) return;
    store.patch(situationAt(experiment, index));
    onHighlight(step.highlight ?? null);
    render();
  }

  function render() {
    const experiment = current();
    if (!experiment) {
      root.hidden = true;
      return;
    }
    root.hidden = false;
    const index = store.state.experimentStep;
    const step = experiment.steps[index];
    const total = experiment.steps.length;

    titleEl.textContent = i18n.localized(experiment.title);
    stepEl.textContent = i18n.t('experiment.step', { n: index + 1, total });
    bodyEl.textContent = i18n.localized(step.title) + ' — ' + i18n.localized(step.text);

    // The goal is stated once, at the start: what this guide is for.
    goalEl.hidden = !(index === 0 && experiment.goal);
    if (!goalEl.hidden) {
      goalEl.querySelector('.hint-label').textContent = i18n.t('experiment.goal');
      goalEl.querySelector('.hint-text').textContent = i18n.localized(experiment.goal);
    }

    const changes = changesAt(experiment, index);
    changesEl.hidden = changes.length === 0;
    changesEl.querySelector('.hint-label').textContent = i18n.t('experiment.changed');
    changesEl.querySelector('.hint-text').textContent = changes.join('  ·  ');

    if (step.observe) {
      observeEl.hidden = false;
      observeEl.querySelector('.hint-label').textContent = i18n.t('experiment.observe');
      observeEl.querySelector('.hint-text').textContent = i18n.localized(step.observe);
    } else {
      observeEl.hidden = true;
    }

    if (step.question) {
      questionEl.hidden = false;
      questionEl.querySelector('.hint-label').textContent = i18n.t('experiment.question');
      questionEl.querySelector('.hint-text').textContent = i18n.localized(step.question);
    } else {
      questionEl.hidden = true;
    }

    // Where the step's claims come from: plain links, built as elements so a
    // label can never be read as markup.
    const sources = Array.isArray(step.sources) ? step.sources : [];
    sourcesEl.hidden = sources.length === 0;
    sourcesEl.querySelector('.hint-label').textContent = i18n.t('experiment.sources');
    const list = sourcesEl.querySelector('.hint-text');
    list.textContent = '';
    sources.forEach((source, i) => {
      if (i > 0) list.append('  ·  ');
      const link = document.createElement('a');
      link.href = source.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = i18n.localized(source.label);
      list.append(link);
    });

    prevBtn.disabled = index === 0;
    prevBtn.textContent = i18n.t('experiment.previous');
    nextBtn.textContent = index === total - 1 ? i18n.t('experiment.finish') : i18n.t('experiment.next');
    exitBtn.textContent = i18n.t('experiment.exit');

    progressEl.textContent = '';
    for (let i = 0; i < total; i++) {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'progress-dot' + (i === index ? ' is-active' : '') + (i < index ? ' is-done' : '');
      dot.title = i18n.localized(experiment.steps[i].title);
      dot.addEventListener('click', () => {
        store.patch({ experimentStep: i });
        applyStep(i);
      });
      progressEl.appendChild(dot);
    }
  }

  /** Options for the header selector, ordered as the config files ask. */
  function listExperiments() {
    return Array.from(config.experiments.values())
      .sort((a, b) => (a.order ?? 0) - (b.order ?? 0))
      .map((e) => ({ value: e.id, label: i18n.localized(e.title), summary: i18n.localized(e.summary) }));
  }

  render();
  return { start, exit, render, listExperiments, changesAt };
}

/* ===== js/main.js ===== */
/**
 * Application bootstrap.
 *
 * Wiring only: load the configuration, build the physics, build the interface,
 * and keep the two in step. The loop recomputes the model at most once per
 * frame and only when something actually changed, so dragging a slider stays
 * responsive while an idle page costs nothing.
 */

const boot = document.getElementById('boot');
const bootMessage = document.getElementById('boot-message');

async function start() {
  const config = await loadConfiguration();
  const colorimetry = createColorimetry(config.colorimetryData);
  const i18n = createI18n(config.localization, config.index.defaults.language ?? 'cs');

  const store = createStore({ ...DEFAULT_STATE, language: i18n.getLanguage() });
  syncCeilings();

  /**
   * How high each observer may climb, which depends on that simulation's own
   * world. The two can be different worlds, so there are two answers.
   */
  function syncCeilings() {
    const state = store.state;
    store.setContext({
      maxAltitude: {
        a: maxAltitudeFor(config.atmospheres.get(state.atmosphere.presetId)),
        b: maxAltitudeFor(config.atmospheres.get(state.compare.b.atmosphere.presetId)),
      },
    });
  }

  const simulation = createSimulation({ config, colorimetry });

  const sceneRenderer = createSceneRenderer(
    document.getElementById('scene-canvas'), { i18n, colorimetry });
  const skyStrip = createSkyStrip(
    document.getElementById('sky-canvas'), { i18n, colorimetry });
  const beamHistogram = createBeamHistogram(
    document.getElementById('histogram-canvas'), { i18n });
  const spectrumChart = createSpectrumChart(document.getElementById('spectrum-canvas'), { i18n });
  const chromaticity = createChromaticityPlot(
    document.getElementById('chroma-canvas'), { colorimetry, i18n });

  const controls = createControls(
    document.getElementById('controls-root'), { store, i18n, config });
  const panels = createPanels(
    document.getElementById('right-panel'),
    { i18n, store, spectrumChart, chromaticity, colorimetry });
  const explanation = createExplanation(
    document.getElementById('explain-panel'), { i18n, store });
  const experiments = createExperiments(
    document.getElementById('experiment-panel'),
    { i18n, store, config, onHighlight: (id) => id && controls.highlight(id) });

  /* ---- Single Beam Chamber View (Tab 1) ---- */
  let activeView = 'beam';
  let beamState = {
    elevationDeg: 25,
    mode: 'sunlight',
    wavelengthNm: 532,
    densityScale: 1,
    rayleighExponent: 4,
    aerosolScale: 1,
    enableRefraction: true,
    animate: true,
  };

  const beamCanvasEl = document.getElementById('beam-canvas');
  let beamCanvas = null;
  let beamUI = null;

  function switchView(view) {
    activeView = view;
    const isBeam = view === 'beam';

    const tabBeam = document.getElementById('tab-btn-beam');
    const tabScattering = document.getElementById('tab-btn-scattering');
    if (tabBeam) tabBeam.classList.toggle('is-active', isBeam);
    if (tabScattering) tabScattering.classList.toggle('is-active', !isBeam);

    const beamControlsRoot = document.getElementById('beam-controls-root');
    const controlsRoot = document.getElementById('controls-root');
    if (beamControlsRoot) beamControlsRoot.hidden = !isBeam;
    if (controlsRoot) controlsRoot.hidden = isBeam;

    const beamCenterWrap = document.getElementById('beam-center-wrap');
    const scatteringCenterWrap = document.getElementById('scattering-center-wrap');
    if (beamCenterWrap) beamCenterWrap.hidden = !isBeam;
    if (scatteringCenterWrap) scatteringCenterWrap.hidden = isBeam;

    const beamTelemetryRoot = document.getElementById('beam-telemetry-root');
    const rightPanel = document.getElementById('right-panel');
    if (beamTelemetryRoot) beamTelemetryRoot.hidden = !isBeam;
    if (rightPanel) rightPanel.hidden = isBeam;

    if (isBeam && beamCanvas && beamUI) {
      beamCanvas.update(beamState);
      beamUI.update(beamState, beamCanvas.getTraceResult());
    } else {
      needsPaint = true;
    }
  }

  if (beamCanvasEl) {
    beamCanvas = createBeamCanvas(beamCanvasEl, {
      i18n,
      colorimetry,
      onElevationChange: (elev) => {
        beamState.elevationDeg = elev;
        if (beamUI) beamUI.update(beamState, beamCanvas.getTraceResult());
      },
    });

    beamUI = createBeamUI({
      leftContainer: document.getElementById('beam-controls-root'),
      rightContainer: document.getElementById('beam-telemetry-root'),
      i18n,
      colorimetry,
      onStateChange: (next) => {
        Object.assign(beamState, next);
        beamCanvas.update(beamState);
        beamUI.update(beamState, beamCanvas.getTraceResult());
      },
      onSwitchToScattering: () => {
        switchView('scattering');
      },
    });
  }

  // View toggle tabs listener
  const viewToggle = document.getElementById('view-toggle');
  if (viewToggle) {
    viewToggle.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-view]');
      if (!btn) return;
      switchView(btn.dataset.view);
    });
  }

  /* ---- derived data, recomputed only when its inputs move ---- */

  let result = null;
  /**
   * Everything traced, by observer id.
   *
   * Each observer gets their OWN trace, their own rock and their own sweep of
   * the sky. The comparison used to trace once and draw the result twice at two
   * heights, which meant the second panel showed the first observer's rays with
   * a different label under them - and the strip beneath both had to fall back
   * to theory, because one trace cannot answer for two observers.
   */
  let traces = new Map();
  let needsPhysics = true;
  let needsPhotons = true;
  let needsPaint = true;

  function recomputePhysics() {
    result = simulation.run(store.state);
    needsPhysics = false;
  }

  /** Trace one simulation, and measure everything that comes off those rays. */
  function traceFor(entry, panels) {
    const state = store.state;
    const { sim, atmosphere, source, observer } = entry;
    const photons = tracePhotons({
      atmosphere,
      source,
      sunElevationDeg: sim.star.elevationDeg,
      observerZ: observer.z,
      well: observer.well,
      countShaftAir: observer.countShaftAir,
      count: state.rays.showScattering ? state.rays.count : 0,
      starAngularRadiusDeg:
        config.stars.get(sim.star.presetId)?.angularRadius_deg ?? 0.2665,
      mix: state.rays.mix,
      // The rays must be laid out over exactly the region that will be drawn,
      // so the renderer is asked rather than the geometry guessed at.
      ...sceneRenderer.frameFor(observer, atmosphere, panels),
      seed: 20260828,
    });
    const tally = summarisePhotons(photons, { source });
    // The rock the shaft is cut through, lit by the sky that reaches it. The
    // strip fills its wings with it and the cross-section paints the hole in
    // the ground with it, so the two cannot drift apart.
    const wall = photons.length > 0
      ? shaftWallSpectrum(photons, atmosphere.groundReflectance, {
        depth_m: observer.well.depth_m,
        radius_m: observer.well.radius_m,
        sunZenithRad: (90 - sim.star.elevationDeg) * Math.PI / 180,
      })
      : null;
    // The strip under the picture is the colour swatch swept across the sky -
