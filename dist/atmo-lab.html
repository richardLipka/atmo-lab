function createSpectrumChart(canvas, { i18n }) {
  const ctx = canvas.getContext('2d', { alpha: false });
  let payload = null;
  let visible = new Set(SERIES.map((s) => s.key));

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(240, rect.width);
    const h = Math.max(150, rect.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  function update(next) { payload = next; }

  function toggle(key) {
    if (visible.has(key)) visible.delete(key); else visible.add(key);
  }

  function isVisible(key) { return visible.has(key); }

  function draw() {
    const { w, h } = resize();
    ctx.fillStyle = '#0b0e16';
    ctx.fillRect(0, 0, w, h);
    if (!payload) return;

    const padLeft = 34, padRight = 8, padTop = 10, padBottom = 30;
    const plot = { x: padLeft, y: padTop, w: w - padLeft - padRight, h: h - padTop - padBottom };

    const curves = SERIES
      .filter((s) => visible.has(s.key) && payload.curves[s.key])
      .map((s) => ({ ...s, values: payload.curves[s.key] }));

    // One shared vertical scale keeps the curves comparable; without it the
    // sky curve would be rescaled into looking as strong as the direct beam.
    let peak = 0;
    for (const c of curves) {
      for (let i = 0; i < SPECTRUM_BINS; i++) if (c.values[i] > peak) peak = c.values[i];
    }
    if (!(peak > 0)) peak = 1;

    const toX = (i) => plot.x + (i / (SPECTRUM_BINS - 1)) * plot.w;
    const toY = (v) => plot.y + plot.h - (v / peak) * plot.h;

    drawWavelengthAxis(plot, toX);
    drawGrid(plot, peak, toY);

    for (const c of curves) {
      ctx.save();
      ctx.strokeStyle = c.color;
      ctx.lineWidth = c.width;
      ctx.setLineDash(c.dash);
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < SPECTRUM_BINS; i++) {
        const x = toX(i), y = toY(c.values[i]);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    if (peak <= 1e-12 || curves.length === 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(i18n.t('spectrum.empty'), plot.x + plot.w / 2, plot.y + plot.h / 2);
      ctx.restore();
    }

    ctx.save();
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.textAlign = 'center';
    ctx.fillText(i18n.t('spectrum.axisX'), plot.x + plot.w / 2, h - 3);
    ctx.restore();
  }

  /** A true-colour ribbon under the axis, so the axis reads as light. */
  function drawWavelengthAxis(plot, toX) {
    const bandY = plot.y + plot.h + 3;
    const bandH = 7;
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      const [r, g, b] = wavelengthToDisplayRgb(WAVELENGTHS_NM[i]);
      ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
      ctx.fillRect(toX(i) - plot.w / (SPECTRUM_BINS - 1) / 2, bandY,
        plot.w / (SPECTRUM_BINS - 1) + 1, bandH);
    }
    ctx.save();
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (const nm of [400, 500, 600, 700]) {
      const i = (nm - 380) / 10;
      ctx.fillText(String(nm), toX(i), bandY + bandH + 1);
    }
    ctx.restore();
  }

  function drawGrid(plot, peak, toY) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '9px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let k = 0; k <= 4; k++) {
      const value = (peak * k) / 4;
      const y = toY(value);
      ctx.beginPath();
      ctx.moveTo(plot.x, y + 0.5);
      ctx.lineTo(plot.x + plot.w, y + 0.5);
      ctx.stroke();
      ctx.fillText(formatTick(value), plot.x - 4, y);
    }
    ctx.restore();
  }

  function formatTick(v) {
    if (v === 0) return '0';
    if (v >= 0.01 && v < 1000) return v.toPrecision(2);
    return v.toExponential(0);
  }

  return { update, draw, toggle, isVisible, series: SERIES };
}

/* ===== js/render/chromaticity.js ===== */
/**
 * The CIE 1931 chromaticity diagram, with the current sky and star plotted on
 * it. Advanced students can watch the sky point slide along the blue edge as
 * the wavelength exponent changes, and the star point crawl down the Planckian
 * locus as its temperature falls.
 */

function createChromaticityPlot(canvas, { colorimetry, i18n }) {
  const locus = colorimetry.spectralLocus();
  let payload = null;
  let backdrop = null;
  const ctx = canvas.getContext('2d', { alpha: false });

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const size = Math.max(120, Math.min(rect.width, 260));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(size * dpr) || canvas.height !== Math.round(size * dpr)) {
      canvas.width = Math.round(size * dpr);
      canvas.height = Math.round(size * dpr);
      backdrop = null;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return size;
  }

  const toX = (x, size) => 8 + x * (size - 20) / 0.75;
  const toY = (y, size) => size - 12 - y * (size - 20) / 0.85;

  /** The horseshoe is expensive to fill, so it is painted once and cached. */
  function buildBackdrop(size) {
    const off = document.createElement('canvas');
    off.width = size; off.height = size;
    const octx = off.getContext('2d');
    octx.fillStyle = '#0b0e16';
    octx.fillRect(0, 0, size, size);

    const image = octx.createImageData(size, size);
    for (let py = 0; py < size; py++) {
      for (let px = 0; px < size; px++) {
        const x = (px - 8) * 0.75 / (size - 20);
        const y = (size - 12 - py) * 0.85 / (size - 20);
        const z = 1 - x - y;
        if (x < 0 || y <= 0 || z < 0 || !insideLocus(x, y)) continue;
        // Normalise to constant luminance so the shape shows hue, not brightness.
        const scale = 1 / y;
        const linear = colorimetry.xyzToLinearRgb([x * scale, 1, z * scale]);
        const fitted = colorimetry.fitToGamut(linear);
        const i = (py * size + px) * 4;
        image.data[i] = Math.round(colorimetry.encodeComponent(fitted.rgb[0]) * 255);
        image.data[i + 1] = Math.round(colorimetry.encodeComponent(fitted.rgb[1]) * 255);
        image.data[i + 2] = Math.round(colorimetry.encodeComponent(fitted.rgb[2]) * 255);
        image.data[i + 3] = 235;
      }
    }
    octx.putImageData(image, 0, 0);
    return off;
  }

  /** Even-odd test against the closed spectral locus. */
  function insideLocus(x, y) {
    let inside = false;
    for (let i = 0, j = locus.length - 1; i < locus.length; j = i++) {
      const xi = locus[i].x, yi = locus[i].y;
      const xj = locus[j].x, yj = locus[j].y;
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }

  function update(next) { payload = next; }

  function draw() {
    const size = resize();
    if (!backdrop) backdrop = buildBackdrop(size);
    ctx.drawImage(backdrop, 0, 0);

    // Outline.
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    locus.forEach((p, i) => {
      const px = toX(p.x, size), py = toY(p.y, size);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    if (!payload) return;
    const points = [
      { xy: payload.sky, label: 'sky', ring: '#ffffff' },
      { xy: payload.star, label: 'star', ring: '#ffd88a' },
    ];
    for (const point of points) {
      if (!point.xy) continue;
      const px = toX(point.xy[0], size), py = toY(point.xy[1], size);
      ctx.save();
      ctx.strokeStyle = point.ring;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('x', size - 12, size - 2);
    ctx.fillText('y', 2, 10);
    ctx.restore();
  }

  return { update, draw };
}

/* ===== js/render/beam-histogram.js ===== */
/**
 * The light the drawn rays deliver, counted by colour.
 *
 * The spectrum plot on the right is the analytic answer: smooth curves the
 * integrator produced. This is the measured one, and it is the only one the
 * sky colour beside it is built from - a few hundred traced rays, each carrying
 * an unbiased estimate of what it contributes, gathered into the eight bands
 * the rays on screen are drawn in. One bar per colour, the same eight colours,
 * so a bar can be checked against the rays it is made of by counting them.
 *
 * Two earlier versions were wrong in instructive ways. The first counted rays
 * instead of weighing them, and a fixed number of rays is traced whatever the
 * state, so climbing to 40 km emptied the sky without moving a single bar. The
 * second weighed them but divided by the rays that ARRIVED, which is an average
 * over the survivors: at the bottom of a fifty-metre shaft, where five rays get
 * in out of fifty, it reported the same bright sky as open ground. The light
 * collected is now divided by the directions LOOKED IN, so a direction that
 * ends in rock contributes its nothing like any other, and the bars fall with
 * the ray count exactly as the eye does.
 *
 * One chart per observer, side by side under their own panels when the
 * comparison is running - but sharing ONE vertical scale, held at the brightest
 * sky either of them has shown. Giving each chart its own scale would fit both
 * to full height and hide the only thing the comparison exists to say, which is
 * that one of these skies is a hundredth of the other.
 *
 * Bars are as wide as their band, which is not equal: the bands are narrow
 * where the eye separates colours quickly and wide out in the deep red where it
 * does not. Filled means the light arrived from inside the viewing cone; the
 * grey stacked on top is the rest of the sky. The dashed outline is the
 * unscattered direct beam, scaled to its own peak because it carries thousands
 * of times more energy than the sky and is here for its shape - which marches
 * red as the star sinks.
 */

const PAD = { left: 34, right: 10, top: 10, bottom: 22 };

function createBeamHistogram(canvas, { i18n }) {
  const ctx = canvas.getContext('2d', { alpha: false });
  let data = null;
  /** The brightest the sky has been, held so the bars can visibly fall. */
  let reference = 0;

  function cssSize() {
    const rect = canvas.getBoundingClientRect();
    return { w: Math.max(240, rect.width), h: Math.max(80, rect.height) };
  }

  function resize() {
    const { w, h } = cssSize();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  function update(next) {
    data = next;
  }

  function draw() {
    const { w, h } = resize();
    ctx.fillStyle = '#0a0d16';
    ctx.fillRect(0, 0, w, h);
    const stations = data?.stations ?? [];
    if (stations.length === 0) return;

    // The scale is shared, so it has to be settled before either chart is
    // drawn: whichever observer has the brighter sky sets the height for both.
    for (const station of stations) {
      if (station.histogram && station.histogram.peak > reference) {
        reference = station.histogram.peak;

    if (stations.length === 1) {
      drawChart(stations[0], 0, w, h, false);
      return;
    }
    const gap = 10;
    const half = (w - gap) / 2;

  function drawChart(station, x0, w, h, labelled) {
    const histogram = station.histogram;
    if (!histogram) return;
    const active = station.id === data.activeId;

    const plot = {
      x: x0 + PAD.left, y: PAD.top,
      w: w - PAD.left - PAD.right, h: h - PAD.top - PAD.bottom,
    };
    const bins = histogram.centres.length;
    // A true wavelength axis: every band occupies exactly as much of the chart
    // as it occupies of the spectrum. Equal slots would make the deep red, one
    // band covering a third of the range, look like any other colour.
    const AXIS_TO = SPECTRUM_MAX_NM + 1;
    const nmToX = (nm) => plot.x
      + ((nm - SPECTRUM_MIN_NM) / (AXIS_TO - SPECTRUM_MIN_NM)) * plot.w;

    // The vertical scale is the brightest the sky has been since the page
    // loaded, held rather than re-fitted every frame. Re-fitting would defeat
    // the whole purpose: climbing until the sky is black would keep the bars
    // exactly as tall as before, which is the bug this chart exists to answer.

    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    for (const frac of [0, 0.5, 1]) {
      const y = plot.y + plot.h - frac * plot.h;
      ctx.beginPath();
      ctx.moveTo(plot.x, y + 0.5);
      ctx.lineTo(plot.x + plot.w, y + 0.5);
      ctx.stroke();
    }
    ctx.restore();

    const base = plot.y + plot.h;
    for (let b = 0; b < bins; b++) {
      const band = RAY_BANDS[b] ?? { fromNm: 380, edgeNm: 750, css: '#888' };
      const x = nmToX(band.fromNm) + 1;
      const barW = Math.max(2, nmToX(band.edgeNm) - nmToX(band.fromNm) - 2);
      const cone = histogram.inCone[b];
      const other = histogram.elsewhere[b];
      if (cone + other > 0) {
        const coneH = Math.min(plot.h, (cone / top) * plot.h);
        const otherH = Math.min(plot.h - coneH, (other / top) * plot.h);
        ctx.fillStyle = 'rgba(138, 147, 166, 0.42)';
        ctx.fillRect(x, base - coneH - otherH, barW, otherH);

        ctx.fillRect(x, base - coneH, barW, coneH);

      // what they carry; this is how many there are, and the two together are
      // the whole of what the sky colour is built from.
      const rays = histogram.coneBandRays ? histogram.coneBandRays[b] : 0;
      if (rays > 0 && barW >= 14) {
        ctx.save();
        ctx.font = '9px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = 'rgba(255,255,255,0.68)';
        const coneH = Math.min(plot.h, (cone / top) * plot.h);
        const otherH = Math.min(plot.h - coneH, (other / top) * plot.h);
        ctx.fillText(String(rays), x + barW / 2,
          Math.max(plot.y + 9, base - coneH - otherH - 1));
        ctx.restore();
      }
    }

    // The direct beam, drawn as an outline scaled to its own peak. It carries
    // thousands of times more energy than the sky does, so it cannot share the
    // axis; what it is here for is its SHAPE, which marches red as the star
    // sinks while the sky is doing something different.
    if (histogram.directPeak > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.45)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      for (let b = 0; b < bins; b++) {
        const y = plot.y + plot.h
          - (histogram.direct[b] / histogram.directPeak) * plot.h * 0.9;
        const x = nmToX(histogram.centres[b]);
        if (b === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    // Wavelength axis, drawn as the spectrum itself: no legend needed to say
    // which end is which.
    ctx.save();
    const strip = ctx.createLinearGradient(plot.x, 0, plot.x + plot.w, 0);
    for (let i = 0; i <= 10; i++) {
      const [r, g, b] = wavelengthToDisplayRgb(380 + (i / 10) * 370);
      strip.addColorStop(i / 10, `rgb(${r}, ${g}, ${b})`);
    }
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = strip;
    ctx.fillRect(plot.x, plot.y + plot.h + 3, plot.w, 4);
    ctx.restore();

    ctx.save();
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText('380 nm', plot.x, plot.y + plot.h + 9);
    ctx.textAlign = 'right';
    ctx.fillText('750 nm', plot.x + plot.w, plot.y + plot.h + 9);
    ctx.restore();

    // Whose light this is. Same letter, same colour, same frame as the panel
    // and the strip, so the three read as one column about one observer.
    if (labelled) {
      const colour = stationColour(station.id);
      ctx.save();
      ctx.font = '600 10px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillStyle = colour;
      ctx.fillText(i18n.t(station.id === 'a' ? 'compare.observerA' : 'compare.observerB'),
        plot.x + 2, plot.y + 1);
      if (active) {
        ctx.strokeStyle = colour;
        ctx.lineWidth = 2;
        ctx.strokeRect(x0 + 1, 1, w - 2, h - 2);
      }
      ctx.restore();
    }

    ctx.save();
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.textBaseline = 'top';

    const parts = [];
    if (histogram.coneMeanNm != null) {
      parts.push(`${i18n.t('histogram.sky')} ${histogram.coneMeanNm.toFixed(0)} nm`);
    }
    if (histogram.directMeanNm != null) {
      parts.push(`${i18n.t('histogram.direct')} ${histogram.directMeanNm.toFixed(0)} nm`);
    }
    if (parts.length) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      ctx.fillText(parts.join('   ·   '), plot.x + plot.w / 2, plot.y + plot.h + 9);
    }

    // How far the sky has fallen from its brightest, which is the number that
    // moves when the observer climbs and the bars shrink to nothing.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    const share = reference > 0 ? histogram.peak / reference : 0;
    ctx.fillText(share >= 0.995 ? '100 %'
      : share >= 0.01 ? `${(share * 100).toFixed(0)} %`
        : share > 0 ? `${(share * 100).toPrecision(2)} %` : '0 %',
    x0 + 2, plot.y + 6);
    ctx.restore();
  }

  /** Forget the held scale, so a new world or star starts from its own peak. */
  function resetScale() {
    reference = 0;
  }

  return { update, draw, resetScale };
}

/* ===== js/physics/beam-tracer.js ===== */
/**
 * Single Beam Ray Tracer & Atmospheric Interaction Model.
 *
 * Simulates a single pencil beam (or photon stream) entering the atmosphere
 * from space at an adjustable elevation angle theta (from 90° midday zenith
 * down to 0° sunset horizon).
 *
 * Physics & Literature:
 *   1. Spherical planetary chord geometry through an exponential atmosphere (Chapman function).
 *   2. Continuous refraction bending and chromatic dispersion via Ciddor (1996) / Peck & Reeder (1972)
 *      and the Gladstone-Dale relation.
 *   3. Molecular Rayleigh scattering (Bodhaine et al. 1999 cross-sections, King factor, dipole phase).
 *   4. Aerosol Mie scattering & absorption (OPAC models, Angstrom 1929 law, Henyey-Greenstein 1941 phase,
 *      single-scattering albedo varpi_0).
 *   5. Spectral attenuation via Beer-Lambert-Bouguer law, demonstrating why
 *      red light penetrates morning/evening grazing chords while blue light is
 *      scattered away into diffuse sky glow.
 */



const EARTH_RADIUS_M = 6371000;
const TOA_ALTITUDE_M = 100000; // Top of atmosphere: 100 km (consistent with earth.json)
const GAS_SCALE_HEIGHT_M = 8500; // Gas scale height (m) (Bodhaine et al. 1999, identical to earth.json)
const AEROSOL_SCALE_HEIGHT_M = 1200; // Aerosol layer scale height (m)

// Standard sea-level volume scattering coefficients (m^-1) at 550 nm
const SEA_LEVEL_RAYLEIGH_BETA_550 = 1.142e-5; // Bodhaine et al. (1999) Eq. 30, identical to earth.json
const SEA_LEVEL_AEROSOL_BETA_550 = 3.5e-5;

/**
 * Standard refractivity (n_0 - 1) of dry air at 15°C, 101.325 kPa (Ciddor 1996 / Peck & Reeder 1972).
 * sigma is wavenumber in um^-1: sigma = 1000 / lambda_nm.
 */
function airRefractivitySTP(lambdaNm) {
  const sigma = 1000 / Math.max(300, Math.min(1000, lambdaNm));
  const s2 = sigma * sigma;
  return (5792105 / (238.0185 - s2) + 167917 / (57.362 - s2)) * 1e-8;
}

/**
 * Geometric chord length through the spherical atmosphere from top of atmosphere
 * to the ground observer at elevation angle thetaDeg above horizon.
 */
function chordLengthM(elevationDeg, R = EARTH_RADIUS_M, zTop = TOA_ALTITUDE_M) {
  const elevRad = (Math.max(0, Math.min(90, elevationDeg)) * Math.PI) / 180;
  const sinE = Math.sin(elevRad);
  // Quadratic equation: L^2 + 2*R*sinE*L - (2*R*zTop + zTop^2) = 0
  return Math.sqrt(R * R * sinE * sinE + 2 * R * zTop + zTop * zTop) - R * sinE;
}

/**
 * Approximate optical airmass relative to zenith.
 * At 90° M = 1. At 0° (horizon) M ~ 35-38 due to Earth's spherical curvature (Chapman function).
 */
function calculateAirmass(elevationDeg) {
  const elev = Math.max(0, Math.min(90, elevationDeg));
  if (elev >= 15) {
    return 1 / Math.sin((elev * Math.PI) / 180);
  }
  // Kasten & Young (1989) formula for low angles down to horizon
  const thetaZ = 90 - elev;
  return 1 / (Math.cos((thetaZ * Math.PI) / 180) + 0.50572 * Math.pow(96.07995 - thetaZ, -1.6364));
}

/**
 * Build default top-of-atmosphere solar spectrum (approximate 5800K blackbody normalized at 550nm).
 */
function solarSourceSpectrum() {
  const spec = specNew();
  for (let i = 0; i < SPECTRUM_BINS; i++) {
    const nm = WAVELENGTHS_NM[i];
    // Planck curve shape relative to 550 nm
    const lM = nm * 1e-9;
    const lM550 = 550e-9;
    const h = 6.626e-34, c = 3.0e8, k = 1.38e-23, T = 5800;
    const p = 1 / (Math.pow(lM, 5) * (Math.exp((h * c) / (lM * k * T)) - 1));
    const p550 = 1 / (Math.pow(lM550, 5) * (Math.exp((h * c) / (lM550 * k * T)) - 1));
    spec[i] = p / p550;
  }
  return spec;
}

/**
 * Create a monochromatic delta-spectrum at a specific wavelength.
 */
function monochromaticSpectrum(wavelengthNm) {
  const spec = specNew();
  let closest = 0;
  let minDiff = Infinity;
  for (let i = 0; i < SPECTRUM_BINS; i++) {
    const diff = Math.abs(WAVELENGTHS_NM[i] - wavelengthNm);
    if (diff < minDiff) {
      minDiff = diff;
      closest = i;
    }
  }
  spec[closest] = 1.0;
  if (closest > 0) spec[closest - 1] = 0.25;
  if (closest < SPECTRUM_BINS - 1) spec[closest + 1] = 0.25;
  return spec;
}

/**
 * Trace a single beam from top of atmosphere to the ground observer.
 *
 * @param {object} options
 *   elevationDeg         Sun / beam angle above horizon (0° to 90°)
 *   mode                 'sunlight' | 'monochromatic'
 *   wavelengthNm         Target wavelength if monochromatic (380 to 750)
 *   densityScale         Gas density multiplier (default 1)
 *   gasScaleHeightM      Gas scale height in metres (default 8400)
 *   rayleighExponent     Rayleigh law exponent (default 4; 0 = wavelength neutral)
 *   depolarization       Molecular depolarization ratio (default 0.0279)
 *   aerosolScale         Aerosol concentration multiplier (default 1)
 *   aerosolScaleHeightM  Aerosol scale height in metres (default 1200)
 *   angstromExponent     Aerosol spectral exponent (default 1.0; 0 = fog/cloud, 1.8 = smoke)
 *   aerosolAlbedo        Single-scattering albedo (default 1.0; < 1.0 includes absorption)
 *   asymmetryFactor      Henyey-Greenstein asymmetry parameter g (default 0.75)
 *   enableRefraction     Whether refraction curvature is active (boolean)
 *   refractionFactor     Visual exaggeration factor for refraction (1 = realistic, 15 = visible)
 *   stepCount            Number of spatial segments along chord (default 160)
 *   seed                 Random seed for scattering event generator
 */
function traceSingleBeam(options = {}) {
  const {
    elevationDeg = 25,
    mode = 'sunlight',
    wavelengthNm = 532,
    densityScale = 1,
    gasScaleHeightM = GAS_SCALE_HEIGHT_M,
    rayleighExponent = 4,
    depolarization = 0.0279,
    aerosolScale = 1,
    aerosolScaleHeightM = AEROSOL_SCALE_HEIGHT_M,
    angstromExponent = 1,
    aerosolAlbedo = 1.0,
    asymmetryFactor = 0.75,
    enableRefraction = true,
    refractionFactor = 1,
    stepCount = 160,
    seed = 42,
  } = options;

  const R = EARTH_RADIUS_M;
  const zTop = TOA_ALTITUDE_M;
  const elevRad = (Math.max(0, Math.min(90, elevationDeg)) * Math.PI) / 180;
  const cosE = Math.cos(elevRad);
  const sinE = Math.sin(elevRad);

  const L = chordLengthM(elevationDeg, R, zTop);
  const ds = L / stepCount;

  // Initial source spectrum
  const sourceSpec = mode === 'monochromatic'
    ? monochromaticSpectrum(wavelengthNm)
    : solarSourceSpectrum();

  // Wavelength-dependent sea-level scattering coefficients
  const betaRayleighSL = specNew();
  const betaAerosolExtSL = specNew();
  const betaAerosolScaSL = specNew();
  const albedo = Math.max(0.1, Math.min(1.0, aerosolAlbedo));

  for (let i = 0; i < SPECTRUM_BINS; i++) {
    const nm = WAVELENGTHS_NM[i];
    const rayIdeal = Math.pow(REFERENCE_WAVELENGTH_NM / nm, rayleighExponent);
    betaRayleighSL[i] = SEA_LEVEL_RAYLEIGH_BETA_550 * densityScale * rayIdeal * AIR_DISPERSION_FACTOR[i];

    const aerExt = SEA_LEVEL_AEROSOL_BETA_550 * aerosolScale * Math.pow(REFERENCE_WAVELENGTH_NM / nm, angstromExponent);
    betaAerosolExtSL[i] = aerExt;
    betaAerosolScaSL[i] = aerExt * albedo;
  }

  // Refractivity at target/reference wavelength
  const refWl = mode === 'monochromatic' ? wavelengthNm : 550;
  const n0_minus_1 = airRefractivitySTP(refWl) * densityScale;

  // Running optical depth per wavelength bin
  const tau = specNew();

  // Trajectory points from space (s = L) down to observer (s = 0)
  const pathPoints = [];
  const scatteringEvents = [];

  let rngState = seed;
  function random() {
    rngState = (rngState * 1664525 + 1013904223) >>> 0;
    return rngState / 4294967296;
  }

  let totalRayleighEvents = 0;
  let totalAerosolEvents = 0;
  let totalAbsorbedEvents = 0;

  // Refraction deflection accumulator
  let totalDeflectionRad = 0;

  for (let step = stepCount; step >= 0; step--) {
    const sFromObserver = step * ds; // distance along unrefracted line to observer
    const sFromEntry = L - sFromObserver;

    // Unrefracted Cartesian coordinates in planet frame:
    // Observer is at (0, R). Beam arrives from (cosE, sinE).
    let x = sFromObserver * cosE;
    let y = R + sFromObserver * sinE;

    // Accumulate continuous refraction deflection angle if enabled
    if (enableRefraction && n0_minus_1 > 0 && sFromEntry > 0) {
      const rCurrent = Math.sqrt(x * x + y * y);
      const zCurrent = Math.max(0, rCurrent - R);
      const gasDensityFrac = Math.exp(-zCurrent / gasScaleHeightM);
      // Continuous bending dTheta/ds = (grad n / n) * sin(zenith)
      const gradN = (n0_minus_1 / gasScaleHeightM) * gasDensityFrac;
      const bendRate = gradN * cosE * refractionFactor;
      totalDeflectionRad += bendRate * ds;
    }

    const r = Math.sqrt(x * x + y * y);
    const z = Math.max(0, r - R);

    // Exponential density profiles
    const gasFrac = Math.exp(-z / gasScaleHeightM);
    const aerFrac = Math.exp(-z / aerosolScaleHeightM);

    // Accumulate extinction along this step (for step < stepCount)
    if (step < stepCount) {
      for (let i = 0; i < SPECTRUM_BINS; i++) {
        const betaExt = betaRayleighSL[i] * gasFrac + betaAerosolExtSL[i] * aerFrac;
        tau[i] += betaExt * ds;
      }
    }

    // Local transmittance and surviving beam spectrum
    const localTransmittance = specNew();
    const localSpec = specNew();
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      localTransmittance[i] = Math.exp(-tau[i]);
      localSpec[i] = sourceSpec[i] * localTransmittance[i];
    }

    // Record point along the path
    const normalizedIntensity = localTransmittance[Math.round(SPECTRUM_BINS / 2)];
    pathPoints.push({
      sFromEntry,
      sFromObserver,
      x,
      y,
      altitudeM: z,
      spectrum: specCopy(localSpec),
      transmittance: specCopy(localTransmittance),
      normalizedIntensity,
    });

    // Check for scattering and absorption events in this step
    if (step < stepCount && z < zTop) {
      const bRay = SEA_LEVEL_RAYLEIGH_BETA_550 * densityScale * gasFrac;
      const bAerExt = SEA_LEVEL_AEROSOL_BETA_550 * aerosolScale * aerFrac;
      const bAerSca = bAerExt * albedo;
      const bTotalExt = bRay + bAerExt;

      const pEvent = 1 - Math.exp(-bTotalExt * ds);
      const visualChance = Math.min(0.65, pEvent * 18);

      if (random() < visualChance) {
        const isRayleigh = (bRay + bAerExt > 0) ? (random() < (bRay / (bRay + bAerExt))) : true;
        let scatterAngleRad = 0;

        if (isRayleigh) {
          totalRayleighEvents++;
          // Rayleigh phase: sample from a + b * cos^2(theta)
          const rho = Math.max(0, Math.min(0.5, depolarization));
          const gamma = rho / (2 - rho);
          const a = 1 + 3 * gamma;
          const b = 1 - gamma;
          const xi = random();
          const p = (3 * a) / b;
          const q = (3 / b) * (a + b / 3) * (1 - 2 * xi);
          const root = Math.sqrt((q * q) / 4 + (p * p * p) / 27);
          const mu = Math.cbrt(-q / 2 + root) + Math.cbrt(-q / 2 - root);
          const cosTheta = Math.max(-1, Math.min(1, mu));
          scatterAngleRad = Math.acos(cosTheta);
        } else {
          // Aerosol event: check if absorbed or scattered
          const isScattered = random() < albedo;
          if (!isScattered) {
            totalAbsorbedEvents++;
          } else {
            totalAerosolEvents++;
            // Henyey-Greenstein phase sampling with configurable g
            const g = Math.max(-0.95, Math.min(0.95, asymmetryFactor));
            const s = (1 - g * g) / (1 - g + 2 * g * random());
            const cosTheta = (1 + g * g - s * s) / (2 * g);
            scatterAngleRad = Math.acos(Math.max(-1, Math.min(1, cosTheta)));
          }
        }

        // Beam direction vector
        const beamDirX = -cosE;
        const beamDirY = -sinE;
        const baseAngle = Math.atan2(beamDirY, beamDirX);
        const sign = random() > 0.5 ? 1 : -1;
        const outAngle = baseAngle + sign * scatterAngleRad;

        // Wavelength preference of the scattered light
        const daughterSpec = specNew();
        for (let i = 0; i < SPECTRUM_BINS; i++) {
          const nm = WAVELENGTHS_NM[i];
          const scWeight = isRayleigh ? Math.pow(550 / nm, rayleighExponent) : Math.pow(550 / nm, angstromExponent);
          daughterSpec[i] = localSpec[i] * scWeight;
        }

        scatteringEvents.push({
          x,
          y,
          altitudeM: z,
          distanceM: sFromEntry,
          type: isRayleigh ? 'rayleigh' : (albedo < 1.0 && random() > albedo ? 'absorbed' : 'mie'),
          scatterAngleDeg: (scatterAngleRad * 180) / Math.PI,
          outDirectionX: Math.cos(outAngle),
          outDirectionY: Math.sin(outAngle),
          spectrum: daughterSpec,
        });
      }
    }
  }

  // Final surviving direct beam at ground
  const finalTransmittance = specNew();
  const finalSpec = specNew();
  for (let i = 0; i < SPECTRUM_BINS; i++) {
    finalTransmittance[i] = Math.exp(-tau[i]);
    finalSpec[i] = sourceSpec[i] * finalTransmittance[i];
  }

  // Key wavelength transmittances
  const tBlue = finalTransmittance[7]; // ~450 nm
  const tGreen = finalTransmittance[15]; // ~530 nm
  const tRed = finalTransmittance[27]; // ~650 nm

  return {
    elevationDeg,
    mode,
    wavelengthNm,
    totalChordLengthKm: L / 1000,
    airmass: calculateAirmass(elevationDeg),
    opticalDepth550: tau[17], // ~550 nm
    finalTransmittance,
    finalSpectrum: finalSpec,
    keyTransmittances: {
      blue450: tBlue,
      green530: tGreen,
      red650: tRed,
    },
    pathPoints,
    scatteringEvents,
    counts: {
      rayleigh: totalRayleighEvents,
      aerosol: totalAerosolEvents,
      absorbed: totalAbsorbedEvents,
    },
    deflectionArcmin: (totalDeflectionRad * 180 * 60) / Math.PI,
  };
}

/**
 * Wavelength-dependent effective collision radius for Rayleigh scattering on gas molecules.
 * Follows sigma proportional to lambda^(-4), meaning collision radius r_eff = sqrt(sigma / pi) proportional to lambda^(-2).
 */
function effectiveCollisionRadius(wavelengthNm, baseRadiusPx = 5.5) {
  const clampedWl = Math.max(380, Math.min(750, wavelengthNm));
  const ratio = 550 / clampedWl;
  // Area scales as ratio^4 -> radius scales as ratio^2
  return baseRadiusPx * (ratio * ratio);
}

/**
 * Sample deflection angle theta according to Rayleigh dipole phase function:
 * P(theta) ~ (1 + cos^2 theta)
 * Returns theta in radians [-PI, PI].
 */
function sampleRayleighAngle(randomFn = Math.random) {
  for (let iter = 0; iter < 100; iter++) {
    const theta = (randomFn() * 2 - 1) * Math.PI;
    const cosT = Math.cos(theta);
    const prob = (1 + cosT * cosT) / 2; // in [0.5, 1.0]
    if (randomFn() <= prob) {
      return theta;
    }
  }
  return 0;
}

/**
 * Sample deflection angle theta according to Henyey-Greenstein phase function:
 * P(cos theta, g) = (1 - g^2) / (1 + g^2 - 2g cos theta)^(3/2)
 * Returns theta in radians [-PI, PI].
 */
function sampleHenyeyGreensteinAngle(g = 0.75, randomFn = Math.random) {
  const gClamped = Math.max(0, Math.min(0.98, g));
  if (gClamped < 1e-4) {
    return (randomFn() * 2 - 1) * Math.PI;
  }
  const u = randomFn();
  const term = (1 - gClamped * gClamped) / (1 - gClamped + 2 * gClamped * u);
  const cosTheta = (1 + gClamped * gClamped - term * term) / (2 * gClamped);
  const clampedCos = Math.max(-1, Math.min(1, cosTheta));
  const theta = Math.acos(clampedCos);
  const sign = randomFn() < 0.5 ? 1 : -1;
  return sign * theta;
}

/**
 * Create a discrete field of gas molecules (N2/O2) and aerosols in an interaction chamber.
 */
function createChamberParticles(width = 800, height = 450, options = {}) {
  const {
    densityScale = 1.0,
    aerosolScale = 1.0,
    aerosolAlbedo = 1.0,
    asymmetryFactor = 0.75,
    seed = 12345,
  } = options;

  let rngState = seed;
  function random() {
    rngState = (rngState * 1664525 + 1013904223) >>> 0;
    return rngState / 4294967296;
  }

  const padX = 60;
  const padY = 30;
  const usableW = Math.max(100, width - padX * 2);
  const usableH = Math.max(100, height - padY * 2);

  // Molecule count scales with densityScale: base 90 at density 1.0
  const gasCount = Math.round(90 * Math.max(0.1, densityScale));
  // Aerosol count scales with aerosolScale: base 14 at aerosolScale 1.0
  const aeroCount = Math.round(14 * Math.max(0, aerosolScale));

  const particles = [];
  let id = 1;

  // Distribute gas molecules
  for (let i = 0; i < gasCount; i++) {
    particles.push({
      id: id++,
      type: 'gas',
      x: padX + random() * usableW,
      y: padY + random() * usableH,
      vx: (random() - 0.5) * 4,
      vy: (random() - 0.5) * 4,
      baseRadius: 5.0,
      bondAngle: random() * Math.PI * 2,
      rotationSpeed: (random() - 0.5) * 1.5,
      lastHitTime: -100,
      hitCount: 0,
    });
  }

  // Distribute aerosols
  for (let j = 0; j < aeroCount; j++) {
    particles.push({
      id: id++,
      type: 'aerosol',
      x: padX + random() * usableW,
      y: padY + random() * usableH,
      vx: (random() - 0.5) * 1.5,
      vy: (random() - 0.5) * 1.5,
      radius: 9.0 + random() * 6.0,
      albedo: aerosolAlbedo,
      g: asymmetryFactor,
      lastHitTime: -100,
      hitCount: 0,
    });
  }

  return {
    width,
    height,
    particles,
    options,
  };
}

/**
 * Trace a single micro-ray through the chamber of particles.
 */
function traceMicroRay(chamber, rayOptions = {}) {
  const {
    startX = 50,
    startY = chamber.height / 2,
    angleRad = 0,
    wavelengthNm = 532,
    maxBounces = 3,
    aerosolAlbedo = 1.0,
    asymmetryFactor = 0.75,
    randomFn = Math.random,
  } = rayOptions;

  const segments = [];
  const collisions = [];

  let curX = startX;
  let curY = startY;
  let curAngle = angleRad;
  let bounces = 0;
  let absorbed = false;
  let status = 'in_flight';

  const minX = 0;
  const maxX = chamber.width;
  const minY = 0;
  const maxY = chamber.height;
  const detectorX = chamber.width - 50;

  const visitedParticleIds = new Set();

  while (bounces <= maxBounces && !absorbed) {
    const dirX = Math.cos(curAngle);
    const dirY = Math.sin(curAngle);

    let closestDist = Infinity;
    let hitParticle = null;
    let hitPoint = null;

    for (const p of chamber.particles) {
      if (visitedParticleIds.has(p.id)) continue;

      let rColl = 0;
      if (p.type === 'gas') {
        rColl = effectiveCollisionRadius(wavelengthNm, p.baseRadius);
      } else {
        rColl = p.radius;
      }

      const dx = p.x - curX;
      const dy = p.y - curY;

      const proj = dx * dirX + dy * dirY;
      if (proj <= 1.0) continue;

      const perpSq = (dx * dx + dy * dy) - proj * proj;
      if (perpSq <= rColl * rColl) {
        const halfChord = Math.sqrt(Math.max(0, rColl * rColl - perpSq));
        const dist = proj - halfChord;
        if (dist > 1.0 && dist < closestDist) {
          closestDist = dist;
          hitParticle = p;
          hitPoint = {
            x: curX + dirX * dist,
            y: curY + dirY * dist,
          };
        }
      }
    }

    let boundaryDist = Infinity;
    if (dirX > 1e-6) {
      boundaryDist = Math.min(boundaryDist, (maxX - curX) / dirX);
    } else if (dirX < -1e-6) {
      boundaryDist = Math.min(boundaryDist, (minX - curX) / dirX);
    }
    if (dirY > 1e-6) {
      boundaryDist = Math.min(boundaryDist, (maxY - curY) / dirY);
    } else if (dirY < -1e-6) {
      boundaryDist = Math.min(boundaryDist, (minY - curY) / dirY);
    }

    if (hitParticle && closestDist < boundaryDist) {
      visitedParticleIds.add(hitParticle.id);
      segments.push({
        x1: curX,
        y1: curY,
        x2: hitPoint.x,
        y2: hitPoint.y,
        wavelengthNm,
      });

      curX = hitPoint.x;
      curY = hitPoint.y;

      if (hitParticle.type === 'gas') {
        const scAngle = sampleRayleighAngle(randomFn);
        curAngle += scAngle;
        bounces++;
        collisions.push({
          x: curX,
          y: curY,
          particleId: hitParticle.id,
          type: 'rayleigh',
          scatterAngleDeg: (scAngle * 180) / Math.PI,
          wavelengthNm,
        });
      } else {
        const albedo = hitParticle.albedo ?? aerosolAlbedo;
        if (randomFn() > albedo) {
          absorbed = true;
          status = 'absorbed';
          collisions.push({
            x: curX,
            y: curY,
            particleId: hitParticle.id,
            type: 'absorbed',
            scatterAngleDeg: 0,
            wavelengthNm,
          });
          break;
        } else {
          const scAngle = sampleHenyeyGreensteinAngle(hitParticle.g ?? asymmetryFactor, randomFn);
          curAngle += scAngle;
          bounces++;
          collisions.push({
            x: curX,
            y: curY,
            particleId: hitParticle.id,
            type: 'mie',
            scatterAngleDeg: (scAngle * 180) / Math.PI,
            wavelengthNm,
          });
        }
      }
    } else {
      const endX = curX + dirX * Math.min(boundaryDist, 1200);
      const endY = curY + dirY * Math.min(boundaryDist, 1200);
      segments.push({
        x1: curX,
        y1: curY,
        x2: endX,
        y2: endY,
        wavelengthNm,
      });
      curX = endX;
      curY = endY;

      if (endX >= detectorX - 15 && endY >= chamber.height * 0.25 && endY <= chamber.height * 0.75 && Math.abs(curAngle) < 0.35) {
        status = 'transmitted';
      } else {
        status = 'scattered_away';
      }
      break;
    }
  }

  return {
    segments,
    collisions,
    bounces,
    absorbed,
    status,
    finalX: curX,
    finalY: curY,
    finalAngle: curAngle,
    wavelengthNm,
  };
}

/**
 * Trace a bundle of rays through the chamber.
 * Directly demonstrates how the macroscopic beam emerges from individual ray collisions.
 */
function traceMicroBundle(chamber, bundleOptions = {}) {
  const {
    rayCount = 30,
    beamHeight = 70,
    startY = chamber.height / 2,
    mode = 'sunlight',
    wavelengthNm = 532,
    aerosolAlbedo = 1.0,
    asymmetryFactor = 0.75,
    seed = 42,
  } = bundleOptions;

  let rngState = seed;
  function random() {
    rngState = (rngState * 1664525 + 1013904223) >>> 0;
    return rngState / 4294967296;
  }

  const rays = [];
  const halfH = beamHeight / 2;

  let directTransmittedCount = 0;
  let scatteredAwayCount = 0;
  let absorbedCount = 0;
  let rayleighHitCount = 0;
  let aerosolHitCount = 0;

  const transmittedWls = [];
  const scatteredWls = [];

  for (let i = 0; i < rayCount; i++) {
    const offsetFrac = rayCount > 1 ? (i / (rayCount - 1)) * 2 - 1 : 0;
    const y0 = startY + offsetFrac * halfH;

    let wl = wavelengthNm;
    if (mode === 'sunlight') {
      const wlFrac = i / Math.max(1, rayCount - 1);
      wl = Math.round(410 + wlFrac * 260); // 410 to 670 nm
    }

    const res = traceMicroRay(chamber, {
      startX: 50,
      startY: y0,
      angleRad: 0,
      wavelengthNm: wl,
      aerosolAlbedo,
      asymmetryFactor,
      randomFn: random,
    });

    rays.push(res);

    for (const c of res.collisions) {
      if (c.type === 'rayleigh') rayleighHitCount++;
      else if (c.type === 'mie') aerosolHitCount++;
      else if (c.type === 'absorbed') absorbedCount++;
    }

    if (res.status === 'transmitted') {
      directTransmittedCount++;
      transmittedWls.push(wl);
    } else if (res.status === 'absorbed') {
      absorbedCount++;
    } else {
      scatteredAwayCount++;
      scatteredWls.push(wl);
    }
  }

  return {
    rays,
    rayCount,
    directTransmittedCount,
    scatteredAwayCount,
    absorbedCount,
    rayleighHitCount,
    aerosolHitCount,
    transmittedRatio: directTransmittedCount / rayCount,
    scatteredRatio: scatteredAwayCount / rayCount,
    absorbedRatio: absorbedCount / rayCount,
    transmittedWavelengths: transmittedWls,
    scatteredWavelengths: scatteredWls,
  };
}

/* ===== js/render/beam-canvas.js ===== */
/**
 * Interactive Atmospheric Ray Tracer Canvas.
 *
 * Provides two synchronized views:
 *   1. 'micro' (Default): Microscopic Interaction Chamber.
 *      Directly visualizes the path of a ray (or a bundle of rays), discrete collisions
 *      with gas molecules (N2/O2) and aerosol particles, dipole wavelets, scattering
 *      angles theta, and how a bundle of rays naturally reddens as blue rays are
 *      scattered out to the sides.
 *   2. 'macro': Planetary Earth Atmosphere.
 *      Visualizes spherical chord geometry from space to observer, airmass,
 *      and atmospheric refraction.
 */


function createBeamCanvas(canvas, { i18n, colorimetry, onElevationChange, onStateChange }) {
  const ctx = canvas.getContext('2d', { alpha: false });

  let state = {
    viewType: 'micro', // 'micro' | 'macro'
    bundleMode: 'bundle', // 'single' | 'bundle'
    elevationDeg: 25,
    mode: 'sunlight', // 'sunlight' | 'monochromatic'
    wavelengthNm: 532,
    densityScale: 1,
    gasScaleHeightM: 8500,
    rayleighExponent: 4,
    aerosolScale: 1,
    aerosolScaleHeightM: 1200,
    angstromExponent: 1.0,
    aerosolAlbedo: 1.0,
    asymmetryFactor: 0.75,
    enableRefraction: true,
    refractionFactor: 15,
    animate: true,
    loupeMode: 'rayleigh',
    chamberSeed: 12345,
  };

  let traceResult = null;
  let microChamber = null;
  let microSingleResult = null;
  let microBundleResult = null;

  let animTime = 0;
  let isDraggingSun = false;
  let singleRayProgress = 0; // for animated single ray shot

  // Interactive buttons on the canvas header
  const buttons = [];

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(300, rect.width || canvas.clientWidth || 800);
    const h = Math.max(220, rect.height || canvas.clientHeight || 450);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const targetW = Math.round(w * dpr);
    const targetH = Math.round(h * dpr);
    if (canvas.width !== targetW || canvas.height !== targetH) {
      canvas.width = targetW;
      canvas.height = targetH;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  function recompute() {
    traceResult = traceSingleBeam({
      elevationDeg: state.elevationDeg,
      mode: state.mode,
      wavelengthNm: state.wavelengthNm,
      densityScale: state.densityScale,
      gasScaleHeightM: state.gasScaleHeightM,
      rayleighExponent: state.rayleighExponent,
      aerosolScale: state.aerosolScale,
      aerosolScaleHeightM: state.aerosolScaleHeightM,
      angstromExponent: state.angstromExponent,
      aerosolAlbedo: state.aerosolAlbedo,
      asymmetryFactor: state.asymmetryFactor,
      enableRefraction: state.enableRefraction,
      refractionFactor: state.refractionFactor,
    });

    const { w, h } = resize();

    // Scale chamber particle density with elevation:
    // Low sun (sunset) corresponds to higher effective path density!
    const pathDensityFactor = Math.max(0.6, Math.min(2.8, (traceResult.airmass || 1) * 0.45));
    const effectiveGasDensity = state.densityScale * pathDensityFactor;
    const effectiveAeroDensity = state.aerosolScale * pathDensityFactor;

    microChamber = createChamberParticles(w, h, {
      densityScale: effectiveGasDensity,
      aerosolScale: effectiveAeroDensity,
      aerosolAlbedo: state.aerosolAlbedo,
      asymmetryFactor: state.asymmetryFactor,
      seed: state.chamberSeed,
    });

    // Single ray trace
    microSingleResult = traceMicroRay(microChamber, {
      startX: 70,
      startY: h / 2,
      angleRad: 0,
      wavelengthNm: state.mode === 'monochromatic' ? state.wavelengthNm : 450,
      aerosolAlbedo: state.aerosolAlbedo,
      asymmetryFactor: state.asymmetryFactor,
    });

    // Bundle trace
    microBundleResult = traceMicroBundle(microChamber, {
      rayCount: 28,
      beamHeight: Math.min(100, h * 0.38),
      startY: h / 2,
      mode: state.mode,
      wavelengthNm: state.wavelengthNm,
      aerosolAlbedo: state.aerosolAlbedo,
      asymmetryFactor: state.asymmetryFactor,
      seed: state.chamberSeed + 7,
    });
  }

  function update(newState) {
    let changed = false;
    for (const [k, v] of Object.entries(newState)) {
      if (state[k] !== v) {
        state[k] = v;
        changed = true;
      }
    }
    if (changed || !traceResult) {
      recompute();
    }
    draw();
  }

  function getPointerElevation(e) {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    const cx = rect.width * 0.18;
    const cy = rect.height * 0.84;

    const dx = px - cx;
    const dy = cy - py;
    if (dx <= 0 && dy <= 0) return state.elevationDeg;

    let rad = Math.atan2(dy, dx);
    let deg = (rad * 180) / Math.PI;
    deg = Math.max(0, Math.min(90, deg));
    return deg;
  }

  canvas.addEventListener('pointerdown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    // Check click on UI buttons on canvas
    for (const btn of buttons) {
      if (px >= btn.x && px <= btn.x + btn.w && py >= btn.y && py <= btn.y + btn.h) {
        btn.onClick();
        draw();
        return;
      }
    }

    if (state.viewType === 'macro') {
      const loupeX = rect.width - 130;
      const loupeY = rect.height - 130;
      if (Math.hypot(px - loupeX, py - loupeY) <= 60) {
        state.loupeMode = state.loupeMode === 'rayleigh' ? 'mie' : 'rayleigh';
        draw();
        return;
      }

      isDraggingSun = true;
      canvas.setPointerCapture(e.pointerId);
      const newElev = getPointerElevation(e);
      if (Math.abs(newElev - state.elevationDeg) > 0.5) {
        state.elevationDeg = newElev;
        recompute();
        if (onElevationChange) onElevationChange(newElev);
        draw();
      }
    } else {
      // In micro mode: clicking chamber triggers a ray shoot animation or re-seeds
      singleRayProgress = 0;
      draw();
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isDraggingSun || state.viewType !== 'macro') return;
    const newElev = getPointerElevation(e);
    state.elevationDeg = newElev;
    recompute();
    if (onElevationChange) onElevationChange(newElev);
    draw();
  });

  const stopDrag = (e) => {
    if (isDraggingSun) {
      isDraggingSun = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  };
  canvas.addEventListener('pointerup', stopDrag);
  canvas.addEventListener('pointercancel', stopDrag);

  // Animation loop
  function tick(timestamp) {
    animTime = timestamp * 0.001;
    if (state.animate) {
      singleRayProgress = (singleRayProgress + 0.015) % 1;
      draw();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function draw() {
    const { w, h } = resize();
    if (!traceResult || !microChamber) recompute();

    buttons.length = 0; // Clear button hitboxes

    if (state.viewType === 'micro') {
      drawMicroView(ctx, w, h);
    } else {
      drawMacroView(ctx, w, h);
    }

    // Top control bar
    drawTopNav(ctx, w, h);
  }

  /**
   * Top Navigation Switcher on Canvas.
   */
  function drawTopNav(ctx, w, h) {
    const isCs = i18n.getLanguage() === 'cs';
    ctx.save();

    let startX = 14;
    const barY = 14;
    const barH = 30;

    // View switcher: [🔬 Mikrosimulace] | [🌍 Zemská atmosféra]
    const viewBtnW = isCs ? 150 : 140;
    const isMicro = state.viewType === 'micro';

    // Micro button
    ctx.fillStyle = isMicro ? '#2979ff' : 'rgba(20, 26, 40, 0.85)';
    ctx.strokeStyle = isMicro ? '#70a5ff' : '#2b364c';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(startX, barY, viewBtnW, barH, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(isCs ? '🔬 Mikrosimulace kolizí' : '🔬 Particle Collisions', startX + viewBtnW / 2, barY + 19);

    buttons.push({
      x: startX, y: barY, w: viewBtnW, h: barH,
      onClick: () => {
        state.viewType = 'micro';
        if (onStateChange) onStateChange(state);
      },
    });

    startX += viewBtnW + 8;

    // Macro button
    const macroBtnW = isCs ? 150 : 140;
    ctx.fillStyle = !isMicro ? '#2979ff' : 'rgba(20, 26, 40, 0.85)';
    ctx.strokeStyle = !isMicro ? '#70a5ff' : '#2b364c';
    ctx.beginPath();
    ctx.roundRect(startX, barY, macroBtnW, barH, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.fillText(isCs ? '🌍 Zemská atmosféra' : '🌍 Earth Atmosphere', startX + macroBtnW / 2, barY + 19);

    buttons.push({
      x: startX, y: barY, w: macroBtnW, h: barH,
      onClick: () => {
        state.viewType = 'macro';
        if (onStateChange) onStateChange(state);
      },
    });

    startX += macroBtnW + 16;

    if (isMicro) {
      // Beam composition: [⚡ 1 Paprsek] | [🔦 Svazek]
      const isBundle = state.bundleMode === 'bundle';
      const singleBtnW = isCs ? 100 : 90;

      ctx.fillStyle = !isBundle ? '#00e676' : 'rgba(20, 26, 40, 0.85)';
      ctx.strokeStyle = !isBundle ? '#69f0ae' : '#2b364c';
      ctx.beginPath();
      ctx.roundRect(startX, barY, singleBtnW, barH, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = !isBundle ? '#000000' : '#ffffff';
      ctx.fillText(isCs ? '⚡ 1 Paprsek' : '⚡ Single Ray', startX + singleBtnW / 2, barY + 19);

      buttons.push({
        x: startX, y: barY, w: singleBtnW, h: barH,
        onClick: () => {
          state.bundleMode = 'single';
          if (onStateChange) onStateChange(state);
        },
      });

      startX += singleBtnW + 6;

      const bundleBtnW = isCs ? 110 : 100;
      ctx.fillStyle = isBundle ? '#00e676' : 'rgba(20, 26, 40, 0.85)';
      ctx.strokeStyle = isBundle ? '#69f0ae' : '#2b364c';
      ctx.beginPath();
      ctx.roundRect(startX, barY, bundleBtnW, barH, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = isBundle ? '#000000' : '#ffffff';
      ctx.fillText(isCs ? '🔦 Svazek paprsků' : '🔦 Beam Bundle', startX + bundleBtnW / 2, barY + 19);

      buttons.push({
        x: startX, y: barY, w: bundleBtnW, h: barH,
        onClick: () => {
          state.bundleMode = 'bundle';
          if (onStateChange) onStateChange(state);
        },
      });

      startX += bundleBtnW + 12;

      // Reseed particles button
      const reseedW = 34;
      ctx.fillStyle = 'rgba(20, 26, 40, 0.85)';
      ctx.strokeStyle = '#2b364c';
      ctx.beginPath();
      ctx.roundRect(startX, barY, reseedW, barH, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '13px system-ui, sans-serif';
      ctx.fillText('🔄', startX + reseedW / 2, barY + 20);

      buttons.push({
        x: startX, y: barY, w: reseedW, h: barH,
        onClick: () => {
          state.chamberSeed = (state.chamberSeed * 1664525 + 1013904223) >>> 0;
          recompute();
          if (onStateChange) onStateChange(state);
        },
      });
    }

    ctx.restore();
  }

  /**
   * 1. MICROSCOPIC INTERACTION CHAMBER (Particle Collisions View).
   */
  function drawMicroView(ctx, w, h) {
    const isCs = i18n.getLanguage() === 'cs';

    // Chamber background
    const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
    bgGrad.addColorStop(0, '#060810');
    bgGrad.addColorStop(1, '#0c101c');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    // Chamber geometry
    const padLeft = 70;
    const padRight = 80;
    const padTop = 60;
    const padBottom = 40;
    const cw = w - padLeft - padRight;
    const ch = h - padTop - padBottom;
    const centerY = padTop + ch / 2;

    // Chamber grid background
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    for (let x = padLeft; x <= padLeft + cw; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, padTop);
      ctx.lineTo(x, padTop + ch);
      ctx.stroke();
    }
    for (let y = padTop; y <= padTop + ch; y += 40) {
      ctx.beginPath();
      ctx.moveTo(padLeft, y);
      ctx.lineTo(padLeft + cw, y);
      ctx.stroke();
    }
    ctx.restore();

    // Top and Bottom "Sky" collection borders
    ctx.save();
    const skyGradTop = ctx.createLinearGradient(0, padTop, 0, padTop + 35);
    skyGradTop.addColorStop(0, 'rgba(60, 140, 255, 0.22)');
    skyGradTop.addColorStop(1, 'rgba(60, 140, 255, 0)');
    ctx.fillStyle = skyGradTop;
    ctx.fillRect(padLeft, padTop, cw, 35);

    const skyGradBot = ctx.createLinearGradient(0, padTop + ch, 0, padTop + ch - 35);
    skyGradBot.addColorStop(0, 'rgba(60, 140, 255, 0.22)');
    skyGradBot.addColorStop(1, 'rgba(60, 140, 255, 0)');
    ctx.fillStyle = skyGradBot;
    ctx.fillRect(padLeft, padTop + ch - 35, cw, 35);
    ctx.restore();

    // Chamber border enclosure
    ctx.save();
    ctx.strokeStyle = 'rgba(90, 120, 170, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(padLeft, padTop, cw, ch);
    ctx.restore();

    // Emitter on Left
    ctx.save();
    const emitterH = Math.min(100, ch * 0.44);
    const emitterY = centerY - emitterH / 2;
    ctx.fillStyle = '#182030';
    ctx.strokeStyle = '#3d4d6e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(padLeft - 24, emitterY, 24, emitterH, [6, 0, 0, 6]);
    ctx.fill();
    ctx.stroke();

    // Emitter glow aperture
    const sourceCol = state.mode === 'sunlight' ? '#fff4db' : colorimetry.spectrumToSrgb(traceResult.finalSpectrum, 1.5).css;
    const emitGlow = ctx.createRadialGradient(padLeft, centerY, 2, padLeft, centerY, emitterH * 0.6);
    emitGlow.addColorStop(0, sourceCol);
    emitGlow.addColorStop(0.5, 'rgba(255, 200, 100, 0.4)');
    emitGlow.addColorStop(1, 'rgba(255, 200, 100, 0)');
    ctx.fillStyle = emitGlow;
    ctx.fillRect(padLeft - 5, emitterY, 15, emitterH);

    ctx.fillStyle = '#8b9bb4';
    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'right';
    ctx.fillText(isCs ? 'ZDROJ' : 'SOURCE', padLeft - 28, centerY + 3);
    ctx.restore();

    // Detector / Receiver on Right
    ctx.save();
    const detectorH = Math.min(110, ch * 0.48);
    const detectorY = centerY - detectorH / 2;
    const finalSRGB = colorimetry.spectrumToSrgb(traceResult.finalSpectrum, 1.4);
    const receivedCol = finalSRGB.css;

    ctx.fillStyle = '#182030';
    ctx.strokeStyle = '#3d4d6e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(padLeft + cw, detectorY, 28, detectorH, [0, 6, 6, 0]);
    ctx.fill();
    ctx.stroke();

    // Sensor screen face
    ctx.fillStyle = receivedCol;
    ctx.shadowColor = receivedCol;
    ctx.shadowBlur = 12;
    ctx.fillRect(padLeft + cw + 3, detectorY + 6, 12, detectorH - 12);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#8b9bb4';
    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(isCs ? 'DETEKTOR' : 'DETECTOR', padLeft + cw + 34, centerY + 3);
    ctx.restore();

    // 2. Draw Particles in Chamber: Gas Molecules & Aerosols
    drawParticles(ctx, microChamber, animTime);

    // 3. Draw Rays: Single Ray vs. Bundle Mode
    if (state.bundleMode === 'single') {
      drawSingleRayMode(ctx, microSingleResult, microChamber, animTime, isCs, colorimetry);
    } else {
      drawBundleMode(ctx, microBundleResult, microChamber, animTime, isCs, colorimetry, padLeft, cw, padTop, ch);
    }

    // 4. Chamber Info Badge
    drawMicroTelemetry(ctx, w, h, isCs, microBundleResult, state);
  }

  /**
   * Draw individual gas molecules (diatomic N2/O2) and aerosols.
   */
  function drawParticles(ctx, chamber, time) {
    for (const p of chamber.particles) {
      // Gentle thermal jitter
      const jx = Math.sin(time * 2 + p.id * 1.3) * 1.2;
      const jy = Math.cos(time * 2 + p.id * 1.7) * 1.2;
      const px = p.x + jx;
      const py = p.y + jy;

      if (p.type === 'gas') {
        // Diatomic molecule (N2 / O2): two paired atoms with bond
        const rot = p.bondAngle + time * p.rotationSpeed;
        const bondDist = 3.8;
        const x1 = px + Math.cos(rot) * bondDist;
        const y1 = py + Math.sin(rot) * bondDist;
        const x2 = px - Math.cos(rot) * bondDist;
        const y2 = py - Math.sin(rot) * bondDist;

        // Covalent bond
        ctx.save();
        ctx.strokeStyle = 'rgba(100, 170, 255, 0.5)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        // Atom 1
        ctx.fillStyle = '#5aa9ff';
        ctx.shadowColor = '#5aa9ff';
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(x1, y1, 2.8, 0, Math.PI * 2);
        ctx.fill();

        // Atom 2
        ctx.beginPath();
        ctx.arc(x2, y2, 2.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else {
        // Aerosol particle: larger dust grain or water droplet
        ctx.save();
        const r = p.radius;
        const aeroGrad = ctx.createRadialGradient(px - r * 0.3, py - r * 0.3, r * 0.1, px, py, r);
        aeroGrad.addColorStop(0, 'rgba(255, 230, 160, 0.85)');
        aeroGrad.addColorStop(0.7, 'rgba(200, 160, 90, 0.65)');
        aeroGrad.addColorStop(1, 'rgba(140, 100, 50, 0.35)');

        ctx.fillStyle = aeroGrad;
        ctx.strokeStyle = 'rgba(255, 220, 140, 0.7)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  /**
   * Draw Single Ray trajectory with collision callouts and dipole wavelets.
   */
  function drawSingleRayMode(ctx, rayResult, chamber, time, isCs, colorimetry) {
    if (!rayResult || !rayResult.segments) return;

    const wl = rayResult.wavelengthNm;
    const colStr = wlToColor(wl);

    // 1. Draw Ray Segments
    ctx.save();
    for (let i = 0; i < rayResult.segments.length; i++) {
      const seg = rayResult.segments[i];

      // Segment glow
      ctx.strokeStyle = colStr;
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(seg.x1, seg.y1);
      ctx.lineTo(seg.x2, seg.y2);
      ctx.stroke();

      // Segment core
      ctx.globalAlpha = 0.95;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(seg.x1, seg.y1);
      ctx.lineTo(seg.x2, seg.y2);
      ctx.stroke();
    }
    ctx.restore();

    // 2. Collision Points and Reactions
    for (let j = 0; j < rayResult.collisions.length; j++) {
      const c = rayResult.collisions[j];
      const isRayleigh = c.type === 'rayleigh';

      ctx.save();
      // Flash at collision point
      ctx.fillStyle = isRayleigh ? '#ffffff' : '#ffd54f';
      ctx.shadowColor = colStr;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(c.x, c.y, isRayleigh ? 4.5 : 6, 0, Math.PI * 2);
      ctx.fill();

      // Expanding dipole wavelets radiating outward from molecule
      const wavePhase = (time * 3 + j * 0.4) % 1;
      for (let r = 8; r <= 32; r += 8) {
        const rad = r + wavePhase * 10;
        ctx.strokeStyle = colStr;
        ctx.globalAlpha = Math.max(0, 0.6 - (rad / 42));
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(c.x, c.y, rad, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Callout box near collision
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = 'rgba(15, 20, 32, 0.90)';
      ctx.strokeStyle = isRayleigh ? '#5aa9ff' : '#ffd54f';
      ctx.lineWidth = 1;

      const calloutText = isRayleigh
        ? (isCs ? `💥 Kolize s molekulou plynu! Rozptyl θ = ${Math.abs(c.scatterAngleDeg).toFixed(0)}°` : `💥 Molecular collision! Rayleigh θ = ${Math.abs(c.scatterAngleDeg).toFixed(0)}°`)
        : (c.type === 'absorbed'
          ? (isCs ? '💥 Pohlceno aerosolem (absorpce)' : '💥 Absorbed by aerosol')
          : (isCs ? `💥 Kolize s aerosolem! Dopředný rozptyl θ = ${Math.abs(c.scatterAngleDeg).toFixed(0)}°` : `💥 Aerosol collision! Forward Mie θ = ${Math.abs(c.scatterAngleDeg).toFixed(0)}°`));

      ctx.font = '10px ui-monospace, monospace';
      const textW = ctx.measureText(calloutText).width;
      const boxX = Math.min(chamber.width - textW - 20, Math.max(20, c.x - textW / 2));
      const boxY = c.y - 28;

      ctx.beginPath();
      ctx.roundRect(boxX - 6, boxY - 12, textW + 12, 20, 4);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.fillText(calloutText, boxX, boxY + 2);
      ctx.restore();
    }

    // 3. Animated photon bead traveling along path
    ctx.save();
    let totalLen = 0;
    for (const s of rayResult.segments) {
      totalLen += Math.hypot(s.x2 - s.x1, s.y2 - s.y1);
    }
    const currentDist = (singleRayProgress * totalLen);
    let walked = 0;
    let beadX = rayResult.segments[0].x1;
    let beadY = rayResult.segments[0].y1;

    for (const s of rayResult.segments) {
      const segLen = Math.hypot(s.x2 - s.x1, s.y2 - s.y1);
      if (walked + segLen >= currentDist) {
        const frac = (currentDist - walked) / Math.max(1, segLen);
        beadX = s.x1 + (s.x2 - s.x1) * frac;
        beadY = s.y1 + (s.y2 - s.y1) * frac;
        break;
      }
      walked += segLen;
    }

    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = colStr;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(beadX, beadY, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /**
   * Draw Beam Bundle composed of multiple individual rays.
   * Shows blue rays deflecting out to the sides while red rays pass straight through.
   */
  function drawBundleMode(ctx, bundleResult, chamber, time, isCs, colorimetry, padLeft, cw, padTop, ch) {
    if (!bundleResult || !bundleResult.rays) return;

    ctx.save();
    for (let i = 0; i < bundleResult.rays.length; i++) {
      const ray = bundleResult.rays[i];
      const colStr = wlToColor(ray.wavelengthNm);

      // Draw segments
      for (let s = 0; s < ray.segments.length; s++) {
        const seg = ray.segments[s];
        const isFirst = s === 0;

        ctx.strokeStyle = colStr;
        ctx.globalAlpha = isFirst ? 0.45 : 0.28;
        ctx.lineWidth = isFirst ? 1.8 : 1.2;

        ctx.beginPath();
        ctx.moveTo(seg.x1, seg.y1);
        ctx.lineTo(seg.x2, seg.y2);
        ctx.stroke();
      }

      // Animated photons streaming down each ray
      if (ray.segments.length > 0) {
        const phase = (time * 0.8 + i * 0.08) % 1;
        const seg0 = ray.segments[0];
        const segLen = Math.hypot(seg0.x2 - seg0.x1, seg0.y2 - seg0.y1);
        const px = seg0.x1 + (seg0.x2 - seg0.x1) * phase;
        const py = seg0.y1 + (seg0.y2 - seg0.y1) * phase;

        ctx.fillStyle = colStr;
        ctx.beginPath();
        ctx.arc(px, py, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw collision nodes
      for (const c of ray.collisions) {
        ctx.fillStyle = c.type === 'rayleigh' ? '#5aa9ff' : '#ffd54f';
        ctx.beginPath();
        ctx.arc(c.x, c.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  /**
   * Telemetry overlay badge for Micro view.
   */
  function drawMicroTelemetry(ctx, w, h, isCs, bundleResult, state) {
    ctx.save();
    const isSingle = state.bundleMode === 'single';

    let telemetryText = '';
    if (isSingle) {
      telemetryText = isCs
        ? '💡 Sleduj dráhu 1 paprsku a jeho srážky s molekulami (Rayleigh) a aerosoly (Mie)'
        : '💡 Trace 1 ray path and watch collisions with molecules (Rayleigh) and aerosols (Mie)';
    } else if (bundleResult) {
      const transPct = Math.round(bundleResult.transmittedRatio * 100);
      const scaPct = Math.round(bundleResult.scatterRatio !== undefined ? bundleResult.scatterRatio * 100 : bundleResult.scatteredRatio * 100);
      telemetryText = isCs
        ? `Svazek: Prošlo přímo na detektor: ${transPct}%  |  Rozptýleno do stran (modrá obloha): ${scaPct}%  |  Srážky: ${bundleResult.rayleighHitCount} Rayleigh, ${bundleResult.aerosolHitCount} Mie`
        : `Bundle: Direct transmitted: ${transPct}%  |  Side scattered (blue sky): ${scaPct}%  |  Hits: ${bundleResult.rayleighHitCount} Rayleigh, ${bundleResult.aerosolHitCount} Mie`;
    }

    ctx.fillStyle = 'rgba(15, 20, 32, 0.88)';
    ctx.strokeStyle = '#253046';
    ctx.lineWidth = 1;
    ctx.font = '11px ui-monospace, monospace';
    const textW = ctx.measureText(telemetryText).width;

    const bX = 14;
    const bY = h - 34;
    ctx.beginPath();
    ctx.roundRect(bX, bY, textW + 20, 24, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#e0e6f5';
    ctx.textAlign = 'left';
    ctx.fillText(telemetryText, bX + 10, bY + 16);
    ctx.restore();
  }

  /**
   * Helper to convert wavelength in nm to vibrant CSS color string.
   */
  function wlToColor(wavelengthNm) {
    if (wavelengthNm < 420) return '#7c4dff';
    if (wavelengthNm < 450) return '#3d5afe';
    if (wavelengthNm < 480) return '#00b0ff';
    if (wavelengthNm < 510) return '#00e5ff';
    if (wavelengthNm < 540) return '#00e676';
    if (wavelengthNm < 570) return '#aeea00';
    if (wavelengthNm < 600) return '#ffd600';
    if (wavelengthNm < 630) return '#ff6d00';
    if (wavelengthNm < 670) return '#ff3d00';
    return '#d50000';
  }

  /**
   * 2. MACROSCOPIC PLANETARY ATMOSPHERE VIEW.
   */
  function drawMacroView(ctx, w, h) {
    const isCs = i18n.getLanguage() === 'cs';

    const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
    bgGrad.addColorStop(0, '#04060c');
    bgGrad.addColorStop(0.7, '#070b14');
    bgGrad.addColorStop(1, '#0c121e');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    const ox = w * 0.18;
    const oy = h * 0.84;
    const viewR = Math.max(w * 1.5, 1100);
    const planetCenter = { x: ox, y: oy + viewR };
    const atmoThickness = Math.min(h * 0.36, 160);
    const atmoOuterR = viewR + atmoThickness;

    const getGroundY = (x) => {
      const dx = x - planetCenter.x;
      if (Math.abs(dx) >= viewR) return planetCenter.y;
      return planetCenter.y - Math.sqrt(viewR * viewR - dx * dx);
    };

    const elevRad = (state.elevationDeg * Math.PI) / 180;
    const cosE = Math.cos(elevRad);
    const sinE = Math.sin(elevRad);

    const atmoChordLen = Math.sqrt(viewR * viewR * sinE * sinE + 2 * viewR * atmoThickness + atmoThickness * atmoThickness) - viewR * sinE;
    const entryX = ox + atmoChordLen * cosE;
    const entryY = oy - atmoChordLen * sinE;

    const spaceMargin = Math.min(w * 0.20, 100);
    const sunDist = atmoChordLen + spaceMargin;
    const sunX = ox + sunDist * cosE;
    const sunY = oy - sunDist * sinE;

    // Atmosphere Density Glow
    const atmoGrad = ctx.createRadialGradient(
      planetCenter.x, planetCenter.y, viewR,
      planetCenter.x, planetCenter.y, atmoOuterR
    );
    atmoGrad.addColorStop(0, 'rgba(45, 110, 210, 0.42)');
    atmoGrad.addColorStop(0.18, 'rgba(40, 95, 190, 0.28)');
    atmoGrad.addColorStop(0.45, 'rgba(30, 75, 160, 0.14)');
    atmoGrad.addColorStop(0.8, 'rgba(20, 50, 120, 0.04)');
    atmoGrad.addColorStop(1, 'rgba(10, 25, 60, 0.0)');

    ctx.save();
    ctx.beginPath();
    ctx.arc(planetCenter.x, planetCenter.y, atmoOuterR, 0, Math.PI * 2);
    ctx.fillStyle = atmoGrad;
    ctx.fill();

    ctx.strokeStyle = 'rgba(90, 169, 255, 0.12)';
    ctx.setLineDash([3, 6]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(planetCenter.x, planetCenter.y, atmoOuterR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Planet Ground
    ctx.save();
    ctx.beginPath();
    ctx.arc(planetCenter.x, planetCenter.y, viewR, 0, Math.PI * 2);
    ctx.fillStyle = '#0c1018';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#223045';
    ctx.stroke();
    ctx.restore();

    // Ground Observer
    ctx.save();
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.arc(ox, oy, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = '10px ui-monospace, monospace';
    ctx.fillStyle = '#8b9bb4';
    ctx.textAlign = 'center';
    ctx.fillText(isCs ? 'POZOROVATEL' : 'OBSERVER', ox, oy + 16);
    ctx.restore();

    // Sun Emitter Disk
    ctx.save();
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 2, sunX, sunY, 24);
    sunGrad.addColorStop(0, '#ffffff');
    sunGrad.addColorStop(0.2, '#fff3cc');
    sunGrad.addColorStop(0.6, 'rgba(255, 200, 80, 0.35)');
    sunGrad.addColorStop(1, 'rgba(255, 180, 50, 0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 24, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 9, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = '11px ui-monospace, monospace';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText(`${state.elevationDeg.toFixed(1)}°`, sunX, sunY - 14);
    ctx.restore();

    // Straight beam chord from Sun to Observer
    const pts = traceResult.pathPoints;
    const srcSrgb = colorimetry.spectrumToSrgb(pts && pts[0] ? pts[0].spectrum : traceResult.finalSpectrum, 1.2);

    ctx.save();
    ctx.strokeStyle = srcSrgb.css;
    ctx.globalAlpha = 0.40;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(sunX, sunY);
    ctx.lineTo(entryX, entryY);
    ctx.stroke();

    ctx.globalAlpha = 0.95;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(sunX, sunY);
    ctx.lineTo(entryX, entryY);
    ctx.stroke();
    ctx.restore();

    // Atmospheric straight chord
    if (pts && pts.length > 1) {
      const totalL = traceResult.totalChordLengthKm * 1000;
      for (let i = 0; i < pts.length - 1; i++) {
        const p1 = pts[i];
        const p2 = pts[i + 1];

        const frac1 = p1.sFromEntry / totalL;
        const frac2 = p2.sFromEntry / totalL;

        const x1 = entryX + (ox - entryX) * frac1;
        const y1 = entryY + (oy - entryY) * frac1;
        const x2 = entryX + (ox - entryX) * frac2;
        const y2 = entryY + (oy - entryY) * frac2;

        const srgb = colorimetry.spectrumToSrgb(p1.spectrum, 1.2);
        const alpha = Math.max(0.15, Math.min(1.0, p1.normalizedIntensity * 1.3));

        ctx.save();
        ctx.strokeStyle = srgb.css;
        ctx.globalAlpha = alpha * 0.45;
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        ctx.globalAlpha = Math.min(1.0, alpha * 0.95);
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
      }

      // Scattering events diverted away
      const events = traceResult.scatteringEvents;
      if (events) {
        const beamAngle = Math.atan2(oy - entryY, ox - entryX);
        for (let k = 0; k < events.length; k++) {
          const ev = events[k];
          const frac = Math.max(0, Math.min(1, ev.distanceM / totalL));
          const ex = entryX + (ox - entryX) * frac;
          const ey = entryY + (oy - entryY) * frac;

          const isRayleigh = ev.type === 'rayleigh';
          const dotCol = isRayleigh ? '#5aa9ff' : '#ffe082';

          ctx.save();
          ctx.fillStyle = dotCol;
          ctx.beginPath();
          ctx.arc(ex, ey, isRayleigh ? 2.5 : 3.5, 0, Math.PI * 2);
          ctx.fill();

          const scAngleRad = (ev.scatterAngleDeg * Math.PI) / 180;
          let divAngle = beamAngle - Math.abs(scAngleRad * 0.8);
          const rayLen = isRayleigh ? 36 : 48;
          let endX = ex + Math.cos(divAngle) * rayLen;
          let endY = ey + Math.sin(divAngle) * rayLen;

          const gy = getGroundY(endX);
          if (endY > gy) endY = gy;

          const daughterGrad = ctx.createLinearGradient(ex, ey, endX, endY);
          daughterGrad.addColorStop(0, dotCol);
          daughterGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

          ctx.strokeStyle = daughterGrad;
          ctx.lineWidth = isRayleigh ? 1.3 : 1.9;
          ctx.beginPath();
          ctx.moveTo(ex, ey);
          ctx.lineTo(endX, endY);
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    // Ground spot
    const finalSRGB = colorimetry.spectrumToSrgb(traceResult.finalSpectrum, 1.4);
    ctx.save();
    const spotGrad = ctx.createRadialGradient(ox, oy - 2, 2, ox, oy - 2, 18);
    spotGrad.addColorStop(0, finalSRGB.css);
    spotGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = spotGrad;
    ctx.beginPath();
    ctx.arc(ox, oy - 2, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Loupe inset
    drawLoupe(ctx, w, h);

    // Macro badge
    drawMacroBadges(ctx, w, h, isCs);
  }

  function drawMacroBadges(ctx, w, h, isCs) {
    ctx.save();
    ctx.fillStyle = 'rgba(15, 19, 29, 0.85)';
    ctx.strokeStyle = '#242c3d';
    ctx.lineWidth = 1;

    const chordText = `${isCs ? 'Délka cesty' : 'Path length'}: ${traceResult.totalChordLengthKm.toFixed(0)} km  |  ${isCs ? 'Vzdušná hmota' : 'Airmass'}: ${traceResult.airmass.toFixed(1)}×`;
    ctx.font = '12px ui-monospace, monospace';
    const textW = ctx.measureText(chordText).width;

    ctx.beginPath();
    ctx.roundRect(14, 56, textW + 20, 26, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#e8ecf5';
    ctx.fillText(chordText, 24, 73);
    ctx.restore();
  }

  function drawLoupe(ctx, w, h) {
    const isCs = i18n.getLanguage() === 'cs';
    const lx = w - 125;
    const ly = h - 125;
    const lr = 54;

    ctx.save();
    ctx.beginPath();
    ctx.arc(lx, ly, lr, 0, Math.PI * 2);
    ctx.fillStyle = '#0f1422';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = state.loupeMode === 'rayleigh' ? '#5aa9ff' : '#ffb454';
    ctx.stroke();

    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = '#9aa5bb';
    ctx.textAlign = 'center';
    const title = state.loupeMode === 'rayleigh'
      ? (isCs ? 'Molekula (Rayleigh)' : 'Molecule (Rayleigh)')
      : (isCs ? 'Aerosol / Kapka (Mie)' : 'Aerosol Drop (Mie)');
    ctx.fillText(title, lx, ly - lr - 6);

    ctx.fillStyle = '#6b7488';
    ctx.font = '9px system-ui, sans-serif';
    ctx.fillText(isCs ? '(kliknutím přepni)' : '(click to toggle)', lx, ly + lr + 14);

    if (state.loupeMode === 'rayleigh') {
      const osc = Math.sin(animTime * 6) * 6;
      ctx.strokeStyle = 'rgba(90, 169, 255, 0.35)';
      ctx.lineWidth = 1.2;
      for (let r = 10; r <= 38; r += 12) {
        const wr = (r + (animTime * 24) % 12);
        ctx.beginPath();
        ctx.ellipse(lx, ly, wr, wr * 0.6, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(lx, ly - osc * 0.4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5aa9ff';
      ctx.beginPath();
      ctx.arc(lx, ly + osc * 0.8, 3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(140, 190, 230, 0.25)';
      ctx.strokeStyle = 'rgba(200, 230, 255, 0.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(lx, ly, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  // Initial calculation and draw
  recompute();
  draw();

  return {
    update,
    draw,
    resize,
    getTraceResult: () => traceResult,
    getMicroBundleResult: () => microBundleResult,
  };
}

/* ===== js/ui/beam-controls.js ===== */
/**
 * UI Controls and Telemetry Panels for the Single Beam & Particle Micro View.
 *
 * Populates:
 *   - The left panel with view mode (Micro-Chamber vs Macro-Atmosphere), beam mode
 *     (Single Ray vs Beam Bundle), wavelength, spectral laser presets,
 *     atmospheric gas sliders, and aerosol (OPAC) parameters.
 *   - The right panel with optical telemetry, wavelength survival bars,
 *     color swatches, and pedagogical explanations.
 */

function createBeamUI({
  leftContainer,
  rightContainer,
  i18n,
  colorimetry,
  onStateChange,
  onSwitchToScattering,
}) {
  let currentState = {
    viewType: 'micro',
    bundleMode: 'bundle',
    elevationDeg: 25,
    mode: 'sunlight',
    wavelengthNm: 532,
    densityScale: 1,
    gasScaleHeightM: 8500,
    rayleighExponent: 4,
    aerosolScale: 1,
    aerosolScaleHeightM: 1200,
    angstromExponent: 1.0,
    aerosolAlbedo: 1.0,
    asymmetryFactor: 0.75,
    enableRefraction: true,
    refractionFactor: 15,
    animate: true,
  };

  let lastTraceResult = null;

  function renderLeftPanel() {
    const isCs = i18n.getLanguage() === 'cs';

    leftContainer.innerHTML = `
      <div class="panel-section">
        <h2>${isCs ? 'Pohled a složení paprsku' : 'View & Beam Mode'}</h2>
        
        <div class="segmented" id="beam-view-toggle" style="margin-bottom:8px;display:flex;width:100%;">
          <button type="button" style="flex:1;" class="${currentState.viewType === 'micro' ? 'is-active' : ''}" data-view="micro">
            ${isCs ? '🔬 Mikrosimulace' : '🔬 Particle Micro'}

    if (nextState) {
      Object.assign(currentState, nextState);
    }
    renderLeftPanel();
    if (traceResult) {
      renderRightPanel(traceResult);
    }
  }

  return {
    renderLeftPanel,
    renderRightPanel,
    update,
  };

/* ===== js/ui/controls.js ===== */
/**
 * The control panel.
 *
