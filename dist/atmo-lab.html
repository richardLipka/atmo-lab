    reset(next = DEFAULT_STATE) {
      const changed = new Set();
      mergeInto(state, clone(next), changed);
      reconcile(changed);
      notify(changed);
    },

    subscribe(fn) {
      listeners.add(fn);
      return () => listeners.delete(fn);
    },

    snapshot() { return clone(state); },
  };
}

/** True if any changed path falls under one of the given prefixes. */
function touches(changed, ...prefixes) {
  for (const path of changed) {
    for (const prefix of prefixes) {
      if (path === prefix || path.startsWith(prefix + '.')) return true;
    }
  }
  return false;
}

/* ===== js/physics/spectrum.js ===== */
/**
 * Spectral representation.
 *
 * Every radiometric quantity in this simulator is carried as a discrete
 * spectral power density vector I(lambda) sampled on a fixed grid:
 *
 *     lambda in [380 nm, 750 nm], step 10 nm  ->  38 bins.
 *
 * Keeping one single grid for sources, cross-sections, transmittances and the
 * CIE colour matching functions means no resampling is ever needed and the
 * whole pipeline is a chain of element-wise array operations.
 */

const SPECTRUM_MIN_NM = 380;
const SPECTRUM_MAX_NM = 750;
const SPECTRUM_STEP_NM = 10;
const SPECTRUM_BINS =
  Math.round((SPECTRUM_MAX_NM - SPECTRUM_MIN_NM) / SPECTRUM_STEP_NM) + 1;

/** Wavelength of every bin centre, in nanometres. */
const WAVELENGTHS_NM = (() => {
  const a = new Float64Array(SPECTRUM_BINS);
  for (let i = 0; i < SPECTRUM_BINS; i++) a[i] = SPECTRUM_MIN_NM + i * SPECTRUM_STEP_NM;
  return a;
})();

/* Physical constants (SI, CODATA 2018). */
const PLANCK_H = 6.62607015e-34;      // J s
const LIGHT_C = 2.99792458e8;         // m / s
const BOLTZMANN_K = 1.380649e-23;     // J / K
const WIEN_B = 2.897771955e-3;        // m K

/** Allocate a zeroed spectrum. */
function specNew() {
  return new Float64Array(SPECTRUM_BINS);
}

/** Allocate a spectrum filled with a constant. */
function specConst(value) {
  const s = new Float64Array(SPECTRUM_BINS);
  s.fill(value);
  return s;
}

function specCopy(src) {
  return Float64Array.from(src);
}

/** out[i] += src[i] * scale  (in place, returns out) */
function specAddScaled(out, src, scale) {
  for (let i = 0; i < SPECTRUM_BINS; i++) out[i] += src[i] * scale;
  return out;
}

/** out[i] *= scale (in place, returns out) */
function specScale(out, scale) {
  for (let i = 0; i < SPECTRUM_BINS; i++) out[i] *= scale;
  return out;
}

/** Element-wise product into a new array. */
function specMul(a, b) {
  const out = new Float64Array(SPECTRUM_BINS);
  for (let i = 0; i < SPECTRUM_BINS; i++) out[i] = a[i] * b[i];
  return out;
}

/** Sum of all bins multiplied by the bin width (a crude integral). */
function specIntegral(s) {
  let sum = 0;
  for (let i = 0; i < SPECTRUM_BINS; i++) sum += s[i];
  return sum * SPECTRUM_STEP_NM;
}

function specMax(s) {
  let m = 0;
  for (let i = 0; i < SPECTRUM_BINS; i++) if (s[i] > m) m = s[i];
  return m;
}

/**
 * Planck's law: spectral radiance of a black body, in W / (m^2 sr m).
 *
 *     B(lambda, T) = 2 h c^2 / lambda^5  *  1 / (exp(h c / (lambda k T)) - 1)
 *
 * @param {number} lambdaNm wavelength in nanometres
 * @param {number} temperatureK absolute temperature in kelvin
 */
function planckSpectralRadiance(lambdaNm, temperatureK) {
  if (temperatureK <= 0) return 0;
  const lambda = lambdaNm * 1e-9;
  const l5 = lambda * lambda * lambda * lambda * lambda;
  const numerator = 2 * PLANCK_H * LIGHT_C * LIGHT_C / l5;
  const exponent = (PLANCK_H * LIGHT_C) / (lambda * BOLTZMANN_K * temperatureK);
  // exp() overflows for cold stars at short wavelengths; the limit is simply 0.
  if (exponent > 700) return 0;
  return numerator / (Math.expm1(exponent));
}

/** Wien displacement law: wavelength of peak emission, in nanometres. */
function wienPeakNm(temperatureK) {
  if (temperatureK <= 0) return Infinity;
  return (WIEN_B / temperatureK) * 1e9;
}

/**
 * Black-body spectrum sampled on the standard grid.
 *
 * @param {number} temperatureK
 * @param {'peak'|'none'} normalize  'peak' rescales so the largest bin is 1,
 *        which keeps numbers in a friendly range for display. Absolute
 *        photometric scaling is applied later, by the colorimetry module.
 */
function makeBlackbodySpectrum(temperatureK, normalize = 'peak') {
  const s = new Float64Array(SPECTRUM_BINS);
  for (let i = 0; i < SPECTRUM_BINS; i++) {
    s[i] = planckSpectralRadiance(WAVELENGTHS_NM[i], temperatureK);
  }
  if (normalize === 'peak') {
    const m = specMax(s);
    if (m > 0) specScale(s, 1 / m);
  }
  return s;
}

/**
 * Approximate sRGB colour of a single wavelength, used only to tint the
 * spectrum graph and the illustrative photon paths. It is a display aid, never
 * an input to the physics.
 */
function wavelengthToDisplayRgb(lambdaNm) {
  let r = 0, g = 0, b = 0;
  const w = lambdaNm;
  if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
  else if (w < 490) { g = (w - 440) / 50; b = 1; }
  else if (w < 510) { g = 1; b = -(w - 510) / 20; }
  else if (w < 580) { r = (w - 510) / 70; g = 1; }
  else if (w < 645) { r = 1; g = -(w - 645) / 65; }
  else if (w <= 780) { r = 1; }
  let falloff = 1;
  if (w > 700) falloff = 0.3 + 0.7 * (780 - w) / 80;
  else if (w < 420) falloff = 0.3 + 0.7 * (w - 380) / 40;
  const gamma = 0.8;
  const enc = (c) => Math.round(255 * Math.pow(Math.max(0, Math.min(1, c * falloff)), gamma));
  return [enc(r), enc(g), enc(b)];
}

/* ===== js/physics/color.js ===== */
/**
 * Colour science: spectrum -> CIE 1931 XYZ -> sRGB.
 *
 * No colour anywhere in this application is chosen by hand. Every sky tint,
 * every star swatch and every gradient band is the end of this pipeline:
 *
 *   1. integrate the observed spectral irradiance against the CIE 1931
 *      colour matching functions to get tristimulus values X, Y, Z;
 *   2. map XYZ into linear sRGB with the standard 3x3 matrix;
 *   3. bring the result into gamut, then apply the display transfer function.
 */


/**
 * Build a colorimetry object from the CIE data file.
 * The colour matching functions must already be on the standard grid.
 */
function createColorimetry(cieConfig) {
  if (cieConfig.count !== SPECTRUM_BINS ||
      cieConfig.wavelengthStart_nm !== WAVELENGTHS_NM[0] ||
      cieConfig.wavelengthStep_nm !== SPECTRUM_STEP_NM) {
    throw new Error('CIE table does not match the spectral grid');
  }

  const xBar = Float64Array.from(cieConfig.xBar);
  const yBar = Float64Array.from(cieConfig.yBar);
  const zBar = Float64Array.from(cieConfig.zBar);
  const M = cieConfig.xyzToLinearSRGB;

  /** Integral of yBar over the grid; the normaliser for photometric units. */
  let yBarIntegral = 0;
  for (let i = 0; i < SPECTRUM_BINS; i++) yBarIntegral += yBar[i];
  yBarIntegral *= SPECTRUM_STEP_NM;

  /**
   * Tristimulus values of a spectral power distribution.
   *   X = k * sum I(lambda) xBar(lambda) dLambda      (likewise Y and Z)
   * with k = 1, so Y is a relative luminance in the same arbitrary units as
   * the input spectrum.
   */
  function spectrumToXYZ(spec) {
    let X = 0, Y = 0, Z = 0;
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      const v = spec[i];
      X += v * xBar[i];
      Y += v * yBar[i];
      Z += v * zBar[i];
    }
    return [X * SPECTRUM_STEP_NM, Y * SPECTRUM_STEP_NM, Z * SPECTRUM_STEP_NM];
  }

  /** Relative luminance Y only - cheaper when the hue is not needed. */
  function luminance(spec) {
    let Y = 0;
    for (let i = 0; i < SPECTRUM_BINS; i++) Y += spec[i] * yBar[i];
    return Y * SPECTRUM_STEP_NM;
  }

  /** CIE 1931 chromaticity coordinates. */
  function xyzToChromaticity([X, Y, Z]) {
    const sum = X + Y + Z;
    if (sum <= 0) return [0.3127, 0.3290];
    return [X / sum, Y / sum];
  }

  /** Linear (un-encoded) sRGB primaries. Components may fall outside [0,1]. */
  function xyzToLinearRgb([X, Y, Z]) {
    return [
      M[0][0] * X + M[0][1] * Y + M[0][2] * Z,
      M[1][0] * X + M[1][1] * Y + M[1][2] * Z,
      M[2][0] * X + M[2][1] * Y + M[2][2] * Z,
    ];
  }

  /**
   * The sRGB electro-optical transfer function, inverted. Its slope matches a
   * pure power law of gamma = 2.2 closely enough that the two are
   * interchangeable for teaching; 'gamma22' selects the plain power law.
   */
  function encodeComponent(c, transfer = 'srgb') {
    const v = Math.max(0, Math.min(1, c));
    if (transfer === 'gamma22') return Math.pow(v, 1 / 2.2);
    return v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
  }

  /**
   * Bring a linear RGB triplet into the displayable cube without changing its
   * hue more than necessary.
   *
   *   - a negative component means the colour is outside the sRGB gamut, so we
   *     add just enough white to reach the gamut boundary (desaturation);
   *   - a component above 1 means the colour is brighter than the display can
   *     show, so every component is divided by the maximum. Scaling all three
   *     by one factor keeps their ratios, and therefore the hue, intact.
   */
  function fitToGamut(rgb) {
    let [r, g, b] = rgb;
    let desaturated = false, clipped = false;
    const min = Math.min(r, g, b);
    if (min < 0) {
      r -= min; g -= min; b -= min;
      desaturated = true;
    }
    const max = Math.max(r, g, b);
    if (max > 1) {
      r /= max; g /= max; b /= max;
      clipped = true;
    }
    return { rgb: [r, g, b], desaturated, clipped };
  }

  /**
   * Full pipeline. `exposure` scales the spectrum before conversion and is the
   * only place where an arbitrary display choice enters; it never changes the
   * ratios between wavelengths, so it cannot change the hue.
   */
  function spectrumToSrgb(spec, exposure = 1, transfer = 'srgb') {
    const xyz = spectrumToXYZ(spec);
    const scaled = [xyz[0] * exposure, xyz[1] * exposure, xyz[2] * exposure];
    const linear = xyzToLinearRgb(scaled);
    const fitted = fitToGamut(linear);
    const enc = fitted.rgb.map((c) => encodeComponent(c, transfer));
    const bytes = enc.map((c) => Math.round(c * 255));
    return {
      xyz,
      chromaticity: xyzToChromaticity(xyz),
      luminance: xyz[1],
      linear: fitted.rgb,
      rgb: bytes,
      css: `rgb(${bytes[0]}, ${bytes[1]}, ${bytes[2]})`,
      desaturated: fitted.desaturated,
      clipped: fitted.clipped,
    };
  }

  /** Rescale a spectrum in place so that its luminance equals `targetY`. */
  function normalizeToLuminance(spec, targetY = 1) {
    const Y = luminance(spec);
    if (Y > 0) {
      const k = targetY / Y;
      for (let i = 0; i < SPECTRUM_BINS; i++) spec[i] *= k;
    }
    return spec;
  }

  /** xy coordinates of every monochromatic wavelength - the spectral locus. */
  function spectralLocus() {
    const pts = [];
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      const X = xBar[i], Y = yBar[i], Z = zBar[i];
      const sum = X + Y + Z;
      if (sum > 1e-6) pts.push({ lambda: WAVELENGTHS_NM[i], x: X / sum, y: Y / sum });
    }
    return pts;
  }

  return {
    xBar, yBar, zBar, yBarIntegral,
    spectrumToXYZ, luminance, xyzToChromaticity, xyzToLinearRgb,
    encodeComponent, fitToGamut, spectrumToSrgb, normalizeToLuminance,
    spectralLocus,
  };
}

/* ===== js/physics/scattering.js ===== */
/**
 * Scattering physics: cross-sections and phase functions.
 *
 * Two regimes are modelled.
 *
 * Rayleigh scattering applies when the scatterer is far smaller than the
 * wavelength (air molecules, ~0.3 nm, against ~500 nm light). The cross
 * section goes as 1/lambda^4, which is the single fact behind the blue sky and
 * the red sunset.
 *
 * Aerosol (Mie) scattering applies when the particle size is comparable to the
 * wavelength (dust, droplets, smoke). The exact theory needs Maxwell's
 * equations solved on a sphere; here it is replaced by the standard
 * educational pair of an Angstrom power law and a Henyey-Greenstein phase
 * function, which reproduce the two features that matter: near-neutral colour
 * and strong forward peaking.
 */


const REFERENCE_WAVELENGTH_NM = 550;

/**
 * Rayleigh volume scattering coefficient per wavelength, at the density where
 * `beta550` was measured.
 *
 *     beta(lambda) = beta(550) * (550 / lambda)^exponent
 *
 * The exponent is exposed so a student can dial it away from 4 and watch the
 * sky lose its colour - the fastest way to see that 1/lambda^4 is doing all
 * the work.
 */
function rayleighBetaSpectrum(beta550, exponent = 4) {
  const out = specNew();
  for (let i = 0; i < SPECTRUM_BINS; i++) {
    out[i] = beta550 * Math.pow(REFERENCE_WAVELENGTH_NM / WAVELENGTHS_NM[i], exponent);
  }
  return out;
}

/**
 * Aerosol extinction coefficient per wavelength using the Angstrom power law.
 * An exponent near 0 means a grey (colour-neutral) haze; near 1.3 it is a fine
 * clean aerosol with a mild blue preference.
 */
function aerosolBetaSpectrum(beta550, angstromExponent = 1) {
  const out = specNew();
  for (let i = 0; i < SPECTRUM_BINS; i++) {
    out[i] = beta550 * Math.pow(REFERENCE_WAVELENGTH_NM / WAVELENGTHS_NM[i], angstromExponent);
  }
  return out;
}

/**
 * Resolve a single-scattering albedo specification into a spectrum.
 * Accepts a plain number (grey) or a {wavelengths_nm, values} table, which is
 * linearly interpolated and clamped at the ends.
 *
 * The albedo is the fraction of an extinction event that is scattering rather
 * than absorption. Martian dust absorbs blue far more than red, and that
 * asymmetry - not the scattering itself - is what makes the Martian sky ochre.
 */
function resolveAlbedoSpectrum(spec) {
  const out = specNew();
  if (typeof spec === 'number') {
    out.fill(spec);
    return out;
  }
  if (!spec || !Array.isArray(spec.wavelengths_nm) || !Array.isArray(spec.values)) {
    out.fill(1);
    return out;
  }
  const xs = spec.wavelengths_nm, ys = spec.values;
  for (let i = 0; i < SPECTRUM_BINS; i++) {
    const w = WAVELENGTHS_NM[i];
    if (w <= xs[0]) { out[i] = ys[0]; continue; }
    if (w >= xs[xs.length - 1]) { out[i] = ys[ys.length - 1]; continue; }
    let k = 0;
    while (k < xs.length - 2 && xs[k + 1] < w) k++;
    const t = (w - xs[k]) / (xs[k + 1] - xs[k]);
    out[i] = ys[k] + t * (ys[k + 1] - ys[k]);
  }
  return out;
}

/**
 * Normalised Rayleigh phase function.
 *
 *     P(theta) = 3 / (16 pi) * (1 + cos^2 theta)
 *
 * It integrates to 1 over the full solid angle. Forward and backward
 * scattering are equally likely and sideways scattering is only half as
 * likely, so the sky is brightest near the Sun and dimmest 90 degrees away.
 */
function rayleighPhase(cosTheta) {
  return (3 / (16 * Math.PI)) * (1 + cosTheta * cosTheta);
}

/**
 * Henyey-Greenstein phase function, the standard one-parameter stand-in for a
 * Mie lobe.
 *
 *     P(theta) = (1 - g^2) / (4 pi (1 + g^2 - 2 g cos theta)^{3/2})
 *
 * g = 0 is isotropic, g -> 1 is entirely forward. Atmospheric aerosols sit
 * around g = 0.7, which is why haze produces a bright glare around the Sun.
 */
function henyeyGreensteinPhase(cosTheta, g) {
  const gg = Math.max(-0.99, Math.min(0.99, g));
  const denom = 1 + gg * gg - 2 * gg * cosTheta;
  return (1 - gg * gg) / (4 * Math.PI * Math.pow(Math.max(denom, 1e-6), 1.5));
}

/** Draw a scattering direction cosine from the Rayleigh phase function. */
function sampleRayleighCosine(random = Math.random) {
  // Inverting the cumulative distribution of (3/8)(1+mu^2) analytically.
  const u = 4 * random() - 2;
  const d = Math.cbrt(u + Math.sqrt(u * u + 1));
  return d - 1 / d;
}

/** Draw a scattering direction cosine from the Henyey-Greenstein lobe. */
function sampleHenyeyGreensteinCosine(g, random = Math.random) {
  const gg = Math.max(-0.99, Math.min(0.99, g));
  if (Math.abs(gg) < 1e-4) return 1 - 2 * random();
  const s = (1 - gg * gg) / (1 - gg + 2 * gg * random());
  return (1 + gg * gg - s * s) / (2 * gg);
}

/* ===== js/physics/geometry.js ===== */
/**
 * Minimal 3D vector maths and ray/sphere intersection.
 *
 * The world is a sphere of radius R centred on the origin. The observer stands
 * on the +Y axis, so the local "up" direction is simply the normalised
 * position vector. Working on a sphere rather than a flat slab is not a
 * refinement here, it is essential: a flat atmosphere has an infinite path
 * length at the horizon, and the sunset experiment would never terminate.
 */

function v3(x, y, z) { return { x, y, z }; }

function v3add(a, b) { return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }; }

function v3scale(a, s) { return { x: a.x * s, y: a.y * s, z: a.z * s }; }

/** a + b * s, the fused form used inside the ray-marching inner loops. */
function v3addScaled(a, b, s) {
  return { x: a.x + b.x * s, y: a.y + b.y * s, z: a.z + b.z * s };
}

function v3dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }

function v3length(a) { return Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z); }

function v3normalize(a) {
  const l = v3length(a);
  return l > 0 ? { x: a.x / l, y: a.y / l, z: a.z / l } : { x: 0, y: 1, z: 0 };
}

const DEG = Math.PI / 180;

/**
 * Unit direction from a zenith angle and an azimuth, in the local frame of an
 * observer standing on the +Y axis.
 *   theta = 0    -> straight up
 *   theta = 90   -> the horizon
 *   phi   = 0    -> towards the Sun's azimuth
 */
function directionFromAngles(zenithRad, azimuthRad) {
  const st = Math.sin(zenithRad);
  return {
    x: st * Math.cos(azimuthRad),
    y: Math.cos(zenithRad),
    z: st * Math.sin(azimuthRad),
  };
}

/** Direction towards a star at a given elevation above the horizon. */
function sunDirectionFromElevation(elevationDeg) {
  const e = elevationDeg * DEG;
  return { x: Math.cos(e), y: Math.sin(e), z: 0 };
}

/**
 * Distance from `origin` along `dir` to the far intersection with a sphere of
 * radius R centred at the origin. Returns -1 if the ray misses.
 * Used to find where a ray leaves the top of the atmosphere.
 */
function raySphereFar(origin, dir, R) {
  const b = v3dot(origin, dir);
  const c = v3dot(origin, origin) - R * R;
  const disc = b * b - c;
  if (disc < 0) return -1;
  return -b + Math.sqrt(disc);
}

/**
 * Distance to the near intersection with a sphere of radius R, but only if it
 * lies ahead of the origin. Returns -1 when the ray does not hit.
 * Used to test whether a ray runs into the ground.
 */
function raySphereNear(origin, dir, R) {
  const b = v3dot(origin, dir);
  const c = v3dot(origin, origin) - R * R;
  const disc = b * b - c;
  if (disc < 0) return -1;
  const t = -b - Math.sqrt(disc);
  return t > 1e-6 ? t : -1;
}

/* ===== js/physics/atmosphere.js ===== */
/**
 * The atmosphere model: density profile, column amounts, optical depth.
 *
 * Density falls off exponentially with height,
 *
 *     rho(h) = rho_0 * exp(-h / H)
 *
 * where H is the scale height. Because that profile has a closed-form
 * integral, the amount of air directly above an observer is exact:
 *
 *     C(z) = integral from z to infinity of rho(h) dh = rho_0 * H * exp(-z / H)
 *
 * This single formula is the whole of the "flight into space" experiment: the
 * column, and with it the optical depth and the amount of scattered light,
 * decays exponentially with altitude and reaches zero only at infinity.
 *
 * Optical depth follows by multiplying a column by a wavelength-dependent
 * cross-section, and transmission follows from Beer-Lambert:
 *
 *     tau(lambda) = beta_0(lambda) * C        T(lambda) = exp(-tau(lambda))
 */




/**
 * Build a ready-to-use atmosphere from a config file plus live UI overrides.
 *
 * @param {object} config  a /config/atmospheres/[name].json document
 * @param {object} overrides
 *   densityScale     multiplies every scattering coefficient (1 = as configured)
 *   scaleHeight_m    replaces the molecular scale height
 *   aerosolScale     multiplies the aerosol load only
 *   rayleighExponent replaces the wavelength exponent (4 = true Rayleigh)
 */
function createAtmosphere(config, overrides = {}) {
  const densityScale = overrides.densityScale ?? 1;
  const aerosolScale = overrides.aerosolScale ?? 1;
  const rayleighExponent = overrides.rayleighExponent ?? (config.rayleigh.wavelengthExponent ?? 4);
  const scaleHeightR = overrides.scaleHeight_m ?? config.rayleigh.scaleHeight_m;
  // A named aerosol from config/scattering/aerosols.json replaces the haze the
  // world came with, so the same air can be given city smog or volcanic ash.
  const aerosol = overrides.aerosol ?? config.aerosol;
  // The haze layer keeps its proportion to the gas column when the gas scale
  // height is changed, so a taller atmosphere does not accidentally strand its
  // dust at the bottom.
  const heightRatio = scaleHeightR / config.rayleigh.scaleHeight_m;
  const scaleHeightA = aerosol.scaleHeight_m * heightRatio;

  const rayleighBeta0 = rayleighBetaSpectrum(
    config.rayleigh.beta550_perM * densityScale, rayleighExponent);

  const aerosolExt0 = aerosolBetaSpectrum(
    (aerosol.beta550_perM ?? 0) * densityScale * aerosolScale,
    aerosol.angstromExponent ?? 1);

  const albedo = resolveAlbedoSpectrum(aerosol.singleScatteringAlbedo ?? 1);
  const aerosolSca0 = specNew();
  for (let i = 0; i < SPECTRUM_BINS; i++) aerosolSca0[i] = aerosolExt0[i] * albedo[i];

  const planetRadius = config.planetRadius_m;
  const topAltitude = config.topAltitude_m;
  const topRadius = planetRadius + topAltitude;

  /** Relative molecular density at height h (1 at the surface). */
  function densityRayleigh(h) {
    return h < 0 ? 1 : Math.exp(-h / scaleHeightR);
  }
  function densityAerosol(h) {
    return h < 0 ? 1 : Math.exp(-h / scaleHeightA);
  }

  /** Vertical column of relative density above altitude z, in metres. */
  function verticalColumnRayleigh(z) {
    return scaleHeightR * Math.exp(-Math.max(0, z) / scaleHeightR);
  }
  function verticalColumnAerosol(z) {
    return scaleHeightA * Math.exp(-Math.max(0, z) / scaleHeightA);
  }

  /** Mass of air above one square metre at altitude z, in kg. */
  function massColumn(z) {
    const g = config.surfaceGravity_mps2;
    const p = config.surfacePressure_kPa;
    if (!g || !p) return null;
    const surfaceMass = (p * 1000) / g;
    return surfaceMass * Math.exp(-Math.max(0, z) / scaleHeightR);
  }

  /** Beer-Lambert transmission for a pair of accumulated columns. */
  function transmittance(columnR, columnA) {
    const t = specNew();
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      t[i] = Math.exp(-(rayleighBeta0[i] * columnR + aerosolExt0[i] * columnA));
    }
    return t;
  }

  /** Optical depth spectrum for a pair of accumulated columns. */
  function opticalDepth(columnR, columnA) {
    const t = specNew();
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      t[i] = rayleighBeta0[i] * columnR + aerosolExt0[i] * columnA;
    }
    return t;
  }

  /** Altitude of a point above the planet surface. */
  function altitudeAt(p) {
    return v3length(p) - planetRadius;
  }

  /** Position vector of an observer standing at altitude z on the +Y axis. */
  function observerPosition(z) {
    return v3(0, planetRadius + Math.max(0, z), 0);
  }

  /**
   * Distance along a ray until it leaves the modelled atmosphere, or hits the
   * ground first. Returns { distance, hitGround }.
   */
  function rayExtent(origin, dir) {
    // An observer standing exactly on the surface is a degenerate case for the
    // quadratic: both of its roots sit at t = 0, so a ray aimed below the local
    // horizon would be reported as missing the planet entirely. Decide that
    // case geometrically instead - it is the one that says whether a star has
    // set.
    const radius = v3length(origin);
    if (radius <= planetRadius + 1e-6 && v3dot(origin, dir) < 0) {
      return { distance: 0, hitGround: true };
    }
    const ground = raySphereNear(origin, dir, planetRadius);
    if (ground > 0) return { distance: ground, hitGround: true };
    const top = raySphereFar(origin, dir, topRadius);
    return { distance: Math.max(0, top), hitGround: false };
  }

  /**
   * Integrate both density columns along a ray segment with the midpoint rule.
   * The step count adapts to the path length measured in scale heights, so a
   * short vertical hop and a thousand-kilometre horizon grazer are both
   * resolved without wasting work.
   */
  function pathColumns(origin, dir, distance, stepHint) {
    if (distance <= 0) return { columnR: 0, columnA: 0, steps: 0 };
    const steps = stepHint ?? Math.max(8, Math.min(96,
      Math.round(distance / (0.25 * scaleHeightR))));
    const ds = distance / steps;
    let columnR = 0, columnA = 0;
    for (let i = 0; i < steps; i++) {
      const t = (i + 0.5) * ds;
      const h = v3length(v3addScaled(origin, dir, t)) - planetRadius;
      columnR += densityRayleigh(h);
      columnA += densityAerosol(h);
    }
    return { columnR: columnR * ds, columnA: columnA * ds, steps };
  }

  return {
    config,
    id: config.id,
    name: config.name,
    planetRadius, topAltitude, topRadius,
    groundAlbedo: config.groundAlbedo ?? 0.1,
    scaleHeightRayleigh: scaleHeightR,
    scaleHeightAerosol: scaleHeightA,
    rayleighExponent,
    rayleighBeta0, aerosolExt0, aerosolSca0, aerosolAlbedo: albedo,
    asymmetryG: aerosol.asymmetry_g ?? 0.7,
    densityRayleigh, densityAerosol,
    verticalColumnRayleigh, verticalColumnAerosol, massColumn,
    transmittance, opticalDepth,
    altitudeAt, observerPosition, rayExtent, pathColumns,
  };
}

/* ===== js/physics/well.js ===== */
/**
 * Well shaft geometry.
 *
 * This module exists to keep one idea strictly separate from the atmosphere
 * code: going down a shaft is a GEOMETRIC restriction, not an atmospheric one.
 *
 * An observer standing on the axis of a cylindrical shaft of radius R at depth
 * d looks out through the mouth of the shaft. A ray leaving at zenith angle
 * theta rises d and travels d*tan(theta) sideways, so it escapes only while
 *
 *     tan(theta) <= R / d
 *
 * Everything steeper hits the wall. The sky that remains visible is exactly as
 * bright and exactly the same colour as it was at ground level - there is just
 * far less of it. That is the whole of the well paradox.
 */

/** Half-angle of the visible cone of sky, in radians. */
function wellApertureHalfAngle(depth, radius) {
  if (depth <= 0) return Math.PI / 2;
  if (radius <= 0) return 0;
  return Math.atan(radius / depth);
}

/** Is a viewing direction stopped by the shaft wall? */
function wellIsBlocked(zenithRad, depth, radius) {
  if (depth <= 0) return false;
  if (zenithRad >= Math.PI / 2) return true;
  if (radius <= 0) return true;
  return Math.tan(zenithRad) > radius / depth;
}

/**
 * Solid angle of the visible cone, in steradians.
 *     Omega = 2 pi (1 - cos theta_max)
 * The open sky is a hemisphere, 2 pi sr.
 */
function wellSolidAngle(halfAngleRad) {
  return 2 * Math.PI * (1 - Math.cos(halfAngleRad));
}

/** Visible sky as a fraction of the open hemisphere. */
function wellSkyFraction(depth, radius) {
  return wellSolidAngle(wellApertureHalfAngle(depth, radius)) / (2 * Math.PI);
}

/**
 * Fraction of the horizontal illuminance that survives, assuming a sky of
 * uniform radiance.
 *
 *     E_cone / E_hemisphere = sin^2(theta_max)
 *
 * For a 1 m wide shaft 20 m deep this is about 0.0025: the light level drops
 * by a factor of four hundred while the patch of sky overhead stays exactly as
 * blue as before.
 */
function wellIlluminanceFraction(depth, radius) {
  const s = Math.sin(wellApertureHalfAngle(depth, radius));
  return s * s;
}

/**
 * Distance from the observer to the point where a ray meets the shaft wall or
 * clears the mouth. Used only for drawing.
 */
function wellRayHit(zenithRad, depth, radius) {
  if (depth <= 0) return null;
  const t = Math.tan(Math.min(zenithRad, Math.PI / 2 - 1e-6));
  if (zenithRad >= Math.PI / 2) return { type: 'wall', distance: radius, height: 0 };
  const heightToMouth = depth;
  const lateralAtMouth = heightToMouth * t;
  if (lateralAtMouth <= radius) {
    return { type: 'escapes', distance: heightToMouth / Math.cos(zenithRad), height: depth };
  }
  const heightAtWall = radius / Math.max(t, 1e-9);
  return { type: 'wall', distance: Math.hypot(radius, heightAtWall), height: heightAtWall };
}

/**
 * Extra air column inside an air-filled shaft, in metres of surface-equivalent
 * density. The exponential profile continued below datum gives
 *
 *     C_shaft = H (exp(d / H) - 1)
 *
 * The specification treats the column above the observer as unchanged when
 * descending, which isolates the geometric effect; this function powers an
 * optional advanced toggle that restores the real, denser shaft air.
 */
function wellShaftColumn(depth, scaleHeight) {
  if (depth <= 0) return 0;
  return scaleHeight * (Math.exp(depth / scaleHeight) - 1);
}

/* ===== js/physics/radiance.js ===== */
/**
 * Radiative transfer: what actually reaches the observer.
 *
 * For a chosen viewing direction the engine walks along the ray and adds up
 * the light scattered into it from every point of the atmosphere:
 *
 *   L(lambda) = integral over the path of
 *        T_view(lambda, observer -> s)   how much scattered light survives the trip back
 *      * [ beta_R(lambda) rho_R(s) P_R(theta)
 *        + beta_M(lambda) rho_M(s) P_M(theta) ]  how much is scattered here, towards us
 *      * T_sun(lambda, s -> space)       how much starlight reached this point at all
 *      * I_0(lambda)  ds                 the spectrum the star emitted
 *
 * Every factor depends on wavelength, and the blue sky, the red sunset and the
 * black sky of space are all consequences of that one integral.
 *
 * The model is single scattering: a photon is followed from the star to one
 * scattering event and then to the eye. This is the standard teaching
 * approximation. It is accurate while the optical depth stays below about one,
 * and it deliberately under-predicts the glow of deep twilight and of very
 * dense atmospheres, where photons bounce many times before arriving.
 */





/**
 * Sampling density presets. `viewSteps` divides the viewing ray, `sunSteps`
 * divides each shadow ray towards the star.
 */
const QUALITY_PRESETS = {
  preview: { viewSteps: 14, sunSteps: 6 },
  normal: { viewSteps: 28, sunSteps: 10 },
  high: { viewSteps: 64, sunSteps: 18 },
};

/**
 * Exposure that maps radiance to screen brightness. It is a fixed constant on
 * purpose: an automatic exposure would silently cancel the very effect the
 * altitude experiment exists to show, by re-brightening a fading sky.
 */
const DISPLAY_EXPOSURE = 45.0;

const ZERO_SPECTRUM = specNew();

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

/**
 * Bundle the live state into the form the integrator wants. `observerZ` is the
 * signed vertical coordinate: positive is altitude, negative is depth in the
 * shaft.
 */
function buildScene({
  atmosphere, sourceSpectrum, sunDirection, sunElevationDeg,
  observerZ, well, countShaftAir = false, starAngularRadiusDeg = 0.2665,
}) {
  const depth = observerZ < 0 ? -observerZ : 0;
  const wellActive = !!(well && well.enabled && depth > 0);
  const wellRadius = well ? well.radius_m : 1;
  // Descending does not change the air above you: the column stays the one
  // measured at datum. This is the physical heart of the well experiment.
  const atmosphericAltitude = Math.max(0, observerZ);
  return {
    atmosphere,
    source: sourceSpectrum,
    sunDir: sunDirection,
    sunElevationDeg,
    observerZ,
    atmosphericAltitude,
    observerPos: atmosphere.observerPosition(atmosphericAltitude),
    wellActive,
    wellDepth: wellActive ? depth : 0,
    wellRadius,
    apertureHalfAngle: wellActive ? wellApertureHalfAngle(depth, wellRadius) : Math.PI / 2,
    countShaftAir,
    starAngularRadiusDeg,
    starSolidAngle: 2 * Math.PI * (1 - Math.cos(starAngularRadiusDeg * Math.PI / 180)),
  };
}

/** Extra column contributed by air standing inside the shaft, if enabled. */
function shaftPrefix(scene, zenithRad) {
  if (!scene.countShaftAir || !scene.wellActive) return { r: 0, a: 0 };
  const atm = scene.atmosphere;
  const sec = 1 / Math.max(0.05, Math.cos(Math.min(zenithRad, Math.PI / 2 - 1e-3)));
  return {
    r: wellShaftColumn(scene.wellDepth, atm.scaleHeightRayleigh) * sec,
    a: wellShaftColumn(scene.wellDepth, atm.scaleHeightAerosol) * sec,
  };
}

/**
 * Radiance arriving from one viewing direction.
 *
 * Returns the scattered sky radiance, the attenuated direct beam, the optical
 * depth actually traversed, and whether the shaft wall got in the way.
 */
function computeViewRadiance(scene, viewDir, quality = QUALITY_PRESETS.normal) {
  const atm = scene.atmosphere;
  const zenithRad = Math.acos(clamp(viewDir.y, -1, 1));

  if (scene.wellActive && wellIsBlocked(zenithRad, scene.wellDepth, scene.wellRadius)) {
    return {
      blocked: true, hitGround: false,
      scattered: ZERO_SPECTRUM, observed: ZERO_SPECTRUM,
      transmittance: ZERO_SPECTRUM, opticalDepth: ZERO_SPECTRUM,
      pathLength: 0, columnR: 0, columnA: 0, zenithRad, starVisible: false,
    };
  }

  const origin = scene.observerPos;
  const ext = atm.rayExtent(origin, viewDir);
  const distance = ext.distance;
  const prefix = shaftPrefix(scene, zenithRad);

  const scattered = specNew();
  const betaR = atm.rayleighBeta0;
  const betaAext = atm.aerosolExt0;
  const betaAsca = atm.aerosolSca0;
  const source = scene.source;

  const cosScatter = v3dot(viewDir, scene.sunDir);
  const phaseR = rayleighPhase(cosScatter);
  const phaseA = henyeyGreensteinPhase(cosScatter, atm.asymmetryG);

  let columnR = prefix.r, columnA = prefix.a;

  if (distance > 0) {
    const steps = quality.viewSteps;
    const ds = distance / steps;
    for (let i = 0; i < steps; i++) {
      const Q = v3addScaled(origin, viewDir, i * ds + ds * 0.5);
      const h = v3length(Q) - atm.planetRadius;
      const rhoR = atm.densityRayleigh(h);
      const rhoA = atm.densityAerosol(h);

      // Column from the observer out to this sample point.
      const midR = columnR + rhoR * ds * 0.5;
      const midA = columnA + rhoA * ds * 0.5;
      columnR += rhoR * ds;
      columnA += rhoA * ds;

      // Is this point in sunlight at all? A shadow ray that runs into the
      // planet means the point sits in the shadow of the planet, which is what
      // makes the sky darken from the bottom upwards after sunset.
      const sunExt = atm.rayExtent(Q, scene.sunDir);
      if (sunExt.hitGround) continue;
      const sunCol = atm.pathColumns(Q, scene.sunDir, sunExt.distance, quality.sunSteps);

      const totalR = midR + sunCol.columnR;
      const totalA = midA + sunCol.columnA;
      const srcR = rhoR * phaseR * ds;
      const srcA = rhoA * phaseA * ds;

      for (let k = 0; k < SPECTRUM_BINS; k++) {
        const tau = betaR[k] * totalR + betaAext[k] * totalA;
        if (tau > 40) continue;
        const emitted = betaR[k] * srcR + betaAsca[k] * srcA;
        scattered[k] += Math.exp(-tau) * emitted * source[k];
      }
    }
  }

  const transmittance = atm.transmittance(columnR, columnA);
  const opticalDepth = atm.opticalDepth(columnR, columnA);

  // If the star itself lies in this viewing direction, its disc adds a
  // radiance of (attenuated irradiance / the solid angle the disc covers).
  const observed = specNew();
  observed.set(scattered);
  const angleToStar = Math.acos(clamp(cosScatter, -1, 1)) * 180 / Math.PI;
  const starVisible = angleToStar <= scene.starAngularRadiusDeg && !ext.hitGround;
  if (starVisible && scene.starSolidAngle > 0) {
    for (let k = 0; k < SPECTRUM_BINS; k++) {
      observed[k] += source[k] * transmittance[k] / scene.starSolidAngle;
    }
  }

  return {
    blocked: false,
    hitGround: ext.hitGround,
    scattered, observed, transmittance, opticalDepth,
    pathLength: distance, columnR, columnA, zenithRad, starVisible,
  };
}

/**
 * The star seen directly by the observer: its spectrum after the whole
 * atmospheric path. This is the sunset curve - one unchanging star,
 * progressively stripped of its short wavelengths as the path lengthens.
 */
function computeDirectBeam(scene, quality = QUALITY_PRESETS.normal) {
  const atm = scene.atmosphere;
  const sunZenith = Math.acos(clamp(scene.sunDir.y, -1, 1));
  const blockedByWell = scene.wellActive &&
    wellIsBlocked(sunZenith, scene.wellDepth, scene.wellRadius);

  const ext = atm.rayExtent(scene.observerPos, scene.sunDir);
  const belowHorizon = ext.hitGround;
  const prefix = shaftPrefix(scene, sunZenith);
  const col = atm.pathColumns(scene.observerPos, scene.sunDir, ext.distance, quality.sunSteps * 3);

  const columnR = col.columnR + prefix.r;
  const columnA = col.columnA + prefix.a;
  const transmittance = atm.transmittance(columnR, columnA);
  const opticalDepth = atm.opticalDepth(columnR, columnA);

  const beam = specNew();
  const visible = !blockedByWell && !belowHorizon;
  if (visible) {
    for (let k = 0; k < SPECTRUM_BINS; k++) beam[k] = scene.source[k] * transmittance[k];
  }

  const verticalColumn = atm.verticalColumnRayleigh(scene.atmosphericAltitude);
  return {
    spectrum: beam,
    transmittance, opticalDepth,
    columnR, columnA,
    pathLength: ext.distance,
    airMass: verticalColumn > 0 ? columnR / verticalColumn : 0,
    blockedByWell, belowHorizon, visible,
  };
}

/**
 * Sample the sky across the principal plane - the vertical slice containing
 * the star. The signed angle runs from -90 (the horizon behind the observer)
 * through 0 (the zenith) to +90 (the horizon below the star).
 */
function computeSkyDome(scene, options = {}) {
  const samples = options.samples ?? 61;
  const quality = options.quality ?? QUALITY_PRESETS.preview;
  const angles = domeAngles(scene, samples, options.focusAperture !== false);

  return angles.map(({ signed, magnified }) => {
    const zenithRad = Math.abs(signed) * Math.PI / 180;
    const dir = directionFromAngles(zenithRad, signed >= 0 ? 0 : Math.PI);
    return {
      signedAngleDeg: signed,
      zenithDeg: Math.abs(signed),
      towardsStar: signed >= 0,
      magnified,
      dir,
      result: computeViewRadiance(scene, dir, quality),
    };
  });
}

/**
 * Choose the viewing angles to sample.
 *
 * Normally they are spread evenly from horizon to horizon. Inside a shaft that
 * would be useless: a hundred metres down, the whole visible sky is under a
 * degree wide and would fall between two samples, so the strip would go
 * uniformly black and hide the very thing the experiment is about. When a
 * shaft is present, a third of the samples are therefore spent inside the
 * aperture, and those samples are flagged so the drawing can say that its
 * middle is magnified.
 */
function domeAngles(scene, samples, focusAperture) {
  const half = scene.apertureHalfAngle * 180 / Math.PI;
  const linear = () => {
    const out = [];
    for (let i = 0; i < samples; i++) {
      out.push({ signed: -90 + (180 * i) / (samples - 1), magnified: false });
    }
    return out;
  };

  if (!scene.wellActive || !focusAperture || half >= 60) return linear();

  const inner = Math.max(7, Math.round(samples * 0.34)) | 1;   // keep it odd
  const outerEach = Math.floor((samples - inner) / 2);
  // Keep the innermost samples just inside the cone. A sample sitting exactly
  // on the boundary is decided by floating-point rounding and would show up as
  // a black edge on a patch of sky that is in fact fully visible.
  const edge = half * 0.999;
  const out = [];
  for (let i = 0; i < outerEach; i++) {
    out.push({ signed: -90 + ((90 - half) * i) / outerEach, magnified: false });
  }
  for (let i = 0; i < inner; i++) {
    out.push({ signed: -edge + (2 * edge * i) / (inner - 1), magnified: true });
  }
  for (let i = 1; i <= outerEach; i++) {
    out.push({ signed: half + ((90 - half) * i) / outerEach, magnified: false });
  }
  return out;
}

/**
 * Downward illuminance on a horizontal surface at the observer.
 *
 *     E = integral over the visible sky of L(theta, phi) cos(theta) dOmega
 *
 * Directions stopped by the shaft simply drop out of the sum, so the same code
 * yields both the open-sky value and the value at the bottom of the well, and
 * the two are directly comparable.
 */
function computeIllumination(scene, colorimetry, options = {}) {
  const quality = options.quality ?? QUALITY_PRESETS.preview;
  const openScene = scene.wellActive ? { ...scene, wellActive: false } : scene;

  /**
   * Integrate L cos(theta) dOmega over an annulus of zenith angles. The shaft
   * aperture can be a hundredth of a degree wide, so the sampling range is
   * fitted to the cone being measured rather than to the whole hemisphere -
   * otherwise a deep shaft would fall between samples and report exactly zero
   * light, which is a sampling artefact and not physics.
   */
  function integrateCone(thetaMin, thetaMax, nTheta, nPhi) {
    let sum = 0, omega = 0;
    if (thetaMax <= thetaMin) return { sum, omega };
    const dTheta = (thetaMax - thetaMin) / nTheta;
    const dPhi = (2 * Math.PI) / nPhi;
    for (let i = 0; i < nTheta; i++) {
      const theta = thetaMin + (i + 0.5) * dTheta;
      const dOmega = Math.sin(theta) * dTheta * dPhi;
      const cosT = Math.cos(theta);
      for (let j = 0; j < nPhi; j++) {
        const dir = directionFromAngles(theta, (j + 0.5) * dPhi);
        // The radiance of a sky patch never depends on the shaft; the shaft
        // only decides whether the observer can see that patch at all.
        const r = computeViewRadiance(openScene, dir, quality);
        sum += colorimetry.luminance(r.scattered) * cosT * dOmega;
        omega += dOmega;
      }
    }
    return { sum, omega };
  }

  const openIntegral = integrateCone(0, Math.PI / 2,
    options.zenithSamples ?? 9, options.azimuthSamples ?? 8);
  const coneIntegral = scene.wellActive
    ? integrateCone(0, scene.apertureHalfAngle, 5, 6)
    : openIntegral;

  const open = openIntegral.sum;
  const visible = coneIntegral.sum;
  const visibleSolidAngle = coneIntegral.omega;

  const beam = computeDirectBeam(scene, quality);
  const openBeam = computeDirectBeam(openScene, quality);
  const cosSun = Math.max(0, scene.sunDir.y);
  const beamIlluminance = colorimetry.luminance(beam.spectrum) * cosSun;
  const openBeamIlluminance = colorimetry.luminance(openBeam.spectrum) * cosSun;

  return {
    skyIlluminance: visible,
    skyIlluminanceOpen: open,
    beamIlluminance,
    total: visible + beamIlluminance,
    totalOpen: open + openBeamIlluminance,
    visibleSolidAngle,
    apertureSolidAngle: 2 * Math.PI * (1 - Math.cos(scene.apertureHalfAngle)),
  };
}

/**
 * How much light is scattered out of the beam at a single point of the
 * atmosphere, towards someone viewing the cross-section from the side. This is
 * what tints the atmosphere in the diagram - the glow itself, computed, not a
 * gradient picked by hand.
 */
function computeScatteringSource(scene, position, scatterCos = 0, quality = QUALITY_PRESETS.preview) {
  const atm = scene.atmosphere;
  const out = specNew();
  const h = v3length(position) - atm.planetRadius;
  if (h < 0 || h > atm.topAltitude) return out;

  const sunExt = atm.rayExtent(position, scene.sunDir);
  if (sunExt.hitGround) return out;
  const col = atm.pathColumns(position, scene.sunDir, sunExt.distance, quality.sunSteps);

  const rhoR = atm.densityRayleigh(h);
  const rhoA = atm.densityAerosol(h);
  const phaseR = rayleighPhase(scatterCos);
  const phaseA = henyeyGreensteinPhase(scatterCos, atm.asymmetryG);

  for (let k = 0; k < SPECTRUM_BINS; k++) {
    const tau = atm.rayleighBeta0[k] * col.columnR + atm.aerosolExt0[k] * col.columnA;
    if (tau > 40) continue;
    const emitted = atm.rayleighBeta0[k] * rhoR * phaseR + atm.aerosolSca0[k] * rhoA * phaseA;
    out[k] = Math.exp(-tau) * emitted * scene.source[k];
  }
  return out;
}

/* ===== js/simulation.js ===== */
/**
 * The bridge between the interface and the physics.
 *
 * Given the current state it builds an atmosphere, a source spectrum and a
 * scene, then evaluates everything the panels need: the view ray, the direct
 * beam, a sweep across the sky, the illumination budget and the derived
 * colours. Panels never call the physics themselves, so there is exactly one
 * place where the model is assembled.
 */






const REFERENCE_LAMBDAS = [450, 550, 650];

function createSimulation({ config, colorimetry }) {
  /** Cache atmospheres so dragging an unrelated slider costs nothing. */
  let atmosphereCache = { key: null, value: null };

  function atmosphereFor(state) {
    const preset = config.atmospheres.get(state.atmosphere.presetId)
      ?? config.atmospheres.get('earth');
    const a = state.atmosphere;
    const key = [preset.id, a.densityScale, a.scaleHeight_m, a.aerosolScale,
      a.rayleighExponent, a.aerosolPresetId].join('|');
    if (atmosphereCache.key !== key) {
      atmosphereCache = {
        key,
        value: createAtmosphere(preset, {
          densityScale: a.densityScale,
          aerosolScale: a.aerosolScale,
          rayleighExponent: a.rayleighExponent,
          scaleHeight_m: a.scaleHeight_m ?? undefined,
          aerosol: aerosolPreset(a.aerosolPresetId),
        }),
      };
    }
    return atmosphereCache.value;
  }

  /** A named haze from config/scattering/aerosols.json, or the world default. */
  function aerosolPreset(id) {
    if (!id) return undefined;
    return config.scattering.get('aerosols')?.presets?.[id];
  }

  /**
   * Spectral irradiance arriving at the top of the atmosphere.
   * The black body is normalised to unit luminance so that a change of stellar
   * temperature is seen as a change of colour, not of brightness; the optional
   * insolation factor then restores the real difference between worlds.
   */
  function sourceFor(state, atmosphereConfig) {
    const spectrum = makeBlackbodySpectrum(state.star.temperatureK);
    colorimetry.normalizeToLuminance(spectrum, 1);
    if (state.star.realisticInsolation) {
      const factor = atmosphereConfig.insolationRelative ?? 1;
      for (let i = 0; i < SPECTRUM_BINS; i++) spectrum[i] *= factor;
    }
    return spectrum;
  }

  function sceneFor(state, atmosphere, source, overrideZ) {
    const starPreset = config.stars.get(state.star.presetId);
    const z = overrideZ ?? state.observer.z;
    return buildScene({
      atmosphere,
      sourceSpectrum: source,
      sunDirection: sunDirectionFromElevation(state.star.elevationDeg),
      sunElevationDeg: state.star.elevationDeg,
      observerZ: z,
      well: state.observer.well,
      countShaftAir: state.observer.countShaftAir,
      starAngularRadiusDeg: starPreset?.angularRadius_deg ?? 0.2665,
    });
  }

  function exposureFor(state) {
    return DISPLAY_EXPOSURE * (state.rays.brightness ?? 1);
  }

  /** Evaluate one observer completely. */
  function evaluate(state, atmosphere, source, overrideZ) {
    const quality = QUALITY_PRESETS[state.rays.quality] ?? QUALITY_PRESETS.normal;
    const scene = sceneFor(state, atmosphere, source, overrideZ);
    const exposure = exposureFor(state);

    const viewDir = directionFromAngles(
      state.observer.viewZenithDeg * DEG, state.observer.viewAzimuthDeg * DEG);
    const view = computeViewRadiance(scene, viewDir, quality);
    const beam = computeDirectBeam(scene, quality);
    const dome = computeSkyDome(scene, { samples: 73, quality: QUALITY_PRESETS.preview });
    const illumination = computeIllumination(scene, colorimetry, { quality: QUALITY_PRESETS.preview });

    const skyColor = colorimetry.spectrumToSrgb(view.observed, exposure);
    const scatterColor = colorimetry.spectrumToSrgb(view.scattered, exposure);
    // The star is shown at its own exposure: it is a direct source, not a dim
    // patch of sky, and normalising it to the sky would make it pure white.
    const starColor = colorimetry.spectrumToSrgb(beam.spectrum, 1 / Math.max(1e-6, colorimetry.luminance(source)));
    const sourceColor = colorimetry.spectrumToSrgb(source, 1 / Math.max(1e-6, colorimetry.luminance(source)));

    const domeColors = dome.map((sample) => ({
      ...sample,
      color: sample.result.blocked
        ? { css: '#000000', rgb: [0, 0, 0], luminance: 0 }
        : colorimetry.spectrumToSrgb(sample.result.observed, exposure),
    }));

    const atmosphericZ = Math.max(0, scene.observerZ);
    const columnR = atmosphere.verticalColumnRayleigh(atmosphericZ);
    const columnA = atmosphere.verticalColumnAerosol(atmosphericZ);
    const surfaceColumn = atmosphere.verticalColumnRayleigh(0);
    const verticalTau = atmosphere.opticalDepth(columnR, columnA);

    const depth = scene.observerZ < 0 ? -scene.observerZ : 0;
    const half = scene.wellActive ? wellApertureHalfAngle(depth, scene.wellRadius) : Math.PI / 2;

    return {
      scene, view, beam, dome: domeColors, illumination,
      colors: { sky: skyColor, scatter: scatterColor, star: starColor, source: sourceColor },
      metrics: {
        z: scene.observerZ,
        atmosphericAltitude: atmosphericZ,
        columnFraction: surfaceColumn > 0 ? columnR / surfaceColumn : 0,
        massColumn: atmosphere.massColumn(atmosphericZ),
        verticalTau: sampleAt(verticalTau, REFERENCE_LAMBDAS),
        viewTau: sampleAt(view.opticalDepth, REFERENCE_LAMBDAS),
        beamTau: sampleAt(beam.opticalDepth, REFERENCE_LAMBDAS),
        beamTransmission: sampleAt(beam.transmittance, REFERENCE_LAMBDAS),
        airMass: beam.airMass,
        pathLength: view.pathLength,
        scaleHeight: atmosphere.scaleHeightRayleigh,
        apertureHalfAngleDeg: half / DEG,
        apertureSolidAngle: scene.wellActive ? wellSolidAngle(half) : 2 * Math.PI,
        skyFraction: scene.wellActive ? wellSolidAngle(half) / (2 * Math.PI) : 1,
        analyticIlluminanceFraction: scene.wellActive
          ? wellIlluminanceFraction(depth, scene.wellRadius) : 1,
        skyLuminance: colorimetry.luminance(view.scattered),
        peakWavelength: wienPeakNm(state.star.temperatureK),
        scatteringAngleDeg: Math.acos(Math.max(-1, Math.min(1,
          viewDir.x * scene.sunDir.x + viewDir.y * scene.sunDir.y + viewDir.z * scene.sunDir.z))) / DEG,
        blocked: view.blocked,
      },
    };
  }

  function sampleAt(spectrum, lambdas) {
    const out = {};
    for (const nm of lambdas) {
      const i = Math.round((nm - 380) / 10);
      out[nm] = spectrum[i] ?? 0;
    }
    return out;
  }

  /**
   * Full evaluation for the current state, plus the second observer when the
   * side-by-side comparison is running.
   */
  function run(state) {
    const atmosphereConfig = config.atmospheres.get(state.atmosphere.presetId)
      ?? config.atmospheres.get('earth');
    const atmosphere = atmosphereFor(state);
    const source = sourceFor(state, atmosphereConfig);

    const primary = evaluate(state, atmosphere, source);
    const result = {
      atmosphere, atmosphereConfig, source,
      exposure: exposureFor(state),
      primary,
      compare: null,
    };

    if (state.compare.enabled) {
      result.compare = {
        left: evaluate(state, atmosphere, source, state.compare.leftZ),
        right: evaluate(state, atmosphere, source, state.compare.rightZ),
      };
    }
    return result;
  }

  return { run, atmosphereFor, sourceFor, sceneFor, exposureFor };
}

/* ===== js/render/photons.js ===== */
/**
 * The light paths drawn in the cross-section.
 *
 * The picture is built backwards from the observer, because the question a
 * student is asking is "why is the light that reaches *me* blue?" Every path
 * drawn is one of three kinds:
 *
 *   arriving  sunlight that came down, scattered once, and turned INTO the
 *             observer. Its wavelength is drawn from the true single-scattering
 *             weight, so the bundle really is blue for the reason the
 *             integrator says it is.
 *   missed    sunlight that scattered at some other point and left in some
 *             other direction. Same physics, same phase function - it simply
 *             is not aimed at you.
 *   through   light that crossed the air without being scattered at all.
 *             Overwhelmingly red, and the lower the star the redder, because
 *             the chord it has to cross grows without limit.
 *
 * Each arriving path has exactly one scattering vertex, which is not a
 * simplification introduced here: it is precisely the single-scattering
 * approximation that physics/radiance.js integrates. The picture and the
 * numbers therefore describe the same model.
 *
 * GEOMETRY IS SPHERICAL, in true Cartesian coordinates with the planet centre at
 * the origin. An earlier version used a flat slab, which is indistinguishable
 * over a few tens of kilometres but makes the single most important fact about a
 * low Sun impossible to draw: that its light crosses a chord hundreds of
 * kilometres long. Straight lines stay straight here - the projection is a plain
 * orthographic one - and it is the ground that curves, which is the truth.
 *
 * The traced set does NOT depend on where the observer is looking. Scattering
 * events are a property of the air and the star; the renderer decides at draw
 * time which of them fall inside the current viewing cone.
 */

/**
 * Half-angle of the cone of sky the observer is looking down.
 *
 * The panels report a radiance for one direction, so the picture has to show
 * which rays that direction actually collects. A mathematical point direction
 * would be one line; a cone is what an eye or an instrument really accepts, and
 * it is wide enough to read at the scale the cross-section is drawn.
 */
const VIEW_CONE_HALF_DEG = 12;

/** How far from the zenith arriving rays are sampled, short of the horizon. */
const MAX_SKY_ANGLE_DEG = 85;

/** Length of the drawn sunward stub, as a fraction of the frame half-width. */
const ARRIVING_STUB = 0.30;

/** A small deterministic generator, so a given setup always draws the same picture. */
function makeRng(seed) {
  let s = seed >>> 0 || 1;
  return function rng() {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

/** Draw an index from a set of non-negative weights. */
function sampleWeighted(weights, total, u) {
  let acc = 0;
  const target = u * total;
  for (let i = 0; i < SPECTRUM_BINS; i++) {
    acc += weights[i];
    if (acc >= target) return i;
  }
  return SPECTRUM_BINS - 1;
}

/**
 * Trace the light paths for the picture.
 *
 * @param {object} options
 *   atmosphere        an object from createAtmosphere
 *   source            top-of-atmosphere spectrum
 *   sunElevationDeg   elevation of the star above the observer's horizon
 *   observerZ         observer altitude in metres
 *   count             how many paths to draw
 *   span_m            vertical extent of the drawn frame, in metres
 *   halfWidth_m       half its horizontal extent
 *   skyExtent_m       how far above the observer's ground point the frame reaches
 *   seed              generator seed
 */
function tracePhotons(options) {
  const {
    atmosphere, source, sunElevationDeg, observerZ = 0,
    count, span_m, halfWidth_m, skyExtent_m, seed = 12345,
    // Scales the sun-leg cache cell. 1 is the working value; the test suite
    // drives it towards zero to compare against an effectively uncached trace.
    sunCacheScale = 1,
  } = options;

  const paths = [];
  if (!(count > 0)) return paths;

  let sourceTotal = 0;
  for (let i = 0; i < SPECTRUM_BINS; i++) sourceTotal += source[i];
  if (!(sourceTotal > 0)) return paths;

  const rng = makeRng(seed);
  const R = atmosphere.planetRadius;
  const topR = R + atmosphere.topAltitude;
  const elevation = sunElevationDeg * Math.PI / 180;
  // The star is effectively at infinity, so this one direction serves the whole
  // picture - which is exactly why a low Sun makes long chords rather than a fan.
  const toStar = { x: Math.cos(elevation), y: Math.sin(elevation) };

  const betaR = atmosphere.rayleighBeta0;
  const betaAext = atmosphere.aerosolExt0;
  const betaAsca = atmosphere.aerosolSca0;
  const g = atmosphere.asymmetryG;
  const HR = atmosphere.scaleHeightRayleigh;
  const invHR = 1 / HR;
  const invHA = 1 / atmosphere.scaleHeightAerosol;

  const observerAltitude = Math.max(0, observerZ);
  const observer = { x: 0, y: R + observerAltitude };

  /* ---- world helpers, all in true Cartesian ---- */

  /** The tallest air worth drawing at this zoom. */
  function drawTopFor() {
    return Math.min(atmosphere.topAltitude, Math.max(HR * 0.6, skyExtent_m));
  }

  const altitudeOf = (p) => Math.sqrt(p.x * p.x + p.y * p.y) - R;

  /**
   * The point at altitude `h` whose horizontal screen coordinate is `x`.
   *
   * Parameterised by the Cartesian offset rather than by arc length along the
   * surface, because the frame is a rectangle in Cartesian space: an arc length
   * of exactly the half-width lands slightly outside it once the point is a few
   * kilometres up, by the factor (R + h)/R.
   */
  function pointAtOffset(x, h) {
    const r = R + h;
    return { x, y: Math.sqrt(Math.max(0, r * r - x * x)) };
  }

  /** Root of |origin + t·dir| = radius: the near one, or the far one. */
  function raySphere(origin, dir, radius, far) {
    const b = origin.x * dir.x + origin.y * dir.y;
    const c = origin.x * origin.x + origin.y * origin.y - radius * radius;
    const disc = b * b - c;
    if (disc < 0) return null;
    const root = Math.sqrt(disc);
    const t = far ? -b + root : -b - root;
    return t > 1e-6 ? t : null;
  }

  /**
   * Column of air along a segment, for both species at once.
   *
   * Marched rather than solved in closed form: the closed form belongs to a flat
   * slab, and the whole point of the spherical geometry is the grazing path that
   * the flat form gets wrong. Steps are sized against the scale height, so a
   * short vertical path costs a dozen samples and a 600 km chord gets the
   * resolution it needs.
   */
  function columns(from, dir, length) {
    // 56 steps is the knee of the curve: a grazing chord of several hundred
    // kilometres is still integrated to well under a percent, and this runs a
    // few hundred times per retrace, so the constant matters. Written without
    // allocating a point per step, and with sqrt rather than hypot, because
    // profiling put nearly all of a 73 ms retrace right here.
    const steps = Math.max(6, Math.min(48, Math.round(length / (0.6 * HR))));
    const ds = length / steps;
    let colR = 0, colA = 0;
    for (let i = 0; i < steps; i++) {
      const t = (i + 0.5) * ds;
      const x = from.x + dir.x * t;
      const y = from.y + dir.y * t;
      const h = Math.sqrt(x * x + y * y) - R;
      // The exponentials are written out rather than called through the
      // atmosphere object: this loop runs tens of thousands of times per
      // retrace, and the closure call was not being inlined.
      colR += h < 0 ? 1 : Math.exp(-h * invHR);
      colA += h < 0 ? 1 : Math.exp(-h * invHA);
    }
    return { colR: colR * ds, colA: colA * ds };
  }

  /**
   * Transmission of the path from P out to the star, or false if the planet is
   * in the way. That shadow test is how night, and the darkening from the bottom
   * up after sunset, appear without a line of special-case code.
   */
  /**
   * The sun leg is the expensive part of a trace, and in a spherically
   * symmetric atmosphere its column depends on only two numbers: how high the
   * point is, and the angle between the starlight and the local vertical there.
   * Quantising those two and memoising collapses the cost at high ray counts,
   * where hundreds of rays share a cell, while leaving the cheap cases alone.
   * The quantum is fine enough that the transmission varies by well under a
   * percent across a cell, which no drawn colour can show.
   */
  const sunCache = new Map();
  const altitudeQuantum = Math.max(1e-6, sunCacheScale * drawTopFor() / 150);

  /**
   * The 38 transmissions along the sun leg, or null if the point is in shadow.
   *
   * The whole spectrum is cached, not merely the columns: turning a column into
   * a transmission costs one exponential per wavelength, and doing that per ray
   * rather than per cell was the largest single cost in a trace at five
   * thousand rays. The returned array is shared and must not be written to.
   */
  function sunTransmission(P) {
    if (raySphere(P, toStar, R, false) != null) return null;
    const radius = Math.sqrt(P.x * P.x + P.y * P.y);
    const cosZenith = (P.x * toStar.x + P.y * toStar.y) / radius;
    // Two independent quantised coordinates packed into one integer key. The
    // cosine term is bounded by +/-400/scale, and the altitude term is spaced
    // wider than that range, so the two can never collide.
    const cosTerm = Math.round(cosZenith * 400 / sunCacheScale);
    const key = Math.round((radius - R) / altitudeQuantum) * (2000 / sunCacheScale)
      + cosTerm;
    const hit = sunCache.get(key);
    if (hit !== undefined) return hit;

    const path = marchSunColumns(P, cosZenith);
    const transmission = new Float64Array(SPECTRUM_BINS);
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      transmission[i] = Math.exp(-(betaR[i] * path.colR + betaAext[i] * path.colA));
    }
    sunCache.set(key, transmission);
    return transmission;
  }

  function marchSunColumns(P, cosZenith) {
    let exit = raySphere(P, toStar, topR, true);
    if (exit != null) {
      // Stop integrating once the air has thinned past any relevance. Along a
      // path leaving at local zenith angle X the density falls with a
      // characteristic length H/cos(X), so twelve of those leaves under 1e-5 of
      // the column behind - while a grazing path, where cos(X) is small, keeps
      // its full length, which is exactly the case that matters.
      if (cosZenith > 0.02) exit = Math.min(exit, 12 * HR / cosZenith);
    }
    return exit == null ? { colR: 0, colA: 0 } : columns(P, toStar, exit);
  }



  /* ---- how much of this light is scattered at all ---- */

  const vertical = columns({ x: 0, y: R }, { x: 0, y: 1 }, atmosphere.topAltitude);
  let tauScatter = 0;
  for (let i = 0; i < SPECTRUM_BINS; i++) {
    tauScatter += (source[i] / sourceTotal)
      * (betaR[i] * vertical.colR + betaAsca[i] * vertical.colA);
  }
  const scatteredFraction = 1 - Math.exp(-tauScatter);

  // Below this, scattering is a one-in-ten-thousand event: with a few hundred
  // drawn paths the honest count of scattering vertices is zero, and drawing any
  // would invent a sky on a world that has none. This is the airless case the
  // simulator exists to contrast, so it must not be fudged.
  const scatters = tauScatter > 1e-4;

  // Pedagogic proportions, not physical ones: in reality the unscattered light
  // outnumbers the scattered several times over, and drawing that faithfully
  // would leave too few arriving rays to read. The true fraction is returned in
  // the tally and stated in the panel instead.
  const nArriving = scatters ? Math.max(1, Math.round(count * 0.60)) : 0;
  const nMissed = scatters ? Math.max(1, Math.round(count * 0.28)) : 0;
  const nThrough = Math.max(1, count - nArriving - nMissed);

  const weights = new Float64Array(SPECTRUM_BINS);

  /**
   * Every arriving ray's full spectral contribution, packed end to end in one
   * allocation.
   *
   * A ray is DRAWN in one colour, sampled from its own spectrum, because that is
   * what a photon does. But measuring the sky from those sampled colours alone
   * throws away most of what each ray knows and leaves the estimate visibly
   * noisy with only a few dozen rays in the cone. So the sampled wavelength is
   * kept for the picture and the whole spectrum is kept for the measurement.
   */
  const arrivingSpectra = new Float64Array(Math.max(1, nArriving) * SPECTRUM_BINS);
  let arrivingCount = 0;

  /** The tallest air worth drawing at this zoom. */
  const drawTop = drawTopFor();

  /**
   * Sample an altitude from the density profile, between a floor and a ceiling.
   *
   * Two callers with different needs. The arriving rays are a measurement, so
   * they sample the whole column above the observer and `columnScale` below is
   * the normalising constant of that distribution. The decorative families only
   * have to be somewhere visible, so they stop at the top of the frame.
   */
  function sampleAltitude(floor = observerAltitude, ceiling = atmosphere.topAltitude) {
    const eFloor = Math.exp(-floor / HR);
    const eTop = Math.exp(-ceiling / HR);
    return -HR * Math.log(eFloor + rng() * (eTop - eFloor));
  }

  /**
   * Integral of the density over the sampled altitude range: the constant that
   * turns one importance-sampled point into an estimate of the whole column.
   */
  const columnScale = HR * (Math.exp(-observerAltitude / HR)
    - Math.exp(-atmosphere.topAltitude / HR));

  /**
   * How far a ray gets before it meets the ground.
   *
   * Written out rather than reusing raySphere because the case that matters is
   * the one that function cannot answer: a scattering event AT the surface,
   * leaving in a downward direction. Both roots are then zero to within
   * rounding, and a ray that starts on the ground pointing into it travels no
   * distance at all.
   */
  function groundLimit(from, dir) {
    const b = from.x * dir.x + from.y * dir.y;
    const radius = Math.sqrt(from.x * from.x + from.y * from.y);
    if (radius - R <= 0.5) return b < 0 ? 0 : Infinity;
    const c = radius * radius - R * R;
    const disc = b * b - c;
    if (disc < 0) return Infinity;
    const t = -b - Math.sqrt(disc);
    return t > 0 ? t : Infinity;
  }

  /**
   * Walk from a point along a direction to the edge of the drawn frame, or to
   * the ground, whichever comes first. Light does not travel through rock, so
   * nothing is ever drawn below the surface - which at a wide zoom is a large
   * part of the picture, and used to collect the stubs of everything scattered
   * downwards near the limb.
   */
  function clipToFrame(from, dir, maxLength = Infinity) {
    let t = Math.min(maxLength, groundLimit(from, dir));
    const yTop = R + skyExtent_m;
    const yBottom = R + skyExtent_m - span_m;
    if (dir.y > 1e-9) t = Math.min(t, (yTop - from.y) / dir.y);
    else if (dir.y < -1e-9) t = Math.min(t, (from.y - yBottom) / -dir.y);
    if (Math.abs(dir.x) > 1e-9) {
      t = Math.min(t, (Math.sign(dir.x) * halfWidth_m - from.x) / dir.x);
    }
    if (!Number.isFinite(t) || t < 0) t = 0;
    return { x: from.x + dir.x * t, y: from.y + dir.y * t };
  }

  /* ---- 1. paths that arrive at the observer ---- */

  for (let n = 0; n < nArriving; n++) {
    const angle = (rng() * 2 - 1) * MAX_SKY_ANGLE_DEG * Math.PI / 180;
    // Line of sight in world coordinates. The observer sits on the x = 0 axis,
    // so its local "up" is +y and this is just a rotation of it.
    const d = { x: Math.sin(angle), y: Math.cos(angle) };

    // The scattering altitude is drawn from the density profile over the WHOLE
    // column above the observer, not just the part inside the drawn frame.
    // Sampling only what is on screen would bias the estimate below by whatever
    // fraction of the air the current zoom happens to exclude, and at a close
    // zoom that is most of it. Points off the frame still count; only their
    // drawing is clipped.
    const target = sampleAltitude();
    if (!(target > observerAltitude)) continue;

    // Where the line of sight reaches that altitude. Closed form on the sphere,
    // so the vertex sits exactly on the drawn straight line.
    const dist = raySphere(observer, d, R + target, true);
    if (dist == null || !(dist > 0)) continue;
    const P = { x: observer.x + d.x * dist, y: observer.y + d.y * dist };

    const sunT = sunTransmission(P);
    if (!sunT) continue;                       // this parcel of air is in shadow

    // Deflection: the photon was travelling away from the star, and leaves
    // travelling along -d, from P back down to the observer.
    const cosTheta = Math.max(-1, Math.min(1, toStar.x * d.x + toStar.y * d.y));
    const h = altitudeOf(P);
    const rhoR = atmosphere.densityRayleigh(h);
    const rhoA = atmosphere.densityAerosol(h);
    const phaseR = rayleighPhase(cosTheta);
    const phaseA = henyeyGreensteinPhase(cosTheta, g);
    const back = columns(P, { x: -d.x, y: -d.y }, dist);

    let total = 0;
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      const scatter = betaR[i] * rhoR * phaseR + betaAsca[i] * rhoA * phaseA;
      const tView = Math.exp(-(betaR[i] * back.colR + betaAext[i] * back.colA));
      const w = source[i] * scatter * sunT[i] * tView;
      weights[i] = w;
      total += w;
    }
    if (!(total > 0)) continue;
    const bin = sampleWeighted(weights, total, rng());
    const lambda = WAVELENGTHS_NM[bin];

    // Turn this sample into an estimate of the whole integral along the ray.
    //
    // The altitude was drawn with probability proportional to the density, so
    // the density in the integrand cancels against the one in the sampling
    // distribution and what is left is Z / (rho * |dh/ds|) - importance
    // sampling that is exact for an exponential atmosphere. |dh/ds| is the
    // cosine between the ray and the local vertical, which is why a ray near
    // the horizon carries so much more: it crosses far more air per metre of
    // altitude gained. It is floored, because at the horizon itself the
    // spherical geometry, not this factor, sets the path length.
    const cosLocal = Math.max(0.02, (d.x * P.x + d.y * P.y) / (R + h));
    const estimator = columnScale / (rhoR * cosLocal);

    // Now the drawing, which is a separate concern from the measurement above.
    // A vertex can legitimately sit above or beside the frame - at a close zoom
    // most of the column does - and such a ray is drawn as a line entering from
    // the edge, with no vertex marker, because its turn happened out of shot.
    const exit = clipToFrame(observer, d);
    const offFrame = Math.hypot(exit.x - observer.x, exit.y - observer.y) < dist - 1;
    const vertex = offFrame ? exit : P;

    // The incoming leg is a stub, not the whole journey down from space. Drawn
    // full length, several hundred of them cross the entire frame at the solar
    // angle and scatter the colour everywhere except where it belongs; the
    // unscattered `through` rays already show that journey at full length. The
    // stub is clipped, never bent, so it stays a piece of the true straight ray.
    const entry = clipToFrame(P, toStar, halfWidth_m * ARRIVING_STUB);
    const drawn = offFrame ? [vertex, observer] : [entry, P, observer];

    const spectrumOffset = arrivingCount * SPECTRUM_BINS;
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      arrivingSpectra[spectrumOffset + i] = weights[i] * estimator;
    }
    arrivingCount++;

    paths.push({
      kind: 'arriving',
      lambda, bin,
      weight: total,
      spectrumOffset,
      // An unbiased single-sample estimate of this ray's contribution to the
      // radiance, in the same units the integrator reports. Depositing it in
      // the sampled bin estimates the spectrum, because the bin was drawn in
      // proportion to that spectrum.
      radiance: total * estimator,
      offFrame,
      points: drawn,
      // Signed direction the light arrives from, so the renderer can ask whether
      // this ray is inside the cone the observer is looking down.
      arrivalAngleRad: angle,
      events: [
        { type: 'enter', x: entry.x, y: entry.y, altitude: atmosphere.topAltitude, lambda },
        {
          type: 'scatter', x: P.x, y: P.y, altitude: h, lambda,
          species: 'rayleigh',
          angleDeg: Math.acos(cosTheta) * 180 / Math.PI,
        },
        {
          type: 'observed', x: observer.x, y: observer.y,
          altitude: observerAltitude, lambda,
        },
      ],
      outcome: 'observed',
      scatterCount: 1,
    });
  }

  /* ---- 2. paths that scatter but go somewhere else ---- */

  for (let n = 0; n < nMissed; n++) {
    const P = pointAtOffset((rng() * 2 - 1) * halfWidth_m, sampleAltitude(0, drawTop));
    const sunT = sunTransmission(P);
    if (!sunT) continue;

    const h = altitudeOf(P);
    const rhoR = atmosphere.densityRayleigh(h);
    const rhoA = atmosphere.densityAerosol(h);
    const isRayleigh = rng() * (rhoR + rhoA) < rhoR || rhoA <= 0;

    // Which way does it leave? Draw the deflection from the real phase function,
    // then reject the small cone that would in fact reach the observer - those
    // paths belong to category 1 and are already drawn.
    let out = null;
    const toObs = { x: observer.x - P.x, y: observer.y - P.y };
    const obsLen = Math.hypot(toObs.x, toObs.y) || 1;
    for (let attempt = 0; attempt < 8; attempt++) {
      const cosT = isRayleigh ? sampleRayleighCosine(rng) : sampleHenyeyGreensteinCosine(g, rng);
      const theta = Math.acos(Math.max(-1, Math.min(1, cosT)));
      const turn = rng() < 0.5 ? theta : -theta;
      const c = Math.cos(turn), s = Math.sin(turn);
      const inX = -toStar.x, inY = -toStar.y;
      const candidate = { x: inX * c - inY * s, y: inX * s + inY * c, cosTheta: cosT };
      const alignment = (candidate.x * toObs.x + candidate.y * toObs.y) / obsLen;
      if (alignment < Math.cos(0.12)) { out = candidate; break; }
    }
    if (!out) continue;

    // Wavelength weighted by how strongly each colour scatters here, with no aim
    // taken at the observer. Mostly blue, which is the point: the blue is being
    // taken out of the beam and thrown in every direction at once.
    const phase = isRayleigh ? rayleighPhase(out.cosTheta) : henyeyGreensteinPhase(out.cosTheta, g);
    let total = 0;
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      const scatter = isRayleigh ? betaR[i] * rhoR * phase : betaAsca[i] * rhoA * phase;
      const w = source[i] * scatter * sunT[i];
      weights[i] = w;
      total += w;
    }
    if (!(total > 0)) continue;
    const bin = sampleWeighted(weights, total, rng());
    const lambda = WAVELENGTHS_NM[bin];

    // Both legs are stubs. A missed event is about the turn, not about where
    // that particular photon came from or ends up.
    const stub = halfWidth_m * 0.13;
    const entry = clipToFrame(P, toStar, stub);
    const end = clipToFrame(P, out, stub);

    paths.push({
      kind: 'missed',
      lambda, bin,
      weight: total,
      points: [entry, P, end],
      events: [
        { type: 'enter', x: entry.x, y: entry.y, altitude: altitudeOf(entry), lambda },
        {
          type: 'scatter', x: P.x, y: P.y, altitude: h, lambda,
          species: isRayleigh ? 'rayleigh' : 'aerosol',
          angleDeg: Math.acos(Math.max(-1, Math.min(1, out.cosTheta))) * 180 / Math.PI,
        },
        { type: 'missed', x: end.x, y: end.y, altitude: altitudeOf(end), lambda },
      ],
      outcome: 'missed',
      scatterCount: 1,
    });
  }

  /* ---- 3. light that crosses without being scattered at all ---- */

  for (let n = 0; n < nThrough; n++) {
    // Anchor the beam on a parcel of air that is actually in the picture, then
    // follow the line the starlight takes through it. Sampling the anchor from
    // the density puts the beams where the air is, which at a low Sun means a
    // long chord skimming the limb - the reason the light is red, drawn rather
    // than asserted.
    const anchor = pointAtOffset((rng() * 2 - 1) * halfWidth_m, sampleAltitude(0, drawTop));
    const back = { x: -toStar.x, y: -toStar.y };

    const entryDist = raySphere(anchor, back, topR, true);
    if (entryDist == null) continue;
    const entry = { x: anchor.x + back.x * entryDist, y: anchor.y + back.y * entryDist };

    // Forward from the entry: stop at the ground if it gets there, otherwise at
    // the far side of the atmosphere.
    const ground = raySphere(entry, toStar, R, false);
    const exit = raySphere(entry, toStar, topR, true);
    const travel = ground != null ? ground : (exit ?? 0);
    if (!(travel > 0)) continue;
    const end = { x: entry.x + toStar.x * travel, y: entry.y + toStar.y * travel };

    // Beer-Lambert over the whole chord, so this bundle carries exactly the
    // reddening the spectrum panel plots for the direct beam.
    const path = columns(entry, toStar, travel);
    let total = 0;
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      const w = source[i] * Math.exp(-(betaR[i] * path.colR + betaAext[i] * path.colA));
      weights[i] = w;
      total += w;
    }
    if (!(total > 0)) continue;
    const bin = sampleWeighted(weights, total, rng());
    const lambda = WAVELENGTHS_NM[bin];

    // Draw the part of that chord which is inside the frame: clipped from the
    // anchor in both directions, never bent, and never past the real endpoints.
    const drawnStart = clipToFrame(anchor, back, entryDist);
    const drawnEnd = clipToFrame(anchor, toStar, Math.max(0, travel - entryDist));

    paths.push({
      kind: 'through',
      lambda, bin,
      weight: total,
      pathLength: travel,
      points: [drawnStart, drawnEnd],
      events: [
        { type: 'enter', x: entry.x, y: entry.y, altitude: atmosphere.topAltitude, lambda },
        {
          type: ground != null ? 'ground' : 'escape',
          x: end.x, y: end.y, altitude: Math.max(0, altitudeOf(end)), lambda,
        },
      ],
      outcome: ground != null ? 'ground' : 'escape',
      scatterCount: 0,
    });
  }

  paths.scatteredFraction = scatteredFraction;
  paths.arrivingSpectra = arrivingSpectra;
  return paths;
}

/**
 * Tally the drawn paths - how many of each kind, and how blue each family came
 * out. These are properties of the drawing. The percentages the panel quotes are
 * NOT taken from here: they are integrated straight off the spectra the engine
 * computed, which is exact and free of sampling noise. What this does carry that
 * the spectra do not is `scatteredFraction`, the true share of the light that is
 * scattered at all, which the picture deliberately over-represents.
 */
function summarisePhotons(paths, options = {}) {
  const { source = null, splitNm = 520 } = options;
  const group = () => ({ total: 0, blue: 0 });
  const tally = {
    arriving: group(), missed: group(), through: group(),
    sourceBlueFraction: null,
    scatteredFraction: paths.scatteredFraction ?? null,
    blue: { total: 0, scattered: 0 },
    red: { total: 0, scattered: 0 },
  };

  for (const p of paths) {
    const isBlue = p.lambda < splitNm;
    const bucket = tally[p.kind];
    if (bucket) { bucket.total++; if (isBlue) bucket.blue++; }
    const legacy = isBlue ? tally.blue : tally.red;
    legacy.total++;
    if (p.scatterCount > 0) legacy.scattered++;
  }

  if (source) {
    let all = 0, blue = 0;
    for (let i = 0; i < SPECTRUM_BINS; i++) {
      all += source[i];
      if (WAVELENGTHS_NM[i] < splitNm) blue += source[i];
    }
    tally.sourceBlueFraction = all > 0 ? blue / all : null;
  }

  return tally;
}

/**
 * The spectrum of the light the drawn rays actually deliver, binned for a chart.
 *
 * This is not a count. Each arriving ray carries an unbiased estimate of its
 * contribution to the radiance, so summing those estimates per wavelength gives
 * a Monte Carlo measurement of the same spectrum the integrator computes - and
